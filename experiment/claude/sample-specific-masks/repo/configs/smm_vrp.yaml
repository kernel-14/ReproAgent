evidence_obligation_matrix:
  - obligation: "仓库入口 -> experiment_id=table1_resnet -> Table 1 -> results/tables/table_1.csv"
    protocol: "table1_resnet"
    route_callable: "sample_specific_masks.train.run_table_1_route"
    writer_callable: "sample_specific_masks.artifacts.write_table_1_artifact"
  - obligation: "仓库入口 -> experiment_id=table2_vit -> Table 2 -> results/tables/table_2.csv"
    protocol: "table2_vit"
    route_callable: "sample_specific_masks.train.run_table_2_route"
    writer_callable: "sample_specific_masks.artifacts.write_table_2_artifact"
  - obligation: "仓库入口 -> experiment_id=table3_ablation -> Table 3: ONLY δ、ONLY f_mask、SINGLE-CHANNEL f_mask^s、OURS + ResNet-18 -> mean accuracy % ± std %"
    protocol: "table3_ablation"
    route_callable: "sample_specific_masks.train.run_table_3_route"
    writer_callable: "sample_specific_masks.artifacts.write_table3_ablation_table_artifact"
  - obligation: "仓库入口 -> experiment_id=appendix_table13 -> Table 13 -> results/tables/table_13.csv"
    protocol: "appendix_table13"
    route_callable: "sample_specific_masks.train.run_appendix_table_route"
    writer_callable: "sample_specific_masks.artifacts.write_named_result_artifacts"
  - obligation: "仓库入口 -> experiment_id=appendix_table14 -> Table 14 -> results/tables/table_14.csv"
    protocol: "appendix_table14"
    route_callable: "sample_specific_masks.train.run_appendix_table_route"
    writer_callable: "sample_specific_masks.artifacts.write_named_result_artifacts"
  - obligation: "仓库入口 -> experiment_id=smm_smoke -> Algorithm 1 学习策略 + shared δ 初始化为零 + mask generator 参数 φ 迭代更新 -> smoke metrics/artifacts"
    protocol: "smm_smoke"
    route_callable: "sample_specific_masks.train.run_training_loop"
    writer_callable: "sample_specific_masks.artifacts.write_summary_report"
  - obligation: "Section 3.1 Framework of SMM -> r(x)、shared δ、sample-specific multi-channel masks、f_mask(r(x)) -> SMM/Ours 前向路径"
    implementation: "sample_specific_masks.reprogramming.build_reprogramming"
    config_nodes: ["preprocessing.shared_adapter", "mask_generator", "method_registry.Ours"]
  - obligation: "Section 3.2 Lightweight Mask Generator Module -> CNN mask generator f_mask -> 输出与输入图像同尺寸 mask -> 可训练参数 φ"
    implementation: "sample_specific_masks.reprogramming.ReprogrammingConfig"
    config_nodes: ["mask_generator.architecture", "training_defaults.trainable_parameter_groups"]
  - obligation: "Section 3.3 Patch-wise Interpolation Module -> floor(H/2^l)×floor(W/2^l) 到 H×W，每通道插值，l=0 omit -> mask 上采样路径"
    implementation: "sample_specific_masks.reprogramming.prepare_reprogramming"
    config_nodes: ["mask_generator.patch_wise_interpolation", "sweeps.interpolation_level_l"]
  - obligation: "Section 3.4 Learning Strategy / Algorithm 1 -> δ 初始化为 {0}^{d_P}，δ 与 φ 按 epoch 迭代更新 -> 训练 step"
    implementation: "sample_specific_masks.train.run_training_loop"
    config_nodes: ["constants.delta_initialization", "training_defaults"]
  - obligation: "Table 3 Ablation Studies -> ONLY δ、ONLY f_mask、SINGLE-CHANNEL f_mask^s、OURS -> 同一模块通过 variant selector 暴露"
    implementation: "sample_specific_masks.reprogramming.build_reprogramming"
    config_nodes: ["ablation_variants", "protocol_matrix.table3_ablation"]
  - obligation: "Section 5 Pre-trained Models and Target Tasks -> ResNet-18、ResNet-50、ViT-B/32 pretrained on ImageNet-1K -> backbone factory"
    implementation: "sample_specific_masks.data.build_backbone"
    config_nodes: ["backbone_registry"]

trend_assertions:
  - id: "ours_improves_over_fixed_masks"
    claim: "Ours expected to improve over predetermined shared mask VR baselines"
    decisive_comparison: "Ours vs PAD/Narrow/Medium/Full"
    decisive_metric: "mean_std_accuracy"
    protocols: ["table1_resnet", "table2_vit"]
  - id: "ours_strongest_or_competitive_ablation"
    claim: "OURS expected to be strongest or competitive among Table 3 ablation variants"
    decisive_comparison: "ours_multi_channel vs only_delta/only_f_mask/single_channel_mask"
    decisive_metric: "mean_std_accuracy"
    protocols: ["table3_ablation"]
  - id: "sample_specific_masks_differ_by_sample"
    claim: "样本特定掩码应体现更强的样本差异性"
    decisive_artifact: "results/mask_visualizations.png"
    protocols: ["figure_13_23_diagnostics"]
  - id: "endpoint_low"
    claim: "p=0 and p=1 are represented as endpoint/boundary cases"
    parameter: "p"
    values: [0.0, 1.0]
    protocols: ["figure_13_23_diagnostics"]
  - id: "positive_parameter_improves"
    claim: "nonzero/positive parameter values preserve the reported improvement trend"
    parameters: ["alpha", "gamma", "similarity_guidance_scale"]
    protocols: ["figure_13_23_diagnostics"]

