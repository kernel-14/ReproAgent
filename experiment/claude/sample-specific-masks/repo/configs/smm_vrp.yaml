schema_version: "1.0"
config_id: "smm_vrp"
paper: "Sample-specific Masks for Visual Reprogramming-based Prompting"
work_package_id: "wp_data_backbone_mapping"
reference_grounding: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
mode_default: "runtime_smoke"

canonical_route:
  entrypoint: "run_smm_vrp.py"
  main_callable: "main.main"
  command: "python run_smm_vrp.py --mode runtime_smoke --config configs/smm_vrp.yaml"
  full_command: "python run_smm_vrp.py --mode full_run --config configs/smm_vrp.yaml"
  stages:
    - setup_config
    - write_config_resolved_artifact
    - write_data_manifest_artifact
    - build_data
    - build_backbone
    - build_reprogramming
    - train_or_adapt
    - evaluate_predictions
    - aggregate_accuracy
    - write_table_or_figure_artifacts
    - write_artifact_manifest_artifact
  expected_outputs:
    - "results/metrics.json"
    - "results/tables/table1_resnet_main.csv"
    - "results/tables/table2_vit_main.csv"
    - "results/tables/table3_ablation.csv"
    - "results/dataset_registry.json"
    - "results/environment_registry.json"
    - "results/config_resolved.json"
    - "results/data_manifest.json"
    - "results/analysis_report.json"
    - "results/sensitivity_report.json"
  smoke_artifacts:
    readiness: "readiness.json"
    evaluation_result: "evaluation_result.json"

runtime:
  output_root_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  default_output_root: "results"
  default_experiment_id: "smm_smoke"
  default_metric: "accuracy"
  default_output_mapping: "Rlm_random_label_mapping"
  run_modes:
    runtime_smoke:
      description: "Bounded measured route exercising data, ImageNet-logit backbone wrapper, SMM reprogramming, train step, evaluation, and artifact wiring without full downloads."
      seeds: [0]
      datasets: ["unit-001"]
      backbones: ["resnet18_imagenet1k"]
      methods: ["Ours"]
      mask_variants: ["ours_multi_channel"]
      epochs: 1
      batch_size: 4
      max_train_batches: 1
      max_eval_batches: 1
      max_samples_per_dataset: 8
      allow_download: false
      write_readiness: true
      write_evaluation_result: true
      paper_visible_policy: "write paper-visible metric/table artifacts only when computed by the bounded measured route"
    full_run:
      description: "Paper protocol route using lazy torchvision/timm dataset and ImageNet-1K pretrained model factories."
      seeds: [0, 1, 2]
      datasets: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
      backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b_32_imagenet1k"]
      methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
      mask_variants: ["ours_multi_channel", "only_delta", "only_f_mask", "single_channel_mask"]
      epochs: 30
      batch_size: 128
      max_train_batches: null
      max_eval_batches: null
      max_samples_per_dataset: null
      allow_download: true
      write_readiness: true
      write_evaluation_result: true

scope_constraints:
  - "仅实现论文复现所需的最小可运行闭环。"
  - "仅覆盖论文中的输入视觉重编程主路径，f_out 作为非参数映射单独处理。"
  - "只实现论文中实际比较过的固定掩码族，不扩展到未出现的额外基线。"
  - "仅实现论文所列四个消融分支，不额外添加近似变体。"
  - "仅实现论文理解性分析所需的诊断输出，不做超出论文范围的额外理论扩展。"

public_symbols:
  "多次运行结果的 mean/std 统计函数":
    canonical_identifier: "aggregate_accuracy"
    callable: "sample_specific_masks.config.aggregate_accuracy"
    formula:
      mean_percent: "100 * sum(per_seed_accuracy) / n"
      std_percent: "100 * sqrt(sum((accuracy_i - mean_accuracy)^2) / max(n - 1, 1))"
    input_fields: ["dataset", "backbone", "method", "mask_variant", "seed", "accuracy"]
    output_fields: ["mean_accuracy_percent", "std_accuracy_percent", "num_seeds"]
    used_by:
      - "table1_resnet"
      - "table2_vit"
      - "table3_ablation"
      - "appendix_table13"
      - "appendix_table14"
  "均值/标准差汇总与消融表驱动器":
    canonical_identifier: "table3_ablation_driver"
    route_callable: "sample_specific_masks.artifacts.write_table3_ablation_table_artifact"
    metric_callable: "sample_specific_masks.config.aggregate_accuracy"
    experiment_id: "table3_ablation"
    artifact_path: "results/tables/table3_ablation.csv"
    legacy_artifact_path: "results/table_3_ablation.csv"
    variants: ["only_delta", "only_f_mask", "single_channel_mask", "ours_multi_channel"]

constants:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  pretrained_input_size:
    height: 224
    width: 224
    channels: 3
  source_label_space:
    id: "imagenet_1k"
    num_classes: 1000
  delta_initialization:
    name: "zero_matrix"
    value: 0.0
    shape: [3, 224, 224]
    paper_anchor: "δ initialized to {0}^{d_P}"
  mask_target_size:
    height: 224
    width: 224
    channels_multi: 3
    channels_single: 1
  interpolation_level_default: 2
  coarse_mask_grid_formula: "floor(H / 2^l) x floor(W / 2^l)"
  coarse_mask_grid_default:
    l: 2
    height: 56
    width: 56
  l_zero_behavior: "omit patch-wise interpolation and emit mask at H x W"
  three_seed_protocol: [0, 1, 2]

sweeps:
  seed_list:
    values: [0, 1, 2]
    default_smoke: [0]
    full_run: [0, 1, 2]
  dataset:
    values: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
    smoke_values: ["unit-001"]
  backbone:
    values: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b_32_imagenet1k"]
    smoke_values: ["resnet18_imagenet1k"]
  mask_variant:
    values: ["only_delta", "only_f_mask", "single_channel_mask", "ours_multi_channel"]
    smoke_values: ["ours_multi_channel"]
  interpolation_level_l:
    values: [0, 1, 2, 3]
    default: 2
    formula: "coarse_grid=(floor(H/2^l), floor(W/2^l)); l=0 omits upsampling"
  run_mode:
    values: ["runtime_smoke", "full_run"]
  alpha:
    values: [0.1, 0.5, 1.0]
    default: 0.5
  p:
    values: [0.0, 0.25, 0.5, 0.75, 1.0]
    default: 0.5
    endpoint_low_cases: [0.0, 1.0]
  gamma:
    values: [0.0, 0.1, 1.0]
    default: 0.1
  patch_size:
    values: [4, 2, 1]
    default: 2
    paper_visible_values: [2, 1]
  similarity_guidance_scale:
    values: [9, 7, 10]
    default: 9

training_defaults:
  optimizer: "Adam"
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs_smoke: 1
  epochs_full: 30
  batch_size_smoke: 4
  batch_size_full: 128
  trainable_parameter_groups:
    - name: "shared_delta"
      enabled_by_variants: ["only_delta", "ours_multi_channel", "single_channel_mask"]
      initialization: "zero_matrix"
    - name: "mask_generator_phi"
      enabled_by_variants: ["only_f_mask", "ours_multi_channel", "single_channel_mask"]
      initialization: "cnn_default"
  frozen_parameter_groups:
    - name: "ImageNet-1K pretrained backbone"
      freeze: true
      outputs: "1000-way ImageNet logits"
  objective:
    name: "cross_entropy_after_injective_output_mapping"
    loss_callable: "sample_specific_masks.train.compute_loss"
    training_loop_callable: "sample_specific_masks.train.run_training_loop"
    algorithm_anchor: "Algorithm 1 SMM learning strategy: initialize δ=0, update δ and φ by epoch"

