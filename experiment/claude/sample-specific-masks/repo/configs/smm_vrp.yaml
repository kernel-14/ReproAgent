backbone_registry:
  resnet18_imagenet1k:
    id: "resnet18_imagenet1k"
    paper_name: "ResNet-18"
    aliases: ["ResNet-18 ImageNet-1K", "resnet18", "resnet"]
    pretrained_source: "ImageNet-1K"
    output_logits: 1000
    input_size: [3, 224, 224]
    factory: "sample_specific_masks.data.build_backbone"
    lazy_imports: ["torch", "torchvision"]
    freeze_pretrained_parameters: true
    smoke_fallback: "sample_specific_masks.data.DeterministicBackbone"
  resnet50_imagenet1k:
    id: "resnet50_imagenet1k"
    paper_name: "ResNet-50"
    aliases: ["ResNet-50 ImageNet-1K", "resnet50", "resnet"]
    pretrained_source: "ImageNet-1K"
    output_logits: 1000
    input_size: [3, 224, 224]
    factory: "sample_specific_masks.data.build_backbone"
    lazy_imports: ["torch", "torchvision"]
    freeze_pretrained_parameters: true
    smoke_fallback: "sample_specific_masks.data.DeterministicBackbone"
  vit_b_32_imagenet1k:
    id: "vit_b_32_imagenet1k"
    paper_name: "ViT-B/32"
    aliases: ["ViT-B/32 ImageNet-1K", "ViT-B32", "vit"]
    pretrained_source: "ImageNet-1K"
    output_logits: 1000
    input_size: [3, 224, 224]
    patch_size: 32
    factory: "sample_specific_masks.data.build_backbone"
    lazy_imports: ["torch", "torchvision", "timm"]
    freeze_pretrained_parameters: true
    smoke_fallback: "sample_specific_masks.data.DeterministicBackbone"

preprocessing:
  shared_adapter:
    callable: "sample_specific_masks.data.build_preprocess"
    normalization: "ImageNet mean/std"
    resize_function_r: "bilinear_resize_to_224"
    output_size: [3, 224, 224]
    used_by_methods: ["PAD", "Narrow", "Medium", "Full", "Ours", "ONLY δ", "ONLY f_mask", "SINGLE-CHANNEL f_mask^s"]
  method_layouts:
    PAD:
      selector: "PAD"
      layout: "center_target_image_with_zero_padding"
      trainable_delta: true
      sample_specific_mask: false
      fixed_mask_family: "padding_based"
      forward_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    Narrow:
      selector: "Narrow"
      layout: "predetermined_shared_narrow_mask"
      trainable_delta: true
      sample_specific_mask: false
      fixed_mask_family: "resizing_based"
      forward_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    Medium:
      selector: "Medium"
      layout: "predetermined_shared_medium_mask"
      trainable_delta: true
      sample_specific_mask: false
      fixed_mask_family: "resizing_based"
      forward_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    Full:
      selector: "Full"
      layout: "predetermined_shared_full_mask"
      trainable_delta: true
      sample_specific_mask: false
      fixed_mask_family: "resizing_based"
      forward_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    Ours:
      selector: "Ours"
      layout: "r(x)+delta*sample_specific_multi_channel_mask"
      trainable_delta: true
      sample_specific_mask: true
      fixed_mask_family: null
      forward_callable: "sample_specific_masks.reprogramming.build_reprogramming"

output_mapping:
  id: "Rlm_random_label_mapping"
  aliases: ["Rlm", "random label mapping", "injective output mapping f_out"]
  callable: "sample_specific_masks.data.build_label_mapping"
  type: "deterministic_one_to_one_injection"
  source_classes: 1000
  target_classes_field: "dataset_registry.${dataset}.target_classes"
  seed_field: "seed"
  persist_artifact: "results/label_mapping/${experiment_id}_${dataset}_${backbone}_seed${seed}.json"
  artifact_fields:
    - "seed"
    - "dataset"
    - "target_class"
    - "target_class_index"
    - "pretrained_class_index"
    - "pretrained_source"
  collision_policy: "sample without replacement from ImageNet-1K class indices"

mask_generator:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  id: "lightweight_cnn_f_mask"
  callable: "sample_specific_masks.reprogramming.build_reprogramming"
  trainable_parameters_name: "phi"
  architecture:
    family: "lightweight_cnn"
    resnet_layers: 5
    vit_layers: 6
    activation: "sigmoid"
    output_spatial_size: [224, 224]
    output_channels_multi: 3
    output_channels_single: 1
  patch_wise_interpolation:
    callable: "sample_specific_masks.reprogramming.prepare_reprogramming"
    formula: "floor(H/2^l) x floor(W/2^l) -> H x W per channel"
    l_default: 2
    l_zero_omit: true

method_registry:
  PAD:
    id: "PAD"
    aliases: ["Pad", "padding-based reprogramming"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "fixed_pad"
    delta_enabled: true
    mask_generator_enabled: false
    channel_mode: "fixed_shared"
    metrics: ["accuracy", "loss"]
  Narrow:
    id: "Narrow"
    aliases: ["NARrow", "narrow"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "fixed_narrow"
    delta_enabled: true
    mask_generator_enabled: false
    channel_mode: "fixed_shared"
    metrics: ["accuracy", "loss"]
  Medium:
    id: "Medium"
    aliases: ["medium"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "fixed_medium"
    delta_enabled: true
    mask_generator_enabled: false
    channel_mode: "fixed_shared"
    metrics: ["accuracy", "loss"]
  Full:
    id: "Full"
    aliases: ["FULL", "full"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "fixed_full"
    delta_enabled: true
    mask_generator_enabled: false
    channel_mode: "fixed_shared"
    metrics: ["accuracy", "loss"]
  Ours:
    id: "Ours"
    aliases: ["ours", "SMM/Ours", "sample-specific multi-channel masks"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "ours_multi_channel"
    delta_enabled: true
    mask_generator_enabled: true
    channel_mode: "multi_channel"
    metrics: ["accuracy", "loss"]
  ours:
    id: "ours"
    aliases: ["Ours", "SMM/Ours"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "ours_multi_channel"
    delta_enabled: true
    mask_generator_enabled: true
    channel_mode: "multi_channel"
    metrics: ["accuracy", "loss"]
  vit:
    id: "vit"
    aliases: ["ViT-B/32", "vit_b_32_imagenet1k"]
    selector_callable: "sample_specific_masks.data.build_backbone"
    role: "backbone_selector"
    backbone: "vit_b_32_imagenet1k"
    metrics: ["accuracy", "loss"]
  resnet:
    id: "resnet"
    aliases: ["ResNet-18", "ResNet-50", "resnet18_imagenet1k", "resnet50_imagenet1k"]
    selector_callable: "sample_specific_masks.data.build_backbone"
    role: "backbone_selector"
    backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k"]
    metrics: ["accuracy", "loss"]
  lora:
    id: "lora"
    aliases: ["LoRA"]
    role: "method_selector_declared_for_evidence_contract"
    selector_callable: "sample_specific_masks.train.run_training_loop"
    route_policy: "not executed in default SMM tables; retained as code-visible selector for paper evidence contract"
    metrics: ["accuracy", "loss"]

ablation_variants:
  reference_grounding: "chunk_017_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  only_delta:
    paper_label: "ONLY δ"
    aliases: ["ONLY delta", "only_delta"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    delta_enabled: true
    mask_generator_enabled: false
    channel_mode: "fixed_all_ones_mask"
    trainable_parameter_groups: ["shared_delta"]
    table3_column: "ONLY δ"
  only_f_mask:
    paper_label: "ONLY f_mask"
    aliases: ["ONLY f_mask", "only_f_mask"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    delta_enabled: false
    mask_generator_enabled: true
    delta_substitute: "unit_pattern_or_bounded_equivalent"
    channel_mode: "multi_channel"
    trainable_parameter_groups: ["mask_generator_phi"]
    table3_column: "ONLY f_mask"
  single_channel_mask:
    paper_label: "SINGLE-CHANNEL f_mask^s"
    aliases: ["SINGLE-CHANNEL f_mask^s", "single_channel_mask"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    delta_enabled: true
    mask_generator_enabled: true
    channel_mode: "single_channel_broadcast"
    trainable_parameter_groups: ["shared_delta", "mask_generator_phi"]
    table3_column: "SINGLE-CHANNEL f_mask^s"
  ours_multi_channel:
    paper_label: "OURS"
    aliases: ["OURS", "Ours", "ours_multi_channel"]
    selector_callable: "sample_specific_masks.reprogramming.build_reprogramming"
    delta_enabled: true
    mask_generator_enabled: true
    channel_mode: "multi_channel"
    trainable_parameter_groups: ["shared_delta", "mask_generator_phi"]
    table3_column: "OURS"

metric_registry:
  accuracy:
    id: "accuracy"
    callable: "sample_specific_masks.config.compute_accuracy"
    formula: "correct_predictions / total_predictions"
    aggregate_callable: "sample_specific_masks.config.aggregate_accuracy"
    aggregate_formula: "mean_percent ± std_percent over seeds"
    output_fields: ["accuracy", "mean_accuracy_percent", "std_accuracy_percent"]
  loss:
    id: "loss"
    callable: "sample_specific_masks.train.compute_loss"
    formula: "cross_entropy(mapped_imagenet_logits, target_labels)"
    aggregate_callable: "sample_specific_masks.train.aggregate_loss"
    output_fields: ["loss", "mean_loss", "std_loss"]
  f1:
    id: "F1"
    callable: "sample_specific_masks.data.compute_f1"
    aggregate_callable: "sample_specific_masks.data.aggregate_f1"
    output_fields: ["f1", "mean_f1", "std_f1"]

