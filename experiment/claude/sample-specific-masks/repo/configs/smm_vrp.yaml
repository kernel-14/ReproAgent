test_contract:
  static_registry_checks:
    required_datasets: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
    required_dataset_aliases: ["cifar", "imagenet", "svhn", "imagenet_1k", "stanford_cars", "dtd", "eurosat", "flowers", "oxford_pets"]
    required_environment_aliases: ["cifar", "imagenet", "svhn"]
    required_backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b_32_imagenet1k"]
    required_methods: ["ours", "vit", "resnet", "lora", "PAD", "Narrow", "Medium", "Full", "Ours"]
    required_ablation_variants: ["only_delta", "only_f_mask", "single_channel_mask", "ours_multi_channel"]
    required_metrics: ["accuracy", "loss"]
    required_sweeps:
      patch_size: [4, 2, 1]
      p_endpoint_cases: [0.0, 1.0]
      similarity_guidance_scale: [9, 7, 10]
      three_seed_protocol: [0, 1, 2]
  smoke_route_checks:
    command: "python run_smm_vrp.py --mode runtime_smoke --config configs/smm_vrp.yaml"
    must_write:
      - "readiness.json"
      - "evaluation_result.json"
      - "results/config_resolved.json"
      - "results/data_manifest.json"
    must_call:
      - "sample_specific_masks.data.build_data"
      - "sample_specific_masks.data.build_backbone"
      - "sample_specific_masks.reprogramming.build_reprogramming"
      - "sample_specific_masks.train.run_training_loop"
      - "sample_specific_masks.config.compute_accuracy"
      - "sample_specific_masks.config.aggregate_accuracy"