schema_version: "1.0"
config_id: "unit_for_or_trainable"
paper: "Sample-specific Masks for Visual Reprogramming-based Prompting"
work_package_id: "wp_main_comparison"
reference_grounding: "chunk_014_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
reference_grounding_secondary: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
reference_grounding_tertiary: "chunk_017_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
reference_grounding_quaternary: "chunk_002_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
reference_grounding_marker: "reference_grounding: chunk_014_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"

mode_default: "runtime_smoke"

canonical_route:
  entrypoint: "run_smm_vrp.py"
  main_callable: "main.main"
  command: "python run_smm_vrp.py --mode runtime_smoke --config configs/unit_for_or_trainable.yaml"
  full_command: "python run_smm_vrp.py --mode full_run --config configs/unit_for_or_trainable.yaml"
  stages:
    - setup_config
    - resolve_runtime_mode
    - write_config_resolved_artifact
    - write_dataset_registry_artifact
    - write_environment_registry_artifact
    - write_experiment_registry_artifact
    - build_data
    - load_data
    - prepare_data
    - build_backbone
    - build_reprogramming
    - load_reprogramming
    - train_or_adapt_algorithm_1
    - evaluate_predictions
    - compute_accuracy
    - aggregate_accuracy
    - compute_f1
    - aggregate_f1
    - write_run_smm_vrp_artifact
    - write_table_or_figure_artifacts
    - write_artifact_manifest
    - write_dry_run_manifest_artifact
    - write_readiness_artifacts
  smoke_artifacts:
    readiness: "readiness.json"
    evaluation_result: "evaluation_result.json"
  expected_outputs:
    - "results/metrics.json"
    - "results/tables/table1_resnet_main.csv"
    - "results/tables/table2_vit_main.csv"
    - "results/tables/table3_ablation.csv"
    - "results/dataset_registry.json"
    - "results/environment_registry.json"
    - "results/experiment_registry.json"
    - "results/artifact_manifest.json"
    - "results/config_resolved.json"
    - "results/tables/table_13.csv"
    - "results/tables/table_14.csv"
    - "results/figures/figure_13.png"
    - "results/figures/figure_14.png"
    - "results/figures/figure_15.png"
    - "results/figures/figure_16.png"
    - "results/figures/figure_17.png"
    - "results/figures/figure_18.png"
    - "results/figures/figure_19.png"
    - "results/figures/figure_20.png"
    - "results/figures/figure_21.png"
    - "results/figures/figure_22.png"
    - "results/figures/figure_23.png"

scope_constraints:
  - "仅实现论文复现所需的最小可运行闭环。"
  - "仅覆盖论文中的输入视觉重编程主路径，f_out 作为非参数映射单独处理。"
  - "只实现论文中实际比较过的固定掩码族，不扩展到未出现的额外基线。"
  - "仅实现论文所列四个消融分支，不额外添加近似变体。"
  - "仅实现论文理解性分析所需的诊断输出，不做超出论文范围的额外理论扩展。"

runtime:
  output_root_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  default_output_root: "results"
  default_experiment_id: "smm_smoke"
  default_metric: "accuracy"
  default_output_mapping: "Rlm_random_label_mapping"
  default_dataset_split: "paper_split_shared_across_main_comparisons"
  default_seed_protocol: "three_seed_protocol"
  default_seeds: [0, 1, 2]
  default_optimizer: "adamw"
  default_learning_rate: 0.0003
  default_weight_decay: 0.01
  default_batch_size: 4
  default_epochs: 1
  default_mask_variant: "ours_multi_channel"
  default_interpolation_level: 1
  default_patch_size: 2
  default_patch_size_sweep: [4, 2, 1]
  default_p_sweep: [0, 1]
  default_alpha_sweep: [0.0, 0.1, 0.5, 1.0]
  default_gamma_sweep: [0.0, 0.5, 1.0]
  default_similarity_guidance_scale_sweep: [9, 7, 10]
  default_max_train_batches: 1
  default_max_eval_batches: 1
  default_max_samples_per_dataset: 8
  default_image_size:
    height: 224
    width: 224
  target_mask_grid:
    l1: [112, 112]
    l2: [56, 56]
    l3: [28, 28]
  patchwise_interpolation:
    omit_when_l_zero: true
    upsample_to_input_size: true
    per_channel: true
  fixed_hyperparameters:
    three_seed_protocol:
      seed_values: [0, 1, 2]
      aggregation: "mean_std_across_seeds"
      rationale: "paper-visible fixed anchor"
  trend_obligations:
    endpoint_low:
      parameter: "p"
      boundary_values: [0, 1]
      expected_ordering: "boundary cases should remain lowest/minimum/worst"
    positive_parameter_improves:
      parameter: "p"
      positive_values: [0.1, 0.5, 1.0]
      expected_direction: "nonzero/positive values should preserve the reported improvement trend"

  run_modes:
    runtime_smoke:
      description: "Bounded measured route exercising data/model/method/train/eval/artifact wiring without downloads or long training."
      seeds: [0]
      datasets: ["unit-001"]
      backbones: ["resnet18_imagenet1k"]
      methods: ["Ours"]
      mask_variants: ["ours_multi_channel"]
      epochs: 1
      batch_size: 4
      max_train_batches: 1
      max_eval_batches: 1
      max_samples_per_dataset: 8
      write_readiness: true
      write_evaluation_result: true
      write_auxiliary_manifests: true
      paper_visible_outputs: false
    full_run:
      description: "Full measured route over the paper protocol matrix with lazy loading of datasets/backbones."
      seeds: [0, 1, 2]
      datasets: ["cifar", "imagenet", "svhn", "imagenet_1k", "stanford_cars", "dtd", "eurosat", "flowers", "oxford_pets"]
      backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b32_imagenet1k"]
      methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
      mask_variants: ["pad", "narrow", "medium", "full", "ours_multi_channel", "only_delta", "only_f_mask", "single_channel_mask"]
      epochs: 90
      batch_size: 64
      max_train_batches: null
      max_eval_batches: null
      max_samples_per_dataset: null
      write_readiness: true
      write_evaluation_result: true
      write_auxiliary_manifests: true
      paper_visible_outputs: true

callable_bindings:
  compute_accuracy: "sample_specific_masks.evaluate:compute_accuracy"
  aggregate_accuracy: "sample_specific_masks.evaluate:aggregate_accuracy"
  compute_f1: "sample_specific_masks.evaluate:compute_f1"
  aggregate_f1: "sample_specific_masks.evaluate:aggregate_f1"
  compute_loss: "sample_specific_masks.evaluate:compute_loss"
  aggregate_loss: "sample_specific_masks.evaluate:aggregate_loss"
  evaluate_predictions: "sample_specific_masks.evaluate:evaluate_predictions"
  run_protocolsincodeconfigrathe_experiment: "run_smm_vrp:run_protocolsincodeconfigrathe_experiment"
  write_run_smm_vrp_artifact: "run_smm_vrp:write_run_smm_vrp_artifact"
  write_artifact_manifest: "run_smm_vrp:write_artifact_manifest"
  build_data: "sample_specific_masks.data:build_data"
  load_data: "sample_specific_masks.data:load_data"
  prepare_data: "sample_specific_masks.data:prepare_data"
  build_reprogramming: "sample_specific_masks.reprogramming:build_reprogramming"
  load_reprogramming: "sample_specific_masks.reprogramming:load_reprogramming"
  make_environment: "sample_specific_masks.data:make_environment"
  environment_ready_check: "sample_specific_masks.data:check_environment_ready"
  load_classifier: "sample_specific_masks.reprogramming:load_classifier"
  finetune_classifier: "sample_specific_masks.reprogramming:finetune_classifier"

