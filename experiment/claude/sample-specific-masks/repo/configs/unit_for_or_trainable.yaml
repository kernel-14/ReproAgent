data_pipeline:
  make_environment: "sample_specific_masks.data:make_environment"
  load_data: "sample_specific_masks.data:load_data"
  prepare_data: "sample_specific_masks.data:prepare_data"
  build_data: "sample_specific_masks.data:build_data"
  load_classifier: "sample_specific_masks.reprogramming:load_classifier"
  finetune_classifier: "sample_specific_masks.reprogramming:finetune_classifier"
  availability_checks:
    cifar: "sample_specific_masks.data:check_cifar_available"
    imagenet: "sample_specific_masks.data:check_imagenet_source_available"
    svhn: "sample_specific_masks.data:check_svhn_available"
    gtsrb: "sample_specific_masks.data:check_gtsrb_available"
    flowers102: "sample_specific_masks.data:check_flowers102_available"
    dtd: "sample_specific_masks.data:check_dtd_available"
    ucf101: "sample_specific_masks.data:check_ucf101_available"
    eurosat: "sample_specific_masks.data:check_eurosat_available"
    oxford_pets: "sample_specific_masks.data:check_oxford_pets_available"

training_loop:
  algorithm_1:
    name: "SMM learning strategy"
    shared_delta_initialization: "zero_matrix_{0}^{d_P}"
    update_targets: ["delta", "phi"]
    freeze_backbone: true
    backbone_updates_allowed: false
    optimizer_parameter_groups:
      - name: "delta"
        target: "shared_delta"
      - name: "phi"
        target: "mask_generator_phi"
    train_steps:
      ours: "sample_specific_masks.train:train_ours"
      only_delta: "sample_specific_masks.train:train_only_delta"
      only_f_mask: "sample_specific_masks.train:train_only_f_mask"
      single_channel_mask: "sample_specific_masks.train:train_single_channel_mask"
      pad: "sample_specific_masks.train:train_pad"
      narrow: "sample_specific_masks.train:train_narrow"
      medium: "sample_specific_masks.train:train_medium"
      full: "sample_specific_masks.train:train_full"
  learning_rates:
    default: 0.0003
    schedule: "constant_for_smoke_then_cosine_for_full"
  batch_sizes:
    default: 4
    smoke: 4
    full: 64
  epochs:
    smoke: 1
    full: 90
  checkpointing:
    enabled: true
    best_metric: "accuracy"
    save_last: true
    save_best: true

evaluation:
  evaluate_predictions: "sample_specific_masks.evaluate:evaluate_predictions"
  compute_accuracy: "sample_specific_masks.evaluate:compute_accuracy"
  aggregate_accuracy: "sample_specific_masks.evaluate:aggregate_accuracy"
  compute_f1: "sample_specific_masks.evaluate:compute_f1"
  aggregate_f1: "sample_specific_masks.evaluate:aggregate_f1"
  compute_loss: "sample_specific_masks.evaluate:compute_loss"
  aggregate_loss: "sample_specific_masks.evaluate:aggregate_loss"
  metric_aggregation:
    accuracy: "mean_std_across_seeds"
    loss: "mean_across_seeds"
    f1: "mean_across_seeds"
  paper_visible_reporting:
    uses_mean_std_accuracy: true
    mean_accuracy_percent_field: "mean_accuracy_percent"
    std_accuracy_percent_field: "std_accuracy_percent"

baseline_or_ablation:
  method_selector_set_required: ["ours", "vit", "resnet", "lora"]
  baseline_variants_required: ["PAD", "Narrow", "Medium", "Full"]
  ablation_variants_required: ["ONLY δ", "ONLY f_mask", "SINGLE-CHANNEL f_mask^s", "OURS"]
  variant_policy:
    only_delta:
      description: "only shared noise pattern delta contributes"
      use_delta: true
      use_mask_generator: false
      channel_mode: "single"
    only_f_mask:
      description: "only mask generator contributes, shared delta disabled"
      use_delta: false
      use_mask_generator: true
      channel_mode: "multi"
    single_channel_mask:
      description: "single-channel sample-specific mask variant"
      use_delta: true
      use_mask_generator: true
      channel_mode: "single"
    ours:
      description: "sample-specific multi-channel masks with shared delta"
      use_delta: true
      use_mask_generator: true
      channel_mode: "multi"

reporting_validation:
  coverage_auditor:
    required_datasets:
      - "cifar"
      - "imagenet"
      - "svhn"
      - "imagenet_1k"
      - "stanford_cars"
      - "dtd"
      - "eurosat"
      - "flowers"
      - "oxford_pets"
    required_environments:
