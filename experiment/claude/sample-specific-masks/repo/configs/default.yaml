schema_version: "1.0"
config_id: "default"
paper: "Sample-specific Masks for Visual Reprogramming-based Prompting"
work_package_id: "wp_surface"
reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
mode_default: "runtime_smoke"

canonical_route:
  entrypoint: "run_smm_vrp.py"
  main_callable: "main.main"
  command: "python run_smm_vrp.py --mode runtime_smoke --config configs/default.yaml"
  full_command: "python run_smm_vrp.py --mode full_run --config configs/default.yaml"
  stages:
    - setup_config
    - write_config_resolved_artifact
    - write_dataset_registry_artifact
    - write_environment_registry_artifact
    - write_experiment_registry_artifact
    - build_data
    - build_backbone
    - build_reprogramming
    - train_or_adapt
    - evaluate_predictions
    - aggregate_accuracy
    - write_metrics_artifact
    - write_table_or_figure_artifacts
    - write_artifact_manifest_artifact
    - write_dry_run_manifest_artifact
  smoke_artifacts:
    readiness: "readiness.json"
    evaluation_result: "evaluation_result.json"

runtime:
  output_root_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  default_output_root: "results"
  default_experiment_id: "smm_smoke"
  default_metric: "accuracy"
  default_output_mapping: "Rlm_random_label_mapping"
  run_modes:
    runtime_smoke:
      description: "Bounded route exercising data/model/method/train/eval/artifact wiring without downloads or long training."
      seeds: [0]
      datasets: ["unit-001"]
      backbones: ["resnet18_imagenet1k"]
      methods: ["Ours"]
      mask_variants: ["ours_multi_channel"]
      epochs: 1
      batch_size: 4
      max_train_batches: 1
      max_eval_batches: 1
      max_samples_per_dataset: 8
      allow_download: false
      require_pretrained_weights: false
      write_readiness: true
      write_evaluation_result: true
      paper_visible_output_policy: "only write benchmark-visible metrics/tables/figures when computed by bounded measured route"
    full_run:
      description: "Full paper protocol using lazy dataset/backbone factories and explicit downloads/checkpoints when enabled."
      seeds: [0, 1, 2]
      datasets: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
      backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b32_imagenet1k"]
      methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
      mask_variants: ["ours_multi_channel"]
      epochs: 200
      batch_size: 128
      max_train_batches: null
      max_eval_batches: null
      max_samples_per_dataset: null
      allow_download: true
      require_pretrained_weights: true
      write_readiness: true
      write_evaluation_result: true

scope_constraints:
  - "仅实现论文复现所需的最小可运行闭环。"
  - "仅覆盖论文中的输入视觉重编程主路径，f_out 作为非参数映射单独处理。"
  - "只实现论文中实际比较过的固定掩码族，不扩展到未出现的额外基线。"
  - "仅实现论文所列四个消融分支，不额外添加近似变体。"
  - "仅实现论文理解性分析所需的诊断输出，不做超出论文范围的额外理论扩展。"

paper_method:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  formula: "f_in(x_i | phi, delta) = r(x_i) + delta * f_mask(r(x_i) | phi)"
  resize_function: "bilinear_resize_to_pretrained_input"
  shared_delta:
    symbol: "δ"
    initialization: "zero_matrix"
    value_description: "{0}^{d_P}"
    trainable: true
    tensor_shape: [3, 224, 224]
  mask_generator:
    symbol: "f_mask"
    parameters_symbol: "φ"
    architecture_selector: "lightweight_cnn_mask_generator"
    trainable: true
    output_size: [3, 224, 224]
    resnet_layers: 5
    vit_layers: 6
  patch_wise_interpolation:
    enabled: true
    interpolation: "bilinear"
    level_l_default: 2
    level_l_values: [0, 1, 2]
    l0_behavior: "omit_interpolation"
    target_mask_size: [224, 224]
    coarse_grid_formula: "floor(H / 2^l) x floor(W / 2^l)"
    coarse_grid_examples:
      l0: [224, 224]
      l1: [112, 112]
      l2: [56, 56]
  output_mapping:
    id: "Rlm_random_label_mapping"
    type: "non_parametric_injective_mapping"
    trainable: false
    source_space: "ImageNet-1K"
    seed_controlled: true
  learning_strategy:
    algorithm: "Algorithm 1 SMM learning strategy"
    optimizer_parameter_groups:
      - name: "delta"
        parameters: "shared noise pattern δ"
        enabled_for: ["Ours", "ONLY δ", "SINGLE-CHANNEL f_mask^s"]
      - name: "phi"
        parameters: "mask generator parameters φ"
        enabled_for: ["Ours", "ONLY f_mask", "SINGLE-CHANNEL f_mask^s"]
    frozen_components:
      - "ImageNet-1K pretrained backbone"
      - "non-parametric output mapping f_out"

hyperparameters:
  reference_grounding: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  fixed_hyperparameters:
    three_seed_protocol: [0, 1, 2]
    pretrained_source: "ImageNet-1K"
    input_size: [224, 224]
    image_channels: 3
  defaults:
    seed: 0
    seeds: [0, 1, 2]
    learning_rate: 0.001
    delta_learning_rate: 0.001
    mask_generator_learning_rate: 0.001
    batch_size: 128
    smoke_batch_size: 4
    epochs: 200
    smoke_epochs: 1
    interpolation_level_l: 2
    patch_size: 2
    p: 0.5
    alpha: 0.5
    gamma: 0.1
    similarity_guidance_scale: 9
  sweeps:
    seed_list: [0, 1, 2]
    dataset: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
    backbone: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b32_imagenet1k"]
    mask_variant: ["ours_multi_channel", "only_delta", "only_f_mask", "single_channel_f_mask_s"]
    interpolation_level_l: [0, 1, 2]
    dry_run_full_run_mode: ["runtime_smoke", "full_run"]
    p: [0.0, 0.25, 0.5, 0.75, 1.0]
    patch_size: [4, 2, 1]
    alpha: [0.1, 0.5, 1.0]
    gamma: [0.0, 0.1, 1.0]
    similarity_guidance_scale: [9, 7, 10]
  endpoint_trends:
    endpoint_low:
      parameter: "p"
      boundary_values: [0.0, 1.0]
      expected_relation: "endpoint or boundary cases are tracked as lowest/minimum comparison cases when the route is run"
    positive_parameter_improves:
      parameters: ["p", "alpha", "gamma"]
      expected_relation: "nonzero/positive values preserve the reported improvement trend when measured"

