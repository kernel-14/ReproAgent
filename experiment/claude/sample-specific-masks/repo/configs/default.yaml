methods:
  reference_grounding: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  PAD:
    aliases: ["PAD", "Pad", "pad"]
    family: "padding_based_visual_reprogramming"
    selector: "PAD"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "fixed_padding_mask_pattern"
    mask_variant: "pad_shared_mask"
    delta_enabled: true
    f_mask_enabled: false
    channel_mode: "fixed_shared"
  Narrow:
    aliases: ["Narrow", "NARrow", "narrow"]
    family: "watermarking_shared_mask"
    selector: "Narrow"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "fixed_narrow_shared_mask"
    mask_variant: "narrow_shared_mask"
    delta_enabled: true
    f_mask_enabled: false
    channel_mode: "fixed_shared"
  Medium:
    aliases: ["Medium", "medium"]
    family: "watermarking_shared_mask"
    selector: "Medium"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "fixed_medium_shared_mask"
    mask_variant: "medium_shared_mask"
    delta_enabled: true
    f_mask_enabled: false
    channel_mode: "fixed_shared"
  Full:
    aliases: ["Full", "FULL", "full"]
    family: "watermarking_shared_mask"
    selector: "Full"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "fixed_full_shared_mask"
    mask_variant: "full_shared_mask"
    delta_enabled: true
    f_mask_enabled: false
    channel_mode: "fixed_shared"
  Ours:
    aliases: ["Ours", "OURS", "ours", "SMM/Ours"]
    family: "sample_specific_multi_channel_masks"
    selector: "ours"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "smm_forward"
    mask_variant: "ours_multi_channel"
    delta_enabled: true
    f_mask_enabled: true
    channel_mode: "multi_channel"
  "ONLY δ":
    aliases: ["ONLY δ", "only_delta", "delta_only"]
    family: "table3_ablation"
    selector: "only_delta"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "shared_delta_without_sample_specific_generator"
    mask_variant: "only_delta"
    delta_enabled: true
    f_mask_enabled: false
    channel_mode: "fixed_or_identity"
  "ONLY f_mask":
    aliases: ["ONLY f_mask", "only_f_mask", "mask_only"]
    family: "table3_ablation"
    selector: "only_f_mask"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "mask_generator_without_normal_delta_contribution"
    mask_variant: "only_f_mask"
    delta_enabled: false
    f_mask_enabled: true
    channel_mode: "multi_channel"
  "SINGLE-CHANNEL f_mask^s":
    aliases: ["SINGLE-CHANNEL f_mask^s", "single_channel_mask", "single_channel_f_mask_s"]
    family: "table3_ablation"
    selector: "single_channel_mask"
    method_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "single_channel_sample_specific_mask"
    mask_variant: "single_channel_f_mask_s"
    delta_enabled: true
    f_mask_enabled: true
    channel_mode: "single_channel"
  vit:
    aliases: ["vit", "ViT-B/32"]
    family: "backbone_selector"
    selector: "vit"
    method_factory: "sample_specific_masks.train.load_classifier"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "vit_b32_backbone_adapter"
  resnet:
    aliases: ["resnet", "ResNet-18", "ResNet-50"]
    family: "backbone_selector"
    selector: "resnet"
    method_factory: "sample_specific_masks.train.load_classifier"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "resnet_backbone_adapter"
  lora:
    aliases: ["lora", "LoRA"]
    family: "selector_surface_only_for_paper_evidence_contract"
    selector: "lora"
    method_factory: "sample_specific_masks.train.load_classifier"
    train_step: "sample_specific_masks.train.run_training_loop"
    forward_path: "optional_adapter_route_not_part_of_core_smm_tables"

metrics:
  accuracy:
    display_name: "accuracy"
    formula: "correct_predictions / total_predictions"
    unit: "fraction"
    percent_field: "mean_accuracy_percent"
    compute_function: "sample_specific_masks.evaluate.compute_accuracy"
    aggregate_function: "sample_specific_masks.evaluate.aggregate_accuracy"
    output_fields: ["accuracy", "mean %", "std %", "seed", "dataset", "backbone", "method", "mask_variant", "output_mapping"]
  mean_std_accuracy:
    display_name: "mean ± std accuracy"
    formula: "mean(seed_accuracy) * 100 ± std(seed_accuracy) * 100"
    unit: "percent"
    compute_function: "sample_specific_masks.evaluate.compute_accuracy"
    aggregate_function: "sample_specific_masks.evaluate.aggregate_accuracy"
    output_fields: ["mean %", "std %", "accuracy", "seed", "dataset", "backbone", "method", "mask_variant", "output_mapping"]
  loss:
    display_name: "loss"
    formula: "cross_entropy(mapped_source_logits, target_labels)"
    unit: "nats"
    compute_function: "sample_specific_masks.train.compute_loss"
    aggregate_function: "sample_specific_masks.train.aggregate_loss"
  F1:
    display_name: "F1"
    formula: "macro harmonic mean of precision and recall"
    unit: "fraction"
    compute_function: "sample_specific_masks.evaluate.compute_f1"
    aggregate_function: "sample_specific_masks.evaluate.aggregate_f1"

