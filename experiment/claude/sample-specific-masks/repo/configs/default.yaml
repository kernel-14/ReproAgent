result_schema:
  required_fields:
    - "mean %"
    - "std %"
    - "accuracy"
    - "seed"
    - "dataset"
    - "backbone"
    - "method"
    - "mask_variant"
    - "output_mapping"
  optional_fields:
    - "loss"
    - "run_mode"
    - "experiment_id"
    - "paper_visible_name"
    - "reference_grounding"
    - "computed_from_bounded_route"

trend_assertions:
  - id: "ours_over_shared_mask_baselines"
    statement: "Ours expected to improve over predetermined shared mask VR baselines"
    compared_methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
    metric: "mean_std_accuracy"
    artifact_routes: ["table1_resnet", "table2_vit"]
    no_fabrication_policy: "record expectation; verify only from computed metrics"
  - id: "ours_ablation_strength"
    statement: "OURS expected to be strongest or competitive among Table 3 ablation variants"
    compared_methods: ["ONLY δ", "ONLY f_mask", "SINGLE-CHANNEL f_mask^s", "Ours"]
    metric: "mean_std_accuracy"
    artifact_routes: ["table3_ablation"]
    no_fabrication_policy: "record expectation; verify only from computed metrics"
  - id: "appendix_diagnostics_not_full_scores"
    statement: "附录图表仅记录可复查诊断趋势，不伪造未运行的完整训练数值"
    artifact_routes: ["figure13_23_diagnostics"]
    no_fabrication_policy: "diagnostic figures are written only from actual mask/statistic tensors or indexed as pending full-mode requirements"

out_of_scope_filters:
  excluded_extra_baselines:
    - "unlisted visual prompting baselines"
    - "new non-paper ablation variants"
    - "trainable classifier heads replacing f_out"
  excluded_sweeps:
    - "unbounded hyperparameter search"
    - "additional seeds beyond three_seed_protocol unless explicitly requested"
    - "datasets not named by the paper or evidence contract"
  pruning_rationale: "Stop at paper-specified protocol, registry, artifact, and smoke-test surfaces; avoid unbounded training, exhaustive sweeps, or unrelated scaffolding."

