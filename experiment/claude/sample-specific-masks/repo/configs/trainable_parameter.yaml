    checked_by: ["table1_resnet", "table2_vit"]
    metric: "mean_std_accuracy"
    claim_type: "expected_trend_not_fabricated_result"
  - id: "ours_ablation_competitive"
    assertion: "OURS expected to be strongest or competitive among ONLY δ, ONLY f_mask, SINGLE-CHANNEL f_mask^s, and OURS."
    checked_by: ["table3_ablation"]
    metric: "mean_std_accuracy"
    claim_type: "expected_trend_not_fabricated_result"
  - id: "appendix_diagnostics_not_full_score_claims"
    assertion: "Appendix figures record reviewable diagnostics and do not fabricate unrun full-training numbers."
    checked_by: ["figures_13_23"]
    metric: "mask_visual_diagnostics"
    claim_type: "diagnostic_provenance"

scope_constraints:
  - "仅实现论文复现所需的最小可运行闭环。"
  - "仅覆盖论文中的输入视觉重编程主路径，f_out 作为非参数映射单独处理。"
  - "只实现论文中实际比较过的固定掩码族，不扩展到未出现的额外基线。"
  - "仅实现论文所列四个消融分支，不额外添加近似变体。"
  - "仅实现论文理解性分析所需的诊断输出，不做超出论文范围的额外理论扩展。"

out_of_scope_filters:
  unrelated_prompting_methods: true
  trainable_classification_head_as_main_method: false
  unregistered_extra_mask_baselines: false
  exhaustive_unbounded_sweeps_by_default: false
  schema_only_paper_visible_artifacts: false