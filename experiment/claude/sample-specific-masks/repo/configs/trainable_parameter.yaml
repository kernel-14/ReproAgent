schema_version: "1.0"
config_id: "trainable_parameter"
paper: "Sample-specific Masks for Visual Reprogramming-based Prompting"
work_package_id: "wp_surface"
reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
mode_default: "runtime_smoke"

canonical_route:
  entrypoint: "run_smm_vrp.py"
  main_callable: "main.main"
  command: "python run_smm_vrp.py --mode runtime_smoke --config configs/trainable_parameter.yaml"
  full_command: "python run_smm_vrp.py --mode full_run --config configs/trainable_parameter.yaml"
  selectable_experiment_arg: "--experiment-id"
  default_experiment_id: "smm_smoke"
  stages:
    - setup_config
    - write_config_resolved_artifact
    - write_dataset_registry_artifact
    - write_environment_registry_artifact
    - write_experiment_registry_artifact
    - build_data
    - load_data
    - prepare_data
    - build_reprogramming
    - load_reprogramming
    - train_or_adapt_algorithm_1
    - evaluate_predictions
    - compute_accuracy
    - aggregate_accuracy
    - compute_f1
    - aggregate_f1
    - write_run_smm_vrp_artifact
    - write_table_or_figure_artifacts
    - write_artifact_manifest
    - write_readiness_artifacts
  callable_bindings:
    compute_accuracy: "run_smm_vrp:compute_accuracy"
    aggregate_accuracy: "run_smm_vrp:aggregate_accuracy"
    run_protocolsincodeconfigrathe_experiment: "run_smm_vrp:run_protocolsincodeconfigrathe_experiment"
    write_run_smm_vrp_artifact: "run_smm_vrp:write_run_smm_vrp_artifact"
    write_artifact_manifest: "run_smm_vrp:write_artifact_manifest"
    compute_f1: "sample_specific_masks.data:compute_f1"
    aggregate_f1: "sample_specific_masks.data:aggregate_f1"
    build_data: "sample_specific_masks.data:build_data"
    load_data: "sample_specific_masks.data:load_data"
    prepare_data: "sample_specific_masks.data:prepare_data"
    build_reprogramming: "sample_specific_masks.reprogramming:build_reprogramming"
    load_reprogramming: "sample_specific_masks.reprogramming:load_reprogramming"
  smoke_artifacts:
    readiness: "readiness.json"
    evaluation_result: "evaluation_result.json"
  expected_outputs:
    - "results/metrics.json"
    - "results/dataset_registry.json"
    - "results/environment_registry.json"
    - "results/experiment_registry.json"
    - "results/artifact_manifest.json"
    - "results/config_resolved.json"
    - "results/dry_run_manifest.json"
    - "results/table_index.json"
    - "results/figure_index.json"
    - "results/tables/table_1.csv"
    - "results/tables/table_2.csv"
    - "results/tables/table_3.csv"
    - "results/tables/table_13.csv"
    - "results/tables/table_14.csv"

runtime:
  output_root_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  default_output_root: "results"
  default_metric: "accuracy"
  default_output_mapping: "Rlm_random_label_mapping"
  run_modes:
    runtime_smoke:
      description: "Bounded measured route exercising the same SMM data/model/reprogramming/train/evaluate/artifact path without downloads or long training."
      allow_download: false
      require_pretrained_weights: false
      datasets: ["unit-001"]
      backbones: ["resnet18_imagenet1k"]
      methods: ["Ours"]
      mask_variants: ["ours_multi_channel"]
      seeds: [0]
      epochs: 1
      batch_size: 4
      max_train_batches: 1
      max_eval_batches: 1
      max_samples_per_dataset: 8
      write_readiness: true
      write_evaluation_result: true
      paper_visible_outputs_require_measured_values: true
    full_run:
      description: "Paper-scale reproduction route with lazy dataset/model factories and the registered table/figure protocols."
      allow_download: true
      require_pretrained_weights: true
      datasets: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
      backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b32_imagenet1k"]
      methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
      mask_variants: ["ours_multi_channel", "only_delta", "only_f_mask", "single_channel_f_mask_s"]
      seeds: [0, 1, 2]
      epochs: 100
      batch_size: 128
      max_train_batches: null
      max_eval_batches: null
      max_samples_per_dataset: null
      write_readiness: true
      write_evaluation_result: true

fixed_hyperparameters:
  three_seed_protocol:
    id: "three_seed_protocol"
    values: [0, 1, 2]
    default_smoke_values: [0]
    aggregation: "mean accuracy % ± std %"
  target_input_size:
    H: 224
    W: 224
    channels: 3
  pretrained_source:
    id: "ImageNet-1K pretrained source"
    aliases: ["imagenet_1k", "imagenet", "ImageNet-1K"]
    num_source_classes: 1000
  output_mapping:
    id: "Rlm_random_label_mapping"
    type: "non_parametric_injective_mapping"
    mapping_seed_source: "seed"
    trainable: false

sweeps:
  seed_list:
    values: [0, 1, 2]
    smoke_values: [0]
  p:
    values: [0.0, 0.25, 0.5, 0.75, 1.0]
    smoke_values: [0.5]
    trend_assertions:
      - "endpoint_low: p=0 and p=1 are retained as boundary cases for review."
      - "positive_parameter_improves: interior nonzero p values preserve the reported improvement trend."
  patch_size:
    values: [4, 2, 1]
    smoke_values: [2]
    paper_visible_name: "patch_size values 4, 2, 1"
  interpolation_level_l:
    values: [0, 1, 2]
    smoke_values: [1]
    formula:
      coarse_grid_h: "floor(H / 2^l)"
      coarse_grid_w: "floor(W / 2^l)"
      upsample_rule: "bilinear per channel to H x W; l=0 omits interpolation"
  alpha:
    values: [0.1, 0.5, 1.0]
    smoke_values: [0.5]
  gamma:
    values: [0.0, 0.1, 1.0]
    smoke_values: [0.1]
  similarity_guidance_scale:
    values: [9, 7, 10]
    smoke_values: [9]
  mask_variant:
    values: ["only_delta", "only_f_mask", "single_channel_f_mask_s", "ours_multi_channel"]
    smoke_values: ["ours_multi_channel"]
  run_mode:
    values: ["runtime_smoke", "full_run"]
    smoke_values: ["runtime_smoke"]

trainable_parameter_defaults:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  delta:
    symbol: "δ"
    initialized_as: "zero matrix {0}^{d_P}"
    shape: [3, 224, 224]
    trainable: true
    optimizer_group: "delta"
    enabled_by_variant:
      only_delta: true
      only_f_mask: false
      single_channel_f_mask_s: true
      ours_multi_channel: true
  mask_generator_phi:
    symbol: "φ"
    module: "lightweight CNN mask generator f_mask"
    trainable: true
    optimizer_group: "phi"
    output_mask_shape: [3, 224, 224]
    single_channel_output_shape: [1, 224, 224]
    enabled_by_variant:
      only_delta: false
      only_f_mask: true
      single_channel_f_mask_s: true
      ours_multi_channel: true
  patchwise_interpolation:
    enabled: true
    l_default: 1
    coarse_grid_formula: "floor(H/2^l) x floor(W/2^l)"
    upsample_to: "H x W"
    per_channel: true
  optimizer:
    name: "Adam"
    learning_rate_delta: 0.01
    learning_rate_phi: 0.001
    weight_decay: 0.0
  algorithm_1_learning_strategy:
    objective: "cross_entropy(f_out(f_P(f_in(x | phi, delta))), y)"
    frozen_backbone: true
    trainable_groups: ["delta", "phi"]
    epoch_step_order:
      - "resize target image r(x)"
      - "compute sample-specific mask f_mask(r(x) | phi)"
      - "apply f_in(x | phi, delta) = r(x) + delta ⊙ f_mask(r(x) | phi)"
      - "evaluate frozen ImageNet-1K pretrained backbone logits"
      - "apply non-parametric output mapping f_out"
      - "backpropagate loss into δ and φ only"
      - "record accuracy/loss and mask diagnostics"

