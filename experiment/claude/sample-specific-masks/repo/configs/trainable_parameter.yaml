environments:
  cifar:
    ids: ["CIFAR10", "CIFAR100"]
    aliases: ["cifar"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:dataset_available"
    runnable_config_hook: "datasets.CIFAR10"
  imagenet:
    ids: ["ImageNet-1K", "ImageNet-1K pretrained source"]
    aliases: ["imagenet", "imagenet_1k"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:dataset_available"
    runnable_config_hook: "fixed_hyperparameters.pretrained_source"
  svhn:
    ids: ["SVHN"]
    aliases: ["svhn"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:dataset_available"
    runnable_config_hook: "datasets.SVHN"
  unit-001:
    ids: ["unit-001"]
    aliases: ["unit", "smoke"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:dataset_available"
    runnable_config_hook: "datasets.unit-001"
  resnet18_imagenet1k:
    ids: ["ResNet-18 ImageNet-1K"]
    aliases: ["resnet18", "ResNet-18", "resnet"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:backbone_available"
  resnet50_imagenet1k:
    ids: ["ResNet-50 ImageNet-1K"]
    aliases: ["resnet50", "ResNet-50", "resnet"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:backbone_available"
  vit_b32_imagenet1k:
    ids: ["ViT-B/32 ImageNet-1K"]
    aliases: ["vit", "ViT-B/32", "vit_b32"]
    make_environment: "sample_specific_masks.data:make_environment"
    availability_check: "sample_specific_masks.data:backbone_available"

backbones:
  resnet18_imagenet1k:
    paper_name: "ResNet-18 (ImageNet-1K)"
    aliases: ["ResNet-18", "resnet18", "resnet"]
    family: "resnet"
    pretrained_source: "ImageNet-1K"
    factory: "sample_specific_masks.data:build_backbone"
    lazy_imports: ["torch", "torchvision"]
    frozen: true
    input_size: [3, 224, 224]
    num_logits: 1000
  resnet50_imagenet1k:
    paper_name: "ResNet-50 (ImageNet-1K)"
    aliases: ["ResNet-50", "resnet50", "resnet"]
    family: "resnet"
    pretrained_source: "ImageNet-1K"
    factory: "sample_specific_masks.data:build_backbone"
    lazy_imports: ["torch", "torchvision"]
    frozen: true
    input_size: [3, 224, 224]
    num_logits: 1000
  vit_b32_imagenet1k:
    paper_name: "ViT-B/32 (ImageNet-1K)"
    aliases: ["ViT-B/32", "vit", "vit_b32"]
    family: "vit"
    pretrained_source: "ImageNet-1K"
    factory: "sample_specific_masks.data:build_backbone"
    lazy_imports: ["torch", "torchvision", "timm"]
    frozen: true
    input_size: [3, 224, 224]
    num_logits: 1000

methods:
  PAD:
    id: "PAD"
    aliases: ["Pad", "pad"]
    category: "fixed_mask_baseline"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "pad_fixed"
    uses_delta: true
    uses_mask_generator: false
    channel_mode: "fixed_shared"
  Narrow:
    id: "Narrow"
    aliases: ["NARrow", "narrow"]
    category: "fixed_mask_baseline"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "narrow_fixed"
    uses_delta: true
    uses_mask_generator: false
    channel_mode: "fixed_shared"
  Medium:
    id: "Medium"
    aliases: ["medium"]
    category: "fixed_mask_baseline"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "medium_fixed"
    uses_delta: true
    uses_mask_generator: false
    channel_mode: "fixed_shared"
  Full:
    id: "Full"
    aliases: ["FULL", "full"]
    category: "fixed_mask_baseline"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "full_fixed"
    uses_delta: true
    uses_mask_generator: false
    channel_mode: "fixed_shared"
  Ours:
    id: "Ours"
    aliases: ["ours", "SMM/Ours", "smm", "sample-specific multi-channel masks"]
    category: "proposed_method"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "ours_multi_channel"
    uses_delta: true
    uses_mask_generator: true
    channel_mode: "multi_channel"
  only_delta:
    id: "ONLY δ"
    aliases: ["ONLY delta", "only_delta"]
    category: "ablation"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "only_delta"
    uses_delta: true
    uses_mask_generator: false
    channel_mode: "fixed_or_all_ones"
  only_f_mask:
    id: "ONLY f_mask"
    aliases: ["only_f_mask", "ONLY fmask"]
    category: "ablation"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "only_f_mask"
    uses_delta: false
    uses_mask_generator: true
    channel_mode: "multi_channel"
  single_channel_f_mask_s:
    id: "SINGLE-CHANNEL f_mask^s"
    aliases: ["single_channel_mask", "single_channel_f_mask_s"]
    category: "ablation"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    forward_route: "sample_specific_masks.reprogramming:forward_reprogramming"
    train_route: "sample_specific_masks.train:run_training_loop"
    mask_variant: "single_channel_f_mask_s"
    uses_delta: true
    uses_mask_generator: true
    channel_mode: "single_channel"
