  resnet:
    id: "resnet"
    aliases: ["ResNet-18", "ResNet-50"]
    category: "backbone_selector"
    selector: "sample_specific_masks.data:build_backbone"
    bound_backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k"]
  lora:
    id: "lora"
    aliases: ["LoRA", "lora_adapter"]
    category: "adapter_baseline_selector"
    selector: "sample_specific_masks.reprogramming:build_reprogramming"
    status: "registered adapter selector for paper evidence contract; not selected in default SMM table routes unless explicitly requested"

metrics:
  accuracy:
    paper_name: "accuracy"
    compute: "run_smm_vrp:compute_accuracy"
    aggregate: "run_smm_vrp:aggregate_accuracy"
    unit: "fraction"
    report_unit: "percent"
    result_fields: ["accuracy", "mean %", "std %", "seed", "dataset", "backbone", "method", "mask_variant", "output_mapping"]
  mean_std_accuracy:
    paper_name: "mean accuracy % ± std %"
    compute: "run_smm_vrp:compute_accuracy"
    aggregate: "run_smm_vrp:aggregate_accuracy"
    report_unit: "percent"
  f1:
    paper_name: "F1"
    compute: "sample_specific_masks.data:compute_f1"
    aggregate: "sample_specific_masks.data:aggregate_f1"
    report_unit: "fraction"
  loss:
    paper_name: "loss"
    compute: "sample_specific_masks.train:compute_loss"
    aggregate: "sample_specific_masks.train:aggregate_loss"
    report_unit: "cross_entropy"

result_record_schema:
  required_fields:
    - "mean %"
    - "std %"
    - "accuracy"
    - "seed"
    - "dataset"
    - "backbone"
    - "method"
    - "mask_variant"
    - "output_mapping"
  optional_fields:
    - "loss"
    - "f1"
    - "run_mode"
    - "experiment_id"
    - "paper_visible_name"
    - "artifact_path"

experiments:
  smm_smoke:
    paper_visible_name: "smm_smoke"
    description: "Algorithm 1 SMM learning strategy smoke route with zero-initialized shared δ and trainable φ."
    route: "run_smm_vrp:run_protocolsincodeconfigrathe_experiment"
    datasets: ["unit-001"]
    backbones: ["resnet18_imagenet1k"]
    methods: ["Ours"]
    mask_variants: ["ours_multi_channel"]
    seeds: [0]
    metrics: ["accuracy", "mean_std_accuracy", "f1", "loss"]
    artifact_writers:
      - "run_smm_vrp:write_run_smm_vrp_artifact"
      - "run_smm_vrp:write_artifact_manifest"
    artifact_paths:
      metrics: "results/metrics.json"
      readiness: "readiness.json"
      evaluation_result: "evaluation_result.json"
    mode_policy: "runtime_smoke uses bounded measured inputs through the full implementation route"
  table1_resnet:
    paper_visible_name: "Table 1 main ResNet comparison"
    reference_grounding: "chunk_014_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
    route: "run_smm_vrp:run_protocolsincodeconfigrathe_experiment"
    datasets: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
    smoke_datasets: ["unit-001"]
    backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k"]
    smoke_backbones: ["resnet18_imagenet1k"]
    methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
    smoke_methods: ["Ours"]
    mask_variants: ["pad_fixed", "narrow_fixed", "medium_fixed", "full_fixed", "ours_multi_channel"]
    seeds: [0, 1, 2]
    smoke_seeds: [0]
    metrics: ["accuracy", "mean_std_accuracy"]
