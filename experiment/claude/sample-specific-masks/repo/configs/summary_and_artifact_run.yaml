trend_assertions:
  - id: "ours_over_shared_mask_baselines"
    assertion: "Ours expected to improve over predetermined shared mask VR baselines"
    checked_by: ["table1_resnet", "table2_vit"]
    decision_metric: "mean_std_accuracy"
  - id: "ours_ablation_strength"
    assertion: "OURS expected to be strongest or competitive among Table 3 ablation variants"
    checked_by: ["table3_ablation"]
    decision_metric: "mean_std_accuracy"
  - id: "appendix_diagnostics_no_fabrication"
    assertion: "附录图表仅记录可复查诊断趋势，不伪造未运行的完整训练数值"
    checked_by: ["figure_13_23_visualization", "appendix_table13", "appendix_table14"]
  - id: "multi_channel_benefit"
    assertion: "multi-channel sample-specific masks expected to provide benefit over single-channel or component-only variants"
    checked_by: ["table3_ablation"]
  - id: "delta_and_f_mask_complementary"
    assertion: "shared δ and f_mask are complementary mechanisms"
    checked_by: ["table3_ablation"]
  - id: "sample_specific_variability"
    assertion: "样本特定掩码应体现更强的样本差异性"
    checked_by: ["mask_visualization_diagnostics"]
  - id: "endpoint_low"
    assertion: "p=0 and p=1 must be represented as lowest/minimum boundary cases"
    parameter: "p"
    values: [0.0, 1.0]
  - id: "positive_parameter_improves"
    assertion: "nonzero/positive parameter values should preserve the reported improvement trend"
    parameters: ["alpha", "gamma", "similarity_guidance_scale"]

scope_constraints:
  - "仅实现论文复现所需的最小可运行闭环。"
  - "仅覆盖论文中的输入视觉重编程主路径，f_out 作为非参数映射单独处理。"
  - "只实现论文中实际比较过的固定掩码族，不扩展到未出现的额外基线。"
  - "仅实现论文所列四个消融分支，不额外添加近似变体。"
  - "仅实现论文理解性分析所需的诊断输出，不做超出论文范围的额外理论扩展。"

