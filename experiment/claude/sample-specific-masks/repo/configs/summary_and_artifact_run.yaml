schema_version: "1.0"
config_id: "summary_and_artifact_run"
paper: "Sample-specific Masks for Visual Reprogramming-based Prompting"
work_package_id: "wp_surface"
reference_grounding: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
mode_default: "runtime_smoke"

canonical_route:
  entrypoint: "run_smm_vrp.py"
  main_callable: "main.main"
  command: "python run_smm_vrp.py --mode runtime_smoke --config configs/summary_and_artifact_run.yaml"
  full_command: "python run_smm_vrp.py --mode full_run --config configs/summary_and_artifact_run.yaml"
  selectable_experiment_arg: "--experiment-id"
  stages:
    - setup_config
    - resolve_runtime_mode
    - write_config_resolved_artifact
    - write_dataset_registry_artifact
    - write_environment_registry_artifact
    - write_experiment_registry_artifact
    - build_data
    - load_data
    - prepare_data
    - build_reprogramming
    - load_reprogramming
    - train_or_adapt_algorithm_1
    - evaluate_predictions
    - compute_accuracy
    - aggregate_accuracy
    - compute_f1
    - aggregate_f1
    - write_run_smm_vrp_artifact
    - write_table_or_figure_artifacts
    - write_artifact_manifest
    - write_dry_run_manifest_artifact
    - write_readiness_artifacts
  smoke_artifacts:
    readiness: "readiness.json"
    evaluation_result: "evaluation_result.json"
  expected_outputs:
    - "results/metrics.json"
    - "results/dataset_registry.json"
    - "results/environment_registry.json"
    - "results/experiment_registry.json"
    - "results/artifact_manifest.json"
    - "results/config_resolved.json"
    - "results/dry_run_manifest.json"
    - "results/table_index.json"
    - "results/figure_index.json"

runtime:
  output_root_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  default_output_root: "results"
  default_experiment_id: "smm_smoke"
  default_metric: "accuracy"
  default_output_mapping: "Rlm_random_label_mapping"
  paper_visible_artifact_policy:
    runtime_smoke: "write paper-visible outputs only when produced by bounded measured route; readiness manifests are auxiliary and labeled smoke"
    full_run: "execute full selected protocol cells with lazy external data/model loading"
  run_modes:
    runtime_smoke:
      description: "Bounded canonical route that instantiates data, backbone adapter, SMM method, one train step, evaluation, metric aggregation, and artifact writers without downloading full datasets."
      seeds: [0]
      datasets: ["unit-001"]
      backbones: ["resnet18_imagenet1k"]
      methods: ["Ours"]
      mask_variants: ["ours_multi_channel"]
      interpolation_levels_l: [1]
      epochs: 1
      batch_size: 4
      max_train_batches: 1
      max_eval_batches: 1
      max_samples_per_dataset: 8
      allow_download: false
      write_readiness: true
      write_evaluation_result: true
      smoke_label: "runtime_smoke_bounded_measured_route"
    full_run:
      description: "Paper protocol route over registered datasets, backbones, baselines, SMM variants, and appendix diagnostics."
      seeds: [0, 1, 2]
      datasets:
        - "CIFAR10"
        - "CIFAR100"
        - "SVHN"
        - "GTSRB"
        - "Flowers102"
        - "DTD"
        - "UCF101"
        - "EuroSAT"
      appendix_visualization_datasets:
        - "CIFAR10"
        - "CIFAR100"
        - "SVHN"
        - "GTSRB"
        - "Flowers102"
        - "DTD"
        - "UCF101"
        - "Food101"
        - "SUN397"
        - "EuroSAT"
        - "OxfordPets"
      backbones:
        - "resnet18_imagenet1k"
        - "resnet50_imagenet1k"
        - "vit_b32_imagenet1k"
      methods:
        - "PAD"
        - "Narrow"
        - "Medium"
        - "Full"
        - "Ours"
      mask_variants:
        - "pad_shared_mask"
        - "narrow_shared_mask"
        - "medium_shared_mask"
        - "full_shared_mask"
        - "only_delta"
        - "only_f_mask"
        - "single_channel_f_mask_s"
        - "ours_multi_channel"
      interpolation_levels_l: [0, 1, 2]
      epochs: "paper_table_9_or_override"
      batch_size: "paper_table_9_or_override"
      max_train_batches: null
      max_eval_batches: null
      max_samples_per_dataset: null
      allow_download: true

result_record_fields:
  required:
    - "mean_percent"
    - "std_percent"
    - "accuracy"
    - "seed"
    - "dataset"
    - "backbone"
    - "method"
    - "mask_variant"
    - "output_mapping"
  optional:
    - "f1"
    - "loss"
    - "run_mode"
    - "experiment_id"
    - "artifact_name"
    - "reference_grounding"
    - "train_batches"
    - "eval_batches"
    - "smoke_bounded"

parameters:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  three_seed_protocol:
    id: "three_seed_protocol"
    values: [0, 1, 2]
    default_smoke: [0]
  seed_list:
    default: [0, 1, 2]
    smoke: [0]
  dataset:
    default_full:
      - "CIFAR10"
      - "CIFAR100"
      - "SVHN"
      - "GTSRB"
      - "Flowers102"
      - "DTD"
      - "UCF101"
      - "EuroSAT"
    smoke: ["unit-001"]
  backbone:
    default_full:
      - "resnet18_imagenet1k"
      - "resnet50_imagenet1k"
      - "vit_b32_imagenet1k"
    smoke: ["resnet18_imagenet1k"]
  mask_variant:
    defaults:
      - "pad_shared_mask"
      - "narrow_shared_mask"
      - "medium_shared_mask"
      - "full_shared_mask"
      - "only_delta"
      - "only_f_mask"
      - "single_channel_f_mask_s"
      - "ours_multi_channel"
    smoke: ["ours_multi_channel"]
  interpolation_level_l:
    default: 1
    sweep: [0, 1, 2]
    semantics:
      l_0: "omit patch-wise interpolation and use H x W mask"
      l_gt_0: "upsample floor(H/2^l) x floor(W/2^l) coarse mask grid to H x W per channel"
  target_mask_size_hw:
    resnet: [224, 224]
    vit_b32: [224, 224]
    vit_l_table13: [384, 384]
  coarse_mask_grid_formula: "floor(H / 2**l) x floor(W / 2**l)"
  delta_initialization:
    symbol: "δ"
    value: "zero matrix {0}^{d_P}"
    executable_hook: "sample_specific_masks.reprogramming.build_reprogramming"
  phi_mask_generator_parameters:
    symbol: "φ"
    resnet_layers: 5
    vit_layers: 6
    trainable: true
    optimizer_group: "mask_generator_phi"
  channel_modes:
    multi_channel_mask:
      channels: 3
      variants: ["ours_multi_channel"]
    single_channel_mask:
      channels: 1
      variants: ["single_channel_f_mask_s"]
  bounded_sweeps:
    alpha:
      values: [0.1, 0.5, 1.0]
      owner: "training_config"
    gamma:
      values: [0.0, 0.1, 1.0]
      owner: "training_config"
    p:
      values: [0.0, 0.25, 0.5, 0.75, 1.0]
      endpoint_low_cases: [0.0, 1.0]
      owner: "diagnostic_trend_protocol"
    patch_size:
      values: [4, 2, 1]
      paper_visible_subset: [2, 1]
      owner: "Figure 4"
    similarity_guidance_scale:
      values: [9, 7, 10]
      owner: "bounded_config_surface"

metric_registry:
  reference_grounding: "chunk_017_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  accuracy:
    canonical_ids: ["accuracy", "metric_accuracy"]
    formula: "correct_predictions / total_predictions"
    callable: "sample_specific_masks.evaluate.compute_accuracy"
    aggregator: "sample_specific_masks.evaluate.aggregate_accuracy"
    output_fields: ["accuracy", "mean_percent", "std_percent"]
  mean_std_accuracy:
    canonical_ids: ["mean_std_accuracy", "metric_mean_std_accuracy"]
    formula: "mean(seed_accuracy_values) * 100 ± sample_std(seed_accuracy_values) * 100"
    callable: "sample_specific_masks.evaluate.aggregate_accuracy"
    output_fields: ["mean_percent", "std_percent"]
    single_seed_smoke_std_percent: 0.0
  f1:
    canonical_ids: ["f1", "metric_f1"]
    formula: "macro average 2 * precision * recall / (precision + recall) over target classes"
    callable: "sample_specific_masks.evaluate.compute_f1"
    aggregator: "sample_specific_masks.evaluate.aggregate_f1"
  mean_std:
    canonical_ids: ["mean_std", "metric_mean_std"]
    formula: "mean(values) ± sample_std(values)"
    callable: "sample_specific_masks.evaluate.aggregate_metrics"
  loss:
    canonical_ids: ["loss", "metric_loss"]
    formula: "cross_entropy(mapped_imagenet_logits, target_labels)"
    callable: "sample_specific_masks.train.compute_loss"
    aggregator: "sample_specific_masks.train.aggregate_loss"
  figure_3_reproduction_artifact:
    canonical_ids: ["figure_3_reproduction_artifact", "metric_figure_3_reproduction_artifact"]
    artifact_writer: "sample_specific_masks.artifacts.write_figure_3_artifact"
  table_3_reproduction_artifact:
    canonical_ids: ["table_3_reproduction_artifact", "metric_table_3_reproduction_artifact"]
    artifact_writer: "sample_specific_masks.artifacts.write_table_3_artifact"
  learning_curve:
    canonical_ids: ["learning_curve", "metric_learning_curve"]
    callable: "sample_specific_masks.train.run_training_loop"
    artifact_writer: "sample_specific_masks.artifacts.write_learning_curve_artifact"
  figure_11_reproduction_artifact:
    canonical_ids: ["figure_11_reproduction_artifact", "metric_figure_11_reproduction_artifact"]
    artifact_writer: "sample_specific_masks.artifacts.write_figure_11_artifact"
  figure_12_reproduction_artifact:
    canonical_ids: ["figure_12_reproduction_artifact", "metric_figure_12_reproduction_artifact"]
    artifact_writer: "sample_specific_masks.artifacts.write_figure_12_artifact"
  table_11_reproduction_artifact:
    canonical_ids: ["table_11_reproduction_artifact", "metric_table_11_reproduction_artifact"]
    artifact_writer: "sample_specific_masks.artifacts.write_table_11_artifact"

