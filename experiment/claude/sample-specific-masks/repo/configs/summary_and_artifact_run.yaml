method_registry:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  PAD:
    aliases: ["Pad", "pad", "padding-based reprogramming"]
    selector: "pad"
    mask_variant: "pad_shared_mask"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    semantics: "Center target image and add padding with a predetermined shared valid-mask layout."
  Narrow:
    aliases: ["narrow"]
    selector: "narrow"
    mask_variant: "narrow_shared_mask"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    semantics: "Predetermined narrow shared mask baseline."
  Medium:
    aliases: ["medium"]
    selector: "medium"
    mask_variant: "medium_shared_mask"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    semantics: "Predetermined medium shared mask baseline."
  Full:
    aliases: ["full"]
    selector: "full"
    mask_variant: "full_shared_mask"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    semantics: "Predetermined full shared mask baseline."
  Ours:
    aliases: ["ours", "SMM/Ours", "sample-specific multi-channel masks"]
    selector: "ours"
    mask_variant: "ours_multi_channel"
    formula: "f_in(x_i | φ, δ) = r(x_i) + δ ⊙ f_mask(r(x_i) | φ)"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    load_factory: "sample_specific_masks.reprogramming.load_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
    output_mapping: "Rlm_random_label_mapping"
  ONLY_delta:
    paper_name: "ONLY δ"
    aliases: ["ONLY δ", "only_delta"]
    selector: "only_delta"
    mask_variant: "only_delta"
    delta_enabled: true
    f_mask_enabled: false
    channel_mode: "shared_or_equivalent_mask"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
  ONLY_f_mask:
    paper_name: "ONLY f_mask"
    aliases: ["ONLY f_mask", "only_f_mask"]
    selector: "only_f_mask"
    mask_variant: "only_f_mask"
    delta_enabled: false
    f_mask_enabled: true
    channel_mode: "multi_channel_mask_without_normal_delta_contribution"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
  SINGLE_CHANNEL_f_mask_s:
    paper_name: "SINGLE-CHANNEL f_mask^s"
    aliases: ["SINGLE-CHANNEL f_mask^s", "single_channel_mask", "single_channel_f_mask_s"]
    selector: "single_channel_mask"
    mask_variant: "single_channel_f_mask_s"
    delta_enabled: true
    f_mask_enabled: true
    channel_mode: "single_channel"
    forward_factory: "sample_specific_masks.reprogramming.build_reprogramming"
    train_step: "sample_specific_masks.train.run_training_loop"
  lora:
    paper_name: "LoRA"
    aliases: ["lora", "finetuning_lora"]
    selector: "lora"
    train_step: "sample_specific_masks.train.run_training_loop"
    artifact_protocol: "appendix_table13"
  resnet:
    paper_name: "ResNet"
    aliases: ["resnet", "resnet18_imagenet1k", "resnet50_imagenet1k"]
    selector: "backbone_family_resnet"
  vit:
    paper_name: "ViT"
    aliases: ["vit", "vit_b32_imagenet1k", "vit_l_384_imagenet1k"]
    selector: "backbone_family_vit"
  imagenet_1k:
    paper_name: "ImageNet-1K"
    aliases: ["imagenet_1k", "imagenet"]
    selector: "source_label_space"

output_mapping:
  default: "Rlm_random_label_mapping"
  callable: "sample_specific_masks.data.build_output_mapping"
  non_parametric: true
  deterministic_seed_control: true
  fields:
    - "seed"
    - "target_class"
    - "pretrained_class_index"
    - "dataset"
    - "backbone"

experiment_registry:
  reference_grounding: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  smm_smoke:
