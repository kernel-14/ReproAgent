trend_obligations:
  endpoint_low:
    parameter: "p"
    boundary_cases: [0.0, 1.0]
    expected_semantics: "p=0 and p=1 are explicit endpoint/minimum boundary cases"
    consumers: ["patch_size_ablation", "mask_statistics_diagnostics"]
  positive_parameter_improves:
    parameters:
      p: [0.25, 0.5, 0.75]
      patch_size: [4, 2, 1]
    expected_semantics: "nonzero/positive parameter values preserve the reported improvement trend without fabricating scores"
    consumers: ["table1_resnet", "table2_vit", "table3_ablation"]

