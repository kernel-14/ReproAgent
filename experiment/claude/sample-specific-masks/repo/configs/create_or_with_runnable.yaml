method_registry:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  PAD:
    id: "PAD"
    aliases: ["Pad", "pad"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "pad"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "padding_shared_delta"
      valid_region: "centered_original_image"
      mask: "fixed_border_pattern"
      mask_channels: 3
      delta_enabled: true
      mask_generator_enabled: false
    metric_artifacts: ["accuracy", "loss"]
  Narrow:
    id: "Narrow"
    aliases: ["narrow"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "narrow"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "shared_fixed_mask"
      mask_width_fraction: 0.25
      mask_channels: 3
      delta_enabled: true
      mask_generator_enabled: false
    metric_artifacts: ["accuracy", "loss"]
  Medium:
    id: "Medium"
    aliases: ["medium"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "medium"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "shared_fixed_mask"
      mask_width_fraction: 0.50
      mask_channels: 3
      delta_enabled: true
      mask_generator_enabled: false
    metric_artifacts: ["accuracy", "loss"]
  Full:
    id: "Full"
    aliases: ["full"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "full"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "shared_fixed_mask"
      mask_width_fraction: 1.0
      mask_channels: 3
      delta_enabled: true
      mask_generator_enabled: false
    metric_artifacts: ["accuracy", "loss"]
  Ours:
    id: "Ours"
    aliases: ["ours", "SMM", "sample-specific multi-channel masks"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "ours"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "sample_specific_multi_channel_mask"
      formula: "r(x_i) + delta * f_mask(r(x_i) | phi)"
      delta_enabled: true
      mask_generator_enabled: true
      mask_channels: 3
      interpolation_level_l: 2
      coarse_grid_formula: "floor(H / 2^l) x floor(W / 2^l)"
    metric_artifacts: ["accuracy", "loss"]
  only_delta:
    id: "ONLY δ"
    aliases: ["only_delta", "ONLY delta"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "only_delta"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "ablation_shared_delta_only"
      delta_enabled: true
      mask_generator_enabled: false
      mask_channels: 3
  only_f_mask:
    id: "ONLY f_mask"
    aliases: ["only_f_mask", "ONLY mask"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "only_f_mask"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "ablation_mask_generator_only"
      delta_enabled: false
      mask_generator_enabled: true
      mask_channels: 3
  single_channel_mask:
    id: "SINGLE-CHANNEL f_mask^s"
    aliases: ["single_channel_mask", "SINGLE-CHANNEL f_mask^s"]
    selector: "sample_specific_masks.reprogramming.build_reprogramming"
    variant: "single_channel_mask"
    forward: "sample_specific_masks.reprogramming.forward_reprogrammed"
    train_step: "sample_specific_masks.train.train_step"
    pattern_layout:
      type: "ablation_single_channel_sample_specific_mask"
      delta_enabled: true
      mask_generator_enabled: true
      mask_channels: 1
  vit:
    id: "vit"
    aliases: ["ViT-B/32", "vit_b32_imagenet1k"]
    selector: "sample_specific_masks.data.load_backbone"
    role: "pretrained_backbone"
  resnet:
    id: "resnet"
    aliases: ["ResNet-18", "ResNet-50", "resnet18_imagenet1k", "resnet50_imagenet1k"]
    selector: "sample_specific_masks.data.load_backbone"
    role: "pretrained_backbone"
  lora:
    id: "lora"
    aliases: ["LoRA"]
    selector: "sample_specific_masks.train.build_adapter_baseline"
    role: "adapter_baseline"
    enabled_by_default: false
    scope_note: "Registered for paper evidence compatibility; not executed in SMM main comparison unless selected explicitly."

metric_registry:
  accuracy:
    id: "accuracy"
    formula: "100 * correct_predictions / total_predictions"
    function: "sample_specific_masks.evaluate.compute_accuracy"
    aggregation: "sample_specific_masks.evaluate.aggregate_accuracy"
    fields: ["accuracy", "mean_accuracy_percent", "std_percent"]
  loss:
    id: "loss"
    formula: "cross_entropy(mapped_logits, target_labels)"
    function: "sample_specific_masks.train.compute_loss"
    aggregation: "sample_specific_masks.train.aggregate_loss"
    fields: ["loss", "mean_loss", "std_loss"]
  mean_std_accuracy:
    id: "mean_std_accuracy"
    formula: "mean(seed_accuracy_percent), sample_std(seed_accuracy_percent)"
    function: "sample_specific_masks.evaluate.aggregate_accuracy"
    fields: ["mean_accuracy_percent", "std_percent", "seed_count"]
  f1:
    id: "F1"
    formula: "macro_f1 = mean_c(2 * precision_c * recall_c / (precision_c + recall_c))"
    function: "sample_specific_masks.evaluate.compute_f1"
    aggregation: "sample_specific_masks.evaluate.aggregate_f1"
    enabled_for_tables: false

output_mapping:
  id: "Rlm"
  type: "non_parametric_injective_random_label_mapping"
  factory: "sample_specific_masks.data.build_output_mapping"
  mapping_seed_field: "seed"
  source_class_count: 1000
  persist_path_template: "results/mappings/{dataset}_{backbone}_seed{seed}.json"

evaluation:
  evaluate_predictions: "sample_specific_masks.evaluate.evaluate_predictions"
  run_evaluation: "sample_specific_masks.evaluate.run_evaluation"
  shared_row_protocol:
    split: "chen_2023_paper_split"
    output_mapping: "Rlm"
    metric_aggregation: "mean_std_accuracy"
    artifact_writer: "sample_specific_masks.artifacts.write_named_result_artifacts"
    prediction_fields:
      - dataset
      - backbone
      - method
      - seed
      - y_true
      - y_pred
      - loss
      - accuracy
  aggregation_group_by: ["dataset", "backbone", "method", "seed"]
  table_group_by: ["dataset", "backbone", "method"]
  summary_fields:
    - dataset
    - backbone
    - method
    - seed_count
    - mean_accuracy_percent
    - std_percent
    - mean_loss

training:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  algorithm: "Algorithm 1 SMM learning strategy"
  function: "sample_specific_masks.train.run_training_loop"
  objective: "minimize cross_entropy(f_out(f_P(f_in(x | phi, delta))), y)"
  initialize:
    delta: "zeros_like_pretrained_input"
    phi: "cnn_mask_generator_parameters"
  parameter_groups:
    - name: "shared_delta"
      enabled_for: ["PAD", "Narrow", "Medium", "Full", "Ours", "ONLY δ", "SINGLE-CHANNEL f_mask^s"]
      learning_rate: 0.001
    - name: "mask_generator_phi"
      enabled_for: ["Ours", "ONLY f_mask", "SINGLE-CHANNEL f_mask^s"]
      learning_rate: 0.001
  freeze_backbone: true
  no_trainable_classifier_head: true
  epochs:
    runtime_smoke: 1
    full_run: 20

artifact_writers:
  metrics:
    path: "results/metrics.json"
    writer: "sample_specific_masks.artifacts.write_metrics_artifact"
  dataset_registry:
