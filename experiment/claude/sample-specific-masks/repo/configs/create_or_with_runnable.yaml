  figure_diagnostic:
    writer: "sample_specific_masks.artifacts.write_mask_diagnostic_figure_artifact"

experiment_registry:
  reference_grounding: "chunk_014_02 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  smm_smoke:
    experiment_id: "smm_smoke"
    paper_route: "Algorithm 1 SMM learning strategy"
    environments: ["unit-001"]
    datasets: ["unit-001"]
    backbones: ["resnet18_imagenet1k"]
    methods: ["Ours"]
    seeds: [0]
    metrics: ["accuracy", "loss", "mean_std_accuracy"]
    train: "sample_specific_masks.train.run_training_loop"
    evaluate: "sample_specific_masks.evaluate.evaluate_predictions"
    artifact_writers:
      - "sample_specific_masks.artifacts.write_metrics_artifact"
      - "sample_specific_masks.artifacts.write_config_resolved_artifact"
    artifacts:
      metrics: "results/metrics.json"
      readiness: "readiness.json"
      evaluation_result: "evaluation_result.json"
    method_defaults:
      delta_initialization: "zeros"
      interpolation_level_l: 2
      mask_channels: 3
      mask_variant: "ours"
  table1_resnet:
    experiment_id: "table1_resnet"
