schema_version: "1.0"
config_id: "create_or_with_runnable"
paper: "Sample-specific Masks for Visual Reprogramming-based Prompting"
work_package_id: "wp_main_comparison"
reference_grounding: "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
mode_default: "runtime_smoke"

canonical_route:
  entrypoint: "run_smm_vrp.py"
  command: "python run_smm_vrp.py --mode runtime_smoke --config configs/create_or_with_runnable.yaml"
  full_command: "python run_smm_vrp.py --mode full_run --config configs/create_or_with_runnable.yaml"
  stages:
    - setup_config
    - make_environment
    - build_data
    - build_backbone
    - build_reprogramming
    - train_or_adapt
    - evaluate_predictions
    - write_artifacts
  smoke_artifacts:
    readiness: "readiness.json"
    evaluation_result: "evaluation_result.json"
  paper_visible_artifact_policy:
    smoke_mode: "bounded measured route only; no fabricated benchmark scores"
    full_mode: "runs all selected protocol cells with lazy dataset/model factories"

scope_constraints:
  - "仅实现论文复现所需的最小可运行闭环。"
  - "仅覆盖论文中的输入视觉重编程主路径，f_out 作为非参数映射单独处理。"
  - "只实现论文中实际比较过的固定掩码族，不扩展到未出现的额外基线。"
  - "仅实现论文所列四个消融分支，不额外添加近似变体。"
  - "仅实现论文理解性分析所需的诊断输出，不做超出论文范围的额外理论扩展。"

runtime:
  output_root_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  default_output_root: "results"
  modes:
    runtime_smoke:
      max_train_batches: 1
      max_eval_batches: 1
      max_samples_per_dataset: 8
      epochs: 1
      seeds: [0]
      datasets: ["unit-001"]
      backbones: ["resnet18_imagenet1k"]
      methods: ["Ours"]
      write_readiness: true
      write_evaluation_result: true
    full_run:
      max_train_batches: null
      max_eval_batches: null
      max_samples_per_dataset: null
      epochs: 20
      seeds: [0, 1, 2]
      datasets: ["CIFAR10", "CIFAR100", "SVHN", "GTSRB", "Flowers102", "DTD", "UCF101", "EuroSAT"]
      backbones: ["resnet18_imagenet1k", "resnet50_imagenet1k", "vit_b32_imagenet1k"]
      methods: ["PAD", "Narrow", "Medium", "Full", "Ours"]
      write_readiness: true
      write_evaluation_result: true

constants:
  reference_grounding: "chunk_009 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"
  target_height: 224
  target_width: 224
  target_channels: 3
  pretrained_input_size: [3, 224, 224]
  delta_initialization: "zeros"
  delta_shape: [3, 224, 224]
  f_in_formula: "r(x_i) + delta * f_mask(r(x_i) | phi)"
  f_out: "non_parametric_injective_random_label_mapping"
  default_output_mapping: "Rlm"
  default_interpolation_level_l: 2
  interpolation_levels: [0, 1, 2, 3]
  coarse_grid_formula: "floor(H / 2^l) x floor(W / 2^l)"
  mask_channels:
    multi_channel: 3
    single_channel: 1
  three_seed_protocol: [0, 1, 2]
  seed_list: [0, 1, 2]
  patch_size_values: [4, 2, 1]
  p_values: [0.0, 0.25, 0.5, 0.75, 1.0]
  alpha_values: [0.1, 0.5, 1.0]
  gamma_values: [0.0, 0.1, 1.0]
  similarity_guidance_scale_values: [9, 7, 10]
  default_learning_rate: 0.001
  default_batch_size: 32
  smoke_batch_size: 4

