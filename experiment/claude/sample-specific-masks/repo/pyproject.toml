[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-specific-masks-vrp"
version = "0.1.0"
description = "PaperBench reproduction for Sample-specific Masks for Visual Reprogramming-based Prompting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "PaperBench Repro" }
]
keywords = [
  "visual-reprogramming",
  "sample-specific-masks",
  "image-classification",
  "paper-reproduction",
  "imagenet",
  "resnet",
  "vit"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "Pillow>=9.4",
  "typing-extensions>=4.7; python_version < '3.11'"
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1"
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4"
]
vision = [
  "torch>=2.0",
  "torchvision>=0.15",
  "timm>=0.9"
]
tables = [
  "pandas>=2.0"
]
figures = [
  "matplotlib>=3.7",
  "scikit-learn>=1.3"
]
full = [
  "torch>=2.0",
  "torchvision>=0.15",
  "timm>=0.9",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3"
]

[project.urls]
Repository = "https://example.invalid/paperbench/sample-specific-masks-vrp"
Paper = "https://proceedings.mlr.press/v235/"

[project.scripts]
smm-vrp = "main:main"
sample-specific-masks-vrp = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "main",
  "run_smm_vrp"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "sample_specific_masks*",
  "src*"
]
exclude = [
  "tests*",
  "results*",
  "assets*"
]

[tool.setuptools.package-data]
sample_specific_masks = ["py.typed"]
"*" = [
  "configs/*.yaml",
  "configs/*.yml"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
  "runtime_smoke: bounded smoke route that exercises dataset, method, metric, environment-readiness, and artifact-writer wiring",
  "full: optional full reproduction route requiring external datasets and vision backends"
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "results",
  "artifacts",
  ".venv",
  "build",
  "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.paperbench_repro]
canonical_entrypoint = "run_smm_vrp.py"
canonical_smoke_command = "python run_smm_vrp.py --mode runtime_smoke"
artifact_env_var = "PAPERBENCH_REPRO_ARTIFACT_DIR"
default_config = "configs/smm_vrp.yaml"
runtime_config = "configs/create_or_with_runnable.yaml"
trainable_config = "configs/unit_for_or_trainable.yaml"
reference_grounding = "chunk_016_01 /mnt/paper2any/pzw/proj/paperagent/hx/Research_space/Reproduction/paperbench_data/sample-specific-masks/paper.md"

[tool.paperbench_repro.lightweight_dependencies]
purpose = "Importable smoke, config resolution, registry readiness, metric aggregation, and bounded artifact writing without mandatory downloads or GPU backends."
packages = ["numpy", "PyYAML", "Pillow"]

[tool.paperbench_repro.optional_heavy_dependencies]
vision_backend = ["torch", "torchvision", "timm"]
table_backend = ["pandas"]
figure_backend = ["matplotlib", "scikit-learn"]
policy = "Optional backends must be imported lazily by loader, training, evaluation, or figure-writing functions."

[tool.paperbench_repro.paper_protocol]
three_seed_protocol = [0, 1, 2]
metrics = ["accuracy", "loss"]
datasets = [
  "cifar",
  "imagenet",
  "svhn",
  "imagenet_1k",
  "stanford_cars",
  "dtd",
  "eurosat",
  "flowers",
  "oxford_pets"
]
environments = ["cifar", "imagenet", "svhn"]
table1_backbones = ["resnet18_imagenet1k", "resnet50_imagenet1k"]
table1_methods = ["PAD", "Narrow", "Medium", "Full", "Ours"]
table2_backbones = ["vit_b_32_imagenet1k"]
appendix_tables = ["Table 13", "Table 14"]
appendix_figures = [
  "Figure 13",
  "Figure 14",
  "Figure 15",
  "Figure 16",
  "Figure 17",
  "Figure 18",
  "Figure 19",
  "Figure 20",
  "Figure 21",
  "Figure 22",
  "Figure 23"
]
baseline_method_aliases = ["ours", "vit", "resnet", "lora"]
bounded_sweeps = { p = [0, 1], patch_size = [2, 1], similarity_guidance_scale = [9, 7, 10] }

[tool.paperbench_repro.artifacts]
metrics = "results/metrics.json"
dataset_registry = "results/dataset_registry.json"
environment_registry = "results/environment_registry.json"
experiment_registry = "results/experiment_registry.json"
artifact_manifest = "results/artifact_manifest.json"
config_resolved = "results/config_resolved.json"
readiness = "readiness.json"
evaluation_result = "evaluation_result.json"
table1_resnet_main = "results/tables/table1_resnet_main.csv"
table2_vit_main = "results/tables/table2_vit_main.csv"
table3_ablation = "results/tables/table3_ablation.csv"
table13 = "results/tables/table_13.csv"
table14 = "results/tables/table_14.csv"
figure13 = "results/figures/figure_13.png"