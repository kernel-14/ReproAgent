# ---------------------------------------------------------------------------
# Global artifact manifest
# All paper-visible figures and tables must appear here
# ---------------------------------------------------------------------------
artifact_manifest:
  # Core result artifacts
  - path: results/metrics.json
    kind: metrics
    owner: wp_surface
    description: "Main metrics JSON: episode_return, success_rate, stage_success_rate per env/method/seed"

  - path: results/run_manifest.json
    kind: run_manifest
    owner: wp_surface
    description: "Run manifest: experiment configuration, timestamps, mode"

  - path: results/config_resolved.json
    kind: config_resolved
    owner: wp_surface
    description: "Resolved configuration artifact for reproducibility"

  - path: results/reproduction_inventory.json
    kind: reproduction_inventory
    owner: wp_surface
    description: "Reproduction inventory: environments, methods, seeds, artifacts covered"

  - path: results/artifact_manifest.json
    kind: artifact_manifest
    owner: wp_surface
    description: "Artifact manifest: all declared output paths and their status"

  - path: results/summary.csv
    kind: summary_table
    owner: wp_surface
    description: "Summary CSV: aggregated metrics across environments and methods"

  # Section 4 Main result figures and tables
  - path: results/figures/figure_3.png
    kind: figure
    paper_ref: "Figure 3"
    owner: wp_main_eval
    description: "Figure 3: Performance on NetHack, Montezuma's Revenge, RoboticSequence"
    environments: [nethack, montezuma, robotic_sequence]