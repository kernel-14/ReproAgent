[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapg-repro"
version = "1.0.0"
description = "SAPG: Split and Aggregate Policy Gradients - Paper Reproduction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PaperBench Reproduction", email = "repro@paperbench.ai"}
]
keywords = ["reinforcement-learning", "policy-gradients", "parallel-rl", "sapg", "ppo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core lightweight dependencies - always installed
dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0.0",
    "importlib-metadata>=4.0.0; python_version<'3.10'",
]

[project.optional-dependencies]
# Heavy RL/training dependencies - optional for smoke/import validation
rl = [
    "torch>=1.10.0",
    "gymnasium>=0.26.0",
    "stable-baselines3>=2.0.0",
]

# Simulator dependencies - optional, environment-specific
isaacgym = [
    # IsaacGym must be installed separately from NVIDIA
    # This group documents the requirement without pip installation
]

# Visualization and analysis dependencies
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
]

# Development and testing dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-timeout>=2.1.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "isort>=5.10.0",
]

# Full installation - all optional dependencies
full = [
    "sapg-repro[rl,viz,dev]",
]

[project.scripts]
sapg-train = "scripts.train_sapg:main"
sapg-train-ppo = "scripts.train_ppo:main"
sapg-evaluate = "scripts.evaluate:main"
sapg-main = "main:main"

[project.urls]
Homepage = "https://github.com/paperbench/sapg-repro"
Repository = "https://github.com/paperbench/sapg-repro"
Documentation = "https://github.com/paperbench/sapg-repro/blob/main/README.md"

[tool.setuptools]
packages = ["src", "sapg", "scripts", "configs"]

[tool.setuptools.package-data]
configs = ["*.yaml", "tasks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov=sapg",
    "--cov-report=term-missing",
    "--timeout=300",
]
markers = [
    "smoke: smoke tests for contract validation",
    "integration: integration tests requiring full environment",
    "slow: slow tests requiring training or heavy computation",
    "isaacgym: tests requiring IsaacGym installation",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
]

[tool.coverage.run]
source = ["src", "sapg"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Paper-specific configuration metadata
[tool.sapg]
# Paper evidence contract: method/baseline selector set
methods = ["ours", "sapg", "ppo", "pbt", "dexpbt", "pql", "ddpg"]
method_aliases = {ours = "sapg", Ours = "sapg", OURS = "sapg", "COEF=0" = "sapg", PPO = "ppo", PBT = "pbt", DexPBT = "dexpbt", PQL = "pql", baseline = "ppo"}

# Paper-derived environment/task coverage
environments = ["ShadowHandOver", "ShadowHandCatchUnderarm", "ShadowHandCatchAbreast", "ShadowHandReOrientation", "AllegroHandReOrientation", "AllegroKuka", "harder_AllegroKuka", "Throw", "Regrasping", "Reorientation"]
environment_aliases = {ShadowHand = "ShadowHandOver", "Shadow Hand" = "ShadowHandOver", "Monte Carlo" = "ShadowHandReOrientation"}

# Paper-stated hyperparameter sweep entries
sweep_parameters = {batch_size = [1500, 3125, 6250, 12500, 25000, 50000, 100000], num_policies = [6], aggregation_coefficient = [1.0], entropy_coefficient = [0.0, 0.003, 0.005]}

# Execution modes
modes = ["smoke", "default", "full"]

# Canonical artifact paths
artifacts = [
    "results/evidence_contract_matrix.json",
    "results/experiment_registry.json",
    "results/metrics.json",
    "results/artifact_manifest.json",
    "results/sensitivity_report.json",
    "results/config_resolved.json",
    "results/readiness.json",
    "results/evaluation_result.json",
    "results/figures/figure_1.png",
    "results/figures/figure_2.png",
    "results/figures/figure_5.png",
    "results/figures/figure_6.png",
    "results/figures/figure_7.png",
    "results/figures/figure_8.png",
]
