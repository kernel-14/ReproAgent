tests:
  smoke_command: "python scripts/run_coupled_si.py --mode runtime_smoke --config configs/wp_core_interpolants.yaml"
  expected_importable_modules:
    - "stochastic_interpolants_couplings.config"
    - "stochastic_interpolants_couplings.data"
    - "stochastic_interpolants_couplings.couplings"
    - "stochastic_interpolants_couplings.interpolants"
    - "stochastic_interpolants_couplings.models"
    - "stochastic_interpolants_couplings.training"
    - "stochastic_interpolants_couplings.evaluation"
    - "stochastic_interpolants_couplings.artifacts"
  required_config_assertions:
    - "alpha_t and beta_t coefficient interfaces are present."
    - "rho_1, zeta/z~N(0,I_d), and t~U(0,1) sampling routes are configured."
    - "independent_gaussian and data_dependent couplings are selectable."
    - "I_t, dI_t/dt, hat_b, and empirical hat L_b objective are configured."
    - "ode_sampler and sde_sampler are separate named routes."
    - "methods include ours, resnet, ddpm, diffusion_model."
    - "gamma sweep includes 0 and 1."
    - "batch_size_32, mask_tiles_64, and mask_probability_0.3 anchors are preserved."
  expected_artifacts:
    - "results/dataset_registry.json"
    - "results/metrics.json"
    - "results/data_manifest.json"
    - "results/method_registry.json"
    - "results/ablation_registry.json"
    - "results/config_resolved.json"