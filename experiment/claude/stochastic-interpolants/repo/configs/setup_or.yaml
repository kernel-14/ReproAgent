protocol_matrix:
  matrix_callable: "stochastic_interpolants_couplings.config.build_protocol_matrix"
  rows:
    - id: "section_3_core_interpolant_api"
      paper_obligation: "第3节 Stochastic interpolants with couplings -> rho_0、rho_1、rho(x_0,x_1)、I_t、alpha_t、beta_t"
      task: "core"
      methods: ["stochastic_interpolants", "data_dependent_couplings", "independent_gaussian_coupling"]
      parameters: ["alpha_t", "beta_t", "x_1 ~ rho_1", "zeta_i ~ N(0,I_d)", "t_i ~ U(0,1)"]
      implementation_routes:
        - "stochastic_interpolants_couplings.couplings.build_coupling"
        - "stochastic_interpolants_couplings.interpolants.interpolant_state"
        - "stochastic_interpolants_couplings.interpolants.compute_paper_loss"
      metrics: ["transport_cost_diagnostic", "hat_L_b"]
      artifacts: ["results/loss_trace.json", "results/training_trace.json"]
    - id: "section_3_2_data_dependent_coupling"
      paper_obligation: "第3.2节 Designing data-dependent couplings -> rho_0(x_0 | x_1)"
      task: "super_resolution"
      methods: ["ours", "data_dependent_super_resolution"]
      parameters: ["x_0 = m(x_1) + sigma*zeta", "low-resolution conditioning image"]
      implementation_routes:
        - "stochastic_interpolants_couplings.couplings.SuperResolutionCoupling"
        - "stochastic_interpolants_couplings.couplings.make_low_resolution_condition"
      metrics: ["fid"]
      artifacts: ["results/super_resolution/sample_grid.png"]
    - id: "section_3_3_algorithm_1_training"
      paper_obligation: "第3.3节 Reducing transport costs via coupling -> Algorithm 1 Training"
      task: "core"
      methods: ["velocity field model hat_b_t(I_t)"]
      parameters: ["batch size n_b", "x_1 ~ rho_1", "zeta_i ~ N(0,I_d)", "t_i ~ U(0,1)"]
      implementation_routes:
        - "stochastic_interpolants_couplings.training.train_experiment"
        - "stochastic_interpolants_couplings.training.train_one_step"
        - "stochastic_interpolants_couplings.interpolants.interpolant_loss"
      metrics: ["hat_L_b", "transport_cost_diagnostic"]
      artifacts: ["results/train_log.jsonl", "results/loss_trace.json"]
    - id: "section_3_4_learning_sampling"
      paper_obligation: "第3.4节 Learning and Sampling -> ODE/SDE sampling and empirical loss"
      task: "core"
      methods: ["ODE", "SDE"]
      implementation_routes:
        - "stochastic_interpolants_couplings.interpolants.sample_ode"
        - "stochastic_interpolants_couplings.interpolants.sample_sde"
      metrics: ["sampling_success_rate"]
      artifacts: ["results/evaluation_result.json"]
    - id: "section_4_1_inpainting"
      paper_obligation: "第4.1节 In-painting -> xi binary mask and class labels"
      task: "inpainting"
      methods: ["independent_gaussian_baseline", "ours"]
      parameters: ["C channels", "W width", "H height", "xi binary mask in {0,1}^{C x W x H}", "optional class labels"]
      implementation_routes:
        - "stochastic_interpolants_couplings.couplings.make_inpainting_mask"
        - "fid_experiment_table_task.run_table_2_route"
        - "experiment_and_512x512_image.run_figure_3_route"
      metrics: ["fid"]
      artifacts: ["results/tables/table_2.csv", "results/figures/figure_3.png"]
    - id: "section_4_2_super_resolution"
      paper_obligation: "第4.2节比较语境 -> baseline independent Gaussian coupling vs data-dependent coupling -> super-resolution FID比较writer"
      task: "super_resolution"
      methods: ["independent_gaussian_baseline", "ours"]
      parameters: ["high-resolution x_1 in R^{C x W x H}", "low-resolution conditioning image", "same-content higher-resolution generation"]
      implementation_routes:
        - "stochastic_interpolants_couplings.data.build_task_batch"
        - "stochastic_interpolants_couplings.couplings.make_low_resolution_condition"
        - "stochastic_interpolants_couplings.evaluation.evaluate_superresolution"
        - "stochastic_interpolants_couplings.artifacts.write_super_resolution_records_artifact"
      metrics: ["fid"]
      artifacts: ["results/metrics.json", "results/tables/table_3.csv", "results/super_resolution/sample_grid.png"]

