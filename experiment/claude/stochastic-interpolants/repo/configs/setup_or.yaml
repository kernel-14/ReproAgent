evaluation_and_aggregation:
  result_aggregation_command: "python scripts/run_coupled_si.py --config configs/setup_or.yaml --task super_resolution --stage evaluate"
  callable: "stochastic_interpolants_couplings.evaluation.evaluate_superresolution"
  result_collector: "stochastic_interpolants_couplings.evaluation.summarize_metrics"
  pairwise_metric_runner: "stochastic_interpolants_couplings.evaluation.evaluate_pairwise"
  super_resolution_result_writer: "stochastic_interpolants_couplings.artifacts.write_super_resolution_records_artifact"
  comparison_fields:
    - "experiment_id"
    - "dataset"
    - "task"
    - "resolution"
    - "method"
    - "coupling"
    - "sampler_type"
    - "fid"
    - "num_samples"
    - "mode"
    - "data_root"
    - "checkpoint_path"
  expected_trend_assertions:
    - "data-dependent coupling is evaluated against independent Gaussian coupling for ImageNet super-resolution"
  baseline_table_context:
    table_3_caption: "FID-50k for Super-resolution, 64x64 to 256x256."
    external_baselines_recorded_with_provenance_only:
      - { model: "Improved DDPM", train_fid: 12.26, valid_fid: null, method_selector: "ddpm" }
      - { model: "SR3", train_fid: 11.30, valid_fid: 5.20, method_selector: "diffusion_model" }
      - { model: "ADM", train_fid: 7.49, valid_fid: 3.10, method_selector: "diffusion_model" }
      - { model: "Cascaded Diffusion", train_fid: 4.88, valid_fid: 4.63, method_selector: "diffusion_model" }
      - { model: "I2SB", train_fid: null, valid_fid: 2.70, method_selector: "diffusion_model" }
    measured_rows_from_this_repository:
      - "independent_gaussian_baseline"
      - "ours"

evidence_obligation_matrix:
  artifact_writer: "stochastic_interpolants_couplings.artifacts.write_evidence_contract_matrix_artifact"
  rows:
    - obligation_id: "rho0_rho1_rho_coupling_interpolant_api"
      source: "Section 3"
      paper_terms: ["rho_0", "rho_1", "rho(x_0,x_1)", "I_t", "alpha_t", "beta_t"]
      bound_task: "core"
      bound_methods: ["independent_gaussian_baseline", "ours"]
      bound_defaults: ["alpha_t=1-t", "beta_t=t", "batch_size_32"]
      metric_functions: ["stochastic_interpolants_couplings.training.transport_cost"]
      artifact_call_sites: ["results/loss_trace.json", "results/training_trace.json"]
    - obligation_id: "conditional_base_distribution"
      source: "Section 3.2"
      paper_terms: ["rho_0(x_0 | x_1)", "data-dependent coupling"]
      bound_task: "super_resolution"
      bound_methods: ["ours"]
      bound_defaults: ["sigma=0.05", "gamma=1"]
      metric_functions: ["stochastic_interpolants_couplings.evaluation.compute_fidelity_score"]
      artifact_call_sites: ["results/super_resolution/sample_grid.png"]
    - obligation_id: "algorithm_1_training_transport_cost"
      source: "Section 3.3"
      paper_terms: ["Algorithm 1 Training", "transport costs"]
      bound_task: "super_resolution"
      bound_methods: ["ours", "independent_gaussian_baseline"]
      bound_defaults: ["x_1 ~ rho_1", "zeta_i ~ N(0,I_d)", "t_i ~ U(0,1)"]
      metric_functions: ["stochastic_interpolants_couplings.interpolants.interpolant_loss"]
      artifact_call_sites: ["results/train_log.jsonl", "results/loss_trace.json"]
    - obligation_id: "learning_sampling_ode_sde"
      source: "Section 3.4 and Introduction"
      paper_terms: ["hat L_b", "minibatch n_b", "ODE sampler", "SDE sampler"]
      bound_task: "core"
      bound_methods: ["stochastic_interpolants"]
      bound_defaults: ["sampler_type=ODE", "sampler_type=SDE"]
      metric_functions: ["stochastic_interpolants_couplings.evaluation.summarize_metrics"]
      artifact_call_sites: ["results/evaluation_result.json"]
    - obligation_id: "inpainting_protocol_registry"
      source: "Section 4.1"
      paper_terms: ["x_1 in R^{C x W x H}", "xi binary mask", "optional class labels"]
      bound_task: "inpainting"
      bound_methods: ["ours", "independent_gaussian_baseline"]
      bound_defaults: ["mask_tiles_64", "mask_probability_0.3"]
      metric_functions: ["stochastic_interpolants_couplings.evaluation.compute_fidelity_score"]
      artifact_call_sites: ["results/tables/table_2.csv", "results/figures/figure_3.png"]
    - obligation_id: "super_resolution_fid_comparison"
      source: "Section 4.2"
      paper_terms: ["low-resolution image", "high-resolution image", "FID-50k", "data-dependent coupling vs independent Gaussian coupling"]
      bound_task: "super_resolution"
      bound_methods: ["ours", "independent_gaussian_baseline", "ddpm", "resnet", "diffusion_model"]
      bound_defaults: ["gamma[0,1]", "similarity_guidance_scale[0,1]"]
      metric_functions: ["stochastic_interpolants_couplings.evaluation.compute_fidelity_score"]
      artifact_call_sites: ["results/metrics.json", "results/tables/table_3.csv", "results/super_resolution/sample_grid.png"]

tests:
  smoke_command: "pytest tests/test_super_resolution.py"
  config_load_test:
    path: "configs/setup_or.yaml"
    assertions:
      - "task registry includes super_resolution independently from inpainting"
      - "datasets include imagenet, imagenet_1k, imagenet_c aliases"
      - "methods include ours, resnet, ddpm, diffusion_model"
      - "sweeps include gamma values 0 and 1"
      - "conditioning transform is callable and produces low-resolution tensor batch field"
      - "FID evaluator and super-resolution result writer are configured"
  route_validation:
    entrypoint: "scripts/run_coupled_si.py"
    command: "python scripts/run_coupled_si.py --config configs/setup_or.yaml --mode runtime_smoke --task super_resolution"
    expected_auxiliary_artifacts:
      - "results/readiness.json"
      - "results/evaluation_result.json"
    expected_registry_artifacts:
      - "results/dataset_registry.json"
      - "results/environment_registry.json"
      - "results/experiment_registry.json"
      - "results/artifact_manifest.json"