ablation_registry:
  bounded_parameter_sweeps:
    gamma:
      values: [0, 1]
      rationale: "Paper evidence contract priority sweep; gamma=0 gives deterministic linear interpolant and gamma=1 enables stochastic interpolant noise."
  fixed_hyperparameters:
    batch_size_32: 32
    mask_tiles_64: 64
    mask_probability_0.3: 0.3
  omitted_unbounded_sweeps:
    - sweep: "mask_probability_grid_beyond_0.3"
      rationale: "Not required for the decisive Table 2/Figure 3 protocol."
    - sweep: "large_scale_architecture_search"
      rationale: "Not part of the paper-specified in-painting comparison route."
    - sweep: "all_sampler_step_counts"
      rationale: "Use bounded default and full explicit step settings only."

