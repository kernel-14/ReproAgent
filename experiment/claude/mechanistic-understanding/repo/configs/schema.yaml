    factory_hook: "dpo_toxicity.modeling:create_gpt2_dpo_adapter"
    training_hook: "dpo_toxicity.dpo_training:train_dpo"
    config_hook: "configs/reproduction.yaml:models.aligned_model"

  - id: "Llama2"
    aliases:
      - "Llama2"
      - "llama2"
      - "base Llama 2"
    kind: "causal_language_model"
    paper_role:
      - "paper-visible model variant"
      - "permissioned full-mode comparison"
    access:
      requires_permission: true
      permission_note: "Default execution excludes Llama2 full results because model access requires permission."
      optional_dependencies:
        - "transformers"
        - "torch"
      lazy_import_required: true
    factory_hook: "dpo_toxicity.modeling:create_llama2_adapter"
    tokenizer_hook: "dpo_toxicity.modeling:create_llama2_tokenizer"
    config_hook: "configs/reproduction.yaml:models.base_model"
    default_execution: "registered_not_executed"

  - id: "Llama2_DPO"
    aliases:
      - "Llama2_DPO"
      - "llama2-dpo"
      - "DPO aligned Llama 2"
    kind: "dpo_aligned_causal_language_model"
    paper_role:
      - "paper-visible DPO model variant"
      - "permissioned full-mode comparison"
    access:
      requires_permission: true
      permission_note: "Default execution excludes Llama2_DPO full results because model access requires permission."
      optional_dependencies:
        - "transformers"
        - "torch"
      lazy_import_required: true
    factory_hook: "dpo_toxicity.modeling:create_llama2_dpo_adapter"
    training_hook: "dpo_toxicity.dpo_training:train_dpo"
    config_hook: "configs/reproduction.yaml:models.aligned_model"
    default_execution: "registered_not_executed"

method_registry:
  - id: "ours"
    aliases:
      - "ours"
      - "mechanistic toxicity vector method"
      - "DPO toxicity mechanism"
    kind: "paper_method"
    description: "Paper-derived mechanistic route: binary toxicity probe, toxic-vector extraction, DPO comparison, intervention, and un-aligning evaluation."
    required_components:
      - "binary_toxicity_probe"
      - "toxic_vector_extraction"
      - "dpo_training_or_loading"
      - "generation_evaluation"
      - "activation_shift_measurement"
      - "intervention_protocol"
      - "unalign_protocol"
    adapter_hook: "dpo_toxicity.registry:create_ours_adapter"
    config_hook: "configs/reproduction.yaml:method"
    training_hook: "dpo_toxicity.dpo_training:train_dpo"
    evaluation_hook: "src.evaluation_protocol:run_evaluation_protocol"
    artifact_writer_hook: "dpo_toxicity.reporting:write_paper_artifacts"
    default_selected: true

  - id: "ppo"
    aliases:
      - "ppo"
      - "PPO baseline"
      - "RLHF PPO baseline"
    kind: "baseline"
    description: "Policy-optimization baseline selector retained for decisive comparison and registry visibility."
    required_components:
      - "policy_model_adapter"
      - "toxicity_reward_or_classifier"
      - "generation_evaluation"
    adapter_hook: "dpo_toxicity.registry:create_ppo_adapter"
    config_hook: "configs/reproduction.yaml:method.baselines.ppo"
    training_hook: "dpo_toxicity.dpo_training:train_policy_baseline"
    evaluation_hook: "src.evaluation_protocol:run_evaluation_protocol"
    default_selected: false

  - id: "oracle"
    aliases:
      - "oracle"
      - "oracle toxicity filter"
      - "upper-bound baseline"
    kind: "baseline"
    description: "Oracle selector using the configured toxicity classifier/filter as an upper-bound decision rule for toxic continuation suppression."
    required_components:
      - "toxicity_classifier"
      - "candidate_generation"
      - "oracle_selection"
      - "generation_evaluation"
    adapter_hook: "dpo_toxicity.registry:create_oracle_adapter"
    config_hook: "configs/reproduction.yaml:method.baselines.oracle"
    evaluation_hook: "src.evaluation_protocol:run_oracle_baseline"
    default_selected: false

sweep_registry:
  bounded_default_policy:
    execute_by_default: false
    default_validation_subset:
      similarity_guidance_scale: [9]
      generation_tokens: [20]
      table_1_vector_example:
        layer: 19
        vector_id: "MLP.v_770^19"
    full_mode_required_for_all_values: true
    rationale: >
      The sweep registry exposes all paper-visible values needed for reproduction
      while preventing default commands from becoming exhaustive parameter sweeps.
  sweeps:
    - id: "sweep:similarity_guidance_scale"
      selector_key: "method.pplm.similarity_guidance_scale"
      values: [9, 1, 10]
      bounded_default: [9]
      full_mode_values: [9, 1, 10]
      method_ids:
        - "ours"
      implementation_hook: "src.pplm_pairwise_toxicity:run_similarity_guidance_sweep"
      artifact_path: "results/sensitivity_report.json"
      paper_visible: true
    - id: "sweep:generation_tokens"
      selector_key: "evaluation.generation.max_new_tokens"
      values: [20]
      bounded_default: [20]
      full_mode_values: [20]
      method_ids:
        - "ours"
        - "ppo"
        - "oracle"
      implementation_hook: "dpo_toxicity.evaluation:generate_and_score"
      artifact_path: "results/metrics.json"
      paper_visible: true
    - id: "sweep:table_1_layer_19_mlp_v_770"
      selector_key: "method.vector_extraction.table_1_vector_example"
      values:
        - layer: 19
          vector_id: "MLP.v_770^19"
          matrix_index: 770
          value_vector_kind: "mlp_value_vector"
      bounded_default:
        - layer: 19
          vector_id: "MLP.v_770^19"
          matrix_index: 770
          value_vector_kind: "mlp_value_vector"
      full_mode_values:
        - layer: 19
          vector_id: "MLP.v_770^19"
          matrix_index: 770
          value_vector_kind: "mlp_value_vector"
      method_ids:
        - "ours"
      implementation_hook: "src.reproduction_table_measurement:measure_table_1_vector_tokens"
      artifact_path: "results/tables/table_1_reproduction.json"
      paper_visible: true

experiment_protocol_matrix:
  default_protocol_id: "mechanistic_dpo_toxicity_bounded_validation"
  full_protocol_id: "mechanistic_dpo_toxicity_full"
  protocols:
    - id: "mechanistic_dpo_toxicity_bounded_validation"
      mode: "runtime_smoke"
      purpose: "Exercise real configuration, registry, data-pipeline, method, evaluation, training-loop, and artifact-writer surfaces with bounded inputs."
      benchmark_scores_claimed: false
      selectors:
        methods: ["ours"]
        datasets: ["safe_fixture", "wikitext"]
        models: ["GPT2", "GPT2_DPO"]
        similarity_guidance_scale: [9]
        generation_tokens: [20]
      stages:
        - "setup_config"
        - "data_pipeline"
        - "probe_interface_validation"
        - "vector_extraction_interface_validation"
        - "bounded_evaluation"
        - "artifact_closure"
      expected_auxiliary_artifacts:
        - "results/readiness.json"
        - "results/evaluation_result.json"
        - "results/config_resolved.json"
        - "results/data_manifest.json"
        - "results/dataset_registry.json"
        - "results/experiment_registry.json"

    - id: "mechanistic_dpo_toxicity_full"
      mode: "full"
      purpose: "Run the paper-derived training, vector extraction, DPO/baseline comparison, interventions, un-aligning, and measured artifact writing."
      benchmark_scores_claimed: true
      selectors:
        methods: ["ours", "ppo", "oracle"]
        datasets: ["wikitext", "jigsaw_toxicity"]
        models: ["GPT2", "GPT2_DPO"]
        permissioned_models_registered_not_default:
          - "Llama2"
          - "Llama2_DPO"
        similarity_guidance_scale: [9, 1, 10]
        generation_tokens: [20]
      stages:
        - "setup_config"
        - "data_obtain_prepare_validate"
        - "train_or_load_binary_probe"
        - "extract_probe_mlp_svd_vectors"
        - "write_table_1_reproduction_artifact"
        - "train_or_load_dpo"
        - "run_ppo_baseline_if_selected"
        - "run_oracle_baseline_if_selected"
        - "evaluate_generation_toxicity"
        - "evaluate_perplexity"
        - "measure_activation_shift"
        - "run_intervention_protocol"
        - "run_unalign_protocol"
        - "write_measured_artifacts"
      expected_paper_visible_artifacts:
        - "results/metrics.json"
        - "results/sensitivity_report.json"
        - "results/training_trace.json"
        - "results/tables/table_1_reproduction.json"
        - "results/artifact_manifest.json"

metric_schema:
  normalized_score_contract: "normalized_binary_toxicity_score_protocol"
  metrics:
    toxicity_rate:
      type: "number"
      range: [0.0, 1.0]
      formula: "mean(1[toxicity_score_normalized >= threshold])"
      required_fields:
        - "toxicity_score_normalized"
        - "threshold"
        - "normalization"
      aggregation: "mean_over_generated_samples"
      implementation_hook: "dpo_toxicity.evaluation:toxicity_rate"
    probe_f1:
      type: "number"
      range: [0.0, 1.0]
      formula: "2 * precision * recall / (precision + recall)"
      required_fields:
        - "predicted_binary_toxicity"
        - "gold_binary_toxicity"
      aggregation: "classification_f1"
      implementation_hook: "dpo_toxicity.evaluation:binary_f1"
    activation_shift:
      type: "number"
      formula: "norm(mean_activation_aligned - mean_activation_base)"
      required_fields:
        - "base_activation"
        - "aligned_activation"
        - "layer"
      aggregation: "layerwise_norm_and_cosine"
      implementation_hook: "dpo_toxicity.evaluation:activation_shift"
    perplexity:
      type: "number"
      minimum: 0.0
      formula: "exp(mean_negative_log_likelihood)"
      required_fields:
        - "negative_log_likelihood"
        - "token_count"
      implementation_hook: "dpo_toxicity.evaluation:perplexity"
    logit_lens_toxic_probability:
      type: "number"
      range: [0.0, 1.0]
      formula: "classifier_or_token_set_probability_from_layerwise_unembedded_state"
      required_fields:
        - "layer"
        - "unembedded_logits"
      implementation_hook: "dpo_toxicity.evaluation:logit_lens_toxic_probability"
    pairwise_preference_accuracy:
      type: "number"
      range: [0.0, 1.0]
      formula: "mean(1[preferred_score > rejected_score])"
      required_fields:
        - "preferred_score"
        - "rejected_score"
      implementation_hook: "dpo_toxicity.evaluation:pairwise_preference_accuracy"

artifact_contract:
  output_dir: "results"
  artifact_dir_env: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  parent_dirs_created_during_bounded_validation: true
  paper_visible_outputs_require_measured_code_path: true
  readiness_artifacts_are_auxiliary_only: true
  declared_artifacts:
    config_resolved:
      path: "results/config_resolved.json"
      writer_hook: "dpo_toxicity.config:write_resolved_config"
      schema_role: "resolved config artifact"
      can_be_written_in_bounded_validation: true
      benchmark_visible_score: false
    sensitivity_report:
      path: "results/sensitivity_report.json"
      writer_hook: "dpo_toxicity.reporting:write_sensitivity_report"
      schema_role: "paper-visible sensitivity artifact"
      can_be_written_in_bounded_validation: false
      requires_measured_code_path: true
    dataset_registry:
      path: "results/dataset_registry.json"
      writer_hook: "dpo_toxicity.registry:write_dataset_registry"
      schema_role: "registry artifact"
      can_be_written_in_bounded_validation: true
      benchmark_visible_score: false
    data_manifest:
      path: "results/data_manifest.json"
      writer_hook: "dpo_toxicity.data:write_data_manifest"
      schema_role: "data validation artifact"
      can_be_written_in_bounded_validation: true
      benchmark_visible_score: false
    experiment_registry:
      path: "results/experiment_registry.json"
      writer_hook: "dpo_toxicity.registry:write_experiment_registry"
      schema_role: "protocol registry artifact"
      can_be_written_in_bounded_validation: true
      benchmark_visible_score: false
    metrics:
      path: "results/metrics.json"
      writer_hook: "dpo_toxicity.reporting:write_metrics"
      schema_role: "paper-visible measured metrics"
      can_be_written_in_bounded_validation: false
      requires_measured_code_path: true
    training_trace:
      path: "results/training_trace.json"
      writer_hook: "dpo_toxicity.reporting:write_training_trace"
      schema_role: "training log artifact"
      can_be_written_in_bounded_validation: false
      requires_measured_code_path: true
    readiness:
      path: "results/readiness.json"
      writer_hook: "dpo_toxicity.reporting:write_readiness"
      schema_role: "auxiliary readiness artifact"
      can_be_written_in_bounded_validation: true
      benchmark_visible_score: false
    evaluation_result:
      path: "results/evaluation_result.json"
      writer_hook: "dpo_toxicity.reporting:write_evaluation_result"
      schema_role: "auxiliary bounded validation result"
      can_be_written_in_bounded_validation: true
      benchmark_visible_score: false
    table_1_reproduction_artifact:
      path: "results/tables/table_1_reproduction.json"
      writer_hook: "src.reproduction_table_measurement:write_table_1_reproduction_artifact"
      schema_role: "paper-visible table 1 reproduction artifact"
      can_be_written_in_bounded_validation: false
      requires_measured_code_path: true

config_factory:
  id: "canonical_config_factory"
  default_config_path: "configs/reproduction.yaml"
  schema_path: "configs/schema.yaml"
  factory_hook: "dpo_toxicity.config:load_and_resolve_config"
  validation_hook: "dpo_toxicity.config:validate_config_against_schema"
  registry_materialization_hook: "dpo_toxicity.registry:materialize_registries"
  artifact_path_resolution:
    env_var: "PAPERBENCH_REPRO_ARTIFACT_DIR"
    default_output_dir: "results"
    preserve_repository_relative_defaults: true
  selector_resolution_order:
    - "cli_args"
    - "config_file"
    - "schema_defaults"
    - "registry_defaults"
  required_selector_sets:
    methods: ["ours", "ppo", "oracle"]
    model_variants: ["GPT2", "Llama2", "GPT2_DPO", "Llama2_DPO"]
    datasets: ["wikitext"]
    tasks:
      - "task:binary_toxicity_classification"
      - "task:wikitext_generation"
      - "task:editing_models"
      - "task:config_data_pipeline"
      - "task:config_factory"
      - "task:registry_configuration_artifact"

tests_contract:
  interface_tests:
    - id: "test_schema_loads_as_yaml"
      target: "configs/schema.yaml"
      assertion: "YAML parses and exposes schema_version, environment_registry, dataset_registry, method_registry, and sweep_registry."
    - id: "test_required_methods_registered"
      target: "method_registry"
      assertion: "Registry contains ours, ppo, and oracle."
    - id: "test_required_models_registered"
      target: "model_registry"
      assertion: "Registry contains GPT2, Llama2, GPT2_DPO, and Llama2_DPO."
    - id: "test_required_sweeps_registered"
      target: "sweep_registry"
      assertion: "similarity_guidance_scale has values [9, 1, 10], generation_tokens has [20], and Table 1 vector example is MLP.v_770^19 at layer 19."
    - id: "test_wikitext_aliases_registered"
      target: "environment_registry,dataset_registry"
      assertion: "The wikitext alias is present in both task and dataset registries."
    - id: "test_artifact_paths_declared"
      target: "artifact_contract"
      assertion: "config_resolved and sensitivity_report paths are declared under results/."

compatibility:
  minimal_import_environment:
    heavy_packages_imported_lazily:
      - "torch"
      - "transformers"
      - "datasets"
      - "pandas"
      - "sklearn"
      - "matplotlib"
    schema_requires_no_heavy_imports: true
  execution_closure:
    canonical_entrypoint: "scripts/run_reproduction.py"
    default_invocation: "python scripts/run_reproduction.py --mode runtime_smoke"
    expected_outputs:
      - "results/config_resolved.json"
      - "results/sensitivity_report.json"
      - "results/dataset_registry.json"
      - "results/metrics.json"
      - "results/data_manifest.json"
      - "results/experiment_registry.json"
    bounded_validation_outputs:
      - "results/readiness.json"
      - "results/evaluation_result.json"
      - "results/config_resolved.json"
      - "results/data_manifest.json"
      - "results/dataset_registry.json"
      - "results/experiment_registry.json"