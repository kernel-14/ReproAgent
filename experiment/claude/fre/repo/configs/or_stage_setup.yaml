  reward_scaling_config_matrix:
    description: "Config surface for build_reward_scaling_config_matrix."
    bounded_execution_note: "Expose all paper-specified reward-form subsets as selectable rows; default smoke executes only singleton and full mixed rows."
    same_training_budget: true
    reward_form_universe:
      - "singleton_goal"
      - "random_linear"
      - "random_mlp"
    rows:
      - row_id: "subset_singleton_goal"
        reward_forms:
          - "singleton_goal"
        complexity_level: 1
        default_smoke_enabled: true
        K_encoder_states:
          - 4
          - 32
        expected_trend: "Lowest diversity; useful lower bound for goal-like tasks."
      - row_id: "subset_random_linear"
        reward_forms:
          - "random_linear"
        complexity_level: 1
        default_smoke_enabled: false
        K_encoder_states:
          - 32
        expected_trend: "Tests XY positions and velocity linear task prior."
      - row_id: "subset_random_mlp"
        reward_forms:
          - "random_mlp"
        complexity_level: 1
        default_smoke_enabled: false
        K_encoder_states:
          - 32
        expected_trend: "Tests expressive but less structured reward prior."
      - row_id: "subset_goal_linear"
        reward_forms:
          - "singleton_goal"
          - "random_linear"
        complexity_level: 2
        default_smoke_enabled: false
        K_encoder_states:
          - 32
        expected_trend: "Intermediate mixed reward-function type."
      - row_id: "subset_goal_mlp"
        reward_forms:
          - "singleton_goal"
          - "random_mlp"
        complexity_level: 2
        default_smoke_enabled: false
        K_encoder_states:
          - 32
        expected_trend: "Tests sparse goals plus nonlinear random rewards."
      - row_id: "subset_linear_mlp"
        reward_forms:
          - "random_linear"
          - "random_mlp"
        complexity_level: 2
        default_smoke_enabled: false
        K_encoder_states:
          - 32
        expected_trend: "Tests dense random reward prior without singleton goals."
      - row_id: "subset_goal_linear_mlp"
        reward_forms:
          - "singleton_goal"
          - "random_linear"
          - "random_mlp"
        complexity_level: 3
        default_smoke_enabled: true
        K_encoder_states:
          - 4
          - 32
        expected_trend: "Highest paper-specified prior diversity under same training budget."

evaluation:
  zero_shot_transfer:
    hook: "fre_repro.evaluation.evaluate_zero_shot_transfer"
    adaptation_steps_default: 0
    input: "agent plus held-out tasks represented by state-reward examples"
    metrics:
      normalized_return:
        aggregation:
          - "mean"
          - "std"
          - "per_seed"
      success_rate:
        aggregation:
          - "mean"
          - "std"
          - "per_seed"
      reward_decoding_error:
        aggregation:
          - "mean"
    artifact_paths:
      metrics: "results/metrics.json"
      figure: "results/fig3_zero_shot_transfer.png"
      summary: "results/eval_summary.json"
  benchmark_comparison:
    hook: "fre_repro.evaluation.run_benchmark_comparison"
    methods_from_registry: true
    benchmarks:
      - "exorl_benchmark"
      - "antmaze"
      - "kitchen"
    artifact_paths:
      metrics: "results/metrics.json"
      summary: "results/eval_summary.json"

readiness_checks:
  - id: "config_loadable"
    description: "YAML is parseable and exposes required public contract names."
  - id: "method_selectors_complete"
    description: "Selector set includes ours, bc, iql, test_time_adaptation, ppo, pbt, pql."
  - id: "dataset_registry_complete"
    description: "Registry includes deepmind_control/ExORL, robotics/AntMaze/Kitchen, offline trajectory datasets, and offline state-action pairs."
  - id: "reward_prior_sampler_wired"
    description: "sample_reward_prior(domain, seed) hook is present and serializes reward_prior_config."
  - id: "encoder_policy_training_wired"
    description: "Encoder checkpoint and latent-conditioned policy checkpoint paths are declared."
  - id: "smoke_artifact_safety"
    description: "Smoke mode writes readiness.json and evaluation_result.json only as readiness artifacts unless measured bounded computation produces benchmark-visible outputs."

