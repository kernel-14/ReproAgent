# Default configuration for Robust CLIP reproduction
# Paper: "Robust CLIP: Unsupervised Adversarial Fine-Tuning of Vision Embeddings for Robust Large Vision-Language Models"

# ============================================================================
# Execution Mode
# ============================================================================
mode: runtime_smoke  # train, eval, train_eval, runtime_smoke, docker_validate
dry_run: true  # Set to false for full training/evaluation

# ============================================================================
# Method Registry (Paper Evidence Contract)
# ============================================================================
methods:
  # Primary methods from paper
  fare:
    name: "Feature-Alignment Robust Embedding"
    type: "adversarial_finetuning"
    description: "FARE adversarial fine-tuning (ours)"
    enabled: true
    config:
      loss_type: "fare"
      alignment_target: "class_token"  # class_token only (from B.1)
      distance_metric: "l2"  # ℓ₂ distance metric
      lambda_preserve: 1.0  # Embedding preservation weight (from Eq. 3)
      lambda_sweep: [0.1, 0.5, 1.0, 2.0, 5.0]
      attack_steps: 10
      step_size: 1/255
      
  tecoa:
    name: "Text-guided Contrastive Adversarial"
    type: "adversarial_finetuning"
    description: "TeCoA baseline"
    enabled: true
    config:
      loss_type: "tecoa"
      alignment_target: "text_guided"
      attack_steps: 10
      step_size: 1/255
      
  clip:
    name: "Standard CLIP"
    type: "baseline"
    description: "Clean CLIP baseline"
    enabled: true
    config:
      loss_type: "clip"
      pretrained: true
      
  ours:
    name: "FARE (alias)"
    type: "adversarial_finetuning"
    description: "Alias for FARE method"
    enabled: true
    alias_of: "fare"
    
  random:
    name: "Random perturbation"
    type: "baseline"
    description: "Random noise baseline"
    enabled: true
    config:
      perturbation: "random"
      
  robust_clip:
    name: "Robust CLIP variant"
    type: "baseline"
    description: "Robust CLIP baseline"
    enabled: true
    
  vit:
    name: "Vision Transformer"
    type: "baseline"
    description: "ViT baseline"
    enabled: true
    
  fine_tuning:
    name: "Standard fine-tuning"
    type: "baseline"
    description: "Non-adversarial fine-tuning"
    enabled: true
    
  baseline:
    name: "Unperturbed baseline"
    type: "baseline"
    description: "No perturbation"
    enabled: true
    
  adapter:
    name: "Adapter-based fine-tuning"
    type: "baseline"
    description: "Parameter-efficient adaptation"
    enabled: true
    
  # LVLM integration methods
  llava:
    name: "LLaVA"
    type: "lvlm"
    description: "LLaVA with robust vision encoder"
    enabled: true
    config:
      model_version: "llava-1.5-7b"
      vision_encoder: "clip"  # Can be swapped with fare/tecoa
      
  openflamingo:
    name: "OpenFlamingo"
    type: "lvlm"
    description: "OpenFlamingo 9B with CLIP ViT-L/14 vision encoder and MPT-7B language model"
    enabled: true
    config:
      model_name: "openflamingo/OpenFlamingo-9B-vitl-mpt7b"
      vision_encoder: "ViT-L/14"
      language_model: "mosaicml/mpt-7b"
      dependency: "open_flamingo.create_model_and_transforms"
    
  # Attack methods
  pgd:
    name: "PGD attack"
    type: "attack"
    description: "Projected Gradient Descent"
    enabled: true
    config:
      eps_values: [2/255, 4/255, 8/255, 16/255]
      steps: 10
      step_size: 1/255
      momentum: 0.9
      
  apgd:
    name: "AutoPGD attack"
    type: "attack"
    description: "Auto-PGD"
    enabled: true
    config:
      iterations: 100
      initial_step_size: epsilon
      precisions: ["float16", "float32"]
    
  autoattack:
    name: "AutoAttack"
    type: "attack"
    description: "AutoAttack ensemble"
    enabled: true

# ============================================================================
# Environment/Task Registry (Paper Evidence Contract)
# ============================================================================
environments:
  clip:
    env_id: "clip"
    name: "CLIP Environment"
    aliases: ["standard_clip", "openai_clip"]
    task_type: "classification"
    model_type: "clip"
    description: "Standard CLIP evaluation environment"
    setup_metadata:
      architecture: "ViT-L/14"
      resolution: 224
      pretrained: true
      
  tecoa:
    env_id: "tecoa"
    name: "TeCoA Environment"
    aliases: ["tecoa_clip"]
    task_type: "adversarial_classification"
    model_type: "tecoa"
    description: "TeCoA adversarial training environment"
    
  fare:
    env_id: "fare"
    name: "FARE Environment"
    aliases: ["fare_clip", "robust_clip"]
    task_type: "adversarial_classification"
    model_type: "fare"
    description: "FARE adversarial training environment"
    
  clean_clip:
    env_id: "clean_clip"
    name: "Clean CLIP"
    aliases: ["unperturbed_clip"]
    task_type: "classification"
    model_type: "clip"
    description: "Clean evaluation without adversarial perturbations"
    
  llava:
    env_id: "llava"
    name: "LLaVA Environment"
    aliases: ["llava_1", "llava_1.5"]
    task_type: "vqa"
    model_type: "llava"
    description: "LLaVA large vision-language model"
    setup_metadata:
      model_version: "llava-1.5-7b"
      vision_encoder: "clip_vit_l_14"
      language_model: "vicuna-7b"
      
  pope:
    env_id: "pope"
    name: "POPE Benchmark"
    aliases: ["pope_eval"]
    task_type: "hallucination"
    model_type: "lvlm"
    description: "Polling-based Object Probing Evaluation"
    
  sqa_i:
    env_id: "sqa_i"
    name: "SQA-I Benchmark"
    aliases: ["scienceqa_image"]
    task_type: "vqa"
    model_type: "lvlm"
    description: "ScienceQA Image subset"
    
  imagenet:
    env_id: "imagenet"
    name: "ImageNet"
    aliases: ["imagenet_1k", "ilsvrc2012"]
    task_type: "classification"
    description: "ImageNet-1K classification"
    
  coco:
    env_id: "coco"
    name: "COCO"
    aliases: ["mscoco", "coco_2014", "coco_2017"]
    task_type: "retrieval"
    description: "COCO image-text retrieval"
    
  flickr30k:
    env_id: "flickr30k"
    name: "Flickr30k"
    aliases: ["flickr"]
    task_type: "retrieval"
    description: "Flickr30k image-text retrieval"
    
  vqa:
    env_id: "vqa"
    name: "VQA"
    aliases: ["vqav2"]
    task_type: "vqa"
    description: "Visual Question Answering"
    
  quantitative_robustness:
    env_id: "quantitative_robustness"
    name: "Quantitative Robustness Evaluation"
    aliases: ["robustness_eval"]
    task_type: "robustness"
    description: "Quantitative adversarial robustness evaluation"

