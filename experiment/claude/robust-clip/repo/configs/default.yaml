# ============================================================================
# Parameter Sweeps (Paper Evidence Contract)
# ============================================================================
parameter_sweeps:
  epsilon:
    description: "Adversarial perturbation budget (from paper)"
    values: [2/255, 4/255, 8/255, 16/255]
    default: 4/255
    paper_values: [2/255, 4/255]  # Primary values from paper
    
  lambda_preserve:
    description: "Embedding preservation weight (from Eq. 3)"
    values: [0.1, 0.5, 1.0, 2.0, 5.0]
    default: 1.0
    
  alignment_target:
    description: "Class-token only alignment (from Appendix B.1)"
    values: ["class_token", "all_tokens"]
    default: "class_token"
    
  distance_metric:
    description: "Distance metric for alignment"
    values: ["l2", "cosine"]
    default: "l2"  # ℓ₂ distance metric
    
  attack_steps:
    description: "Number of adversarial attack steps"
    values: [1, 5, 10, 20]
    default: 10
    
  step_size:
    description: "Attack step size"
    values: [0.001, 0.005, 0.01, 0.02]
    default: 0.01

# ============================================================================
# Training Configuration
# ============================================================================
training:
  # General training settings
  batch_size: 128
  effective_batch_size: 128
  num_epochs: 2
  learning_rate: 0.00001
  weight_decay: 0.0001
  warmup_epochs: 1
  optimizer: "adamw"
  scheduler: "cosine"
  
  # Adversarial training settings
  adversarial:
    enabled: true
    epsilon: 4/255
    attack_type: "pgd"
    attack_steps: 10
    step_size: 0.01
    random_start: true
    
  # FARE-specific settings
  fare:
    lambda_preserve: 1.0
    alignment_target: "class_token"
    distance_metric: "l2"
    preserve_embeddings: true
    
  # TeCoA-specific settings
  tecoa:
    text_guidance: true
    contrastive_weight: 1.0
    
  # Hardware settings
  device: "cuda"
  num_workers: 4
  pin_memory: true
  mixed_precision: true
  
  # Checkpoint settings
  save_interval: 1
  checkpoint_dir: "checkpoints"
  resume_from: null

# ============================================================================
# Evaluation Configuration
# ============================================================================
evaluation:
  # General evaluation settings
  batch_size: 128
  num_workers: 4
  
  # Clean evaluation
  clean:
    enabled: true
    datasets: ["imagenet", "cifar10", "cifar100"]
    
  # Adversarial evaluation
  adversarial:
    enabled: true
    epsilon_values: [2/255, 4/255, 8/255, 16/255]
    attack_types: ["pgd", "apgd", "autoattack"]
    datasets: ["imagenet", "cifar10", "cifar100"]
    
  # Zero-shot classification
  zero_shot:
    enabled: true
    datasets: [
      "imagenet", "cifar10", "cifar100",
      "caltech101", "stanford_cars", "fgvc_aircraft",
      "flowers", "pcam", "oxford_pets",
      "imagenet_r", "imagenet_sketch", "stl10"
    ]
    
  # LVLM evaluation
  lvlm:
    enabled: true
    models: ["llava"]
    benchmarks: ["pope", "sqa_i", "vqav2", "textvqa"]
    
  # Retrieval evaluation
  retrieval:
    enabled: true
    datasets: ["coco", "flickr30k"]
    metrics: ["recall@1", "recall@5", "recall@10"]

# ============================================================================
# Model Configuration
# ============================================================================
model:
  # CLIP model settings
  architecture: "ViT-L/14"
  pretrained: "openai"
  resolution: 224
  
  # Vision encoder settings
  vision_encoder:
    freeze_backbone: false
    freeze_bn: false
    drop_path_rate: 0.0
    
  # Text encoder settings
  text_encoder:
    freeze: true  # No language model retraining required
    
  # LVLM settings
  lvlm:
    model_name: "llava-1.5-7b"
    vision_encoder: "clip_vit_l_14"
    language_model: "vicuna-7b"
    freeze_language_model: true  # No language model retraining

# ============================================================================
# Data Configuration
# ============================================================================
data:
  # Data root directories
  root: "data"
  cache_dir: "data/cache"
  
  # ImageNet settings
  imagenet:
    train_root: "data/imagenet/train"
    val_root: "data/imagenet/val"
    download: true
    trust_remote_code: true
    
  # Preprocessing settings
  preprocessing:
    mean: [0.48145466, 0.4578275, 0.40821073]
    std: [0.26862954, 0.26130258, 0.27577711]
    resize: 224
    crop_size: 224
    interpolation: "bicubic"
    
  # Augmentation settings
  augmentation:
    random_flip: true
    random_crop: true
    color_jitter: false
    auto_augment: false

# ============================================================================
# Artifact Configuration
# ============================================================================
artifacts:
  # Output directories
  output_dir: "outputs"
  checkpoint_dir: "checkpoints"
  results_dir: "results"
  figures_dir: "figures"
  
  # Checkpoint settings
  checkpoints:
    save_best: true
    save_last: true
    save_interval: 1
    paths:
      - "checkpoints/fare_clip.pth"
      - "checkpoints/fare_clip_final.pth"
      - "checkpoints/tecoa_clip.pth"
      - "checkpoints/clip_baseline.pth"
      
  # Result artifacts
  results:
    paths:
      - "results/metrics.json"
      - "results/robustness_table.csv"
      - "results/evaluation_result.json"
      - "results/readiness.json"
      
  # Figure artifacts
  figures:
    paths:
      - "figures/figure1_radar.png"
      - "figures/figure1_radar.pdf"
      - "figures/robustness_comparison.png"
      - "figures/epsilon_sweep.png"

# ============================================================================
# Scope Constraints (Paper Evidence Contract)
# ============================================================================
scope:
  # In-scope
  included:
    - "FARE adversarial fine-tuning"
    - "TeCoA baseline"
    - "Vision encoder training"
    - "Zero-shot classification"
    - "Adversarial robustness evaluation"
    - "LVLM integration evaluation"
    - "POPE hallucination evaluation"
    
  # Out-of-scope (no language model retraining required)
  excluded:
    - "Language model retraining"
    - "Language model fine-tuning"
    - "Full LVLM training from scratch"
    - "Large-scale pretraining"
    - "Multi-modal pretraining"
    
  # Bounded sweeps
  bounded_sweeps:
    - "Epsilon values: [2/255, 4/255] for main results"
    - "Lambda values: subset of [0.1, 0.5, 1.0, 2.0, 5.0]"
    - "Datasets: focused on ImageNet, CIFAR, fine-grained classification"

# ============================================================================
# Experiment Protocol
# ============================================================================
experiments:
  # Table 4: Clean and adversarial accuracy comparison
  table4:
    name: "Table 4: Robustness Comparison"
    enabled: true
    methods: ["clip", "tecoa", "fare"]
    datasets: ["imagenet", "cifar10", "cifar100"]
    epsilon_values: [2/255, 4/255]
    metrics: ["clean_accuracy", "robust_accuracy_eps2", "robust_accuracy_eps4"]
    
  # LVLM robustness evaluation
  lvlm_robustness:
    name: "LVLM Robustness Evaluation"
    enabled: true
    methods: ["llava"]
    vision_encoders: ["clip", "tecoa", "fare"]
    benchmarks: ["vqav2", "textvqa"]
    
  # POPE hallucination evaluation
  pope_eval:
    name: "POPE Hallucination Evaluation"
    enabled: true
    methods: ["llava"]
    vision_encoders: ["clip", "tecoa", "fare"]
    benchmarks: ["pope"]
    
  # Chain of Thought evaluation
  cot_eval:
    name: "Chain of Thought Evaluation"
    enabled: true
    methods: ["llava"]
    benchmarks: ["sqa_i"]

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level: "INFO"
  console: true
  file: true
  log_dir: "logs"
  tensorboard: true
  wandb: false
  
# ============================================================================
# Reproducibility
# ============================================================================
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false
# ============================================================================
# Paper Fine-Tuning Hyperparameters
# ============================================================================
training_protocol:
  dataset: "ImageNet"
  num_epochs: 2
  optimizer: "AdamW"
  optimizer_betas: [0.9, 0.95]
  peak_learning_rate: 1.0e-5
  lr_schedule: "linear warmup for 7% of total steps followed by cosine decay"
  warmup_fraction: 0.07
  weight_decay: 1.0e-4
  freeze_text_encoder: true
  trainable_module: "visual encoder"
  adversarial_training:
    epsilons: [2/255, 4/255]
    step_size: 1/255
    pgd_momentum: 0.9
  adversarial_evaluation:
    samples_per_dataset: 500

caption_vqa_attack_protocol:
  cider_metric: "pycocoevalcap.cider.Cider if installed; local TF-IDF fallback otherwise"
  vqa_accuracy_metric: "VQA exact/soft answer accuracy over all samples with five most frequent answers"
  adversarial_eval_samples_per_dataset: 500
  half_precision_apgd_iterations: 100
  apgd_initial_step_size: epsilon
  caption_ground_truths_per_image: 5
  vqa_ground_truth_policy: "five most frequent answers among ten annotations"
  targeted_strings: ["maybe", "Word"]
  high_precision_thresholds:
    coco_score_at_least: 10
    flickr30k_score_at_least: 2
    initialization: "best half-precision perturbation for each sample"
  targeted_caption_sources:
    captions_1_to_5: "25 random COCO images per target caption, seeded provenance manifest"
    caption_6: "25 handpicked permissive stock images with source/license fields"
  pope_protocol: "random/popular/adversarial yes-no hallucination splits with accuracy, precision, recall, F1"
  sqa_i_protocol: "ScienceQA image subset with chain-of-thought prompt and final-answer accuracy"
  transfer_table2_protocol: "evaluate OF and LLaVA with five encoders on COCO/Flickr30k adversarial captions and VQAv2/TextVQA"
  jailbreak_protocol:
    image: "clean.jpeg"
    iterations: 5000
    alpha: 1/255
    targeted: true
