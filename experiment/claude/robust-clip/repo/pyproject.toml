[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-clip"
version = "1.0.0"
description = "Robust CLIP: Unsupervised Adversarial Fine-Tuning of Vision Embeddings for Robust Large Vision-Language Models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PaperBench Repro", email = "repro@paperbench.ai"}
]
keywords = [
    "CLIP",
    "adversarial-robustness",
    "vision-language-models",
    "FARE",
    "adversarial-training",
    "LVLM",
    "zero-shot-classification"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core lightweight dependencies (always required)
# Satisfies method obligation: "Declare lightweight core dependencies separately from optional heavy simulator/training dependencies"
dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
    "filelock>=3.12.0",
]

[project.optional-dependencies]
# Vision and ML dependencies (training/evaluation)
training = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "timm>=0.9.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]

# CLIP and vision encoder dependencies
clip = [
    "open_clip_torch>=2.20.0",
    "ftfy>=6.1.0",
    "regex>=2023.0.0",
]

# Dataset and benchmark dependencies
datasets = [
    "torchvision>=0.15.0",
    "datasets>=2.14.0",
    "pycocotools>=2.0.6",
]

# LVLM integration dependencies (LLaVA, OpenFlamingo)
lvlm = [
    "transformers>=4.37.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    "einops>=0.7.0",
    "einops-exts>=0.0.4",
]

# Adversarial attack dependencies
attacks = [
    "foolbox>=3.3.3",
    "autoattack>=0.2.0",
]

# Visualization and analysis dependencies
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

# Full installation (all optional dependencies)
full = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "timm>=0.9.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "open_clip_torch>=2.20.0",
    "ftfy>=6.1.0",
    "regex>=2023.0.0",
    "datasets>=2.14.0",
    "pycocotools>=2.0.6",
    "transformers>=4.37.0",
    "accelerate>=0.25.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    "einops>=0.7.0",
    "einops-exts>=0.0.4",
    "foolbox>=3.3.3",
    "autoattack>=0.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
]

[project.scripts]
# Runnable entrypoint supporting train and eval modes
# Satisfies method obligations: "Create a runnable entrypoint supporting train and eval modes"
robust-clip = "main:main"
robust-clip-train = "main:main"
robust-clip-eval = "main:main"
robust-clip-smoke = "main:main"

[project.urls]
Homepage = "https://github.com/paperbench/robust-clip"
Documentation = "https://github.com/paperbench/robust-clip/blob/main/README.md"
Repository = "https://github.com/paperbench/robust-clip"
Issues = "https://github.com/paperbench/robust-clip/issues"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: marks tests as smoke tests for quick validation",
    "integration: marks tests as integration tests",
    "training: marks tests that require training",
    "evaluation: marks tests that require evaluation",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "build",
    "dist",
    ".venv",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]