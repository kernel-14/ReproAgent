    models: ["roberta-base"]

experiment_specs:
  core_contribution_hypothesis: "APT can jointly prune and tune pretrained language models while preserving task performance and reducing training/inference costs."
  decisive_comparison: "APT versus FT, LoRA, LoRA+Prune, Mask Tuning, CoFi, and test_time_adaptation across GLUE, SQuAD, summarization, and TruthfulQA generation routes."
  decisive_metric_functions: ["dev_accuracy", "dev_F1", "ROUGE", "training_cost", "inference_cost", "memory_usage", "relative_accuracy"]
  positive_implementation_scope_boundary: "Bounded default runs exercise the same adapter, pruning, tuning, distillation, metric, and artifact-writer code paths on tiny fixtures; full mode is required for paper-scale benchmark claims."
  bounded_default_subset:
    tasks: ["SST2", "TruthfulQA"]
    methods: ["ours", "lora", "mask_tuning", "cofi"]
    batch_size: 32
    max_steps: 4
  full_set:
    tasks: ["SST2", "MNLI", "SQuAD v2.0", "CNN/DailyMail", "TruthfulQA"]
    methods: ["ours", "fine_tuning", "lora", "lora_prune", "mask_tuning", "cofi", "test_time_adaptation"]
    batch_sizes: [32, 128]

evidence_contract_matrix:
  path: "results/evidence_contract_matrix.json"
  rows:
    - obligation: "APT adapter -> LoRA base adapter + binary pruning masks m_i/m_o + dynamic rank r_apt"
      callable: "apt.APTAdapter"
      artifact: "results/model_registry.json"
    - obligation: "Low-cost A_P -> outlier-aware salience score + fast search + binary masks"
      callable: "apt.AdaptivePruner"
      artifact: "results/pruning_trace.json"
    - obligation: "Adaptive A_T -> tuning layer importance + dynamic ranks + A_T metadata"
      callable: "apt.AdaptiveTuner"
      artifact: "results/tuning_trace.json"
    - obligation: "Efficient Self-Knowledge Distillation -> shared teacher/student loss route"
      callable: "apt.distillation_loss"
      artifact: "results/loss_trace.json"
