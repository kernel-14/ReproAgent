    figure_6: "pinn_landscape.reporting:write_gradient_norm_trace"
    figure_7: "pinn_landscape.reporting:write_optimizer_diagnostics"
    figure_8: "pinn_landscape.reporting:write_appendix_optimizer_comparison"
    figure_10: "pinn_landscape.reporting:write_residual_hessian_condition"

metrics_json_schema:
  path: "results/metrics.json"
  record_required_fields:
    - "problem"
    - "optimizer"
    - "width"
    - "seed"
    - "iteration"
    - "loss"
    - "L2RE"
  record_optional_but_expected_fields:
    - "total_loss"
    - "residual_loss"
    - "initial_loss"
    - "boundary_loss"
    - "gradient_norm"
    - "learning_rate"
    - "n_residual_points"
    - "mode"
    - "artifact_label"
  aggregation:
    primary_group_keys:
      - "problem"
      - "optimizer"
      - "width"
      - "seed"
    per_sample_selection: "lowest configured primary metric within each group for reporting summaries"
    primary_metric: "L2RE"
  smoke_label_required: true

artifact_contract:
  declared_artifacts:
    - path: "results/metrics.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_metrics"
      required_in_smoke: true
      contains_records_with_fields:
        - "problem"
        - "optimizer"
        - "width"
        - "seed"
        - "iteration"
        - "loss"
        - "L2RE"
    - path: "results/experiment_registry.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_experiment_registry"
      required_in_smoke: true
    - path: "results/artifact_manifest.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_artifact_manifest"
      required_in_smoke: true
    - path: "results/figure1_wave_trajectory.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_wave_trajectory"
      required_in_smoke: true
      figure: "Figure 1"
    - path: "results/figure2_loss_vs_l2re.csv"
      type: "csv"
      writer: "pinn_landscape.reporting:write_loss_vs_l2re"
      required_in_smoke: true
    - path: "results/figure3_component_spectra.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_component_spectra"
      required_in_smoke: true
    - path: "results/figure10_residual_hessian_condition.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_residual_hessian_condition"
      required_in_smoke: true
      figure: "Figure 10"
    - path: "results/loss_curves.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_loss_curves"
      required_in_smoke: true
    - path: "results/experiment_index.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_experiment_index"
      required_in_smoke: true
    - path: "results/loss_trace.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_loss_trace"
      required_in_smoke: true
    - path: "results/method_registry.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_method_registry"
      required_in_smoke: true
    - path: "results/optimizer_comparison_metrics.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_optimizer_comparison_metrics"
      required_in_smoke: true
    - path: "results/readiness.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_readiness"
      required_in_smoke: true
      label: "dry-run contract artifact"
    - path: "results/evaluation_result.json"
      type: "json"
      writer: "pinn_landscape.reporting:write_evaluation_result"
      required_in_smoke: true
      label: "dry-run contract artifact"
  dry_run_contract:
    all_declared_paths_materialized: true
    parent_directories_created: true
    artifact_label: "dry-run contract artifact"
    must_not_claim:
      - "paper-scale training completed"
      - "benchmark score"
      - "trained checkpoint quality"
      - "real final L2RE unless mode is full"

readiness_checks:
  importable_without_torch: true
  optional_dependencies_lazy:
    - "torch"
    - "scipy"
    - "pandas"
    - "matplotlib"
  required_static_files:
    - "configs/pinn_loss_landscape.yaml"
    - "run_experiments.py"
    - "main.py"
  required_runtime_surfaces:
    - "problem_registry"
    - "sampling"
    - "model_registry"
    - "loss_registry"
    - "optimizer_registry"
    - "metric_registry"
    - "protocol_matrix"
    - "artifact_contract"
  smoke_command: "python run_experiments.py --mode runtime_smoke"
  docker_validate_command: "python run_experiments.py --mode docker_validate"

scope_constraints:
  full_spectrum_estimation_default: "disabled"
  full_spectrum_estimation_reason: "Generation and smoke validation must not execute expensive full Hessian spectrum estimation."
  artifact_writers_are_not_substitutes: true
  required_real_surfaces:
    - "PDE/ODE problem factories"
    - "collocation sampler"
    - "PINN model factory"
    - "PINN loss implementation"
    - "optimizer adapters"
    - "training loop"
    - "metric formulas"
    - "Hessian analysis hooks"
  out_of_scope:
    - "Using blacklisted repositories"
    - "Unbounded hyperparameter sweeps during default execution"
    - "Claiming smoke artifacts are final paper results"
    - "Replacing method implementation with only README tables or manifests"