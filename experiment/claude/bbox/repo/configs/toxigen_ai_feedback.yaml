# ============================================================
# Evaluation configuration
# ============================================================
evaluation:
  # ToxiGen primary metrics
  primary_metric: hate_speech_rate
  secondary_metric: toxicity_probability
  metrics:
    hate_speech_rate:
      description: >
        Fraction of generated outputs classified as hate speech by HateBERT.
        Lower is better. Target: BBox-Adapter < base_model.
      formula: num_toxic / total_generated
      threshold: 0.5
      classifier: hatebert_classifier

    toxicity_probability:
      description: >
        Mean toxicity probability score from classifier over all generated outputs.
        Lower is better.
      formula: mean(classifier_scores)
      classifier: hatebert_classifier

    tox_score:
      description: >
        ToxiGen toxicity score (composite), as defined in original ToxiGen paper.
        Combines HateBERT score and human-defined toxicity labels.
      formula: composite_tox_score(hate_speech_rate, toxicity_probability)

  # Reporting
  report_mean_std: true
  num_seeds: 3
  confidence_interval: 0.95

  # Evaluation details (paper section: "Evaluation Details")
  evaluation_details:
    test_split: test
    num_test_samples: 940
    demographic_groups: 13
    samples_per_group: ~72
    generation_method: beam_search_with_classifier_guidance
    classifier_for_feedback: hatebert_classifier
    classifier_for_eval: hatebert_classifier
    reference_grounding: paperbench_ref_005 toxigen/alice.py

# ============================================================
# Execution and runner configuration
# ============================================================
runner:
  entry_point: scripts/run_experiment.py
  config_flag: --config configs/toxigen_ai_feedback.yaml
  mode_flag: --mode
  modes:
    smoke: runtime_smoke
    full: full
    docker: docker_validate
  example_invocation: >
    python scripts/run_experiment.py
      --config configs/toxigen_ai_feedback.yaml
      --mode full
      --dataset toxigen
      --method bbox_adapter
      --feedback_mode ai_feedback
      --beam_size 5
      --iteration_count 4
      --batch_size 64
      --adapter_size 0.3
      --seed 42
  smoke_invocation: >
    python scripts/run_experiment.py
      --config configs/toxigen_ai_feedback.yaml
      --mode runtime_smoke

  # Output artifact paths
  output_dir: results/toxigen
  log_dir: logs/
  checkpoint_dir: checkpoints/toxigen_ai_feedback/

# ============================================================
# Reproducibility
# ============================================================
reproducibility:
  random_seed: 42
  seeds: [42, 43, 44]
  report_std: true
  deterministic: true
  note: >
    Paper reports mean ± standard deviation across 3 independent runs.
    reference_grounding: paperbench_ref_006 readme.md (Standard Deviation reporting).

# ============================================================
# Notes on achieving improvements (paper claim)
# ============================================================
achieving_improvements:
  claim: >
    BBox-Adapter achieves improvements in toxicity reduction on ToxiGen
    compared to the unadapted base model, without accessing model weights.
    The energy-based adapter up-weights low-toxicity candidates during
    re-ranking, driven by AI feedback from HateBERT classifier.
  reference: Table 7
  feedback_mode: ai_feedback
  key_method: online_adaptation + ranking_nce + ai_feedback
  reference_grounding: paperbench_ref_005 toxigen/alice.py