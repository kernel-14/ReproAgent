# configs/scienceqa_groundtruth.yaml
# BBox-Adapter: ScienceQA experiment configuration — ground-truth feedback mode
#
# Reference grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
# Reference grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py
# Reference grounding: paperbench_ref_001 grade_school_math/train.py
# Reference grounding: paperbench_ref_005 toxigen/utils.py
#
# Paper evidence contract: Experiment 4 (ScienceQA) — ours vs baselines
# Metrics: accuracy, training_cost, inference_cost
# Artifact paths:
#   results/online_adaptation_log.json
#   results/positive_negative_curves.json
#   logs/training.log

# ============================================================
# Core experiment identity
# ============================================================
experiment_id: scienceqa_groundtruth
dataset: scienceqa
feedback_mode: ground_truth   # trainer accepts: ground_truth | ai_feedback | combined
description: >
  ScienceQA multi-choice science domain benchmark using ground-truth labels as the reward signal.
  BBox-Adapter is trained online via ranking NCE loss with positive/negative sampling
  based on whether candidate answers match the gold option label.
  Corresponds to Experiment 4 in the paper (Table 2, Table 3, Table 4).
  Ground-truth feedback: positive set = candidates that select the correct choice (A/B/C/D),
  negative set = all other candidates generated by the black-box LLM for the same question.

# ============================================================
# Dataset registry — all five benchmarks from the paper
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py
# ============================================================
dataset_registry:
  gsm8k:
    id: gsm8k
    aliases: [grade_school_math, gsm, math_reasoning]
    hf_path: openai/gsm8k
    hf_name: main
    split_train: train
    split_test: test
    num_train: 7473
    num_test: 1319
    answer_type: numeric
    answer_extractor: regex_boxed_or_last_number
    loader_hook: src.data.gsm8k.load_gsm8k
    metric: exact_match_numeric
    description: Grade-school math word problems requiring multi-step arithmetic reasoning.

  strategyqa:
    id: strategyqa
    aliases: [strategy_qa, implicit_reasoning, binary_qa]
    hf_path: wics/strategy-qa
    hf_name: null
    split_train: train
    split_test: test
    num_train: 2290
    num_test: 490
    answer_type: binary
    answer_extractor: yes_no_extraction
    loader_hook: src.data.strategyqa.load_strategyqa
    metric: exact_match_binary
    description: Multi-step implicit strategy reasoning with yes/no answers.

  truthfulqa:
    id: truthfulqa
    aliases: [truthful_qa, factual_qa, truthfulness]
    hf_path: truthful_qa
    hf_name: multiple_choice
    split_train: validation
    split_test: validation
    num_train: 817
    num_test: 817
    answer_type: multiple_choice
    answer_extractor: mc_choice_extraction
    loader_hook: src.data.truthfulqa.load_truthfulqa
    metric: mc_accuracy
    description: Truthfulness benchmark testing factual accuracy of LLM generations.

  scienceqa:
    id: scienceqa
    aliases: [science_qa, science_domain, multimodal_qa]
    hf_path: derek-thomas/ScienceQA
    hf_name: null
    split_train: train
    split_test: test
    num_train: 12726
    num_test: 4241
    answer_type: multiple_choice
    answer_extractor: mc_choice_extraction
    loader_hook: src.data.scienceqa.load_scienceqa
    metric: mc_accuracy
    description: >
      Science domain multi-choice QA benchmark covering natural science, social science,
      and language topics. Text-only subset used (no image modality).

  toxigen:
    id: toxigen
    aliases: [toxicity, hate_speech, toxic_generation]
    hf_path: skg/toxigen-data
    hf_name: annotated
    split_train: train
    split_test: test
    num_train: 8960
    num_test: 940
    answer_type: generative
    answer_extractor: toxicity_classifier
    loader_hook: src.data.toxigen.load_toxigen
    metric: toxicity_rate
    description: >
      Hate speech and toxicity generation benchmark. AI feedback via HateBERT classifier.
      reference_grounding: paperbench_ref_005 toxigen/utils.py

# ============================================================
# Environment / task registry (paper Table 2, Table 3)
# Black-Box LLMs evaluated in the paper
# ============================================================
environment_registry:
  gpt_3_5_turbo:
    id: gpt_3_5_turbo
    aliases: [gpt-3.5-turbo, chatgpt, openai_chat]
    provider: openai
    api_type: chat_completion
    model_name: gpt-3.5-turbo
    black_box: true
    context_window: 4096
    cost_per_1k_input_tokens: 0.0015
    cost_per_1k_output_tokens: 0.002
    setup_hook: src.utils.llm_client.get_openai_client
    description: OpenAI GPT-3.5-Turbo — primary black-box LLM in main results.

  gpt_4:
    id: gpt_4
    aliases: [gpt-4, openai_gpt4]
    provider: openai
    api_type: chat_completion
    model_name: gpt-4
    black_box: true
    context_window: 8192
    cost_per_1k_input_tokens: 0.03
    cost_per_1k_output_tokens: 0.06
    setup_hook: src.utils.llm_client.get_openai_client
    description: OpenAI GPT-4 — plug-and-play transfer target (Table 3).

  mixtral_8x7b:
    id: mixtral_8x7b
    aliases: [Mixtral-8x7B-v0, mixtral, mixtral_moe]
    provider: together_ai
    api_type: completion
    model_name: mistralai/Mixtral-8x7B-v0.1
    black_box: true
    context_window: 32768
    cost_per_1k_input_tokens: 0.0006
    cost_per_1k_output_tokens: 0.0006
    setup_hook: src.utils.llm_client.get_together_client
    description: >
      Mixtral-8x7B-v0.1 mixture-of-experts open LLM accessed via Together AI API.
      Plug-and-play transfer target (Table 3). Black-box inference only.

  davinci_002:
    id: davinci_002
    aliases: [text-davinci-002, davinci, openai_completion]
    provider: openai
    api_type: completion
    model_name: text-davinci-002
    black_box: true
    context_window: 4097
    cost_per_1k_input_tokens: 0.002
    cost_per_1k_output_tokens: 0.002
    setup_hook: src.utils.llm_client.get_openai_client
    description: OpenAI text-davinci-002 — plug-and-play transfer baseline (Table 3).

  azure_openai:
    id: azure_openai
    aliases: [azure_sft, azure_lora, azure_ft]
    provider: azure
    api_type: chat_completion
    model_name: gpt-3.5-turbo
    black_box: true
    context_window: 4096
    setup_hook: src.utils.llm_client.get_azure_client
    description: >
      Azure OpenAI fine-tuning endpoint. Used for azure_sft and azure_lora baselines
      which fine-tune GPT-3.5-turbo on Azure (Evaluation Details, Main Results).

# ============================================================
# Method / baseline selector registry
# All methods from the paper's evidence obligation
# ============================================================
method_registry:
  # BBox-Adapter variants (paper contribution)
  bbox_adapter:
    id: bbox_adapter
    aliases: [ours, BBox-ADAPTER, BBox-ADApter, BBOX-ADAPTER, energy_based_model, online_adaptation]
    type: bbox_adapter
    adapter_class: src.models.bbox_adapter.BBoxAdapter
    feedback_mode: ground_truth
    description: >
      Full BBox-Adapter method. Energy-based model trained with ranking NCE loss.
      Online adaptation with positive/negative sampling from black-box LLM outputs.
      Sentence-level beam search inference at test time.

  ranking_nce:
    id: ranking_nce
    aliases: [nce_loss, ranking_nce_loss]
    type: loss_variant
    adapter_class: src.models.bbox_adapter.BBoxAdapter
    loss: ranking_nce
    description: BBox-Adapter with ranking NCE loss (ablation vs MLM loss, Table 5).

  ground_truth_feedback:
    id: ground_truth_feedback
    aliases: [gt_feedback, oracle_feedback]
    type: feedback_mode
    feedback: ground_truth
    description: Positive/negative sampling using gold labels (ground-truth feedback mode).

  ai_feedback:
    id: ai_feedback
    aliases: [llm_feedback, judge_feedback]
    type: feedback_mode
    feedback: ai_feedback
    description: Positive/negative sampling using an AI judge (AI feedback mode).

  combined_feedback:
    id: combined_feedback
    aliases: [combined, hybrid_feedback]
    type: feedback_mode
    feedback: combined
    description: Combined ground-truth + AI feedback (combined feedback mode).

  energy_based_model:
    id: energy_based_model
    aliases: [ebm, energy_model]
    type: core_component
    description: EBM component of BBox-Adapter scoring candidate responses.

  single_step_inference:
    id: single_step_inference
    aliases: [greedy_inference, single_step]
    type: inference_mode
    beam_size: 1
    description: Single-step greedy inference without beam search (beam_size=1).

  full_step_inference:
    id: full_step_inference
    aliases: [beam_inference, beam_search_inference]
    type: inference_mode
    beam_size: 5
    description: Full multi-step beam search inference (beam_size=5).

  online_adaptation:
    id: online_adaptation
    aliases: [iterative_adaptation, online_training]
    type: training_mode
    description: Iterative online adaptation loop (Section 3.4 of paper).

  # Baseline methods
  chain_of_thought:
    id: chain_of_thought
    aliases: [cot, CoT, chain_of_thought_prompting]
    type: baseline
    description: Chain-of-thought prompting baseline (few-shot CoT, Table 2).

  oracle:
    id: oracle
    aliases: [upper_bound, oracle_baseline]
    type: baseline
    description: Oracle upper bound using gold labels directly.

  heuristic:
    id: heuristic
    aliases: [heuristic_baseline, rule_based]
    type: baseline
    description: Heuristic rule-based baseline.

  roberta:
    id: roberta
    aliases: [roberta_classifier, roberta_ft]
    type: baseline
    description: RoBERTa fine-tuned classifier baseline.

  fine_tuning:
    id: fine_tuning
    aliases: [sft, supervised_fine_tuning, full_ft]
    type: baseline
    description: Full supervised fine-tuning baseline.

  lora:
    id: lora
    aliases: [LoRA, low_rank_adaptation]
    type: baseline
    description: LoRA (Low-Rank Adaptation) PEFT baseline.

  sft_lora:
    id: sft_lora
    aliases: [sft_with_lora, lora_sft]
    type: baseline
    description: SFT with LoRA fine-tuning baseline (Table 2, Table 4).

  azure_sft:
    id: azure_sft
    aliases: [azure_supervised_ft, azure_fine_tuning]
    type: baseline
    description: Azure OpenAI supervised fine-tuning via Azure API (Table 2, Table 4).

  mlm:
    id: mlm
    aliases: [mlm_loss, masked_language_model, mlm_adapter]
    type: ablation_baseline
    description: Adapter trained with MLM loss instead of ranking NCE (Table 5).

# ============================================================
# Training hyperparameters
# Paper-derived fixed anchors and sweep values
# reference_grounding: paperbench_ref_001 grade_school_math/train.py
# ============================================================
training:
  # Fixed hyperparameter anchors (paper Table 4 / Section 4.2)
  batch_size: 128              # batch_size_128 anchor (primary)
  batch_size_128: 128          # explicit anchor — paper Table 4
  batch_size_64: 64            # explicit anchor — paper Table 4 (ablation)
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  num_epochs: 5
  warmup_steps: 100
  optimizer: adamw
  lr_scheduler: linear

  # Online adaptation settings (Section 3.4)
  num_iterations: 3            # default; sweep: [0, 1, 2, 3, 4]
  samples_per_question: 10     # candidate samples per question from black-box LLM
  positive_sample_ratio: 0.3   # top-k fraction treated as positives
  negative_sample_ratio: 0.7   # remaining fraction treated as negatives
  temperature: 1.0             # sampling temperature for black-box LLM

  # Beam inference settings (Section 3.3)
  beam_size: 5                 # default; sweep: [1, 3, 5]
  max_new_tokens: 256

  # NCE loss settings
  loss_type: ranking_nce
  nce_noise_samples: 10

# ============================================================
# Adapter model settings
# Adapter size sweep: 0.1B and 0.3B (paper Table 2 / Ablation 1)
# ============================================================
adapter:
  adapter_size: 0.1            # default 0.1B; ablation values: [0.1, 0.3]
  adapter_size_0_1b: 0.1       # sweep anchor
  adapter_size_0_3b: 0.3       # sweep anchor
  hidden_dim: 768
  num_layers: 6
  dropout: 0.1
  adapter_class: src.models.bbox_adapter.BBoxAdapter
  model_name_0_1b: microsoft/deberta-v3-base
  model_name_0_3b: microsoft/deberta-v3-large
  architecture: deberta_energy_head
  # 0.1B config (default)
  config_0_1b:
    hidden_dim: 512
    num_layers: 4
    num_heads: 8
    ffn_dim: 2048
  # 0.3B config (ablation)
  config_0_3b:
    hidden_dim: 1024
    num_layers: 8
    num_heads: 16
    ffn_dim: 4096

# ============================================================
# Inference configuration
# ============================================================
inference:
  mode: full_step_inference    # single_step_inference | full_step_inference
  beam_size: 5                 # default beam size
  temperature: 1.0
  max_new_tokens: 256
  num_return_sequences: 10

# ============================================================
# Bounded parameter sweeps (paper Figure 3, Table 2, Ablation)
# ============================================================
parameter_sweeps:
  beam_size:
    values: [1, 3, 5]
    default: 5
    description: Sentence-level beam search beam width (Section 3.3, Figure 3).

  iteration_count:
    values: [0, 1, 2, 3, 4]
    default: 3
    description: Number of online adaptation iterations (Section 3.4, Figure 3).

  adapter_size:
    values: [0.1, 0.3]
    default: 0.1
    unit: B_params
    description: Adapter model parameter count in billions (Ablation 1, Table 2).

  batch_size:
    values: [64, 128]
    default: 128
    anchors:
      batch_size_128: 128
      batch_size_64: 64
    description: Training batch size for NCE loss (Ablation 2, Table 4).

  temperature:
    values: [0.5, 0.7, 1.0, 1.2]
    default: 1.0
    description: Sampling temperature for black-box LLM candidate generation.

# ============================================================
# Evidence obligation matrix — all 5 experiments + ablations
# Paper-derived bindings: experiment -> environment -> methods -> metrics -> artifacts
# ============================================================
evidence_obligation_matrix:
  experiment_1_gsm8k:
    id: experiment_1_gsm8k
    name: "GSM8K Math Reasoning"
    dataset: gsm8k
    environment: gpt_3_5_turbo
    methods: [bbox_adapter, chain_of_thought, azure_sft, sft_lora]
    metrics: [accuracy, training_cost, inference_cost]
    artifacts:
      - results/online_adaptation_log.json
      - results/positive_negative_curves.json
      - logs/training.log
    paper_table: "Table 2, Table 3, Table 4"
    trend: "BBox-Adapter achieves improvements over CoT, azure_sft, sft_lora with lower training_cost"

  experiment_2_strategyqa:
    id: experiment_2_strategyqa
    name: "StrategyQA Implicit Reasoning"
    dataset: strategyqa
    environment: gpt_3_5_turbo
    feedback_mode: ai_feedback
    methods: [bbox_adapter, chain_of_thought, oracle, heuristic, roberta, fine_tuning, lora, sft_lora, azure_sft, mlm]
    metrics: [accuracy, training_cost, inference_cost]
    artifacts:
      - results/online_adaptation_log.json
      - results/positive_negative_curves.json
      - logs/training.log
    paper_table: "Table 2, Table 3, Table 4, Table 5, Table 6"
    trend: "BBox-Adapter outperforms all baselines with competitive training/inference cost"

  experiment_3_truthfulqa:
    id: experiment_3_truthfulqa
    name: "TruthfulQA Truthfulness"
    dataset: truthfulqa
    environment: gpt_3_5_turbo
    feedback_mode: combined
    methods: [bbox_adapter, chain_of_thought, oracle, roberta, azure_sft, sft_lora, mlm]
    metrics: [accuracy, training_cost, inference_cost]
    artifacts:
      - results/online_adaptation_log.json
      - results/positive_negative_curves.json
      - logs/training.log
    paper_table: "Table 2, Table 3, Table 4"
    trend: "BBox-Adapter achieves improvements in factual accuracy over baselines"

  experiment_4_scienceqa:
    id: experiment_4_scienceqa
    name: "ScienceQA Science Domain"
    dataset: scienceqa
    environment: gpt_3_5_turbo
    feedback_mode: ground_truth
    methods: [bbox_adapter, chain_of_thought, oracle, roberta, azure_sft, sft_lora, mlm, lora, ranking_nce]
    metrics: [accuracy, training_cost, inference_cost]
    artifacts:
      - results/online_adaptation_log.json
      - results/positive_negative_curves.json
      - logs/training.log
    paper_table: "Table 2, Table 3, Table 4"
    trend: "BBox-Adapter achieves improvements over CoT and fine-tuning baselines on science domain QA"

  experiment_5_toxigen:
    id: experiment_5_toxigen
    name: "ToxiGen Toxicity Reduction"
    dataset: toxigen
    environment: gpt_3_5_turbo
    feedback_mode: ai_feedback
    methods: [bbox_adapter, chain_of_thought, sft_lora]
    metrics: [toxicity_rate, toxicity_probability, hate_speech_rate]
    artifacts:
      - results/online_adaptation_log.json
      - logs/training.log
    paper_table: "Table 7"
    trend: "BBox-Adapter reduces toxicity rate vs base_model and sft_lora baselines"
    # reference_grounding: paperbench_ref_005 toxigen/utils.py

  ablation_1_adapter_size:
    id: ablation_1_adapter_size
    name: "Adapter Size Sweep (0.1B vs 0.3B)"
    datasets: [strategyqa, gsm8k]
    environment: gpt_3_5_turbo
    methods: [bbox_adapter]
    sweep_param: adapter_size
    sweep_values: [0.1, 0.3]
    metrics: [accuracy]
    artifacts:
      - results/online_adaptation_log.json
    paper_table: "Table 2"
    trend: "0.3B adapter improves accuracy marginally at higher memory cost"

  ablation_2_batch_size:
    id: ablation_2_batch_size
    name: "Batch Size Sweep (64 vs 128)"
    datasets: [strategyqa]
    environment: gpt_3_5_turbo
    methods: [bbox_adapter]
    sweep_param: batch_size
    sweep_values: [64, 128]
    anchors: [batch_size_64, batch_size_128]
    metrics: [accuracy, training_cost]
    artifacts:
      - results/online_adaptation_log.json
      - results/positive_negative_curves.json
    paper_table: "Table 4"
    trend: "batch_size=128 provides best accuracy-cost tradeoff"

  cost_analysis:
    id: cost_analysis
    name: "Cost and VRAM Efficiency Analysis"
    datasets: [strategyqa, gsm8k]
    environments: [gpt_3_5_turbo, mixtral_8x7b, azure_openai]
    methods: [bbox_adapter, azure_sft, sft_lora, chain_of_thought]
    metrics:
      - training_cost
      - inference_cost
      - api_cost
      - memory_usage
      - gpu_memory
    artifacts:
      - results/cost_vram_report.json
      - results/online_adaptation_log.json
    paper_table: "Table 4, Table 6"
    trend: "BBox-Adapter lower training cost vs azure_sft; lower VRAM vs sft_lora"

# ============================================================
# Protocol matrix — named experiments linked to configs
# ============================================================
protocol_matrix:
  main_comparison:
    experiment_ids: [experiment_1_gsm8k, experiment_2_strategyqa, experiment_3_truthfulqa, experiment_4_scienceqa]
    environments: [gpt_3_5_turbo]
    methods: [bbox_adapter, chain_of_thought, azure_sft, sft_lora, lora, roberta, mlm, oracle]
    measurements: [accuracy]
    artifact_paths:
      - results/metrics.json
      - results/online_adaptation_log.json
    paper_tables: ["Table 2", "Table 10"]

  plug_and_play:
    experiment_ids: [experiment_1_gsm8k, experiment_2_strategyqa, experiment_3_truthfulqa, experiment_4_scienceqa]
    environments: [davinci_002, mixtral_8x7b]
    methods: [bbox_adapter]
    measurements: [accuracy]
    artifact_paths:
      - results/metrics.json
      - results/online_adaptation_log.json
    paper_tables: ["Table 3"]

  ablation_adapter_size:
    experiment_ids: [ablation_1_adapter_size]
    environments: [gpt_3_5_turbo]
    methods: [bbox_adapter]
    sweep: adapter_size
    sweep_values: [0.1, 0.3]
    measurements: [accuracy]
    artifact_paths:
      - results/online_adaptation_log.json
    paper_tables: ["Table 2"]

  ablation_batch_size:
    experiment_ids: [ablation_2_batch_size]
    environments: [gpt_3_5_turbo]
    methods: [bbox_adapter]
    sweep: batch_size
    sweep_values: [64, 128]
    measurements: [accuracy, training_cost]
    artifact_paths:
      - results/online_adaptation_log.json
      - results/positive_negative_curves.json
    paper_tables: ["Table 4"]

  cost_efficiency:
    experiment_ids: [cost_analysis]
    environments: [gpt_3_5_turbo, azure_openai, mixtral_8x7b]
    methods: [bbox_adapter, azure_sft, sft_lora, chain_of_thought]
    measurements: [training_cost, inference_cost, api_cost, memory_usage, gpu_memory]
    artifact_paths:
      - results/cost_vram_report.json
    paper_tables: ["Table 4", "Table 6"]

  toxicity_reduction:
    experiment_ids: [experiment_5_toxigen]
    environments: [gpt_3_5_turbo]
    methods: [bbox_adapter, sft_lora, chain_of_thought]
    measurements: [toxicity_rate, toxicity_probability, hate_speech_rate]
    artifact_paths:
      - results/online_adaptation_log.json
    paper_tables: ["Table 7"]

  beam_iteration_ablation:
    experiment_ids: [experiment_4_scienceqa]
    environments: [gpt_3_5_turbo]
    methods: [bbox_adapter]
    sweeps:
      beam_size: [1, 3, 5]
      iteration_count: [0, 1, 2, 3, 4]
    measurements: [accuracy]
    artifact_paths:
      - results/positive_negative_curves.json
      - results/online_adaptation_log.json
    paper_figures: ["Figure 3"]

# ============================================================
# Artifact output paths (canonical paths used by training.py)
# ============================================================
artifacts:
  training_log: logs/training.log
  online_adaptation_log: results/online_adaptation_log.json
  positive_negative_curves: results/positive_negative_curves.json
  metrics: results/metrics.json
  cost_vram_report: results/cost_vram_report.json
  evaluation_result: results/evaluation_result.json
  readiness: readiness.json

# ============================================================
# Evaluation configuration
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py
# Adapted from: compute_metric loop over pred_answers/gold_answers
# ============================================================
evaluation:
  primary_metric: mc_accuracy
  secondary_metrics: [training_cost, inference_cost]
  answer_extractor: mc_choice_extraction
  # Adapted from paperbench_ref_006 MMLU/run_mmlu_open_source.py compute_metric:
  # Iterate pred_answers vs gold_answers, count matches, compute per-subject + overall ACC
  metric_formula: "ACC = sum(pred == gold for pred, gold in zip(pred_answers, gold_answers)) / len(gold_answers)"
  report_per_subject: true
  report_std: true     # Standard Deviation as in paper's results tables

# ============================================================
# Logging and runtime settings
# ============================================================
logging:
  level: INFO
  log_file: logs/training.log
  log_interval: 10
  eval_interval: 100

runtime:
  seed: 42
  device: auto          # auto | cpu | cuda
  num_workers: 4
  smoke_mode: false     # set true for --mode runtime_smoke (no real API calls)
  max_smoke_samples: 5  # bounded input size for smoke/dry-run validation

# ============================================================
# Selector hooks for canonical runner (scripts/run_experiment.py)
# ============================================================
selectors:
  active_experiment: experiment_4_scienceqa
  active_protocol: main_comparison
  active_method: bbox_adapter
  active_feedback_mode: ground_truth
  active_environment: gpt_3_5_turbo
  active_adapter_size: 0.1
  active_batch_size: 128
  active_beam_size: 5
  active_iterations: 3
