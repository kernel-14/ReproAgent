# ==============================================================
# Run execution modes
# ==============================================================
execution_modes:

  runtime_smoke:
    description: >
      Validate configuration wiring and write schema/readiness artifacts.
      Does NOT run real experiments. Labeled as dry-run contract artifacts.
      Creates all declared artifact paths with schema/manifest content.
    run_experiments: false
    write_schema_artifacts: true
    dry_run_label: true
    timeout_seconds: 30
    artifacts_created:
      - results/main_comparison/metrics.json
      - results/ablation/metrics.json
      - results/cost_analysis/metrics.json
      - results/toxigen/metrics.json
      - results/evidence_contract_matrix.json
      - results/experiment_registry.json
      - readiness.json
      - evaluation_result.json

  docker_validate:
    description: >
      Docker environment check. Validates imports and artifact paths.
      Same as runtime_smoke but also checks environment variables and CUDA.
    run_experiments: false
    write_schema_artifacts: true
    dry_run_label: true
    check_env_vars: true
    timeout_seconds: 30

  full:
    description: >
      Full experiment execution. Requires API keys, GPU, and dataset downloads.
      Runs all experiments in evidence_contract_matrix.
    run_experiments: true
    write_schema_artifacts: false
    dry_run_label: false
    required_env_vars:
      - OPENAI_API_KEY
      - AZURE_OPENAI_API_KEY
      - AZURE_OPENAI_ENDPOINT
    required_hardware: [gpu]
    estimated_runtime_hours: 48

  main_only:
    description: >
      Run only main comparison experiments (Experiments 1-5, Table 2).
      Skips ablations and cost analysis.
    run_experiments: true
    experiments_subset:
      - exp_gsm8k_main
      - exp_strategyqa_main
      - exp_truthfulqa_main
      - exp_scienceqa_main
      - exp_toxigen_main
    write_schema_artifacts: false
    dry_run_label: false

  ablation_only:
    description: >
      Run only ablation studies (Table 5, Figure 3).
    run_experiments: true
    experiments_subset:
      - ablation_adapter_size
      - ablation_batch_size
      - ablation_loss_function
      - ablation_beam_size
      - ablation_iterations
    write_schema_artifacts: false
    dry_run_label: false