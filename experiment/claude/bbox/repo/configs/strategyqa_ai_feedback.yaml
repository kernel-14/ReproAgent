# configs/strategyqa_ai_feedback.yaml
# BBox-Adapter: StrategyQA experiment configuration — AI feedback mode
#
# Reference grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
# Reference grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py
# Reference grounding: paperbench_ref_001 grade_school_math/train.py
# Reference grounding: paperbench_ref_005 toxigen/utils.py
#
# Paper evidence contract: Experiment 2 (StrategyQA) — ours vs baselines
# Metrics: accuracy, training_cost, inference_cost
# Artifact paths: results/online_adaptation_log.json, results/positive_negative_curves.json, logs/training.log

# ============================================================
# Core experiment identity
# ============================================================
experiment_id: strategyqa_ai_feedback
dataset: strategyqa
feedback_mode: ai_feedback    # trainer accepts: ground_truth | ai_feedback | combined
description: >
  StrategyQA implicit reasoning benchmark using AI feedback as the reward signal.
  BBox-Adapter is trained online via ranking NCE loss with positive/negative sampling
  determined by an AI judge evaluating binary yes/no correctness.
  Corresponds to Experiment 2 in the paper (Table 2, Table 3, Table 4, Table 5, Table 6).
  AI feedback uses a smaller LLM judge (e.g., GPT-3.5-turbo) to score candidate answers
  when ground-truth labels are not directly accessible during online training.

# ============================================================
# Dataset registry — all five benchmarks from the paper
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py
# ============================================================
dataset_registry:
  gsm8k:
    id: gsm8k
    aliases: [grade_school_math, gsm, math_reasoning]
    hf_path: openai/gsm8k
    hf_name: main
    split_train: train
    split_test: test
    num_train: 7473
    num_test: 1319
    answer_type: numeric
    answer_extractor: regex_boxed_or_last_number
    loader_hook: src.data.gsm8k.load_gsm8k
    metric: exact_match_numeric
    description: Grade-school math word problems requiring multi-step arithmetic reasoning.

  strategyqa:
    id: strategyqa
    aliases: [strategy_qa, strategy-qa, implicit_reasoning]
    hf_path: tau/commonsense_qa   # fallback; primary: wics/strategy-qa
    hf_name: null
    split_train: train
    split_test: validation
    num_train: 2061
    num_test: 490
    answer_type: binary_yes_no
    answer_extractor: yes_no_classifier
    loader_hook: src.data.strategyqa.load_strategyqa
    metric: exact_match_binary
    description: >
      Strategy QA: yes/no questions requiring implicit multi-hop reasoning over commonsense
      knowledge. Feedback derived from AI judge because reasoning chain is implicit.

  truthfulqa:
    id: truthfulqa
    aliases: [truthful_qa, truthfulness]
    hf_path: truthful_qa
    hf_name: multiple_choice
    split_train: validation
    split_test: validation
    num_train: 817
    num_test: 817
    answer_type: multiple_choice
    answer_extractor: letter_choice
    loader_hook: src.data.truthfulqa.load_truthfulqa
    metric: mc1_accuracy
    description: TruthfulQA measures truthfulness of language model responses across categories.

  scienceqa:
    id: scienceqa
    aliases: [science_qa, science-qa, multimodal_science]
    hf_path: derek-thomas/ScienceQA
    hf_name: null
    split_train: train
    split_test: test
    num_train: 12726
    num_test: 4241
    answer_type: multiple_choice
    answer_extractor: letter_choice
    loader_hook: src.data.scienceqa.load_scienceqa
    metric: exact_match_letter
    description: ScienceQA multimodal science questions; text-only subset used for BBox-Adapter.

  toxigen:
    id: toxigen
    aliases: [tox_gen, hate_speech, toxicity]
    hf_path: skg/toxigen-data
    hf_name: annotated
    split_train: train
    split_test: test
    num_train: 8960
    num_test: 940
    answer_type: generation
    answer_extractor: null
    loader_hook: src.data.toxigen.load_toxigen
    metric: hate_speech_rate
    secondary_metric: toxicity_probability
    # reference_grounding: paperbench_ref_005 toxigen/utils.py
    # Label: toxicity_ai + toxicity_human > 5.5 → toxic (binary)
    description: ToxiGen implicit hate speech dataset for toxicity reduction via AI feedback.

# ============================================================
# Primary experiment (this config): StrategyQA / AI feedback
# ============================================================
experiment:
  id: strategyqa_ai_feedback
  benchmark: strategyqa
  hypothesis: >
    BBox-Adapter with AI feedback achieves higher accuracy on StrategyQA
    than strong baselines (CoT, fine-tuning, LoRA, SFT-LoRA) while incurring
    substantially lower training and inference cost.
  decision_metric: exact_match_binary
  comparison:
    primary_method: bbox_adapter
    baselines:
      - ours
      - chain_of_thought
      - oracle
      - heuristic
      - roberta
      - fine_tuning
      - lora
      - sft_lora
      - azure_sft
      - mlm
      - ranking_nce
      - online_adaptation
      - single_step_inference
      - full_step_inference
      - ground_truth_feedback
      - ai_feedback
      - energy_based_model
      - combined_feedback

# ============================================================
# Environment / LLM registry
# Paper section: Black-Box LLMs, Main Results, Evaluation Details
# ============================================================
environment_registry:
  gpt35_turbo:
    id: gpt35_turbo
    aliases: [gpt-3.5-turbo, chatgpt, openai_chat]
    provider: openai
    api_type: chat_completion
    model_name: gpt-3.5-turbo
    black_box: true
    is_primary_generator: true
    is_ai_judge: true        # used as feedback judge in ai_feedback mode
    temperature: 1.0
    max_tokens: 512
    description: >
      Primary black-box LLM generator. Also used as the AI feedback judge for
      StrategyQA yes/no correctness scoring when ground-truth labels are unavailable.

  gpt4:
    id: gpt4
    aliases: [gpt-4, openai_gpt4]
    provider: openai
    api_type: chat_completion
    model_name: gpt-4
    black_box: true
    is_primary_generator: false
    is_ai_judge: false
    temperature: 1.0
    max_tokens: 512
    description: Optional stronger generator for plug-and-play transfer experiments.

  mixtral_8x7b:
    id: mixtral_8x7b
    aliases: [Mixtral-8x7B-v0, mixtral, mixtral_moe]
    provider: huggingface
    api_type: text_generation
    model_name: mistralai/Mixtral-8x7B-v0.1
    black_box: true
    is_primary_generator: false
    is_ai_judge: false
    temperature: 1.0
    max_tokens: 512
    # Paper: Mixtral-8x7B-v0 used in plug-and-play / transfer experiments (Table 3)
    description: >
      Mixtral-8x7B mixture-of-experts open-weight model. Used in plug-and-play
      transfer experiments to demonstrate BBox-Adapter generalizes across LLM backends.

  davinci_002:
    id: davinci_002
    aliases: [text-davinci-002, davinci]
    provider: openai
    api_type: completion
    model_name: text-davinci-002
    black_box: true
    is_primary_generator: false
    is_ai_judge: false
    temperature: 1.0
    max_tokens: 512
    description: Legacy OpenAI completion model used in plug-and-play transfer experiments.

  azure_openai:
    id: azure_openai
    aliases: [azure_sft, azure_fine_tune, azure_lora]
    provider: azure
    api_type: fine_tuned_completion
    model_name: gpt-3.5-turbo   # fine-tuned via Azure
    black_box: true
    is_primary_generator: false
    is_ai_judge: false
    temperature: 0.0
    max_tokens: 512
    description: >
      Azure OpenAI fine-tuned model (SFT baseline). Used as strong supervised baseline
      in cost and accuracy comparisons (Table 2, Table 4).

# ============================================================
# Adapter / small model configuration
# Ablation 1: adapter_size sweep [0.1B, 0.3B]
# ============================================================
adapter:
  # paper-derived adapter sizes (ablation sweep)
  adapter_sizes_sweep: [0.1, 0.3]   # billions of parameters
  default_adapter_size: 0.1         # default for StrategyQA experiments
  model_name_01B: microsoft/deberta-v3-base
  model_name_03B: microsoft/deberta-v3-large
  architecture: deberta_energy_head
  trainable_params_only: true
  # reference_grounding: paperbench_ref_001 grade_school_math/train.py
  # Paper uses small adapter (0.1B/0.3B) trained with AdamW, lr 1e-5, 20 epochs-equivalent

# ============================================================
# Training hyperparameters
# Paper evidence: batch_size anchors batch_size_128, batch_size_64
# Sweep: iteration_count [0,1,2,3,4], beam_size [1,3,5], batch_size [64,128]
# reference_grounding: paperbench_ref_001 grade_school_math/train.py
# ============================================================
training:
  # Fixed hyperparameter anchors (paper evidence contract)
  batch_size_128: 128     # anchor: batch_size_128
  batch_size_64: 64       # anchor: batch_size_64
  default_batch_size: 128

  learning_rate: 1.0e-5
  optimizer: adamw
  lr_scheduler: linear
  warmup_steps: 100
  max_grad_norm: 1.0
  weight_decay: 0.01

  # Online iteration sweep (paper Figure 3, ablation)
  iteration_count_sweep: [0, 1, 2, 3, 4]
  default_iteration_count: 4

  # Beam size sweep (paper Figure 3)
  beam_size_sweep: [1, 3, 5]
  default_beam_size: 5

  # Temperature sweep
  temperature_sweep: [0.5, 0.7, 0.9, 1.0]
  default_temperature: 1.0

  # Adapter size ablation sweep (paper Table 2 ablation)
  adapter_size_sweep: [0.1, 0.3]
  default_adapter_size: 0.1

  # Ablation 2 batch size sweep (paper Table 4 / cost analysis)
  batch_size_sweep: [64, 128]

  # NCE loss configuration (paper: ranking NCE / energy-based objective)
  nce_loss: ranking_nce
  energy_model: energy_based_model
  loss_temperature: 1.0

  num_epochs: 1           # online adaptation: 1 pass per iteration
  num_candidates_per_example: 5   # = default beam_size

# ============================================================
# Feedback / reward configuration for AI feedback mode
# reference_grounding: paperbench_ref_005 toxigen/utils.py
# ============================================================
feedback:
  mode: ai_feedback       # ground_truth | ai_feedback | combined
  ai_judge_model: gpt-3.5-turbo
  ai_judge_provider: openai
  ai_judge_prompt_template: >
    You are an expert evaluator. Given the question and a candidate answer,
    determine whether the candidate answer is correct (yes/no).
    Question: {question}
    Gold answer: {gold_answer}
    Candidate answer: {candidate}
    Reply with only "correct" or "incorrect".
  reward_correct: 1.0
  reward_incorrect: 0.0
  # For binary yes/no tasks: match after normalization
  answer_normalization: lowercase_strip
  # AI feedback judge call budget per training iteration
  max_judge_calls_per_iter: 640   # = batch_size * beam_size

# ============================================================
# Sampling configuration
# Positive: highest-reward candidate; Negative: all other candidates
# ============================================================
sampling:
  strategy: beam_sampling       # sample k candidates via beam/nucleus sampling
  positive_selection: max_reward
  negative_selection: all_others
  min_positives_per_batch: 1
  drop_no_positive_examples: true
  # reference_grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
  # Per-task pred_answers vs gold_answers comparison drives positive/negative labeling.
  nucleus_p: 0.95
  top_k: 50

# ============================================================
# Inference configuration
# ============================================================
inference:
  mode: full_step_inference     # single_step_inference | full_step_inference
  beam_size: 5
  temperature: 1.0
  max_new_tokens: 128
  adapter_reranking: true       # rerank candidates by E_θ(x, y)
  # reference_grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py

# ============================================================
# Method / baseline selector registry
# Paper evidence contract: all methods must be selectable
# ============================================================
method_registry:
  ours:
    id: ours
    aliases: [BBox-ADAPTER, BBox-ADApter, bbox_adapter_primary]
    description: BBox-Adapter with online NCE-based energy model adaptation.
    feedback_mode: ai_feedback
    adapter_size: 0.1
    beam_size: 5
    iteration_count: 4
    batch_size: 128
    enabled: true

  chain_of_thought:
    id: chain_of_thought
    aliases: [CoT, cot, zero_shot_cot]
    description: Chain-of-thought prompting without adapter fine-tuning.
    feedback_mode: null
    adapter_size: null
    enabled: true

  oracle:
    id: oracle
    aliases: [oracle_upper_bound, gold_feedback]
    description: Oracle access to ground-truth labels (upper bound baseline).
    feedback_mode: ground_truth_feedback
    enabled: true

  heuristic:
    id: heuristic
    aliases: [heuristic_baseline, rule_based]
    description: Heuristic rule-based method without neural adaptation.
    feedback_mode: null
    enabled: true

  roberta:
    id: roberta
    aliases: [roberta_base, roberta_large, discriminative_lm]
    description: RoBERTa discriminative baseline for answer selection.
    feedback_mode: null
    adapter_size: 0.125
    enabled: true

  fine_tuning:
    id: fine_tuning
    aliases: [full_fine_tuning, sft, supervised_ft]
    description: Full supervised fine-tuning of a smaller open-source model.
    feedback_mode: ground_truth_feedback
    enabled: true

  lora:
    id: lora
    aliases: [LoRA, low_rank_adaptation, peft_lora]
    description: LoRA parameter-efficient fine-tuning (PEFT).
    feedback_mode: ground_truth_feedback
    enabled: true

  sft_lora:
    id: sft_lora
    aliases: [SFT-LoRA, sft_with_lora]
    description: SFT combined with LoRA adaptation.
    feedback_mode: ground_truth_feedback
    adapter_size: 0.1
    enabled: true

  azure_sft:
    id: azure_sft
    aliases: [azure_fine_tune, azure_lora, azure_openai_sft]
    description: Azure OpenAI supervised fine-tuning (black-box fine-tuning baseline).
    feedback_mode: ground_truth_feedback
    provider: azure
    enabled: true

  mlm:
    id: mlm
    aliases: [masked_language_model, mlm_loss]
    description: Masked language model loss ablation (vs. ranking NCE).
    feedback_mode: ground_truth_feedback
    enabled: true

  bbox_adapter:
    id: bbox_adapter
    aliases: [BBOX-ADAPTER, BBox-Adapter, ADAPTER, LLM_Adaptation]
    description: BBox-Adapter full method (energy model + ranking NCE + online adaptation).
    feedback_mode: ai_feedback
    adapter_size: 0.1
    beam_size: 5
    iteration_count: 4
    batch_size: 128
    enabled: true

  ranking_nce:
    id: ranking_nce
    aliases: [nce_loss, nce_ranking, contrastive_nce]
    description: Ranking NCE loss ablation (core BBox-Adapter loss function).
    feedback_mode: ai_feedback
    enabled: true

  online_adaptation:
    id: online_adaptation
    aliases: [online_train, iterative_adaptation]
    description: Online iterative adaptation loop (paper Algorithm 1).
    feedback_mode: ai_feedback
    iteration_count: 4
    enabled: true

  single_step_inference:
    id: single_step_inference
    aliases: [greedy_inference, one_shot_inference]
    description: Single-step inference without iterative refinement (iteration_count=0).
    feedback_mode: null
    iteration_count: 0
    beam_size: 1
    enabled: true

  full_step_inference:
    id: full_step_inference
    aliases: [beam_inference, adapted_inference]
    description: Full multi-step adapted inference with beam reranking.
    feedback_mode: ai_feedback
    iteration_count: 4
    beam_size: 5
    enabled: true

  ground_truth_feedback:
    id: ground_truth_feedback
    aliases: [gt_feedback, gold_labels]
    description: Training with direct ground-truth label comparison.
    feedback_mode: ground_truth
    enabled: true

  ai_feedback:
    id: ai_feedback
    aliases: [llm_judge_feedback, judge_feedback, ai_reward]
    description: Training with AI judge LLM as reward signal.
    feedback_mode: ai_feedback
    enabled: true

  energy_based_model:
    id: energy_based_model
    aliases: [EBM, energy_model, energy_head]
    description: Energy-based model component of BBox-Adapter.
    enabled: true

  combined_feedback:
    id: combined_feedback
    aliases: [mixed_feedback, hybrid_feedback]
    description: Combined ground-truth and AI feedback training signal.
    feedback_mode: combined
    enabled: true

# ============================================================
# Parameter sweep registry
# Paper evidence: beam_size [1,3,5], iteration_count [0,1,2,3,4],
#                 adapter_size [0.1,0.3], temperature, batch_size [64,128]
# ============================================================
sweep_registry:
  beam_size:
    parameter: beam_size
    values: [1, 3, 5]
    default: 5
    description: Number of candidate responses sampled per query (sentence-level beam).

  iteration_count:
    parameter: iteration_count
    values: [0, 1, 2, 3, 4]
    default: 4
    description: Number of online adaptation iterations (0 = base model, no training).

  adapter_size:
    parameter: adapter_size
    values: [0.1, 0.3]
    unit: billions_params
    default: 0.1
    description: Adapter (small LM) parameter count in billions.

  temperature:
    parameter: temperature
    values: [0.5, 0.7, 0.9, 1.0]
    default: 1.0
    description: Sampling temperature for black-box LLM candidate generation.

  batch_size:
    parameter: batch_size
    values: [64, 128]
    anchors:
      batch_size_64: 64
      batch_size_128: 128
    default: 128
    description: Training batch size; 128 is primary anchor from paper Table 4.

# ============================================================
# Protocol matrix: experiments × environments × methods × artifacts
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_open_source.py
# ============================================================
protocol_matrix:
  main_comparison:
    experiment_id: main_comparison
    description: >
      Main accuracy comparison of BBox-Adapter vs all baselines across four QA benchmarks.
      Paper Table 2 (with GPT-3.5-turbo), Table 10 (alternative models).
    environments:
      - gsm8k
      - strategyqa
      - truthfulqa
      - scienceqa
    methods:
      - ours
      - chain_of_thought
      - oracle
      - heuristic
      - roberta
      - fine_tuning
      - lora
      - sft_lora
      - azure_sft
      - mlm
      - bbox_adapter
    measurements:
      - metric: accuracy
        unit: percent
      - metric: training_cost
        unit: usd
      - metric: inference_cost
        unit: usd
      - metric: standard_deviation
        unit: percent
    artifact_paths:
      - results/metrics.json
      - results/online_adaptation_log.json

  plug_and_play:
    experiment_id: plug_and_play
    description: >
      Plug-and-play transfer: adapter trained on one LLM, evaluated with another.
      Paper Table 3: GPT-3.5-turbo adapter → Mixtral-8x7B-v0 inference.
    environments:
      - gsm8k
      - strategyqa
      - truthfulqa
      - scienceqa
    methods:
      - bbox_adapter
      - chain_of_thought
    generator_models:
      - gpt35_turbo
      - mixtral_8x7b
      - davinci_002
    measurements:
      - metric: accuracy
        unit: percent
    artifact_paths:
      - results/metrics.json

  ablation_adapter_size:
    experiment_id: ablation_adapter_size
    description: >
      Adapter size ablation: 0.1B vs 0.3B parameter adapter on StrategyQA and GSM8K.
      Paper Table 2 ablation rows.
    environments:
      - strategyqa
      - gsm8k
    methods:
      - bbox_adapter
    sweep:
      parameter: adapter_size
      values: [0.1, 0.3]
    measurements:
      - metric: accuracy
        unit: percent
    artifact_paths:
      - results/metrics.json
      - results/online_adaptation_log.json

  ablation_batch_size:
    experiment_id: ablation_batch_size
    description: >
      Batch size ablation: 64 vs 128 on StrategyQA.
      Paper Table 4 cost/accuracy tradeoff analysis.
    environments:
      - strategyqa
    methods:
      - bbox_adapter
    sweep:
      parameter: batch_size
      values: [64, 128]
      anchors:
        batch_size_64: 64
        batch_size_128: 128
    measurements:
      - metric: accuracy
        unit: percent
      - metric: training_cost
        unit: usd
    artifact_paths:
      - results/metrics.json
      - results/positive_negative_curves.json

  cost_efficiency:
    experiment_id: cost_efficiency
    description: >
      Training cost, inference cost, API cost, memory usage, GPU memory
      comparison across methods. Paper Table 4 (cost), Table 6 (VRAM).
    environments:
      - strategyqa
      - gsm8k
    methods:
      - ours
      - azure_sft
      - sft_lora
      - bbox_adapter
      - chain_of_thought
    measurements:
      - metric: training_cost
        unit: usd
      - metric: inference_cost
        unit: usd
      - metric: api_cost
        unit: usd
      - metric: memory_usage
        unit: gb
      - metric: gpu_memory
        unit: gb
      - metric: accuracy
        unit: percent
    artifact_paths:
      - results/cost_vram_report.json
      - results/metrics.json

  toxicity_reduction:
    experiment_id: toxicity_reduction
    description: >
      Toxicity reduction experiment on ToxiGen. BBox-Adapter with AI feedback
      vs base model and SFT-LoRA baseline. Paper Table 7.
      reference_grounding: paperbench_ref_005 toxigen/utils.py
    environments:
      - toxigen
    methods:
      - ours
      - bbox_adapter
      - sft_lora
      - chain_of_thought
    measurements:
      - metric: toxicity
        unit: hate_speech_rate_percent
      - metric: toxicity_probability
        unit: probability
    artifact_paths:
      - results/metrics.json

  nce_vs_mlm:
    experiment_id: nce_vs_mlm
    description: >
      Ablation comparing ranking NCE loss vs MLM loss for adapter training.
      Paper Table 5.
    environments:
      - strategyqa
      - gsm8k
    methods:
      - ranking_nce
      - mlm
    measurements:
      - metric: accuracy
        unit: percent
    artifact_paths:
      - results/metrics.json

  iteration_beam_sweep:
    experiment_id: iteration_beam_sweep
    description: >
      StrategyQA accuracy vs iteration count and beam size. Paper Figure 3.
      Shows achieving improvements with more iterations and larger beam.
    environments:
      - strategyqa
    methods:
      - bbox_adapter
    sweep_iteration:
      parameter: iteration_count
      values: [0, 1, 2, 3, 4]
    sweep_beam:
      parameter: beam_size
      values: [1, 3, 5]
    measurements:
      - metric: accuracy
        unit: percent
    artifact_paths:
      - results/positive_negative_curves.json
      - results/online_adaptation_log.json

# ============================================================
# Artifact paths (canonical output paths for this config)
# ============================================================
artifacts:
  training_log: logs/training.log
  adaptation_log: results/online_adaptation_log.json
  pos_neg_curves: results/positive_negative_curves.json
  metrics: results/metrics.json
  cost_report: results/cost_vram_report.json
  environment_registry: results/environment_registry.json
  dataset_registry: results/dataset_registry.json
  data_manifest: results/data_manifest.json
  scope_report: results/scope_report.json
  readiness: readiness.json
  evaluation_result: evaluation_result.json

# ============================================================
# Evaluation configuration
# reference_grounding: paperbench_ref_006 MMLU/run_mmlu_llama.py
# Adapted from compute_metric: pred_answers vs gold_answers per-task accuracy
# ============================================================
evaluation:
  primary_metric: exact_match_binary
  secondary_metrics:
    - training_cost
    - inference_cost
    - standard_deviation
  evaluation_protocol:
    compute_per_task_accuracy: true   # adapted from run_mmlu_llama compute_metric
    aggregate_total_accuracy: true
    report_std: true
    # Paper reports mean ± std across 3 random seeds
    num_seeds: 3
    seed_values: [42, 43, 44]
  answer_normalization:
    lowercase: true
    strip_punctuation: true
    yes_synonyms: ["yes", "true", "correct", "1", "positive"]
    no_synonyms: ["no", "false", "incorrect", "0", "negative"]
  output_format: json

# ============================================================
# Experiment-level metadata for evidence traceability
# ============================================================
paper_evidence:
  experiment_table: [2, 3, 4, 5, 6]
  result_section: Main Results
  feedback_section: AI Feedback
  model_section: Black-Box LLMs
  cost_section: Cost Analysis
  std_section: Standard Deviation
  training_cost_section: Training Cost
  achieving_improvements_section: achieving improvements
  evaluation_details_section: Evaluation Details
  primary_llm: gpt-3.5-turbo
  transfer_llm: Mixtral-8x7B-v0
  adapter_sizes_reported: [0.1, 0.3]
