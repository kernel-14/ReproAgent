      Figure 4 row 2. FID target ~38.65 (paper reference).
    environment: ant_ddpm_ffhq
    method: ddpm
    target_domain: sunglasses
    shot_count: 10
    training_iterations: 300
    batch_size: 64
    use_similarity_guidance: false
    use_adversarial_noise: false
    adaptor: true
    adaptor_only: true
    artifact_path: results/metrics.json
    paper_figure: Figure4
