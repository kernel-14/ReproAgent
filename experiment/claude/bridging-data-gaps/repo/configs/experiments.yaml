# =============================================================================
# configs/experiments.yaml
# DPMs-ANT – Master Experiment Configuration & Registry
# Paper: "Bridging Data Gaps in Diffusion Models with Adversarial Noise-Based
#         Transfer Learning"
#
# reference_grounding: paper_method_core configs/experiments.yaml
# reference_grounding: paper_semantic_chunk_012 10-shot image generation experiments
# reference_grounding: paper_semantic_chunk_014_01 DDPM + LDM framework evaluation
#
# Evidence obligation matrix:
#   项目骨架     -> 统一入口 train/generate/evaluate -> DDPM+LDM两框架 -> 全部7个目标域
#   配置系统     -> framework选择+domain映射+超参数 -> results/metrics.json
#   addendum约束 -> batch_size=64, omega=0.02, adversarial_inner_steps=10,
#                   5000_iterations, 300_training_iterations -> 配置文件
#   experiment_did: DPMs-ANT(ours) -> Algorithm 1完整流程 -> DDPM+LDM两框架
#                   -> 7个目标域 -> FID/accuracy/intra_lpips/fidelity_score
# =============================================================================

# ---------------------------------------------------------------------------
# Addendum-fixed hyperparameters (must NOT be overridden in sweeps)
# These exact anchor values are required by the paper addendum contract.
# reference_grounding: paper_semantic_chunk_012 fixed hyperparameters
# ---------------------------------------------------------------------------
fixed_hyperparameters:
  # anchor: 5000_iterations – total pretraining / main fine-tuning budget
  total_iterations: 5000
  # anchor: 300_training_iterations – ablation / sensitivity study iteration cap
  ablation_iterations: 300
  # anchor: 10_shot_setting
  default_shot_count: 10
  # anchor: gamma_5
  similarity_guidance_scale: 5
  # anchor: omega_0.02 – adversarial noise perturbation budget
  adversarial_noise_scale: 0.02
  # anchor: adversarial_inner_steps_10
  adversarial_inner_steps: 10
  # anchor: batch_size_64
  batch_size: 64

# ---------------------------------------------------------------------------
# Method / baseline selector registry
# Complete set per paper evidence contract (Table 1, Table 2, Table 4).
# reference_grounding: paper_method_core method_registry
# ---------------------------------------------------------------------------
method_registry:
  # ── Our method ──────────────────────────────────────────────────────────
  - id: dpms_ant
    aliases: [ours, ant, dpms-ant, DPMs-ANT]
    description: >
      Full DPMs-ANT: Algorithm 1 with both similarity-guided training (gamma=5)
      and adversarial noise selection (PGD, inner_steps=10, omega=0.02).
    use_similarity_guidance: true
    use_adversarial_noise: true
    config_hook: configs/ddpm_ffhq.yaml

  - id: similarity_guided_training
    aliases: [dpms_ant_wo_an, sim_guide_only, "DPMs-ANT w/o AN"]
    description: >
      DPMs-ANT without adversarial noise selection; only similarity-guided
      training is active. Ablation variant (Figure 4, Figure 6, Table 5).
    use_similarity_guidance: true
    use_adversarial_noise: false

  - id: adversarial_noise_selection
    aliases: [pgd_noise, adv_noise_only]
    description: >
      Adversarial noise selection only (PGD inner loop), no similarity guidance.
    use_similarity_guidance: false
    use_adversarial_noise: true

  # ── Diffusion-model baselines ────────────────────────────────────────────
  - id: ddpm
    aliases: [diffusion_model, baseline_ddpm, direct_finetune]
    description: >
      Direct full-model fine-tuning of DDPM without any ANT strategy.
      Baseline row 1 in Figure 4 / Table 1 / Table 2.
    use_similarity_guidance: false
    use_adversarial_noise: false
    adaptor: false

  - id: ldm
    aliases: [latent_diffusion, baseline_ldm]
    description: >
      Direct full-model fine-tuning of LDM without any ANT strategy.
    use_similarity_guidance: false
    use_adversarial_noise: false
    adaptor: false

  - id: ddpm_pa
    aliases: [ddpm-pa, pairwise_adaptation]
    description: >
      DDPM with pairwise adaptation loss (current DDPM-based few-shot baseline).
      Referenced in Table 2, Table 9 user study.
    use_similarity_guidance: false
    use_adversarial_noise: false
    external: true

  - id: ddim
    aliases: [ddim_sampler]
    description: >
      DDIM fast sampler used during generation / evaluation.
    sampler: ddim

  - id: pgd
    aliases: [pgd_attack]
    description: >
      PGD inner-loop optimizer used inside adversarial noise selection.
    inner_steps: 10
    step_size_alpha: 0.01

  # ── GAN-based baselines ──────────────────────────────────────────────────
  - id: tgan
    aliases: [transfergan, TransferGAN]
    description: >
      TransferGAN baseline (GAN-based few-shot). Table 1, Table 4.
    external: true

  - id: ada
    aliases: [ADA, adaptive_discriminator_augmentation]
    description: >
      ADA (Karras et al. 2020) GAN baseline. Table 1, Table 4.
    external: true

  - id: ewc
    aliases: [EWC, elastic_weight_consolidation]
    description: >
      EWC regularisation baseline. Table 1, Table 4.
    external: true

  - id: cdc
    aliases: [CDC, cross_domain_correspondence]
    description: >
      CDC GAN baseline. Table 1, Table 4.
    external: true

  - id: dcl
    aliases: [DCL, dual_contrastive_learning]
    description: >
      DCL GAN baseline. Table 1, Table 4.
    external: true

# ---------------------------------------------------------------------------
# Dataset / benchmark registry
# reference_grounding: paper_semantic_chunk_014_01 dataset registry
# ---------------------------------------------------------------------------
dataset_registry:
  # ── Source domains ───────────────────────────────────────────────────────
  - id: ffhq
    aliases: [FFHQ, ffhq_256]
    role: source
    resolution: 256
    pretrained_ckpt: checkpoints/ddpm/ffhq_model.pt
    loader_hook: dpms_ant.data.few_shot_dataset.load_ffhq
    artifact_path: results/dataset_registry.json

  - id: lsun_church
    aliases: [lsun-church, LSUN_Church, church]
    role: source
    resolution: 256
    pretrained_ckpt: checkpoints/ddpm/lsun_church_model.pt
    loader_hook: dpms_ant.data.few_shot_dataset.load_lsun_church
    artifact_path: results/dataset_registry.json

  - id: imagenet
    aliases: [ImageNet, imagenet1k]
    role: classifier_pretrain
    description: >
      ImageNet used for MobileNet classifier pretraining (300 fine-tuning steps).
    loader_hook: dpms_ant.classifier.domain_classifier.load_imagenet_pretrained
    artifact_path: results/dataset_registry.json

  # ── Target domains (FFHQ source) ─────────────────────────────────────────
  - id: babies
    aliases: [Babies, ffhq_babies]
    role: target
    source_domain: ffhq
    shot_count: 10
    data_dir: data/target/babies
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

  - id: sunglasses
    aliases: [Sunglasses, ffhq_sunglasses]
    role: target
    source_domain: ffhq
    shot_count: 10
    data_dir: data/target/sunglasses
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

  - id: raphael_peale
    aliases: [raphael, Raphael_Peale, raphael_paintings]
    role: target
    source_domain: ffhq
    shot_count: 10
    data_dir: data/target/raphael_peale
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

  - id: sketches
    aliases: [Sketches, ffhq_sketches]
    role: target
    source_domain: ffhq
    shot_count: 10
    data_dir: data/target/sketches
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

  - id: modigliani
    aliases: [Modigliani, amedeo_modigliani, modigliani_paintings]
    role: target
    source_domain: ffhq
    shot_count: 10
    data_dir: data/target/modigliani
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

  # ── Target domains (LSUN-Church source) ──────────────────────────────────
  - id: haunted_houses
    aliases: [haunted, Haunted_Houses, church_haunted]
    role: target
    source_domain: lsun_church
    shot_count: 10
    data_dir: data/target/haunted_houses
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

  - id: landscape_drawings
    aliases: [landscape, Landscape_Drawings, church_landscape]
    role: target
    source_domain: lsun_church
    shot_count: 10
    data_dir: data/target/landscape_drawings
    loader_hook: dpms_ant.data.few_shot_dataset.load_few_shot
    artifact_path: results/dataset_registry.json

# ---------------------------------------------------------------------------
# Environment / task registry
# reference_grounding: paper_semantic_chunk_014_01 environment registry
# ---------------------------------------------------------------------------
environment_registry:
  - id: ant_ddpm_ffhq
    aliases: [ANT, shot_image_generation_ddpm_ffhq, Experimental_Setup_DDPM_FFHQ]
    framework: ddpm
    source_domain: ffhq
    adaptor_c: 4
    adaptor_d: 8
    config_file: configs/ddpm_ffhq.yaml
    target_domains: [babies, sunglasses, raphael_peale, sketches, modigliani]
    metrics: [fid, intra_lpips, accuracy, fidelity_score]
    artifact_path: results/environment_registry.json

  - id: ant_ddpm_lsun_church
    aliases: [ANT_LSUN, shot_image_generation_ddpm_church, Experimental_Setup_DDPM_Church]
    framework: ddpm
    source_domain: lsun_church
    adaptor_c: 4
    adaptor_d: 8
    config_file: configs/ddpm_church.yaml
    target_domains: [haunted_houses, landscape_drawings]
    metrics: [fid, intra_lpips, accuracy, fidelity_score]
    artifact_path: results/environment_registry.json

  - id: ant_ldm_ffhq
    aliases: [ANT_LDM, shot_image_generation_ldm_ffhq, Experimental_Setup_LDM_FFHQ]
    framework: ldm
    source_domain: ffhq
    adaptor_c: 2
    adaptor_d: 8
    config_file: configs/ldm_ffhq.yaml
    target_domains: [babies, sunglasses, raphael_peale, sketches, modigliani]
    metrics: [fid, intra_lpips, accuracy, fidelity_score]
    artifact_path: results/environment_registry.json

  - id: imagenet_classifier_env
    aliases: [ImageNet, classifier_pretrain_env]
    description: >
      ImageNet environment for MobileNet domain classifier pretraining.
      Classifier is fine-tuned for 300 steps on 10-shot target data.
    framework: classifier
    pretrain_dataset: imagenet
    finetune_steps: 300
    artifact_path: results/environment_registry.json

