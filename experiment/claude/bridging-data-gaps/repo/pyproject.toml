[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dpms-ant"
version = "0.1.0"
description = "DPMs-ANT: Bridging Data Gaps in Diffusion Models with Adversarial Noise-Based Transfer Learning"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "DPMs-ANT Reproduction Authors" }
]
keywords = [
    "diffusion-models",
    "transfer-learning",
    "adversarial-noise",
    "few-shot",
    "ddpm",
    "ldm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# ---------------------------------------------------------------------------
# Core lightweight dependencies (always installed; no GPU/simulator required)
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.23",
    "pyyaml>=6.0",
    "tqdm>=4.64",
    "einops>=0.6",
    "omegaconf>=2.3",
    "pillow>=9.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Training + evaluation: GPU-accelerated, heavy optional stack
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "accelerate>=0.20",
    "diffusers>=0.18",
    "transformers>=4.30",
    "timm>=0.9",
    "lpips>=0.1.4",
    "clean-fid>=0.1.35",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
# Evaluation-only: slightly lighter than full train stack
eval = [
    "torch>=2.0",
    "torchvision>=0.15",
    "lpips>=0.1.4",
    "clean-fid>=0.1.35",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "timm>=0.9",
]
# Plotting / reporting
plot = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
]
# Development / testing
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
# Full installation combining all optional groups
all = [
    "torch>=2.0",
    "torchvision>=0.15",
    "accelerate>=0.20",
    "diffusers>=0.18",
    "transformers>=4.30",
    "timm>=0.9",
    "lpips>=0.1.4",
    "clean-fid>=0.1.35",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
# Canonical entry points mirroring the CLI contract
dpms-ant-train    = "train:cli_main"
dpms-ant-generate = "generate:cli_main"
dpms-ant-evaluate = "evaluate:cli_main"
dpms-ant-sample   = "sample:cli_main"

[project.urls]
"Paper"      = "https://arxiv.org/abs/2309.XXXXX"
"Repository" = "https://github.com/repro/dpms-ant"

# ---------------------------------------------------------------------------
# Setuptools package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["."]
include = ["dpms_ant*", "src*", "configs*"]
exclude = ["tests*", "results*", "checkpoints*", "data*"]

[tool.setuptools.package-data]
"configs" = ["*.yaml"]
"dpms_ant" = ["py.typed"]

# ---------------------------------------------------------------------------
# Black formatter
# ---------------------------------------------------------------------------
[tool.black]
line-length    = 100
target-version = ["py38", "py39", "py310", "py311"]

# ---------------------------------------------------------------------------
# Ruff linter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts         = "-v --tb=short"
filterwarnings  = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.8"
ignore_missing_imports = true
warn_return_any        = false