# =============================================================================
# Parameter Sweeps - Bounded Config Values
# reference_grounding: paperbench_ref_006 eval_inat21_truncate.ipynb
# =============================================================================
parameter_sweeps:
  clustering:
    description: "Hierarchical clustering parameters for latent taxonomy construction"
    num_layers:
      values: [2, 3]
      default: 2
      paper_usage: "Table 6: Ablation on hierarchy depth"
    clusters_per_layer:
      root_clusters:
        values: [5, 10, 20]
        default: 10
        paper_usage: "Table 6: Root level cluster count"
      intermediate_clusters:
        values: [50, 100]
        default: 50
        paper_usage: "Table 6: Intermediate level cluster count (3-layer only)"
      leaf_clusters:
        values: [100, 200, 500, 1000]
        default: 100
        paper_usage: "Table 6: Leaf level cluster count"
    clustering_algorithm:
      values: [kmeans, hierarchical_agglomerative]
      default: kmeans
      
  soft_labeling:
    description: "Soft label training hyperparameters"
    temperature:
      values: [0.5, 1.0, 2.0, 4.0]
      default: 1.0
      paper_usage: "Table 9: Ablation on temperature parameter"
    lca_loss_weight:
      values: [0.0, 0.1, 0.3, 0.5, 0.7, 1.0]
      default: 0.5
      paper_usage: "Table 9: Ablation on loss weight λ"
    hierarchy_source:
      values: [wordnet, latent_kmeans, latent_agglomerative]
      default: wordnet
      paper_usage: "Table 5 vs Table 6: WordNet vs latent hierarchies"
    soft_label_type:
      values: [lca_distance, uniform_ancestors, exponential_decay]
      default: lca_distance
      paper_usage: "Table 9: Different soft label formulations"
      
  training:
    description: "General training hyperparameters"
    batch_size:
      values: [32, 64, 128, 256]
      default: 128
    learning_rate:
      values: [0.00001, 0.0001, 0.001, 0.01]
      default: 0.001
    epochs:
      values: [10, 30, 90]
      default: 30
    optimizer:
      values: [sgd, adam, adamw]
      default: sgd
    adamw_betas:
      values:
        - [0.9, 0.95]
      default: [0.9, 0.95]
      contract_key: fixed_hyperparameters=adamw_betas_0.9_0.95
      
  evaluation:
    description: "Evaluation configuration"
    batch_size: 256
    num_workers: 4
    metrics: [top1, top5, lca_distance]

# =============================================================================
# Experiment Configurations
# =============================================================================
experiments:
  lca_ood_correlation:
    name: "ID LCA vs OOD Accuracy Correlation"
    description: "Measure correlation between ID LCA distance and OOD Top-1 accuracy"
    datasets:
      id: imagenet
      ood: [imagenet_v2, imagenet_c, imagenet_r, imagenet_sketch, objectnet]
    models:
      vision_models: 36
      vision_language_models: 39
    metrics: [lca_distance, top1_accuracy, correlation_r2, correlation_spearman]
    artifacts:
      - results/figures/figure1_lca_on_the_line.pdf
      - results/tables/table2_correlation.json
      - results/lca_ood_correlation.json
      
  soft_label_training:
    name: "Soft Label Training with Hierarchies"
    description: "Train models with hierarchical soft labels"
    base_models: [resnet18, resnet50, vit_b_16]
    hierarchies: [wordnet, latent_2layer, latent_3layer]
    hyperparameters:
      temperature: [0.5, 1.0, 2.0]
      lca_weight: [0.1, 0.3, 0.5, 0.7]
    artifacts:
      - results/tables/table5_soft_labels_wordnet.json
      - results/tables/table6_soft_labels_latent.json
      - results/tables/table9_ablation.json
      - checkpoints/resnet18_soft_labels.pth
      
  latent_hierarchy_construction:
    name: "Latent Hierarchy Construction via K-means"
    description: "Construct latent hierarchies from model embeddings"
    source_models: [resnet50, vit_b_16, clip_vit_b_32]
    clustering_configs:
      two_layer:
        num_layers: 2
        clusters: [10, 100]
      three_layer:
        num_layers: 3
        clusters: [10, 50, 100]
    artifacts:
      - results/latent_taxonomy.json
      - results/tables/table10_hierarchy_quality.json

# =============================================================================
# Output Paths
# =============================================================================
paths:
  data_root: data
  results_root: results
  checkpoints_root: checkpoints
  cache_root: cache
  
  figures:
    figure1: results/figures/figure1_lca_on_the_line.pdf
    figure2: results/figures/figure2_comparison.pdf
    figure3: results/figures/figure3_lca_distance.pdf
    figure5: results/figures/figure5_ood_correlation.pdf
    
  tables:
    table1: results/tables/table1_model_performance.json
    table2: results/tables/table2_correlation.json
    table3: results/tables/table3_prediction_mae.json
    table5: results/tables/table5_soft_labels_wordnet.json
    table6: results/tables/table6_soft_labels_latent.json
    table9: results/tables/table9_ablation.json
    table10: results/tables/table10_hierarchy_quality.json
    
  metrics:
    lca_ood_correlation: results/lca_ood_correlation.json
    latent_taxonomy: results/latent_taxonomy.json
    sensitivity_report: results/sensitivity_report.json
    
  resolved_config: results/config_resolved.json
  readiness: results/readiness.json
  evaluation_result: results/evaluation_result.json

# =============================================================================
# Runtime Configuration
# =============================================================================