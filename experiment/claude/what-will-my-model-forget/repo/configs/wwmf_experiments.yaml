trend_obligations:
  reference_grounding: "paper_evidence_matrix paper.md"
  baseline_outperformance:
    id: "baseline_outperformance"
    comparison:
      primary_method: "ours"
      baselines: ["fixed_logit", "random_replay", "vanilla_ft"]
      expected_direction:
        f1: "higher"
        em_drop_percent: "lower"
      reporting_artifacts:
        - "results/tables/forecasting.json"
        - "results/tables/refinement.json"
        - "results/metrics.json"
    assertion_module: "src.trend_assertions"
    assertion_function: "assert_baseline_outperformance_when_real_results"
    dry_run_behavior: "record schema and comparison fields only"
  positive_parameter_improves:
    id: "positive_parameter_improves"
    parameters:
      - "gamma"
      - "similarity_guidance_scale"
    required_values:
      similarity_guidance_scale: [1, 10]
    expected_direction:
      f1: "non_decreasing_for_selected_positive_guidance_when_supported"
    reporting_artifacts:
      - "results/sensitivity_report.json"
    assertion_module: "src.trend_assertions"
    assertion_function: "assert_positive_parameter_improves_when_real_results"
    dry_run_behavior: "record bounded sweep rows only"

default_runtime_selection:
  mode: "runtime_smoke"
  protocols:
    - "training_and_evaluation_setup"
    - "forecasting_forgotten_examples_formulation"
    - "forecasting_forgotten_examples"
    - "out_of_domain_evaluation"
    - "improving_model_refinement_by_forecasting_forgetting"
    - "comparison_to_non_replay_model_refinement_methods"
    - "flop_count_comparison"
    - "learning_rate_sensitivity_for_continual_model_refinement"
  models:
    - "flan_t5_large"
  methods:
    forecasting:
      - "ours"
      - "trainable_logit"
      - "fixed_logit"
      - "ground_truth_feedback"
    refinement:
      - "fine_tuning"
      - "lora"
    replay:
      - "vanilla_ft"
      - "random_replay"
      - "forecasted_forgotten_replay"
      - "ground_truth_forgotten_replay"
    appendix:
      - "mend_lora"
  dry_run_limits:
    upstream_examples: 12
    refinement_examples: 4
    learning_rate_rows: ["1e-4", "1e-5", "2e-6"]
    similarity_guidance_scale: [1, 10]
    gamma: [1.0]
  all_declared_artifacts_must_be_materialized: true

full_runtime_selection:
  mode: "full"
  dry_run: false
  full_protocol_entrypoint: "wwmf.paper_protocol.run_all_paper_protocols"
  rubric_facing_protocol_module: "wwmf.paper_protocol"
  protocols_selectable:
    - "forecasting_forgotten_examples"
    - "out_of_domain_evaluation"
    - "improving_model_refinement_by_forecasting_forgetting"
    - "comparison_to_non_replay_model_refinement_methods"
    - "flop_count_comparison"
    - "learning_rate_sensitivity_for_continual_model_refinement"
  full_table_writers:
    - "wwmf.full_protocol.write_table_1"
    - "wwmf.full_protocol.write_table_2"
    - "wwmf.full_protocol.write_table_3"
    - "wwmf.full_protocol.write_table_4"
    - "wwmf.full_protocol.write_figure_3"
  requires_explicit_protocol: true
  data_validation_required: true
  checkpoint_validation_required: true

tests_contract:
  smoke_tests:
    - "tests/test_protocol_smoke.py"
    - "tests/test_contracts.py"
  expected_config_checks:
    - "MEND comparison is registered only for LoRA fine-tuning"
    - "MEND has with/without forgetting objective ablation"
    - "learning_rate sweep row names are exactly 1e-4, 1e-5, 2e-6"
    - "Table 9 columns are exactly Succ. and EM Drop %"
    - "FLOP comparison rows include Representation, Trainable Logit, Ground Truth"
    - "required method selectors include ours, t5, fine_tuning, lora, ground_truth_feedback"
    - "similarity_guidance_scale values include 1 and 10"
    - "dry-run route writes readiness.json and evaluation_result.json"
