protocol_matrix:
  reference_grounding: "paper:paper_named_experiment_protocols paper.md"
  matrix_artifact: "results/protocol_matrix.json"
  rows:
    - obligation: "front_matter / abstract"
      method: "black-box variational inference with a score-based divergence"
      environment_or_task: "jax_cpu"
      parameters:
        method_selector: "ours"
      trends:
        - "method and metric artifacts are emitted"
      artifacts:
        - "results/metrics.json"
        - "results/summary.csv"
        - "results/traces.jsonl"

    - obligation: "paper/addendum contract"
      method: "executable repository surface"
      environment_or_task: "runtime_smoke"
      parameters:
        dataset_prepare_validate_path: "src/data/data.py:prepare_validate_dataset"
        artifact_writer_path: "evaluation/report.py:write_experiment_report"
      trends:
        - "structured artifacts are materialized in smoke modes"
      artifacts:
        - "results/artifact_manifest.json"
        - "results/readiness.json"
        - "results/evaluation_result.json"

    - obligation: "environment protocol"
      method: "JAX CPU/GPU plus CIFAR-compatible data surface"
      environment_or_task: "jax_cpu_or_jax_gpu"
      parameters:
        dataset: "cifar"
      trends:
        - "config echo and run summary record selected backend"
      artifacts:
        - "results/config_echo.json"
        - "results/run_summary.json"
        - "results/environment_registry.json"

    - obligation: "Section 3.1 Algorithm Batch Step"
      method: "BaM"
      environment_or_task: "score_target"
      parameters:
        samples: "z_1,...,z_B ~ q_t"
        scores: "g_b = grad log p(z_b)"
        statistics:
          - "zbar"
          - "C"
          - "gbar"
          - "Gamma"
      trends:
        - "batch statistics trace exists"
      artifacts:
        - "results/batch_statistics_trace.json"
        - "results/traces.jsonl"

    - obligation: "Section 3.1 Algorithm Match Step"
      method: "BaM"
      environment_or_task: "full_covariance_gaussian_variational_family"
      parameters:
        objective: "regularized matching objective with KL regularizer"
        updates:
          - "mu"
          - "Sigma"
        lambda: 0.1
        epsilon: 0.001
      trends:
        - "optimizer trace records KL-regularized update"
      artifacts:
        - "results/bam_trace.json"
        - "results/bam_final_variational_params.npz"

    - obligation: "Section 3.2 / main result"
      method: "Gaussian target B->infinity convergence analysis"
      environment_or_task: "synthetic_gaussian"
      parameters:
        batch_size: "infinite_analysis"
        iteration_count: 100
      trends:
        - "convergence report records mean/covariance sanity metrics"
      artifacts:
        - "results/gaussian_sanity_metrics.json"
        - "results/convergence_report.json"

    - obligation: "contract fixed_hyperparameters"
      method: "bounded training loop"
      environment_or_task: "jax_cpu"
      parameters:
        100_iterations: 100
        batch_size_32: 32
      trends:
        - "run summary preserves fixed hyperparameter anchors"
      artifacts:
        - "results/run_summary.json"
        - "results/config.json"

    - obligation: "Section 5.1"
      method: "Gaussian targets with increasing D"
      environment_or_task: "synthetic_target_protocol"
      parameters:
        dimensions: [4, 16, 64, 256]
      trends:
        - "KL evaluation inputs are available"
      artifacts:
        - "results/synthetic_kl_metrics.json"
        - "results/summary.csv"

    - obligation: "Section 5.1"
      method: "controlled non-Gaussianity"
      environment_or_task: "synthetic_target_protocol"
      parameters:
        p: [0, 1, 2, 4]
      trends:
        - "robustness comparison inputs are available"
      artifacts:
        - "results/synthetic_kl_metrics.json"
        - "results/protocol_matrix.json"

    - obligation: "Section 5.2"
      method: "posterior p(z|{x_n}) proportional to p(z)p({x_n}|z)"
      environment_or_task: "hierarchical_bayesian_protocol"
      parameters:
        posterior_slots: 3
      trends:
        - "posterior score interface is registered"
      artifacts:
        - "results/hierarchical_metrics.json"
        - "results/traces.jsonl"

    - obligation: "Section 5.3"
      method: "deep generative model z_n and x_n|z_n"
      environment_or_task: "deep_generative_latent_posterior_protocol"
      parameters:
        dataset_protocol: "high_dimensional_images_unspecified"
      trends:
        - "latent posterior score and deep-generative artifacts are registered"
      artifacts:
        - "results/deep_generative_metrics.json"
        - "results/deep_generative_latent_params.npz"

    - obligation: "addendum/contract dataset inventory"
      method: "cifar dataset prepare/validate"
      environment_or_task: "cifar"
      parameters:
        dataset_prepare_validate_path: "src/data/data.py:prepare_validate_dataset"
      trends:
        - "dataset validation artifact exists"
      artifacts:
        - "results/data_manifest.json"

hypothesis_and_decision_protocol:
  core_contribution_hypothesis: "A score-based Batch-and-Match update with KL-regularized matching can reproduce the paper's VI comparison surface using target scores without target normalization constants."
  decisive_comparison: "BaM/ours versus ADVI and GSM under the named Section 5.1, 5.2, 5.3, Figure 5.3, and CIFAR contract protocols."
  decisive_metrics:
    - "forward_kl"
    - "reverse_kl"
    - "score_divergence"
    - "loss"
    - "mse"
    - "accuracy"
  stop_rule_or_pruning_rationale: "Default execution is bounded to smoke/runtime validation and one representative value per sweep. Full paper-scale grids require explicit full mode; no unbounded sweeps or unrelated ablations are run by default."

