validation_rules:
  import_light:
    optional_heavy_dependencies_are_lazy: true
    no_top_level_dataset_or_gpu_imports: true
  artifact_closure:
    runtime_smoke_creates_declared_artifacts: true
    docker_validate_creates_declared_artifacts: true
    dry_run_artifacts_must_not_claim_results: true
  method_selector_coverage:
    required:
      - "ours"
      - "baseline"
      - "BaM"
      - "ADVI"
      - "GSM"
      - "BBVI"
      - "KL"
      - "ELBO"
      - "CLI"
      - "SPP"
      - "EM"
  experiment_protocol_coverage:
    required:
      - "5_experiments"
      - "5_1_synthetically_constructed_target_distributions"
      - "5_2_hierarchical_bayesian_models"
      - "5_3_deep_generative_model"
      - "addendum_cifar_contract_protocol"
      - "gaussian_target_sanity_check"
      - "b32_training_setting"
  sweep_coverage:
    required_parameters:
      - "lambda"
      - "epsilon"
      - "learning_rate"
      - "batch_size"
      - "iteration_count"
      - "p"
      - "lora_rank"
    required_values:
      iteration_count:
        - 0
        - 100
      batch_size:
        - 32
      p:
        - 0
  fixed_anchor_coverage:
    required:
      - "100_iterations"
      - "batch_size_32"