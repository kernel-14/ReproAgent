    table_9:
      id: "table_9"
      canonical_id: "artifact_table_9"
      path: "results/tables/table_9.csv"
    figure_4:
      id: "figure_4"
      canonical_id: "artifact_figure_4"
      path: "results/figures/figure_4.png"
    figure_5:
      id: "figure_5"
      canonical_id: "artifact_figure_5"
      path: "results/figures/figure_5.png"
    table_10:
      id: "table_10"
      canonical_id: "artifact_table_10"
      path: "results/tables/table_10.csv"
    figure_5a:
      id: "figure_5a"
      canonical_id: "artifact_figure_5a"
