# reference_grounding: paper:unit_004 (chunk_015)
# Active route closure: wire symbols
# These are used by the runner to call the correct implementations.
registry_hooks:
  loss_fn: "src.apt.engine.trainer.compute_loss"
  agg_loss_fn: "src.apt.engine.trainer.aggregate_loss"
  reward_fn: "src.apt.engine.trainer.compute_reward"
  agg_reward_fn: "src.apt.engine.trainer.aggregate_reward"
  objective_fn: "src.apt.engine.trainer.compute_ours_oradaptersby_inventory_objective"
  score_fn: "src.apt.engine.trainer.compute_ours_oradaptersby_inventory_score"
  wrapper_fn: "src.models.wrapper.build_wrapper"
  load_pipeline_fn: "src.apt.data.pipeline.load_pipeline"
  prepare_pipeline_fn: "src.apt.data.pipeline.prepare_pipeline"
  train_trainer_fn: "src.apt.engine.trainer.train_trainer"
  run_training_loop_fn: "src.apt.engine.trainer.run_training_loop"
  train_ours_fn: "src.apt.engine.trainer.train_ours_oradaptersby_inventory"

# reference_grounding: paper:unit_004 (chunk_015)
# Smoke mode configuration
smoke_mode:
  max_steps: 10
  batch_size: 2
  dataset_subset: 100
  active: true