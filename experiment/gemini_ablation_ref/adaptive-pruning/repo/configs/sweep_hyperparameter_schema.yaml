# reference_grounding: paper:paper_contract_sweep_hyperparameter_protocol (chunk_028, chunk_017, chunk_011)
# APT: Adaptive Pruning and Tuning Pretrained Language Models for Efficient Training and Inference.
# Sweep and Hyperparameter Schema Configuration

reproduction_scope:
  active: true
  notes: "Reproduction focuses on RoBERTa and T5 models. LLaMA models are configured but marked as non-mandatory for replication."
  seeds: [42, 123, 2024]

# reference_grounding: paper:unit_004 (chunk_015)
# selector set must include ours, bert, roberta, t5, fine_tuning, lora, test_time_adaptation.
# selectable method/baseline/variant factories for: FT, LoRA, LoRA+Prune, Co-tuning, LLM-Pruner
methods:
  ours:
    id: "apt"
    alias: "ours"
    hyperparameters:
      rank_init: 8
      scaling_factor: 2
      early_training_steps: 100 # t << T
  bert:
    id: "bert"
  roberta:
    id: "roberta"
  t5:
    id: "t5"
  fine_tuning:
    id: "ft"
    alias: "fine_tuning"
  lora:
    id: "lora"
  test_time_adaptation:
    id: "tta"
    alias: "test_time_adaptation"
  FT:
    id: "ft"
  LoRA:
    id: "lora"
  LoRA+Prune:
    id: "lora_prune"
  Co-tuning:
    id: "co_tuning"
  LLM-Pruner:
    id: "llm_pruner"
  # reference_grounding: paper:unit_016 (chunk_016)
  # Implement the CoFi baseline with LoRA and L0 module controls plus default hyperparameters.
  cofi:
    id: "cofi"
    use_lora: true
    use_l0: true
    hyperparameters:
      l0_lambda: 0.1
      distill_weight: 1.0

# reference_grounding: paper:unit_004 (chunk_015)
# factories for: unit-004 | t5 | llama commonsense | unit-005 | squad | glue | sst2
environments:
  unit-004:
    id: "unit-004"
    alias: "main_repro_env"
    availability_check: "src.apt.data.pipeline.check_env_available"
    config_hook: "configs/task_setup_factory.yaml"
