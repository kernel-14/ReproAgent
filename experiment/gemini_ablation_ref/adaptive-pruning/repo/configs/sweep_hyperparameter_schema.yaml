# reference_grounding: paper:paper_contract_sweep_hyperparameter_protocol (chunk_028)
# bounded sweep/config entries for batch_size.
# fixed hyperparameter anchors for 10_shot_setting, batch_size_128, batch_size_32.
sweeps:
  batch_size:
    values: [32, 128]
    default: 32
  settings:
    - "10_shot_setting"
  early_training_steps:
    values: [50, 100, 200]
    default: 100 # t << T

# reference_grounding: paper:paper_contract_sweep_hyperparameter_protocol (chunk_028)
# Implement measurement collection and result aggregation for: fidelity score; accuracy; runtime; training time
metrics:
  fidelity_score: {id: "fidelity score"}
  accuracy: {id: "accuracy"}
  runtime: {id: "runtime"}
  training_time: {id: "training time"}

