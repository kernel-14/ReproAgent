# reference_grounding: paper:paper_addendum_constraints addendum.md
# Reproduction configuration for APT: Adaptive Pruning and Tuning.

reproduction_scope:
  active: true
  notes: "Reproduction focuses on RoBERTa and T5 models as per addendum. LLaMA models are configured but marked as non-mandatory for replication."

# reference_grounding: paper:unit_004 (chunk_015)
# selector set must include ours, bert, roberta, t5, fine_tuning, lora, test_time_adaptation.
# selectable method/baseline/variant factories for: FT, LoRA, LoRA+Prune, Co-tuning, LLM-Pruner
methods:
  ours: 
    factory: "src.apt.engine.trainer.train_ours_oradaptersby_inventory"
    objective: "src.apt.engine.trainer.compute_ours_oradaptersby_inventory_objective"
  bert: 
    factory: "src.models.wrapper.build_wrapper"
  roberta: 
    factory: "src.models.wrapper.build_wrapper"
  t5: 
    factory: "src.models.wrapper.build_wrapper"
  fine_tuning: 
    factory: "src.apt.engine.trainer.run_training_loop"
  lora: 
    factory: "src.models.wrapper.build_wrapper"
  test_time_adaptation: 
    factory: "src.apt.engine.trainer.run_training_loop"
  FT: 
    factory: "src.apt.engine.trainer.run_training_loop"
  LoRA: 
    factory: "src.models.wrapper.build_wrapper"
  LoRA+Prune: 
    factory: "src.apt.engine.trainer.run_training_loop"
  Co-tuning: 
    factory: "src.apt.engine.trainer.run_training_loop"
  LLM-Pruner: 
    factory: "src.apt.engine.trainer.run_training_loop"

# reference_grounding: paper:unit_004 (chunk_015)
# factories for: unit-004 | t5 | llama commonsense | unit-005 | squad | glue | pruning roberta models targeting similar | apt consistently reach higher | salience notably hurts | sst2 | open llm leaderboard few-shot | fine-tuning will not hurt their
environments:
  unit-004:
    id: "unit-004"
    alias: "main_eval"
    setup: "src.apt.data.pipeline.prepare_pipeline"
  t5:
    id: "t5"
    alias: "t5_tasks"
    setup: "src.apt.data.pipeline.prepare_pipeline"
  llama_commonsense:
    id: "llama_commonsense"
    alias: "llama_eval"
    setup: "src.apt.data.pipeline.prepare_pipeline"
    mandatory: false
  unit-005:
    id: "unit-005"
    alias: "efficiency_profile"
    setup: "src.apt.engine.evaluator.evaluate_evaluator"
  squad:
    id: "squad"
    alias: "squad_v2"
    setup: "src.apt.data.pipeline.prepare_pipeline"
  glue:
    id: "glue"
    alias: "glue_benchmark"
    setup: "src.apt.data.pipeline.prepare_pipeline"
  pruning_roberta_models_targeting_similar:
    id: "pruning_roberta"
    alias: "roberta_pruning"
  apt_consistently_reach_higher:
    id: "apt_performance"
    alias: "apt_performance_claim"
  salience_notably_hurts:
    id: "ablation_salience"
    alias: "ablation_salience"
  sst2:
    id: "sst2"
    alias: "sst2_task"
  open_llm_leaderboard_few_shot:
    id: "few_shot"
    alias: "few_shot_eval"
  fine-tuning_will_not_hurt_their:
    id: "ft_stability"
    alias: "ft_stability_claim"

# reference_grounding: paper:unit_004 (chunk_015)
# loaders for: SST2, MNLI, SQuAD v2.0, CNN/DailyMail, BoolQ, PIQA, SIQA, HellaSwag, WinoGrande, ARC-e, ARC-c, OBQA | glue | truthfulqa
datasets:
  SST2: {id: "SST2", loader: "src.apt.data.pipeline.load_pipeline"}
  MNLI: {id: "MNLI", loader: "src.apt.data.pipeline.load_pipeline"}
  SQuAD_v2.0: {id: "SQuAD_v2.0", loader: "src.apt.data.pipeline.load_pipeline"}
  CNN_DailyMail: {id: "CNN_DailyMail", loader: "src.apt.data.pipeline.load_pipeline"}
  BoolQ: {id: "BoolQ", loader: "src.apt.data.pipeline.load_pipeline"}
  PIQA: {id: "PIQA", loader: "src.apt.data.pipeline.load_pipeline"}
  SIQA: {id: "SIQA", loader: "src.apt.data.pipeline.load_pipeline"}
  HellaSwag: {id: "HellaSwag", loader: "src.apt.data.pipeline.load_pipeline"}
  WinoGrande: {id: "WinoGrande", loader: "src.apt.data.pipeline.load_pipeline"}
  ARC-e: {id: "ARC-e", loader: "src.apt.data.pipeline.load_pipeline"}
  ARC-c: {id: "ARC-c", loader: "src.apt.data.pipeline.load_pipeline"}
  OBQA: {id: "OBQA", loader: "src.apt.data.pipeline.load_pipeline"}
  glue: {id: "glue", loader: "src.apt.data.pipeline.load_pipeline"}
  truthfulqa: {id: "truthfulqa", loader: "src.apt.data.pipeline.load_pipeline"}

# reference_grounding: paper:paper_addendum_constraints addendum.md
metrics:
  accuracy: 
    formula: "src.apt.utils.metrics.compute_accuracy"
    aggregation: "src.apt.utils.metrics.aggregate_accuracy"
  f1: 
    formula: "src.apt.utils.metrics.compute_f1"
    aggregation: "src.apt.utils.metrics.aggregate_f1"
  loss:
    formula: "src.apt.engine.trainer.compute_loss"
    aggregation: "src.apt.engine.trainer.aggregate_loss"
  inference_throughput: 
    formula: "src.apt.utils.efficiency.compute_throughput"
  train_time_to_97_accuracy: 
    formula: "src.apt.utils.efficiency.compute_tta"
  relative_accuracy: 
    formula: "src.reporting.addendum_constraints_flags.compute_relative_accuracy"

# reference_grounding: paper:unit_002 (chunk_011)
# sweeps must include batch_size, early_training_steps (t << T)
sweeps:
  batch_size: [32, 128]
  early_training_steps: [0.05, 0.1, 0.2]

# reference_grounding: paper:paper_addendum_constraints addendum.md
# fixed hyperparameter anchors for 10_shot_setting, batch_size_128, batch_size_32.
fixed_hyperparameters:
  10_shot_setting: {num_shots: 10}
  batch_size_128: {batch_size: 128}
  batch_size_32: {batch_size: 32}

# reference_grounding: paper:paper_addendum_constraints addendum.md
# Canonical artifacts
artifacts:
  figure_1: "results/figures/figure_1.png"
  table_1: "results/tables/table_1.csv"
  figure_2: "results/figures/figure_2.png"
  table_2: "results/tables/table_2.csv"
  table_4: "results/tables/table_4.csv"
  table_11: "results/tables/table_11.csv"
  table_3: "results/tables/table_3.csv"
  table_12: "results/tables/table_12.csv"
  figure_3: "results/figures/figure_3.png"
  table_5: "results/tables/table_5.csv"
  table_7: "results/tables/table_7.csv"
  table_8: "results/tables/table_8.csv"
  table_9: "results/tables/table_9.csv"
  figure_4: "results/figures/figure_4.png"
  figure_5: "results/figures/figure_5.png"
  table_10: "results/tables/table_10.csv"
  figure_5a: "results/figures/figure_5a.png"
  experiment_results: "results/tables/experiment_results.csv"

smoke_mode:
  enabled: true
  max_steps: 10
  batch_size: 2
  data_subset_ratio: 0.01