# reference_grounding: paper:unit_004 (chunk_015)
# Method/Baseline Selectors
methods:
  ours:
    id: "apt"
    alias: "ours"
    salience_fn: "src.apt.pruning.salience.compute_salience_scores"
    search_fn: "src.apt.pruning.search.search_pruning_masks"
  bert:
    id: "bert"
  roberta:
    id: "roberta"
  t5:
    id: "t5"
  fine_tuning:
    id: "ft"
    alias: "fine_tuning"
  lora:
    id: "lora"
  test_time_adaptation:
    id: "tta"
    alias: "test_time_adaptation"
  # reference_grounding: paper:unit_016 (chunk_016)
  # Implement the CoFi baseline with LoRA and L0 module controls plus default hyperparameters.
  cofi:
    id: "cofi"
    use_lora: true
    use_l0: true
    hyperparameters:
      l0_lambda: 0.1
      distill_weight: 1.0
      learning_rate: 2e-5
      batch_size: 32

# reference_grounding: paper:unit_002 (chunk_011)
# Parameter Sweeps and Fixed Hyperparameters
hyperparameters:
  # early_training_steps (t << T)
  early_training_steps:
    default: 100
    sweep: [50, 100, 200, 500]
  
  # batch_size
  batch_size:
    default: 32
    sweep: [32, 128]
    anchors:
      batch_size_32: 32
      batch_size_128: 128

  # 10_shot_setting
  few_shot:
    anchors:
      10_shot_setting: 10

# reference_grounding: paper:unit_002 (chunk_011)
# Pruning Algorithm Configuration
pruning:
  compute_salience_scores: "src.apt.pruning.salience.compute_salience_scores"
  search_pruning_masks: "src.apt.pruning.search.search_pruning_masks"
  salience:
    method: "outlier_aware"
    implementation: "src.apt.pruning.salience.compute_salience_scores"
    notes: "Computes salience scores of parameter blocks at each early-training step when t << T."
  search:
    method: "fast_search"
    implementation: "src.apt.pruning.search.search_pruning_masks"
    notes: "Determines optimal pruning masks m_i and m_o."

# reference_grounding: paper:unit_002 (chunk_011)
# Hypothesis: Pruning LM parameter blocks early in training using an outlier-aware salience score maintains training stability while reducing costs.
# Decision value: Validates the core efficiency claim that pruning can occur at t << T without significant performance degradation.
reproduction_scope:
  active: true
  hypothesis: "Pruning LM parameter blocks early in training using an outlier-aware salience score maintains training stability while reducing costs."
  decision_value: "Validates the core efficiency claim that pruning can occur at t << T without significant performance degradation."
  output_paths:
    metrics: "results/metrics.json"
    table_2: "results/tables/table_2.csv"
    figure_1: "results/figures/figure_1.png"