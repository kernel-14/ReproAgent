# reference_grounding: paper:unit_001 (chunk_010)
# APT Adapter Architecture
# H_apt(X) = (W_o * m_o) * (W_i * m_i) * X
# where m_i and m_o are binary pruning masks.
architecture:
  adapter:
    input_projection: "W_i"
    output_projection: "W_o"
    input_mask: "m_i"
    output_mask: "m_o"
    rank: "r_apt"
    factory: "src.methods.semantic_chunk_adapter.make_adapter"
  shift_module:
    type: "linear"
    bias: true
    apply: "src.methods.semantic_chunk_adapter.apply_shift_module"

# reference_grounding: paper:paper_semantic_chunk_029_adapter_shift_module_block_salience_calculation_correlations_block_salience_calculation (chunk_029)
# Salience scoring function S(W_i,j) = sum |dL/dW_i,j * W_i,j|
salience:
  metric: "weight_gradient_production"
  formula: "abs(grad * weight)"
  aggregation: "sum"
  outlier_aware: true

# reference_grounding: paper:paper_evidence_matrix (chunk_017, chunk_019, chunk_020)
experiment_matrix:
  datasets_or_tasks: ["unit-004", "t5", "llama commonsense", "unit-005", "squad", "glue", "pruning roberta models targeting similar", "apt consistently reach higher", "salience notably hurts", "sst2"]
  methods_or_models: ["FT", "LoRA", "LoRA+Prune", "Co-tuning", "LLM-Pruner", "ours", "bert", "roberta", "t5", "fine_tuning", "lora", "test_time_adaptation", "10_shot_setting", "batch_size_128"]
  parameters: ["early_training_steps"]