# configs/default.yaml
# Classifier-Free Guidance for Language Models - Default Configuration

# Project Metadata
project:
  name: "stay-on-topic-cfg"
  description: "Faithful reproduction of Classifier-Free Guidance for Language Models"
  active_reproduction_scope: "Zero-shot NLP, CoT reasoning, Program Synthesis, and Mechanistic Analysis of CFG"

# Paper Formula & Algorithm Symbol Inventory (Code-Visible Anchors)
# reference_grounding: chunk_004, chunk_005, chunk_007, chunk_010, addendum
symbols:
  w_p: "prompt context"
  flops_computation: "flops measurement formula"
  sum_k: "sum over k"
  p_k: "probability of k"
  x_i: "token or state at step i"
  x_lt_i: "tokens or states before step i"
  sum_i_1_n: "sum from i=1 to n"
  P_theta: "conditional or unconditional model probability"
  P_phi: "classifier probability"
  gamma: "guidance scale"
  theta: "model parameters"
  epsilon_t: "noise prediction at step t"
  x_t_plus_1: "state at step t+1"
  prod_i_1_T: "product from i=1 to T"
  w_i: "token at index i"
  w_j_lt_i: "tokens before index i"
  prod_i_T: "product over i to T"
  c_bar: "negative or null conditioning"
  n_c: "number of conditioning tokens"
  n_p: "number of prompt tokens"
  w_t: "token at step t"
  w_lt_t: "tokens before step t"
  w_T: "terminal token"
  w_hat: "guided token distribution"
  lambda: "guidance weight parameter"
  f_w: "weak model logits"
  f_s: "strong model logits"
  CFG: "Classifier-Free Guidance"
  P_instruct: "instruction-tuned model probability"

# Numeric and Default Anchors from the Paper
numeric_anchors:
  val_5_1: 5.1
  val_1: 1.0
  val_0: 0.0
  val_3: 3.0
  val_4: 4.0
  val_6: 6.0
  val_7: 7.0
  val_5: 5.0
  val_3_4: 3.4
  val_81: 81.0
  val_1_5: 1.5
  val_77_9: 77.9
  val_2: 2.0
  val_10: 10.0
  val_100: 100.0
  val_0_2: 0.2
  val_8: 8.0
  val_14: 14.0
  val_0_8: 0.8
  val_15: 15.0
  val_0_6: 0.6
  val_0_9: 0.9
  val_90: 90.0
  val_50: 50.0
  val_19: 19.0
