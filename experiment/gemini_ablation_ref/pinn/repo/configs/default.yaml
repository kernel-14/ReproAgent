# configs/default.yaml
# Challenges in Training PINNs: A Loss Landscape Perspective
# Faithful reproduction configuration and evidence contract registry

metadata:
  hypothesis: "A unified framework for Convection, Wave, and Reaction PDEs will allow reproduction of the Adam+L-BFGS performance advantage and the Loss-L2RE correlation."
  decision_value: "Establishes the experimental baseline and validates the core observation that high-quality solutions require near-zero loss."
  project_type: "single_experiment_project"
  entrypoints:
    main: "main.py"
    runtime_smoke: "python main.py --mode runtime_smoke"
    docker_validate: "python main.py --mode docker_validate"

# Expose paper-derived environment/task factories
environments:
  convection_pde:
    id: "convection_pde"
    alias: "Convection PDE"
    setup_metadata:
      dimension: 1
      domain: [0.0, 2.0]
      t_domain: [0.0, 1.0]
      beta: 30.0 # Challenging coefficient setting
    availability_check: "src.pinn.pdes.ConvectionPDE"
    runnable_config_hook: "get_convection_config"
    oracle_solution: "analytical_convection"
  
  wave_pde:
    id: "wave_pde"
    alias: "Wave PDE"
    setup_metadata:
      dimension: 1
      domain: [0.0, 1.0]
      t_domain: [0.0, 1.0]
      beta: 4.0 # Challenging coefficient setting
    availability_check: "src.pinn.pdes.WavePDE"
    runnable_config_hook: "get_wave_config"
    oracle_solution: "analytical_wave"

  reaction_ode:
    id: "reaction_ode"
    alias: "Reaction ODE"
    setup_metadata:
      dimension: 1
      domain: [0.0, 1.0]
      rho: 10.0 # Challenging coefficient setting
    availability_check: "src.pinn.pdes.ReactionODE"
    runnable_config_hook: "get_reaction_config"
    oracle_solution: "analytical_reaction"

# Expose method/baseline/attack selectors
methods:
  ours:
    id: "ours"
    alias: "Adam+L-BFGS"
    description: "Combined optimization method Adam+L-BFGS consistently provides a smaller loss and L2RE than using Adam or L-BFGS alone."
    switching_logic:
      adam_epochs: 2000
      lbfgs_max_iter: 5000
      line_search_fn: "strong_wolfe" # Ensure L-BFGS uses Strong Wolfe line search
  
  oracle:
    id: "oracle"
    alias: "Oracle Solution"
    description: "Analytical or high-fidelity solution used for L2RE calculation."
    method_type: "analytical"

  bc:
    id: "bc"
    alias: "Boundary Condition Baseline"
    description: "Baseline focusing on boundary condition satisfaction."
    method_type: "baseline"

  adam:
    id: "adam"
    alias: "Adam Optimizer"
    learning_rate: 0.001

  lbfgs:
    id: "lbfgs"
    alias: "L-BFGS Optimizer"
    line_search_fn: "strong_wolfe"

  nncg:
    id: "nncg"
    alias: "NysNewton-CG"
    description: "NysNewton-CG (NNCG) preconditioned conjugate gradient method."
    damping_factor: 0.1
    armijo_constants:
      c1: 1e-4
      c2: 0.9
    lanczos_iterations: 100

  damped_newton:
    id: "damped_newton"
    alias: "Damped Newton"
    description: "Damped version of Newton's method with Armijo line search."
    damping_factor: 0.1

# Expose required parameter sweeps as executable constants/default accessors
parameter_sweeps:
  network_widths: [10, 20, 40, 80, 128, 256, 512]
  pde_coefficients:
    convection_beta: [0.0, 1.0, 2.0, 10.0, 20.0, 30.0, 40.0]
    wave_beta: [1.0, 2.0, 4.0, 8.0]
    reaction_rho: [1.0, 5.0, 10.0, 20.0]
  beta_values: [0, 2, 1]
  learning_rates: [1e-4, 1e-3, 1e-2]
  lanczos_iterations: [20, 60, 100]
  damping_factors: [0.1, 0.5, 1.0]
  armijo_constants:
    alpha: 0.5
    beta: 0.8
    mu: 1e-4

# Implement per-sample lowest score selection protocol
selection_protocol:
  name: "per_sample_lowest_score_selection"
  metric: "loss"
  description: "For a given PDE, the configuration of Adam learning rate, seed and network width with the smallest L2RE or loss is selected."

