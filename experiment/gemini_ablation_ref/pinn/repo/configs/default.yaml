  four: 4
  five: 5
  six: 6
  seven: 7
  eight: 8
  eight_point_one: 8.1
  eight_point_four: 8.4
  ten: 10
  sixteen: 16
  twenty: 20
  forty: 40
  sixty: 60
  one_hundred: 100
  two_hundred: 200
  one_thousand: 1000
  zero_point_one: 0.1
  zero_point_five: 0.5
  nineteen: 19

# Paper formula/algorithm anchors implemented as executable config
formula_algorithm_anchors:
  section_2_1:
    title: "2.1. Physics-informed Neural Networks"
    symbols: ["PDE", "n_res", "sum_i=1", "n_bc", "R^d", "R^p", "x_r^i", "x_b^j"]
    defaults: [0, 1, 2]
    terms: ["equation", "loss"]
    steps: "For this loss, L(w)=0 means that u(x; w) solves the PDE and boundary conditions exactly."

  section_5_1:
    title: "5.1. The PINN Loss is Ill-conditioned"
    symbols: ["H_L"]
    defaults: [4, 10, 3, 5, 0]
    terms: ["loss"]
    steps: "The conditioning of the loss L plays a key role in the performance of first-order optimization methods. We can understand the conditioning of an optimization problem through the eigenvalues of the Hessian of the loss, H_L."

  section_8_1:
    title: "8.1. Preliminaries"
    symbols: ["w_star", "W_star", "mu", "PŁ^star", "P^star", "PL^star", "kappa_L", "epsilon", "H_L"]
    defaults: [0, 2]
    terms: ["loss", "gradient"]
    steps: "Then L is mu-PL* in S if ||grad L(w)||^2 / (2 * mu) >= L(w). The P*-condition relates the gradient norm to the loss and implies that any minimizer in S is a global minimizer."

  section_B:
    title: "B. Why can Low Losses Correspond to Large L2RE?"
    symbols: ["n_res", "sum_i=1", "x_r^i"]
    defaults: [1, 2, 0]
    terms: ["loss"]
    steps: "PINNs can be attracted to points in the loss landscape that minimize the residual portion of the PINN loss, 1/(2*n_res) * sum(D[u(x_r^i)]^2)."

  section_C_2:
    title: "C.2. Preconditioned Spectral Density Computation"
    symbols: ["rho_k", "gamma_k", "sum_l=2^m", "rho_k-l", "rho_k-1", "H_k", "s_k", "x_k+1", "x_k", "y_k", "f_k+1", "f_k", "y_k^T", "s_k-1^T"]
    defaults: [100, 1, 0, 2, 7, 3]
    terms: ["algorithm", "formula", "gradient", "compute", "update"]
    steps: "L-BFGS stores a set of vector pairs given by the difference in consecutive iterates and gradients from most recent m iterations (we use m=100 in our experiments)."

  section_E_2:
    title: "E.2. NysNewton-CG (NNCG)"
    symbols: ["eta_k", "epsilon", "alpha", "beta", "mu", "CGNNCG", "Lambda_hat", "d_k-1", "w_0", "d_-1", "H_L", "w_k", "d_k", "w_k+1"]
    defaults: [0.1, 1, 60, 20, 10, 16, 1000, 0.5]
    terms: ["algorithm", "objective", "loss", "compute", "update", "search", "decrease"]
    steps: "After computing the Newton step, we compute the step size eta_k using Armijo line search - this guarantees that the loss will decrease when we update the parameters."

  section_G_2:
    title: "G.2. Global Behavior: Reaching a Small Ball About a Minimizer"
    symbols: ["beta_L", "mu", "P^star", "W_star", "mu^3/2", "rho^2", "w_star", "w_0", "w_k+1", "w_k", "r^2", "H_L", "J_F", "H_F"]
    defaults: [4, 1, 0, 2, 3, 19]
    terms: ["loss", "gradient", "linearly"]
    steps: "The mapping F(w) is L_F-Lipschitz, and the loss L(w) is beta_L-smooth. Gradient descent converges linearly."

# Callable experiment specs that bind environments, methods, parameter defaults, metric functions, and artifact writer call sites
experiments:
  experiment_i:
    name: "Experiment I: Optimizer Comparison"
    environment_ids: ["convection_pde", "wave_pde", "reaction_ode"]
    method_ids: ["adam", "lbfgs", "ours"]
    parameter_defaults:
      network_width: 128
      learning_rate: 0.001
      beta: 2.0
    metrics: ["loss", "L2RE", "training_time"]
    artifact_writer: "write_optimizer_comparison_artifact"
    output_path: "results/optimizer_comparison.json"

  experiment_ii:
    name: "Experiment II: Loss vs L2RE Correlation"
    environment_ids: ["convection_pde", "wave_pde", "reaction_ode"]
    method_ids: ["adam", "lbfgs", "ours"]
    parameter_defaults:
      network_width: 128
      learning_rate: 0.001
      beta: 2.0
    metrics: ["loss", "L2RE"]
    artifact_writer: "write_loss_vs_l2re_artifact"
    output_path: "results/loss_vs_l2re.json"

  experiment_iii:
    name: "Experiment III: Hessian Spectral Density Analysis"
    environment_ids: ["convection_pde", "wave_pde"]
    method_ids: ["adam", "lbfgs"]
    parameter_defaults:
      network_width: 128
      lanczos_iterations: 100
    metrics: ["Hessian eigenvalues", "spectral density", "condition number"]
    artifact_writer: "write_spectral_density_artifact"
    output_path: "results/spectral_density.json"

  experiment_iv:
    name: "Experiment IV: Advanced Optimizers"
    environment_ids: ["convection_pde", "wave_pde", "reaction_ode"]
    method_ids: ["nncg", "damped_newton", "ours"]
    parameter_defaults:
      network_width: 128
      damping_factor: 0.1
      armijo_alpha: 0.5
    metrics: ["loss", "L2RE", "training_time"]
    artifact_writer: "write_nncg_vs_adam_lbfgs_artifact"
    output_path: "results/nncg_vs_adam_lbfgs.json"

  experiment_v:
    name: "Experiment V: Appendix Results"
    environment_ids: ["convection_pde"]
    method_ids: ["ours"]
    parameter_defaults:
      network_width: 256
      learning_rate: 0.001
    metrics: ["loss", "L2RE"]
    artifact_writer: "write_figure_10_artifact"
    output_path: "results/figures/figure_10.png"

  final_validation:
    name: "Final Validation: Evidence Contract Closure"
    environment_ids: ["convection_pde", "wave_pde", "reaction_ode"]
    method_ids: ["ours", "oracle", "bc"]
    parameter_defaults:
      network_width: 128
    metrics: ["accuracy", "precision", "loss", "return", "training_time"]
    artifact_writer: "write_evidence_contract_matrix_artifact"
    output_path: "results/evidence_contract_matrix.json"

# Declared runtime artifacts under the repository output paths
artifacts:
  manifest_path: "results/artifact_manifest.json"
  registry_path: "results/experiment_registry.json"
  metrics_path: "results/metrics.json"
  sensitivity_report_path: "results/sensitivity_report.json"
  tables:
    table_1: "results/tables/table_1.csv"
    table_2: "results/tables/table_2.csv"
    table_3: "results/tables/table_3.csv"
    experiment_results: "results/tables/experiment_results.csv"
  figures:
    figure_1: "results/figures/figure_1.png"
    figure_2: "results/figures/figure_2.png"
    figure_3: "results/figures/figure_3.png"
    figure_4: "results/figures/figure_4.png"
    figure_5: "results/figures/figure_5.png"
    figure_6: "results/figures/figure_6.png"
    figure_7: "results/figures/figure_7.png"
    figure_8: "results/figures/figure_8.png"
