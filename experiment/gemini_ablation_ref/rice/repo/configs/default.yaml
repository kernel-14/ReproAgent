  sum_t_0_infty: "sum_t=0^infty"
  gamma_t: "gamma^t"
  s_t: "s_t"
  a_t: "a_t"
  s_0: "s_0"
  Q_pi: "Q^pi(s, a) = E_pi[sum_t=0^infty gamma^t R(s_t, a_t) | s_0 = s, a_0 = a]"
  a_0: "a_0"
  A_pi: "A^pi(s, a) = Q^pi(s, a) - V^pi(s)"
  pi_star: "pi^*"
  max_pi: "max_pi"
  E_ssimrho: "E_ssimrho"
  d_rho_pi: "d_rho^pi"
  gamma: 0.99
  Pr_pi: "Pr^pi"
  pi_r: "pi^r"
  d_rho: "d_rho"
  a_t_m: "a_t^m"
  a_random: "a_random"
  theta: "theta"
  pi_bar: "pi_bar"
  pi_tilde_theta: "pi_tilde_theta"
  theta_old: "theta_old"
  pi_tilde: "pi_tilde"
  s_t_plus_1: "s_t+1"
  R_t_prime: "R_t^prime"
  R_prime: "R^prime(s_t, a_t) = R(s_t, a_t) + alpha * a_t^m"
  alpha: 0.01
  pi_prime: "pi^prime"
  f_hat: "f_hat"
  lambda: 0.01
  pi_theta: "pi_theta"
  f_hat_theta: "f_hat_theta"
  pi_hat: "pi_hat"
  tau: "tau"
  pi_e: "pi_e"
  pi_g: "pi_g"
  formula: "formula"
  mask: "mask"
  ema: "ema"
  calculate: "calculate"
  v_pi: "v_pi"
  e_pi: "e_pi"
