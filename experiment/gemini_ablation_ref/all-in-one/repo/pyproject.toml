[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simformer-repro"
version = "0.1.0"
description = "Faithful reproduction of Simformer: All-in-one simulation-based inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "PaperBench Repro Agent"}
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional heavy simulator/training dependencies declared separately
sbi = [
    "sbi>=0.21.0",
    "pyknos>=0.1.5",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]