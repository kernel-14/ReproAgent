# configs/inventory_registry_make.yaml
# Faithful reproduction configuration and inventory registry for:
# "Fine-tuning Reinforcement Learning Models is Secretly a Forgetting Mitigation Problem"

metadata:
  project_name: "Fine-tuning RL as Forgetting Mitigation"
  paper_id: "ftrl"
  reproduction_scope: "Faithful implementation of MDP, AppleRetrieval, and Robotics experiments."

# Expose paper-derived environment/task factories and registries
environments:
  registry:
    - id: "two_state_mdp"
      alias: "two-state-mdp"
      description: "Two-state MDP with CLOSE and FAR state partitions to track forgetting."
      state_space_partition:
        close: "s_0"
        far: "s_1"
      setup_metadata:
        gamma: 0.9
        epsilon: 0.5
        r_0: 0.11
        r_1: 2.22
        s_0: 0
        s_1: 1
        v_0: 10.0
        f_0: 0.0
        f_1: 1.0
      availability_check: "src.envs.two_state_mdp.make_two_state_mdp"
      runnable_config_hook: "setup_two_state_mdp"

    - id: "appleretrieval"
      alias: "apple_retrieval"
      description: "AppleRetrieval grid-world environment exhibiting state coverage gap."
      setup_metadata:
        M: 13
        c: 11
        sigma: 30
        asset_13: 13
        pi_w: 1.0
        pi_b: 0.0
        apple_reward: 10.0
        step_penalty: -0.1
      availability_check: "src.envs.apple_retrieval.make_apple_retrieval"
      runnable_config_hook: "setup_apple_retrieval"

    - id: "robotics"
      alias: "push-wall"
      description: "Robotic manipulation task (Meta-World push-wall) for sequential transfer."
      setup_metadata:
        task_name: "push-wall-v2"
        gold_score_threshold: 0.9
        beta: 1.5
        E_k: 200
        E_i: 1
        r_t: 1.0
        r_t_prime: 1.0
      availability_check: "src.envs.robotics.make_robotics"
      runnable_config_hook: "setup_robotics"

# Expose paper-derived dataset/benchmark loaders
datasets:
  registry:
    - id: "robotics_dataset"
      alias: "robotics"
      description: "Robotic sequence demonstration dataset for push-wall task."
      setup_metadata:
        num_trajectories: 100
        validation_split: 0.2
      validation_checks:
        - "check_trajectory_lengths"
        - "check_state_action_bounds"
      runnable_config_hook: "load_robotics_dataset"

    - id: "nld-aa-v0"
      alias: "nethack_learning"
      description: "NetHack Learning Dataset (NLD-AA) for behavioral cloning and kickstarting."
      setup_metadata:
        batch_size: 128
        add_nledata_directory: "/path/to/nld-aa"
        add_altorg_directory: "/path/to/nld-nao"
      validation_checks:
        - "check_ttyrec_format"
      runnable_config_hook: "load_nethack_dataset"

# Expose method/baseline/attack selectors
methods:
  selectors:
    - "ours"
    - "ppo"
    - "sac"
    - "bc"
    - "oracle"
    - "nle"
    - "ewc"

# Expose bounded sweep/config entries and fixed hyperparameter anchors
hyperparameters:
  learning_rate:
    default: 0.0003
    sweep_values: [0.0001, 0.0003, 0.001]
  batch_size:
    default: 128
    sweep_values: [64, 128, 256]
  anchors:
    batch_size_128: 128

# Paper formula/algorithm symbol inventory for code visibility and validation
formula_algorithm_symbols:
  addendum:
    symbols:
      - "add_nledata_directory"
      - "add_altorg_directory"
      - "TtyrecDataset\"nld-aa-v0\",batch_size=128"
      - "batch_size"
    numeric_defaults:
      - 128
    algorithm_terms:
      - "algorithm"
      - "distill"
      - "compute"

  two_state_mdp:
    symbols:
      - "theta"
      - "gamma"
      - "f_theta"
      - "epsilon"
      - "1_thetaleq1-epsilon/2"
      - "1_theta>1-epsilon/2"
      - "s_0"
      - "v_0"
      - "r_0"
      - "r_1"
      - "s_1"
      - "f_0"
      - "f_1"
    numeric_defaults:
      - 0
      - 9
      - 1
      - 2
      - 0.11
      - 2.22
      - 0.5
      - 10
    algorithm_terms:
      - "gradient"

  forgetting_capabilities:
    symbols:
      - "theta_*"
      - "L_BC"
      - "theta"
      - "B_BC"
      - "D_KL"
      - "pi_*"
      - "pi_theta"
      - "L_KS"
    numeric_defaults: []
    algorithm_terms:
      - "objective"
      - "loss"
      - "sample"
      - "initialize"

  appleretrieval:
    symbols:
      - "pi_w,b"
      - "sigma"
      - "asset_13"
    numeric_defaults:
      - 1
      - 0
      - 2
      - 13
      - 11
      - 30
    algorithm_terms:
      - "algorithm"
      - "gradient"
      - "ema"
      - "increase"

  meta_world:
    symbols:
      - "E_k"
      - "E_i"
      - "r_t"
      - "r_t^prime"
      - "beta"
      - "K_ij"
      - "x_i"
      - "x_j"
      - "L_ij"
      - "y_i"
      - "y_j"
      - "CKA"
      - "HSIC"
    numeric_defaults:
      - 1
      - 200
      - 1.5
    algorithm_terms:
      - "algorithm"
      - "formula"
      - "sample"
      - "initialize"

  ewc:
    symbols:
      - "L_aux"
      - "theta"
      - "sum_i"
      - "theta_*^i"
      - "theta^i"
      - "theta_*"
      - "F^i"
    numeric_defaults:
      - 2
    algorithm_terms:
      - "loss"

# Declared reproduction artifacts to be written by the pipeline
artifacts:
  dataset_registry: "results/dataset_registry.json"
  data_manifest: "results/data_manifest.json"
  figures:
    figure_1: "results/figures/figure_1.png"
    figure_2: "results/figures/figure_2.png"
    figure_4: "results/figures/figure_4.png"
    figure_12: "results/figures/figure_12.png"
    figure_3a: "results/figures/figure_3a.png"
    figure_3: "results/figures/figure_3.png"
    figure_3b: "results/figures/figure_3b.png"
    figure_3c: "results/figures/figure_3c.png"
    figure_7: "results/figures/figure_7.png"
    figure_5: "results/figures/figure_5.png"
    figure_6: "results/figures/figure_6.png"
    figure_8: "results/figures/figure_8.png"
    figure_14: "results/figures/figure_14.png"
    figure_15: "results/figures/figure_15.png"
  tables:
    table_4: "results/tables/table_4.csv"
    table_5: "results/tables/table_5.csv"