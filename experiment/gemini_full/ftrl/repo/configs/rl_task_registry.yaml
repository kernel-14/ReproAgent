# configs/rl_task_registry.yaml
# reference_grounding: chunk_003_01 chunk_018 chunk_019 chunk_024_01 addendum:formula_algorithm_contract

metadata:
  project_name: "Fine-tuning Reinforcement Learning Models is Secretly a Forgetting Mitigation Problem"
  paper_id: "ftrl"

# 1. Environment/Task Factories
environments:
  two_state_mdp:
    id: "two_state_mdp"
    alias: "two-state-mdp"
    description: "Two-state MDP with CLOSE and FAR state partitions to track forgetting."
    state_space_partition:
      close: "s_0"
      far: "s_1"
    setup_metadata:
      gamma: 0.9
      epsilon: 0.5
      r_0: 0.11
      r_1: 2.22
      s_0: 0
      s_1: 1
      v_0: 10.0
      f_0: 0.0
      f_1: 1.0
    availability_check: "src.envs.two_state_mdp.make_two_state_mdp"
    runnable_config_hook: "setup_two_state_mdp"

  appleretrieval:
    id: "appleretrieval"
    alias: "apple_retrieval"
    description: "AppleRetrieval grid-world environment exhibiting state coverage gap."
    setup_metadata:
      M: 13
      c: 11
      sigma: 30
      asset_13: 13
      pi_w: 1.0
      pi_b: 0.0
      apple_reward: 10.0
      step_penalty: -0.1
    availability_check: "src.envs.apple_retrieval.make_apple_retrieval"
    runnable_config_hook: "setup_apple_retrieval"

  robotics:
    id: "robotics"
    alias: "push-wall"
    description: "Robotic manipulation task (Meta-World push-wall) for sequential transfer."
    setup_metadata:
      task_name: "push-wall-v2"
      gold_score_threshold: 0.9
      beta: 1.5
      E_k: 200
      E_i: 1
      r_t: 1.0
      r_t_prime: 1.0
    availability_check: "src.envs.robotics.make_robotics"
    runnable_config_hook: "setup_robotics"

# 2. Dataset/Benchmark Loaders
datasets:
  robotics:
    id: "robotics_dataset"
    alias: "robotics"
    description: "Robotic manipulation demonstration dataset for behavioral cloning."
    setup_metadata:
      num_trajectories: 100
      validation_split: 0.2
    validation_checks: "src.data.rl_task_registry.validate_robotics_dataset"
    runnable_config_hook: "load_robotics_dataset"

# 3. Method/Baseline/Attack Selectors
methods:
  selectors:
    - "ours"
    - "ppo"
    - "sac"
    - "bc"
    - "oracle"
    - "nle"
    - "ewc"
    - "scaled-bc + fine-tuning + ks"

# 4. Hyperparameter Sweeps and Fixed Anchors
hyperparameters:
  sweeps:
    learning_rate:
      values: [0.0001, 0.0003, 0.001, 0.003]
      default: 0.0003
    batch_size:
      values: [32, 64, 128, 256]
      default: 128
  fixed_anchors:
    batch_size_128: 128

# 5. Paper Formula/Algorithm Symbol Inventory
symbol_inventory:
  add_nledata_directory: "add_nledata_directory"
  add_altorg_directory: "add_altorg_directory"
  ttyrec_dataset_nld_aa_v0: "TtyrecDataset\"nld-aa-v0\",batch_size=128"
  batch_size: 128
  L_aux: "L_aux"
  theta: "theta"
  sum_i: "sum_i"
  F_i: "F^i"
  theta_star_i: "theta_*^i"
  theta_i: "theta^i"
  theta_star: "theta_*"
  L_BC: "L_BC"
  B_BC: "B_BC"
  D_KL: "D_KL"
  pi_star: "pi_*"
  pi_theta: "pi_theta"
  L_KS: "L_KS"
  s_0: 0
  v_0: 9.93
  gamma: 0.9
  r_0: 0.11
  f_theta: "f_theta"
  r_1: 2.22
  epsilon: 0.5

# 6. Numeric and Default Anchors
numeric_anchors:
  anchor_128: 128
  anchor_2: 2
  anchor_0: 0
  anchor_9: 9
  anchor_1: 1
  anchor_0_11: 0.11
  anchor_2_22: 2.22
  anchor_0_5: 0.5
  anchor_10: 10
  anchor_0_08: 0.08
  anchor_9_93: 9.93
  anchor_13: 13
  anchor_11: 11
  anchor_30: 30
  anchor_200: 200
  anchor_1_5: 1.5

# 7. Metrics Registry
metrics:
  - id: "gold_score"
    alias: "gold score"
    description: "Gold score achieved in NetHack tasks."
  - id: "eating_score"
    alias: "eating score"
    description: "Eating score achieved in NetHack tasks."
  - id: "staircase_score"
    alias: "staircase score"
    description: "Staircase score achieved in NetHack tasks."
  - id: "scout_score"
    alias: "scout score"
    description: "Scout score achieved in NetHack tasks."
  - id: "experience_points"
    alias: "experience points"
    description: "Experience points achieved in NetHack tasks."
  - id: "dungeon_depth"
    alias: "dungeon depth"
    description: "Dungeon depth reached in NetHack tasks."
  - id: "loss"
    alias: "loss"
    description: "Training loss (RL objective or auxiliary loss)."
  - id: "reward"
    alias: "reward"
    description: "Step reward."
  - id: "return"
    alias: "return"
    description: "Episode return."
  - id: "success_rate"
    alias: "success_rate"
    description: "Success rate of the task."