    mu_NX_1: "mu_NX_1"
    mu_N: "mu_N"
    X_1: "X_1"
    f_Theta: "f_Theta"
    E_i: "E_i"
    e_i_j: "e_i^j"
    L_i_plus_1: "L_i+1"
    e_i_0: "e_i^0"
    L_i: "L_i"
    E_i_minus_1: "E_i-1"
    e_N_0: "e_N^0"
    D_train: "D_train"
    x_i: "x_i"
    y_i: "y_i"
    D_test: "D_test"
    X_t: "X_t"
    mu: "mu"
    sigma: "sigma"
    m_0: "m^0"
    tau: "tau"
    p_k_t: "p_k^t"
    e_n_0: "e_n^0"
