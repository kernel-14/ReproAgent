# configs/default.yaml
# Reference Grounding: addendum:formula_algorithm_contract

# Global Metadata & Active Reproduction Scope Notes
metadata:
  paper_title: "Sample-specific Masks for Visual Reprogramming-based Prompting"
  active_reproduction_scope: "Reproduction of SMM (Sample-specific Multi-channel Masks) and baseline VR methods"
  three_seed_protocol: [42, 43, 44]

# Paper Formula & Algorithm Symbol Inventory (Code-Visible Anchors)
symbols:
  ViT_B32: "ViT_B32"
  train_preprocess: "train_preprocess"
  compose_transforms_resizeimgsize_32_imgsize_32: "transforms.Resize((imgsize + 32, imgsize + 32))"
  randomcropimgsize: "transforms.RandomCrop(imgsize)"
  lambdalambdax_x_convert_rgb: "transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x)"
  normalizeimagenetnormalize_mean_imagenetnormalize_std: "transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])"
  test_preprocess: "test_preprocess"
  compose_transforms_resizeimgsize_imgsize: "transforms.Resize((imgsize, imgsize))"
  d_T: "d_T"
  k_T: "k_T"
  x_i: "x_i"
  y_i: "y_i"
  f_P: "f_P"
  f_out: "f_out"
  f_in: "f_in"
  Y_sub: "Y_sub"
  min_thetainTheta_omegainOmega: "min_{theta in Theta, omega in Omega}"
  sum_i_1_n: "sum_i=1^n"
  theta: "theta"
  R_plus: "R^+"
  Theta: "Theta"
  delta: "delta"
  f_mask: "f_mask"
  d_P: "d_P"

# Numeric & Default Anchors
numeric_anchors:
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  vit_imgsize: 384
  default_imgsize: 224
  resize_padding: 32
  delta_init_value: 0.0
  frozen_pretrained: true
  default_p: 1.0
  default_epochs: 1
  default_learning_rate: 0.01
  default_patch_size: 4

# Method, Baseline, and Attack Selectors
selectors:
  methods:
    - ours
    - vit
    - resnet
    - lora
  baselines:
    - PAD
    - NARROW
    - MEDIUM
    - FULL
  output_mappings:
    - Rlm  # Random Label Mapping
    - Flm  # Frequency Label Mapping
    - Ilm  # Iterative Label Mapping

# Parameter Sweeps
sweeps:
  p: [0.0, 0.5, 1.0]
  learning_rate: [0.001, 0.01, 0.1]
  patch_size: [4, 2, 1]
  epochs: [1, 10, 50]

# Environment & Task Registry
environments:
  unit-001:
    id: "unit-001"
    alias: "unit_001_smoke"
    setup_metadata: "Lightweight smoke test environment"
    availability_check: "src.data.unit_python_py.check_availability"
    runnable_config_hook: "src.data.unit_python_py.setup_env"
  cifar:
    id: "cifar"
    alias: "cifar_env"
    setup_metadata: "CIFAR environment setup"
    availability_check: "src.data.unit_smm_class.check_cifar_availability"
    runnable_config_hook: "src.data.unit_smm_class.setup_cifar_env"
  imagenet:
    id: "imagenet"
    alias: "imagenet_env"
    setup_metadata: "ImageNet environment setup"
    availability_check: "src.data.unit_smm_class.check_imagenet_availability"
    runnable_config_hook: "src.data.unit_smm_class.setup_imagenet_env"
  svhn:
    id: "svhn"
    alias: "svhn_env"
    setup_metadata: "SVHN environment setup"
    availability_check: "src.data.unit_smm_class.check_svhn_availability"
    runnable_config_hook: "src.data.unit_smm_class.setup_svhn_env"
  ucf101:
    id: "ucf101"
    alias: "ucf101_env"
    setup_metadata: "UCF101 environment setup"
    availability_check: "src.data.unit_smm_class.check_ucf101_availability"
    runnable_config_hook: "src.data.unit_smm_class.setup_ucf101_env"
  food101:
    id: "food101"
    alias: "food101_env"
    setup_metadata: "Food101 environment setup"
    availability_check: "src.data.unit_smm_class.check_food101_availability"
    runnable_config_hook: "src.data.unit_smm_class.setup_food101_env"
  sun397:
    id: "sun397"
    alias: "sun397_env"
    setup_metadata: "SUN397 environment setup"
    availability_check: "src.data.unit_smm_class.check_sun397_availability"
    runnable_config_hook: "src.data.unit_smm_class.setup_sun397_env"

