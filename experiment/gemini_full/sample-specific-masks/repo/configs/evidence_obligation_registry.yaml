# Expose required parameter sweeps and fixed hyperparameter anchors
parameter_sweeps:
  delta_initialized_to_zero:
    default: 0.0
    description: "delta initialized to zero"
  frozen_pretrained_model_parameters:
    default: true
    description: "frozen pre-trained model parameters"
  learning_rate:
    default: 0.01
    values: [0.001, 0.01, 0.1]
  patch_size:
    default: 4
    values: [4, 2, 1]
  p:
    default: 1.0
    values: [0.0, 0.5, 1.0]
    description: "p parameter sweep with endpoint_low trend (p=0 and p=1 represented as lowest/minimum boundary cases)"
  epochs:
    default: 1
    values: [1, 10, 50]

fixed_hyperparameters:
  three_seed_protocol: [42, 43, 44]

# Expose method/baseline/attack selectors
selectors:
  methods:
    - ours
    - vit
    - resnet
    - lora
  baselines:
    - PAD
    - NARROW
    - MEDIUM
    - FULL
    - ONLY_delta
    - ONLY_f_mask
    - SINGLE_CHANNEL_f_mask

# Paper formula/algorithm symbol inventory and anchors
formula_algorithm_anchors:
  addendum:
    symbols:
      - ViT_B32
      - train_preprocess
      - "Compose[transforms.Resizeimgsize+32,imgsize+32]"
      - "RandomCropimgsize"
      - "Lambdalambdax:x.convert'RGB'"
      - "NormalizeIMAGENETNORMALIZE['mean'],IMAGENETNORMALIZE['std']"
      - test_preprocess
      - "Compose[transforms.Resizeimgsize,imgsize]"
    numeric_defaults:
      imagenet_mean: [0.485, 0.456, 0.406]
      imagenet_std: [0.229, 0.224, 0.225]
      vit_imgsize: 384
      default_imgsize: 224
    formula: |
      IMAGENETNORMALIZE = {
          'mean': [0.485, 0.456, 0.406],
          'std': [0.229, 0.224, 0.225],
      }
      if model == "ViT_B32":
          imgsize = 384
      else:
          imgsize = 224
      train_preprocess = transforms.Compose([
          transforms.Resize((imgsize + 32, imgsize + 32)),
          transforms.RandomCrop(imgsize),
          transforms.RandomHorizontalFlip(),
          transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x),
          transforms.ToTensor(),
          transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std']),
      ])
      test_preprocess = transforms.Compose([
          transforms.Resize((imgsize, imgsize)),
          transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x),
          transforms.ToTensor(),
          transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std']),
      ])

  framework_of_smm:
    section: "3.1. Framework of SMM"
    symbols:
      - delta
      - f_mask
      - f_in
      - theta
      - delta_star
      - f_out
      - d_P
      - d_T
      - x_i
      - phi
      - phi_star
      - f_P
      - R_d
      - y_i
    algorithm_terms:
      - objective
      - mask
      - sample
    steps:
      - "Both methods use a pre-determined shared mask to indicate the valid location of pattern delta."
      - "We resize each target image and apply a different three-channel mask accordingly, driven by a lightweight f_mask with an interpolation up-scaling module, allowing for more variability in individual samples."
      - "f_in(x_i | phi, delta) = r(x_i) + delta * f_mask(r(x_i) | phi)"

  experiments:
    section: "5. Experiments"
    symbols:
      - f_in
      - delta
      - f_mask
      - x_i
    algorithm_terms:
      - mask
      - ema
      - sample
    steps:
      - "Impact of Masking: We first investigate the impact of different masking strategies."

  problem_setting:
    section: "2.1. Problem Setting of Model Reprogramming"
    symbols:
      - f_out
      - f_in
      - Y_sub
      - min_thetainTheta_omegainOmega
      - sum_i_1_n
      - theta
      - d_T
      - k_T
      - x_i
      - y_i
      - f_P
      - R_plus
    numeric_defaults:
      loss_lower_bound: 0
      loss_multiplier: 1
    algorithm_terms:
      - formula
      - objective
      - loss
    steps:
      - "Let D_T represent the data distribution of a target task defined over X_T x Y_T, where X_T is the data space and Y_T is the label space."
      - "ell: Y_T x Y_T -> R^+ U {0} is a loss function."

  patch_wise_interpolation:
    section: "3.3. Patch-wise Interpolation Module"
    symbols:
      - f_out
      - delta
      - delta_star
      - f_in
      - f_mask
      - sum_i_1_n
      - f_P
      - x_i
      - y_i
      - alpha_1
      - alpha_2
      - phi
      - phi_star
      - d_P
    numeric_defaults:
      l_min: 0
      l_default: 2
      alpha_init: 1
    algorithm_terms:
      - algorithm
      - loss
      - gradient
      - mask
      - compute
      - initialize
    steps:
      - "The patch-wise interpolation module upscales CNN-generated masks from floor(H/2^l) x floor(W/2^l) back to the original size H x W per channel (omitted when l=0)."
      - "We employ a grid of floor(H/2^l) x floor(W/2^l) patches in the upsampling process, each sized 2^l x 2^l, ensuring the same values within each patch."

  understanding_masks:
    section: "4. Understanding Masks in Visual Reprogramming for Classification"
    symbols:
      - int_X
      - f_out
      - delta
      - R_plus
      - R_D
      - p_X
      - F_1
      - F_2
      - x_i
      - d_P
      - f_P
    numeric_defaults:
      error_min: 0
      error_max: 1
      norm_p: 2
    algorithm_terms:
      - loss
      - mask
      - sample
    steps:
      - "We will demonstrate that SMM enables stronger model learning capacity than previous representative VR methods, via showing reduced approximation error in the PAC learning framework."
      - "The approximation error of F on D is Err_D^apx(F) = inf_{f in F} E_{(X,Y)~D} ell(f(X), Y) - R_D^*"