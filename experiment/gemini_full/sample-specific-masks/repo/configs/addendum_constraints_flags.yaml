    validation_check: "src.data.unit_smm_class.validate_cifar100"
    runnable_config_hook: "src.data.unit_smm_class.load_cifar100"
  cifar:
    id: "cifar"
    setup_metadata: "Generic CIFAR loader"
    validation_check: "src.data.unit_smm_class.validate_cifar"
    runnable_config_hook: "src.data.unit_smm_class.load_cifar"
  imagenet:
