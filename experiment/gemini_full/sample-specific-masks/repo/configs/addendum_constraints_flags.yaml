# Selectable method/baseline/variant factories
method_factories:
  PAD:
    class_path: "src.methods.unit_transformation_functions.PadBaseline"
    description: "Padding-based reprogramming"
  NARROW:
    class_path: "src.methods.unit_transformation_functions.NarrowBaseline"
    description: "Narrow padding binary mask with width of 28"
  MEDIUM:
    class_path: "src.methods.unit_transformation_functions.MediumBaseline"
    description: "Medium padding binary mask"
  FULL:
    class_path: "src.methods.unit_transformation_functions.FullBaseline"
    description: "Full padding binary mask"
  ONLY_delta:
    class_path: "src.methods.unit_smm_class.OnlyDeltaVariant"
    description: "Ablation variant: only delta is trained"
  ONLY_f_mask:
    class_path: "src.methods.unit_smm_class.OnlyFMaskVariant"
    description: "Ablation variant: only f_mask is trained"
  SINGLE_CHANNEL_f_mask:
    class_path: "src.methods.unit_smm_class.SingleChannelFMaskVariant"
    description: "Ablation variant: single-channel f_mask^s"
  ours:
    class_path: "src.methods.unit_smm_class.SMM"
    description: "Sample-specific Multi-channel Masks (SMM)"
  vit:
    class_path: "src.methods.unit_smm_class.ViTModelAdapter"
    description: "ViT-B32 pre-trained model adapter"
  resnet:
    class_path: "src.methods.unit_smm_class.ResNetModelAdapter"
    description: "ResNet-18/50 pre-trained model adapter"
  lora:
    class_path: "src.methods.unit_smm_class.LoRAModelAdapter"
    description: "LoRA baseline adapter"
  RandomLabelMapping:
    class_path: "src.methods.unit_labelmapper_class.RandomLabelMapping"
    description: "Random Label Mapping (Rlm)"

# Active route closure calls
active_route_closure:
  run_experiment: "main.run_experiment"
  compute_accuracy: "src.reporting.unit_smm_class.compute_accuracy"
  aggregate_accuracy: "src.reporting.unit_smm_class.aggregate_accuracy"
  compute_loss: "src.reporting.unit_smm_class.compute_loss"
  aggregate_loss: "src.reporting.unit_smm_class.aggregate_loss"
  compute_f1: "src.reporting.unit_smm_class.compute_f1"
  aggregate_f1: "src.reporting.unit_smm_class.aggregate_f1"
  compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_objective: "src.reporting.unit_smm_class.compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_objective"
  compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_score: "src.reporting.unit_smm_class.compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_score"
  write_main_artifact: "src.reporting.unit_smm_class.write_main_artifact"
  write_artifact_manifest: "src.reporting.unit_smm_class.write_artifact_manifest"
  train_preprocess: "src.methods.registry_make_results.train_preprocess"

# Addendum constraints and flags
addendum_constraints:
  IMAGENETNORMALIZE:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  model_imgsize:
    ViT_B32: 384
    default: 224
  train_preprocess_steps:
    - "transforms.Resize((imgsize + 32, imgsize + 32))"
    - "transforms.RandomCrop(imgsize)"
    - "transforms.RandomHorizontalFlip()"
    - "transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x)"
    - "transforms.ToTensor()"
    - "transforms.Normalize(mean, std)"
  test_preprocess_steps:
    - "transforms.Resize((imgsize, imgsize))"
    - "transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x)"
    - "transforms.ToTensor()"
    - "transforms.Normalize(mean, std)"
  feature_space_visualization:
    num_samples: 5000
  ucf101_hyperparameters:
    alpha: 0.001
    gamma: 1.0

# Formula and algorithm anchors
formula_algorithm_anchors:
  framework_of_smm:
    symbols: ["delta", "f_mask", "f_in", "delta_star", "d_P", "d_T", "x_i", "phi", "theta", "phi_star", "f_out", "f_P", "R_d", "y_i"]
    description: "Both methods use a pre-determined shared mask to indicate the valid location of pattern delta. We resize each target image and apply a different three-channel mask accordingly, driven by a lightweight f_mask with an interpolation up-scaling module."
  patch_wise_interpolation:
    symbols: ["delta", "delta_star", "f_in", "f_mask", "f_P", "f_out", "x_i", "y_i", "alpha_1", "alpha_2", "phi", "phi_star", "d_P", "sum_i"]
    defaults: [2, 0, 1]
  mask_generator_architecture:
    symbols: ["f_mask", "asset_8"]
    defaults: [3, 10, 1, 2, 0]
    description: "5-layer mask generator designed for ResNet"
  understanding_masks:
    symbols: ["delta", "R_plus", "R_D", "int_X", "p_X", "F_1", "F_2", "x_i", "d_P", "f_P", "f_out"]
    defaults: [0, 1, 2]