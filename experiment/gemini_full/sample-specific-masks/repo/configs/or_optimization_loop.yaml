# Selectable method/baseline/variant factories
method_factories:
  PAD:
    id: "PAD"
    class_path: "src.methods.unit_transformation_functions.PadVR"
    description: "Centering the original image and adding the noise pattern around the images"
  NARROW:
    id: "NARROW"
    class_path: "src.methods.unit_transformation_functions.NarrowVR"
    description: "Adding a narrow padding binary mask with a width of 28"
  MEDIUM:
    id: "MEDIUM"
    class_path: "src.methods.unit_transformation_functions.MediumVR"
    description: "Adding a medium padding binary mask"
  FULL:
    id: "FULL"
    class_path: "src.methods.unit_transformation_functions.FullVR"
    description: "Adding a full padding binary mask"
  ONLY_delta:
    id: "ONLY delta"
    class_path: "src.methods.unit_smm_class.OnlyDeltaSMM"
    description: "Ablation variant: only delta is trained"
  ONLY_f_mask:
    id: "ONLY f_mask"
    class_path: "src.methods.unit_smm_class.OnlyFMaskSMM"
    description: "Ablation variant: only f_mask is trained"
  SINGLE_CHANNEL_f_mask_s:
    id: "SINGLE-CHANNEL f_mask^s"
    class_path: "src.methods.unit_smm_class.SingleChannelSMM"
    description: "Ablation variant: single-channel mask generator"
  ours:
    id: "ours"
    class_path: "src.methods.unit_smm_class.SMM"
    description: "Sample-specific Multi-channel Masks (SMM)"
  vit:
    id: "vit"
    class_path: "src.methods.unit_smm_class.ViTReprogramming"
    description: "ViT-based visual prompting baseline"
  resnet:
    id: "resnet"
    class_path: "src.methods.unit_smm_class.ResNetReprogramming"
    description: "ResNet-based visual reprogramming baseline"
  lora:
    id: "lora"
    class_path: "src.methods.unit_smm_class.LoRAReprogramming"
    description: "LoRA baseline"
  Ours:
    id: "Ours"
    class_path: "src.methods.unit_smm_class.SMM"
    description: "Sample-specific Multi-channel Masks (SMM)"
  imagenet_1k:
    id: "imagenet_1k"
    class_path: "src.methods.unit_smm_class.ImageNet1kPretrained"
    description: "ImageNet-1K pre-trained model loader"
  SMM:
    id: "Sample-specific Multi-channel Masks (SMM)"
    class_path: "src.methods.unit_smm_class.SMM"
    description: "Sample-specific Multi-channel Masks (SMM)"
  Lightweight_Mask_Generator:
    id: "Lightweight Mask Generator Module"
    class_path: "src.methods.unit_smm_class.LightweightMaskGenerator"
    description: "Lightweight CNN mask generator f_mask"
  Patchwise_Interpolation:
    id: "Patch-wise Interpolation Module"
    class_path: "src.methods.unit_smm_class.PatchwiseInterpolation"
    description: "Patch-wise interpolation module to upscale the mask"
  Rlm:
    id: "Random Label Mapping (Rlm)"
    class_path: "src.methods.unit_labelmapper_class.RandomLabelMapping"
    description: "Random Label Mapping (Rlm) function"
  ResNet_18:
    id: "ResNet-18"
    class_path: "src.methods.unit_smm_class.ResNet18Loader"
    description: "Pre-trained ResNet-18 model"
  ResNet_50:
    id: "ResNet-50"
    class_path: "src.methods.unit_smm_class.ResNet50Loader"
    description: "Pre-trained ResNet-50 model"

# Executable orchestration matrix over declared paper-derived dimensions
experiment_matrix:
  datasets_or_tasks:
    - "unit-001"
    - "cifar"
    - "imagenet"
    - "svhn"
    - "ucf101"
    - "food101"
    - "sun397"
  methods_or_models:
    - "PAD"
    - "NARROW"
    - "MEDIUM"
    - "FULL"
    - "ONLY delta"
    - "ONLY f_mask"
    - "SINGLE-CHANNEL f_mask^s"
    - "ours"
    - "vit"
    - "resnet"
    - "lora"
  parameters:
    delta_init: 0.0
    frozen_pretrained: true
    learning_rate: [0.001, 0.01, 0.1]
    patch_size: [4, 2, 1]
    epochs: [1, 10, 50]

# Active route closure: calls same-package helper symbols
calls_symbols:
  run_experiment: "main.run_experiment"
  compute_accuracy: "src.methods.registry_make_results.compute_accuracy"
  aggregate_accuracy: "src.methods.registry_make_results.aggregate_accuracy"
  compute_loss: "src.methods.registry_make_results.compute_loss"
  aggregate_loss: "src.methods.registry_make_results.aggregate_loss"
  compute_f1: "src.methods.registry_make_results.compute_f1"
  aggregate_f1: "src.methods.registry_make_results.aggregate_f1"
  compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_objective: "src.methods.registry_make_results.compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_objective"
  compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_score: "src.methods.registry_make_results.compute_metric_entrypoint_artifact_writer_entrypoint_metric_entrypoint_score"
  write_main_artifact: "src.methods.registry_make_results.write_main_artifact"
  write_artifact_manifest: "src.methods.registry_make_results.write_artifact_manifest"
  train_preprocess: "src.methods.registry_make_results.train_preprocess"

# Bounded execution defaults
bounded_execution:
  smoke_mode: true
  default_dataset: "cifar"
  default_model: "resnet"
  default_method: "ours"
  default_epochs: 1
  default_learning_rate: 0.01
  default_patch_size: 4
  default_p: 1.0