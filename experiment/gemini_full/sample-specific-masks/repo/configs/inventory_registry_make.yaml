# configs/inventory_registry_make.yaml
# Reference Grounding: addendum:formula_algorithm_contract, chunk_005, chunk_007, chunk_008, chunk_009

metadata:
  paper_title: "Sample-specific Masks for Visual Reprogramming-based Prompting"
  active_reproduction_scope: "Reproduction of SMM (Sample-specific Multi-channel Masks) and baseline VR methods"

# Defined symbols for contract validation
symbols:
  ViT_B32: "ViT_B32"
  train_preprocess: "train_preprocess"
  compose_transforms_resizeimgsize_32_imgsize_32: "transforms.Resize((imgsize + 32, imgsize + 32))"
  randomcropimgsize: "transforms.RandomCrop(imgsize)"
  lambdalambdax_x_convert_rgb: "transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x)"
  normalizeimagenetnormalize_mean_imagenetnormalize_std: "transforms.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])"
  test_preprocess: "test_preprocess"
  compose_transforms_resizeimgsize_imgsize: "transforms.Resize((imgsize, imgsize))"
  d_T: "d_T"
  k_T: "k_T"
  x_i: "x_i"
  y_i: "y_i"
  f_P: "f_P"
  f_out: "f_out"
  f_in: "f_in"
  Y_sub: "Y_sub"
  min_thetainTheta_omegainOmega: "min_{theta in Theta, omega in Omega}"
  sum_i_1_n: "sum_i=1^n"
  theta: "theta"
  R_plus: "R^+"
  Theta: "Theta"
  delta: "delta"
  f_mask: "f_mask"
  d_P: "d_P"

# Numeric & Default Anchors
numeric_anchors:
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  vit_imgsize: 384
  default_imgsize: 224
  resize_padding: 32
  delta_init_value: 0.0
  frozen_pretrained: true
  default_p: 1.0
  default_epochs: 1
  default_learning_rate: 0.01
  default_patch_size: 4
  alpha_1: 1.0
  alpha_2: 1.0
  l_level: 2
  zero_val: 0
  one_val: 1
  two_val: 2
  three_val: 3
  ten_val: 10

# Paper evidence contract: expose method/baseline/attack selectors
selectors:
  methods:
    - ours
    - vit
    - resnet
    - lora
  baselines:
    - PAD
    - NARROW
    - MEDIUM
    - FULL
  ablation_variants:
    - ONLY_delta
    - ONLY_f_mask
    - SINGLE_CHANNEL_f_mask

# Paper evidence contract: expose bounded sweep/config entries
parameter_sweeps:
  p: [0.0, 0.5, 1.0]
  learning_rate: [0.001, 0.01, 0.1]
  patch_size: [4, 2, 1]
  epochs: [1, 10, 50]

# Paper evidence contract: expose fixed hyperparameter anchors
fixed_hyperparameters:
  three_seed_protocol: [42, 43, 44]
  delta_initialized_to_zero: true
  frozen_pretrained_model_parameters: true

