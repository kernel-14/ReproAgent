# Paper formula/algorithm anchor implementations
formula_algorithm_anchors:
  addendum_transforms:
    description: "The train and test transforms for each dataset are applied as follows"
    formula: |
      IMAGENETNORMALIZE = { 'mean': [0.485, 0.456, 0.406], 'std': [0.229, 0.224, 0.225] }
      if model == "ViT_B32":
          imgsize = 384
      else:
          imgsize = 224
      train_preprocess = transforms.Compose([
          transforms.Resize((imgsize + 32, imgsize + 32)),
          transforms.RandomCrop(imgsize),
          transforms.RandomHorizontalFlip(),
          transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x),
          transforms.ToTensor(),
          transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std'])
      ])
      test_preprocess = transforms.Compose([
          transforms.Resize((imgsize, imgsize)),
          transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x),
          transforms.ToTensor(),
          transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std'])
      ])

  framework_of_smm:
    description: "Framework of SMM: We resize each target image and apply a different three-channel mask accordingly, driven by a lightweight f_mask with an interpolation up-scaling module"
    formula: |
      f_in(x_i | phi, delta) = r(x_i) + delta * f_mask(r(x_i) | phi)
      objective: min_{phi, delta} sum_{i=1}^n loss(f_out(f_P(f_in(x_i | phi, delta))), y_i)

  patch_wise_interpolation:
    description: "Patch-wise Interpolation Module: upscales CNN-generated masks back to the original size H x W per channel"
    formula: |
      Upscales CNN-generated masks from floor(H / 2^l) x floor(W / 2^l) back to H x W per channel.
      Employ a grid of floor(H / 2^l) x floor(W / 2^l) patches, each sized 2^l x 2^l, ensuring the same values within each patch.

  problem_setting:
    description: "Problem Setting of Model Reprogramming"
    formula: |
      Let D_T represent the data distribution of a target task defined over X^T x Y^T.
      f_out(y | Y_sub^P) = rand({0, 1, ..., k^T})
      loss function: ell: Y^T x Y^T -> R^+ U {0}

  understanding_masks:
    description: "Understanding Masks in Visual Reprogramming for Classification"
    formula: |
      Err_D^apx(F) = inf_{f in F} E_{(X, Y) ~ D} ell(f(X), Y) - R_D^*