[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfg-guidance"
version = "0.1.0"
description = "Reproduction of 'Stay on topic with Classifier-Free Guidance'"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "accelerate>=0.20.0",
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
cfg-main = "main:main"
cfg-eval = "evaluate:main"
cfg-env-init = "cfg_guidance.env_registry:write_registry_artifacts"

[tool.setuptools.packages.find]
where = ["src"]
