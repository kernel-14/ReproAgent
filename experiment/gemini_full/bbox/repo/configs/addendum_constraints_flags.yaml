  unit-006: { alias: "data_pipeline", setup: "src/data/unit_python_pipeline.py", availability: true }
  achieving_improvements: { alias: "main_results", setup: "main.py", availability: true }
  determines_which: { alias: "method_selection", setup: "configs/task_setup_factory.yaml", availability: true }
  keep_all_paper_visible: { alias: "visibility_registry", setup: "configs/evidence_obligation_registry.yaml", availability: true }
