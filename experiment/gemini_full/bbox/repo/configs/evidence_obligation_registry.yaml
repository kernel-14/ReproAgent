# ==========================================
# 4. Parameter Sweeps & Hyperparameters
# ==========================================
parameter_sweeps:
  temperature: { default: 0.7 }
  learning_rate: { default: 0.0001 }
  batch_size: { default: 64, anchor: "batch_size_64" }
  beam_size: { values: [1, 3, 5] }
  iteration_count: { values: [3, 0, 1, 2, 4] }
  adapter_size: { values: [0.1, 0.3] }
  epochs: { default: 3 }
  fixed:
    nearest_neighbor_upsample: true

# ==========================================
# 5. Formula & Algorithm Symbol Inventory
# ==========================================
symbol_inventory:
  symbols:
    - ell_2
    - alpha
    - theta
    - y_2 # Defined symbol alias for y_+^2, y_-^2
    - y_+^2
    - y_-^2
    - x_i
    - y_i^t
    - Y^S
    - Y^T
    - p_LLM
    - Z_theta
    - LLM
    - g_theta
    - p_theta
    - x_k
    - p_data
    - p_LM
    - prod_ineqk
    - sum_k
    - LM
    - min_theta
    - max_theta
    - nabla_theta
    - y_+
  numeric_anchors:
    - 1
    - 2
    - 0
    - 4
    - 3
    - 5
    - 3.5
    - 44
    - 88
    - 66
    - 11
    - 128
    - 0.3
    - 384
    - 14
    - 21

# ==========================================
# 6. Formula & Algorithm Anchors
# ==========================================
formula_anchors:
  adapter_update_3_2:
    section: "3.2. Adapter Update"
    symbols: [p_theta, p_LLM, p_LM, prod_ineqk, LLM, sum_k, LM, theta, g_theta, min_theta, max_theta, nabla_theta, alpha, x_k]
    numeric_defaults: [1, 2]
    terms: [eq., loss, gradient, rank, sample]
  online_adaptation_3_4:
    section: "3.4. Online Adaptation"
    symbols: [p_theta, theta, nabla_theta, theta_t, p_data, y_+, y_-, x_i, y_i, y_i+^t, y_i-^t, y_i,j, y_i,1, y_i,2]
    numeric_defaults: [4, 1, 0, 2]
    terms: [eq., algorithm, loss, ema, compute, update, select, sample]
  ablation_nce_4_5:
    section: "4.5. Ablation Study: Effect of Ranking-based NCE Loss"
    terms: [loss, mask, rank, search]
  nce_gradients_proof_b:
    section: "B. Proof for Ranking-based NCE Gradients"
    symbols: [theta, g_theta, sum_k, nabla_theta, sum_m, p_theta, p_data, k^prime, x_k, x_m]
    numeric_defaults: [2, 1]
    terms: [eq., loss, gradient, rank, compute]
  spectral_normalization_addendum:
    section: "addendum"
    symbols: [ell_2, alpha, theta, y_+^2, y_-^2]
    formula: "alpha * E[g_theta(x, y_+)^2] + alpha * E[g_theta(x, y_-)^2]"

