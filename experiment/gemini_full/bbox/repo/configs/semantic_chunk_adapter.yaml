# configs/semantic_chunk_adapter.yaml
# reference_grounding: paperbench_ref_002 lora.ipynb

# ==========================================
# 1. Method & Baseline Registry
# ==========================================
# complete method/baseline selector set must include ours, chain_of_thought, oracle, heuristic, roberta, fine_tuning, lora, sft_lora, azure_sft, mlm, bbox_adapter, ranking_nce, online_adaptation, single_step_inference, full_step_inference, ai_feedback, ppo, energy_based_model.
method_registry:
  selectors:
    - ours
    - chain_of_thought
    - oracle
    - heuristic
    - roberta
    - fine_tuning
    - lora
    - sft_lora
    - azure_sft
    - mlm
    - bbox_adapter
    - ranking_nce
    - online_adaptation
    - single_step_inference
    - full_step_inference
    - ai_feedback
    - ppo
    - energy_based_model

# ==========================================
# 2. Dataset & Benchmark Registry
# ==========================================
# explicitly register dataset/benchmark aliases for gsm8k, strategyqa, truthfulqa, scienceqa, toxigen.
dataset_registry:
  gsm8k:
    id: "gsm8k"
    alias: "gsm8k"
    setup_metadata: { loader: "src.data.bbox_qa_benchmark.load_gsm8k" }
  strategyqa:
    id: "strategyqa"
    alias: "strategyqa"
    setup_metadata: { loader: "src.data.bbox_qa_benchmark.load_strategyqa" }
  truthfulqa:
    id: "truthfulqa"
    alias: "truthfulqa"
    setup_metadata: { loader: "src.data.bbox_qa_benchmark.load_truthfulqa" }
  scienceqa:
    id: "scienceqa"
    alias: "scienceqa"
    setup_metadata: { loader: "src.data.bbox_qa_benchmark.load_scienceqa" }
  toxigen:
    id: "toxigen"
    alias: "toxigen"
    setup_metadata: { loader: "src.data.bbox_qa_benchmark.load_toxigen" }

# ==========================================
# 3. Environment & Task Factories
# ==========================================
environment_factories:
  unit-001: { id: "unit-001", alias: "cli_entry", setup: "main.py" }
  unit-006: { id: "unit-006", alias: "data_eval", setup: "src/data/unit_python_pipeline.py" }
  achieving_improvements: { id: "achieving improvements", alias: "main_hypothesis" }
  determines_which: { id: "determines which", alias: "selection_logic" }
  keep_all_paper_visible: { id: "keep all paper-visible", alias: "visibility_contract" }
  config_data_pipeline: { id: "config data-pipeline", alias: "pipeline_config" }
  config_factory: { id: "config factory", alias: "factory_config" }
  registry_configuration_artifact: { id: "registry configuration artifact", alias: "registry_config" }
  decides_which: { id: "decides which", alias: "decision_logic" }
  config_tests_artifact_writer_expose_explicit: { id: "config tests artifact-writer expose explicit", alias: "writer_config" }
  bind_each_baseline: { id: "bind each baseline", alias: "baseline_binding" }
  worse_ablation_performance_without_fabricating: { id: "worse ablation performance without fabricating", alias: "ablation_logic" }

# ==========================================
# 4. Parameter Sweeps & Defaults
# ==========================================
# complete bounded parameter sweeps must include temperature; learning_rate; batch_size; beam_size values 1, 3, 5; iteration_count values 3, 0, 1, 2, 4; adapter_size values 0.1, 0.3; epochs.
parameter_sweeps:
  temperature: 0.7
  learning_rate: 0.0001
  batch_size: 64
  beam_size: [1, 3, 5]
  iteration_count: [3, 0, 1, 2, 4]
  adapter_size: [0.1, 0.3]
  epochs: 3

# ==========================================
# 5. Numeric Constants & Defaults
# ==========================================
# numeric/defaults 4, 1, 0, 2, 3, 5, 3.5, 0.1, 0.3, 128, 384
numeric_constants:
  online_adaptation_iterations: 4
  positive_samples_per_input: 1
  negative_samples_per_input: 2
  unfinetuned_adapter_t0: 0
  beam_size_default: 5
  scale_analysis_score_threshold: 3.5
  adapter_size_small: 0.1
  adapter_size_large: 0.3
  sft_lora_rank: 128
  sft_lora_alpha: 384

# ==========================================
# 6. BBox-Adapter Core Implementation (Section 3)
# ==========================================
# interface_contract: make_adapter(config), apply_shift_module(features, config)
adapter_config:
  make_adapter: "src.methods.semantic_chunk_adapter.make_adapter"
  apply_shift_module: "src.methods.semantic_chunk_adapter.apply_shift_module"
  base_model: "roberta-base"
  adapter_size: 0.1 # 0.1B version
  shift_module:
    input_dim: 768
    output_dim: 768
    theta: "adapter_parameters" # symbol: theta

# ==========================================
# 7. Algorithm & Formula Anchors
# ==========================================
# 3.1 Black-Box LLM Adaptation as EBM
ebm_perspective:
  equation: "Eq.(1)" # symbol: equation
  p_LLM: "black_box_llm_distribution"
  p_theta: "adapted_distribution"
  g_theta: "energy_function"
  Z_theta: "partition_function"
  x_i: "input_sequence" # symbol: x_i

# 3.2 Adapter Update & 3.4 Online Adaptation
# symbols: loss, rank, update, gradient, alpha, ell_2, y_2
training_logic:
  loss_type: "ranking_nce" # symbol: loss, rank
  ranking_nce:
    equation: "Eq.(3)"
    alpha: 0.01 # symbol: alpha (spectral normalization weight)
    ell_2: true # symbol: ell_2
    y_2: true # symbol: y_2 (regularization of energies)
    gradient_hook: "src.methods.semantic_chunk_loss.compute_ranking_nce_gradient" # symbol: gradient
  online_adaptation:
    algorithm: "Algorithm 1" # symbol: update
    ema_decay: 0.99
    iteration_count: 4 # numeric/defaults 4
    positive_sample_source: "p_data"
    negative_sample_source: "p_theta"

# 4.5 Ablation Study: MLM vs Ranking-based NCE
ablation_study:
  mlm_loss:
    enabled: true
    mask_prob: 0.15
  ranking_nce_loss:
    enabled: true

# 4.6 Scale Analysis & Beam Search
# symbol: search
inference_logic:
  search_method: "adapted_beam_search" # symbol: search
  beam_size: 5
  iteration_count: 3 # T=3
  unfinetuned_adapter_t0: 0 # numeric/defaults 0

# ==========================================
# 8. Artifact Registry
# ==========================================
# calls_symbols: write_model_registry_artifact, write_figure_1_artifact, etc.
artifact_registry:
  model_registry:
    path: "results/model_registry.json"
    writer: "src.reporting.semantic_chunk_adapter.write_model_registry_artifact"
  figure_1:
    path: "results/figures/figure_1.png"
    writer: "src.reporting.semantic_chunk_adapter.write_figure_1_artifact"
  table_1:
    path: "results/tables/table_1.csv"
    writer: "src.reporting.semantic_chunk_adapter.write_table_1_artifact"
  figure_2:
    path: "results/figures/figure_2.png"
    writer: "src.reporting.semantic_chunk_adapter.write_figure_2_artifact"
  table_2:
    path: "results/tables/table_2.csv"
    writer: "src.reporting.semantic_chunk_adapter.write_table_2_artifact"
  table_3:
    path: "results/tables/table_3.csv"
    writer: "src.reporting.semantic_chunk_adapter.write_table_3_artifact"
  table_4:
    path: "results/tables/table_4.csv"
    writer: "src.reporting.semantic_chunk_adapter.write_table_4_artifact"
  table_5:
    path: "results/tables/table_5.csv"
    writer: "src.reporting.semantic_chunk_adapter.write_table_5_artifact"

# ==========================================
# 9. Test Configuration
# ==========================================
tests:
  smoke_test:
    mode: "runtime_smoke"
    command: "python main.py --mode runtime_smoke"
    timeout: 10
  adapter_validation:
    hook: "tests.test_semantic_chunk_adapter.validate_adapter_output"