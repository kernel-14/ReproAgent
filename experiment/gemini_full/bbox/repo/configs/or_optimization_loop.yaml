# ==========================================
# 5. Parameter Sweeps
# ==========================================
parameter_sweeps:
  temperature: 0.7
  learning_rate: 0.0001
  batch_size: 64
  beam_size: [1, 3, 5] # symbols: search
  iteration_count: [3, 0, 1, 2, 4] # symbols: update
  adapter_size: [0.1, 0.3]
  epochs: 3

