# configs/or_optimization_loop.yaml
# reference_grounding: paperbench_ref_002 lora.ipynb

# ==========================================
# 1. Optimization Loop Configuration
# ==========================================
# 3.4. Online Adaptation
# symbols: p_theta, theta, nabla_theta, theta_t, p_data, y_+, y_-, x_i, y_i, y_i+^t, y_i-^t, y_i,j, y_i,1, y_i,2
# numeric/defaults: 4, 1, 0, 2
online_adaptation:
  enabled: true
  iteration_count: [3, 0, 1, 2, 4] # Sweep values
  default_iteration_count: 3
  ema_decay: 0.99 # symbols: ema
  batch_size: 64 # numeric/defaults: 64
  learning_rate: 0.0001
  temperature: 0.7
  adapter_size: [0.1, 0.3] # Sweep values
  default_adapter_size: 0.1
  # symbols: x_i, y_i
  sample_params:
    pos_samples: 1 # numeric/defaults: 1
    neg_samples: 2 # numeric/defaults: 2
    max_steps: 4 # numeric/defaults: 4
    min_steps: 0 # numeric/defaults: 0

# 3.2. Adapter Update
# symbols: x_k, p_theta, p_data, p_LLM, p_LM, prod_ineqk, LLM, x_i, sum_k, LM, theta, g_theta, min_theta, max_theta, nabla_theta, alpha, x_k
# numeric/defaults: 1, 2
adapter_update:
  loss_type: "ranking_nce" # symbols: loss, rank
  spectral_normalization:
    alpha: 0.01 # symbols: alpha
    ell_2: true # symbols: ell_2
    y_2: true # symbols: y_2 (representing y_+^2 and y_-^2 from Equation 3)
  gradient_clipping: 1.0 # symbols: gradient
  # symbols: theta, g_theta
  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.01

# 3.1. Black-Box LLM Adaptation as EBM
# symbols: p_LLM, Z_theta, LLM, g_theta, p_theta, theta, x_i, y_i^t, Y^S, Y^T
ebm_config:
  equation: "Eq.(1)" # symbols: equation
  partition_function_approx: "sampling"
  source_domain: "Y^S"
  target_domain: "Y^T"

# 4.6. Scale Analysis
# numeric/defaults: 4, 1, 3, 5, 3.5, 0, 2
scale_analysis:
  beam_size: [1, 3, 5] # symbols: search
  iteration_count: [3, 0, 1, 2, 4]
  threshold: 3.5 # numeric/defaults: 3.5

# ==========================================
# 2. Method & Baseline Selectors
# ==========================================
# complete method/baseline selector set
method_registry:
  selectors:
    - ours
    - chain_of_thought
    - oracle
    - heuristic
    - roberta
    - fine_tuning
    - lora
    - sft_lora
    - azure_sft
    - mlm
    - bbox_adapter
    - ranking_nce
    - online_adaptation
    - single_step_inference
    - full_step_inference
    - ai_feedback
    - ppo
    - energy_based_model

# ==========================================
# 3. Dataset & Benchmark Loaders
# ==========================================
dataset_registry:
  gsm8k: { id: "gsm8k", alias: "gsm8k", setup: "src/data/bbox_qa_benchmark.py" }
  strategyqa: { id: "strategyqa", alias: "strategyqa", setup: "src/data/bbox_qa_benchmark.py" }
  truthfulqa: { id: "truthfulqa", alias: "truthfulqa", setup: "src/data/bbox_qa_benchmark.py" }
  scienceqa: { id: "scienceqa", alias: "scienceqa", setup: "src/data/bbox_qa_benchmark.py" }
  toxigen: { id: "toxigen", alias: "toxigen", setup: "src/data/bbox_qa_benchmark.py" }

# ==========================================
# 4. Environment & Task Factories
# ==========================================
environment_factories:
