    assertion: "ours > chain_of_thought"

# ==========================================
# 8. Executable Algorithm & Formula Anchors
# ==========================================
formula_anchors:
  ebm_adaptation:
    section: "3.1. Black-Box LLM Adaptation as EBM"
    symbols:
      p_LLM: "p_LLM"
      LLM: "LLM"
      x_i: "x_i"
      y_i_t: "y_i^t"
      Y_S: "Y^S"
      Y_T: "Y^T"
      Z_theta: "Z_theta"
      g_theta: "g_theta"
      p_theta: "p_theta"
      theta: "theta"
    numeric_defaults:
      value: 1
    algorithm_terms:
      - equation
      - ema
    formula: "p_theta(y | x) = p_LLM(y | x) * exp(g_theta(x, y)) / Z_theta(x)"

  adapter_update:
    section: "3.2. Adapter Update"
    symbols:
      p_LLM: "p_LLM"
      LLM: "LLM"
      x_k: "x_k"
      p_theta: "p_theta"
      p_data: "p_data"
      p_LM: "p_LM"
      prod_ineqk: "prod_ineqk"
      x_i: "x_i"
      sum_k: "sum_k"
      LM: "LM"
      theta: "theta"
      g_theta: "g_theta"
      min_theta: "min_theta"
      max_theta: "max_theta"
      nabla_theta: "nabla_theta"
      alpha: "alpha"
    numeric_defaults:
      value_1: 1
      value_2: 2
    algorithm_terms:
      - eq.
      - loss
      - gradient
      - rank
      - sample
    formula: "nabla_theta ell(theta) = nabla_theta { -E_{y_+ ~ p_data}[g_theta(x, y_+)] + E_{y_- ~ p_theta}[g_theta(x, y_-)] + alpha * E[g_theta(x, y_+)^2] + alpha * E[g_theta(x, y_-)^2] }"

  adapted_inference:
    section: "3.3. Adapted Inference"
    symbols:
      p_LLM: "p_LLM"
      LLM: "LLM"
      s_1: "s^1"
      s_2: "s^2"
      s_L: "s^L"
      s_1_L: "s^1:L"
      s_l: "s^l"
      p_theta: "p_theta"
      g_theta: "g_theta"
      prod_l: "prod_l"
      s_1_l_minus_1: "s^1:l-1"
    numeric_defaults:
      value_1: 1
      value_2: 2
    formula: "y = [s^1, s^2, ..., s^L] = s^1:L"

  online_adaptation:
    section: "3.4. Online Adaptation"
    symbols:
      p_data: "p_data"
      y_plus: "y_+"
      y_minus: "y_-"
      p_theta: "p_theta"
      theta: "theta"
      x_i: "x_i"
      y_i: "y_i"
      y_i_plus_t: "y_i+^t"
      y_i_minus_t: "y_i-^t"
      nabla_theta: "nabla_theta"
      theta_t: "theta_t"
      y_i_j: "y_i,j"
      y_i_1: "y_i,1"
      y_i_2: "y_i,2"
    numeric_defaults:
      value_4: 4
      value_1: 1
      value_0: 0
      value_2: 2
    algorithm_terms:
      - eq.
      - algorithm
      - loss
      - ema
      - compute
      - update
      - select
      - sample
    steps:
      - "Draw positive samples from target domain distribution y_+ ~ p_data"
      - "Draw negative samples from adapted generations y_- ~ p_theta"
      - "Update adapter parameters theta using NCE loss"

  ablation_study:
    section: "4.5. Ablation Study: Effect of Ranking-based NCE Loss"
    algorithm_terms:
      - loss
      - mask
      - rank
      - search
    steps:
      - "Compare ranking-based NCE loss against Masked Language Modeling (MLM) loss"
      - "For MLM, generate text chunks, randomly mask words, and train adapter using masked word as supervision"

  scale_analysis:
    section: "4.6. Scale Analysis"
    numeric_defaults:
      value_4: 4
      value_1: 1
      value_3: 3
      value_5: 5
      value_3_5: 3.5
      value_0: 0
      value_2: 2
    algorithm_terms:
      - search
    steps:
      - "Un-finetuned adapter (T=0) performs worse than base model due to inaccurate scores misguiding beam search"

