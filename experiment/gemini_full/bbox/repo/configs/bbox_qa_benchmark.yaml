# ==========================================
# 3. Baselines & Methods
# ==========================================
baselines:
  - ours
  - chain_of_thought
  - oracle
  - heuristic
  - roberta
  - fine_tuning
  - lora
  - sft_lora
  - azure_sft
  - mlm
  - bbox_adapter
  - ranking_nce
  - online_adaptation
  - single_step_inference
  - full_step_inference
  - ai_feedback

# ==========================================
# 4. Parameter Sweeps & Hyperparameters
# ==========================================
parameter_sweeps:
  temperature: 0.7
  learning_rate: 0.0001
  batch_size: 64
  beam_size: [1, 3, 5]
  iteration_count: [3, 0, 1, 2, 4]
  adapter_size: [0.1, 0.3]
  fixed_hyperparameters:
    batch_size_64: 64
    nearest_neighbor_upsample: true

# ==========================================
# 5. Metric Formulas & Aggregations
# ==========================================
metrics:
  accuracy:
    id: "accuracy"
    canonical_identifier: "metric_accuracy"
    formula: "correct_predictions / total_predictions"
    aggregation: "mean"
  table_2_reproduction_artifact:
    id: "table 2 reproduction artifact"
    canonical_identifier: "metric_table_2_reproduction_artifact"
    formula: "accuracy"
    aggregation: "mean"
  table_4_reproduction_artifact:
    id: "table 4 reproduction artifact"
    canonical_identifier: "metric_table_4_reproduction_artifact"
    formula: "accuracy"
    aggregation: "mean"
  loss:
    id: "loss"
    canonical_identifier: "metric_loss"
    formula: "ranking_nce_loss"
    aggregation: "mean"
  training_cost:
    id: "training_cost"
    canonical_identifier: "metric_training_cost"
    formula: "gpu_hours * cost_per_hour"
    aggregation: "sum"
  inference_cost:
    id: "inference_cost"
    canonical_identifier: "metric_inference_cost"
    formula: "api_cost + compute_cost"
    aggregation: "sum"
  api_cost:
    id: "api_cost"
    canonical_identifier: "metric_api_cost"
    formula: "tokens * cost_per_token"
    aggregation: "sum"
  memory_usage:
    id: "memory_usage"
    canonical_identifier: "metric_memory_usage"
    formula: "max_vram_allocated"
    aggregation: "max"
  gpu_memory:
    id: "gpu_memory"
    canonical_identifier: "metric_gpu_memory"
    formula: "max_gpu_memory"
    aggregation: "max"
  toxicity:
    id: "toxicity"
    canonical_identifier: "metric_toxicity"
    formula: "toxic_generations / total_generations"
    aggregation: "mean"

