# ==========================================
# 6. Concrete Paper Formula & Algorithm Anchors
# ==========================================
formula_anchors:
  section_3_1_ebm:
    title: "3.1. Black-Box LLM Adaptation as EBM"
    symbols: [p_LLM, Z_theta, LLM, g_theta, p_theta, theta, x_i, y_i^t, Y^S, Y^T]
    numeric_defaults: [1]
    algorithm_terms: [equation, ema]
    formula: "p_theta(y | x) = p_LLM(y | x) * exp(g_theta(x, y)) / Z_theta(x)"

  section_3_2_adapter_update:
    title: "3.2. Adapter Update"
    symbols: [p_theta, p_LLM, p_LM, prod_ineqk, LLM, sum_k, LM, theta, g_theta, min_theta, max_theta, nabla_theta, alpha, x_k]
    numeric_defaults: [1, 2]
    algorithm_terms: [eq., loss, gradient, rank, sample]
    steps:
      - "Instead, we employ a ranking-based NCE loss that prioritizes ranking true data samples higher than noise (Ma & Collins, 2018)."
      - "Assuming the auxiliary label differentiates between a positive sample from data and a negative one from the LLM, we consider the samples {x_k} to estimate the posterior of the label distribution."

  section_3_4_online_adaptation:
    title: "3.4. Online Adaptation"
    symbols: [p_theta, theta, nabla_theta, theta_t, p_data, y_+, y_-, x_i, y_i, y_i+^t, y_i-^t, y_i,j, y_i,1, y_i,2]
    numeric_defaults: [4, 1, 0, 2]
    algorithm_terms: [eq., algorithm, loss, ema, compute, update, select, sample]
    steps:
      - "Online Adaptation: According to the NCE loss function in Eq.(3), it is essential to draw positive samples from the real distribution of the target domain, denoted as y_+ ~ p_data(y | x), and negative samples from its own generations, y_- ~ p_theta(y | x), to update the adapter parameters theta."
      - "We propose an online adaptation framework (Algorithm 1) with iterative sampling and training to address these challenges, drawing training samples from dynamic distributions."

  section_4_5_ablation_study:
    title: "4.5. Ablation Study: Effect of Ranking-based NCE Loss"
    algorithm_terms: [loss, mask, rank, search]
    steps:
      - "We compare the efficacy of ranking-based NCE loss against the Masked Language Modeling (MLM) loss."
      - "For the MLM-based approach, we generate text chunks from the groundtruth data, randomly masking words, and then train the adapter using the masked word as supervision."

  section_b_proof_nce_gradients:
    title: "B. Proof for Ranking-based NCE Gradients"
    symbols: [theta, g_theta, sum_k, nabla_theta, sum_m, p_theta, p_data, k^prime, x_k, x_m]
    numeric_defaults: [2, 1]
    algorithm_terms: [eq., loss, gradient, rank, compute]
    steps:
      - "Proof for Ranking-based NCE Gradients: We can rewrite the loss function in Eq.(2) as: -ell(theta) = E_{p_data(x)}[g_theta(x) - log sum_{k'} exp(g_theta(x_k'))]"

  section_f_2_additional_baseline_details:
    title: "F.2. Additional Baseline Details"
    symbols: [alpha]
    numeric_defaults: [0, 128, 0.3, 384, 2]
    formula: "Specifically, to maintain the same size as the 0.1B version of BBOX-ADAPTER, we set r=128 for SFT-LoRA."

  addendum_spectral_normalization:
    title: "addendum"
    symbols: [ell_2, alpha, theta, y_+^2, y_-^2]
    algorithm_terms: [equation]
    formula: "- The paper mentions 'spectral normalization' in Section 3.2, which is implemented as l2 regularization of the energies (alpha * E[g_theta(x, y_+)^2] + alpha * E[g_theta(x, y_-)^2]) as shown in Equation 3, rather than using power iteration methods."