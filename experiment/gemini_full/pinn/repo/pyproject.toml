[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinns_loss_landscape"
version = "0.1.0"
description = "Challenges in Training PINNs: A Loss Landscape Perspective"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "PaperBench Repro Agent", email = "agent@paperbench.org"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
# Heavy simulator/training dependencies declared separately from lightweight core dependencies
training = [
    "torch>=1.11.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[tool.setuptools]
packages = ["src"]