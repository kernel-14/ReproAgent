# 7. Callable Protocol Matrix (Experiment Registry)
experiment_registry:
  Experiment I: ExORL Main Comparison:
    environment: "deepmind_control"
    method_selector: "ours"
    metric_function: "compute_reward"
    artifact_writer: "write_table_1_artifact"
    output_path: "results/tables/table_1.csv"
  Experiment II: D4RL Zero-Shot Transfer:
    environment: "robotics"
    method_selector: "ours"
    metric_function: "compute_reward"
    artifact_writer: "write_table_2_artifact"
    output_path: "results/tables/table_2.csv"
  Experiment III: Scaling with Reward Families:
    environment: "deepmind_control"
    method_selector: "ours"
    metric_function: "compute_reward"
    artifact_writer: "write_sensitivity_report"
    output_path: "results/sensitivity_report.json"
  Experiment IV: Domain Knowledge Augmentation:
    environment: "robotics"
    method_selector: "ours"
    metric_function: "compute_reward"
    artifact_writer: "write_metrics_artifact"
    output_path: "results/metrics.json"
  Experiment V: Extended Baselines (PPO, PBT, PQL):
    environment: "deepmind_control"
    method_selector: "ppo"
    metric_function: "compute_reward"
    artifact_writer: "write_table_3_artifact"
    output_path: "results/tables/table_3.csv"

