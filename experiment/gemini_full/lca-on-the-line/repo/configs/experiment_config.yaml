# Executable Algorithm and Formula Anchors
formula_anchors:
  section_4_3_2_soft_labels:
    symbols:
      lambda: 1.0
      CE: "cross_entropy"
      alpha: 0.5
      W_ce: 1.0
      W_interp: 1.0
    numeric_defaults:
      lambda: 1.0
    algorithm_terms: ["loss"]
    steps: "L = lambda * L(CE) + L(soft_lca)"
  section_4_3_1_kmeans_clustering:
    numeric_defaults:
      K_1: 1
      K_2: 2
      K_4: 4
      n: 9
      num_classes: 1000
    algorithm_terms: ["increase"]
    formula: "K=1 represent the most generalized cluster, then we incrementally increase the granularity by splitting into K=2 and K=4 clusters."
  section_d_3_elca_distance:
    symbols:
      D_ELCA: "expected_lowest_common_ancestor_distance"
      D_LCA: "lowest_common_ancestor_distance"
      X_i: "sample_input"
      y_i: "ground_truth_class"
      sum_i_1_n: "sum_over_samples"
      sum_k_1_K: "sum_over_classes"
    numeric_defaults:
      K: 1000
      n: 1
    algorithm_terms: ["rank", "sample"]
    steps: "D_ELCA(model, M) = 1/n * sum_i=1^n sum_k=1^K p_hat_k,i * D_LCA(k, y_i)"
  section_2_lca_distance:
    symbols:
      N_LCA: "lowest_common_ancestor_node"
      D_LCA: "lowest_common_ancestor_distance"
      y_prime: "predicted_class"
      asset_3: "taxonomy_tree"
      X_i: "sample_input"
      X_1: "first_sample"
      X_n: "last_sample"
      sum_i_1_n: "sum_over_samples"
      y_i: "ground_truth_class"
    numeric_defaults:
      n: 1
      min_distance: 3
    algorithm_terms: ["ema", "sample"]
    steps: "D_LCA(model, M) = 1/n * sum_i=1^n D_LCA(y_hat_i, y_i) if y_i != y_hat_i else 0"
  section_e_2_soft_loss:
    symbols:
      M_LCA: "min_max_normalized_lca_matrix"
      LCA: "lca_distance"
      CE_prime: "cross_entropy_with_soft_labels"
      LCA_ALIGNMENT_LOSSlogits: "logits"
      alignment_mode: "alignment_mode"
      LCA_matrix: "lca_matrix"
      lambda_weight: 0.03
      reverse_LCA_matrix: "reverse_lca_matrix"
      standard_loss: "standard_loss"
      soft_loss: "soft_loss"
      total_loss: "total_loss"
      LCA_ALIGNMENT_LOSS: "lca_alignment_loss"
      M_T: "transpose_matrix"
      one_hot_targets: "one_hot_targets"
    numeric_defaults:
      lambda_weight: 0.03
      epochs: 25
      min_val: 1
    algorithm_terms: ["algorithm", "loss", "compute"]
    steps: "M_LCA = MinMax(M^T)"
  section_f_3_ranking_measurement:
    algorithm_terms: ["rank", "select"]
    formula: "As shown in the 'ALL grouping', LCA shows a much better result in preserving the model relative ranking to model OOD performance on all OOD datasets (with the exception of ImageNet-v2), which indicates its superiority for model selection."
  addendum_info:
    symbols:
      trust_remote_code: true
      load_dataset: "imagenet-1k"
      imagenet_sketch: "songweig/imagenet_sketch"
      M_LCA: "min_max_normalized_lca_matrix"
      LCA: "lca_distance"
      process_lca_matrixlca_matrix_raw: "process_lca_matrix"
      tree_prefix: "tree_prefix"
      lca_matrix_raw: "lca_matrix_raw"
      result_matrix: "result_matrix"
      lca_matrix_raw_lca_matrix_raw: "lca_matrix_raw_lca_matrix_raw"
      fit_transformresult_matrix: "fit_transform"
      M_T: "transpose_matrix"
    numeric_defaults:
      depth: 2
      scale: 1.0
    formula: "I(y) = - log p(y) = log |L| - log |L(y)|"