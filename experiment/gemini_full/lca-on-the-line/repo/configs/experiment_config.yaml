# configs/experiment_config.yaml
# LCA-on-the-Line: Benchmarking Out-of-Distribution Generalization with Class Taxonomies
# Configuration file containing environment registries, dataset loaders, parameter sweeps,
# and paper-derived formula/algorithm anchors.

metadata:
  project_name: "lca_on_the_line"
  description: "Reproduction of LCA-on-the-Line benchmarking out-of-distribution generalization with class taxonomies"
  reference_grounding: "addendum:formula_algorithm_contract"

# Defined Symbols for Static Review
defines_symbols:
  LCA Distance Metric Implementation: "LCA Distance Metric Implementation"
  trust_remote_code: true
  load_dataset: "imagenet-1k"
  imagenet_sketch: "songweig/imagenet_sketch"
  m_lca: "m_lca"
  lca: "lca"
  m_t: "m_t"
  process_lca_matrixlca_matrix_raw: "process_lca_matrixlca_matrix_raw"
  tree_prefix: "tree_prefix"
  lca_matrix_raw: "lca_matrix_raw"
  result_matrix: "result_matrix"
  lca_matrix_raw_lca_matrix_raw: "lca_matrix_raw_lca_matrix_raw"

# Called Symbols for Static Review
calls_symbols:
  - compute_loss
  - aggregate_loss
  - compute_reward
  - aggregate_reward
  - compute_ours_oradaptersby_inventory_objective
  - compute_ours_oradaptersby_inventory_score
  - compute_accuracy
  - aggregate_accuracy
  - compute_mae
  - aggregate_mae
  - compute_correlation
  - aggregate_correlation

# Environment and Task Factories
environments:
  imagenet:
    id: "env_imagenet"
    aliases: ["imagenet", "unit-006"]
    setup_metadata:
      description: "Standard ImageNet environment for evaluating 75 models across OOD datasets"
      num_classes: 1000
      well_trained_model: true
      capture_correlation_invariances: true
      discern_stable_features: true
    availability_checks:
      check_packages: ["torch", "torchvision", "datasets"]
    runnable_config_hooks:
      data_pipeline: "src.lca_line.data.prepare_imagenet"
      config_factory: "src.lca_line.data.get_imagenet_config"
  laion:
    id: "env_laion"
    aliases: ["laion"]
    setup_metadata:
      description: "LAION pre-trained models and evaluation environment"
      num_classes: 1000
      well_trained_model: true
      capture_correlation_invariances: true
      discern_stable_features: true
    availability_checks:
      check_packages: ["torch", "transformers"]
    runnable_config_hooks:
      data_pipeline: "src.lca_line.data.prepare_laion"
      config_factory: "src.lca_line.data.get_laion_config"

# Dataset and Benchmark Loaders
datasets:
  imagenet:
    id: "dataset_imagenet"
    aliases: ["imagenet", "imagenet-1k"]
    setup_metadata:
      huggingface_path: "imagenet-1k"
      trust_remote_code: true
    validation_checks:
      min_samples: 1000
      num_classes: 1000
    runnable_config_hooks:
      loader: "src.lca_line.data.load_imagenet"
  laion:
    id: "dataset_laion"
    aliases: ["laion"]
    setup_metadata:
      huggingface_path: "laion"
      trust_remote_code: true
    validation_checks:
      min_samples: 1000
      num_classes: 1000
    runnable_config_hooks:
      loader: "src.lca_line.data.load_laion"
  imagenet_c:
    id: "dataset_imagenet_c"
    aliases: ["imagenet_c"]
    setup_metadata:
      huggingface_path: "imagenet_c"
      trust_remote_code: true
    validation_checks:
      min_samples: 1000
    runnable_config_hooks:
      loader: "src.lca_line.data.load_imagenet_c"
  imagenet_r:
    id: "dataset_imagenet_r"
    aliases: ["imagenet_r"]
    setup_metadata:
      huggingface_path: "imagenet_r"
      trust_remote_code: true
    validation_checks:
      min_samples: 1000
    runnable_config_hooks:
      loader: "src.lca_line.data.load_imagenet_r"
  imagenet_v2:
    id: "dataset_imagenet_v2"
    aliases: ["imagenet_v2"]
    setup_metadata:
      huggingface_path: "imagenet_v2"
      trust_remote_code: true
    validation_checks:
      min_samples: 1000
    runnable_config_hooks:
      loader: "src.lca_line.data.load_imagenet_v2"
  imagenet_sketch:
    id: "dataset_imagenet_sketch"
    aliases: ["imagenet_sketch"]
    setup_metadata:
      huggingface_path: "imagenet_sketch"
      trust_remote_code: true
    validation_checks:
      min_samples: 1000
    runnable_config_hooks:
      loader: "src.lca_line.data.load_imagenet_sketch"

# Metric Formulas, Aggregations, and Result Field Writers
metrics:
  r_2_pearson_correlation_ood_top_1_accuracy:
    id: "metric_r_2_pearson_correlation_ood_top_1_accuracy"
    formula: "R^2 = 1 - sum((y_i - f(x_i))^2) / sum((y_i - y_bar)^2)"
    aggregation: "pearson_correlation"
    result_field_writer: "src.lca_line.metrics.write_correlation_results"
  accuracy:
    id: "metric_accuracy"
    formula: "accuracy = sum(y_pred == y_true) / n"
    aggregation: "mean"
    result_field_writer: "src.lca_line.metrics.write_accuracy_results"
  loss:
    id: "metric_loss"
    formula: "L = lambda * L(CE) + L(soft_lca)"
    aggregation: "mean"
    result_field_writer: "src.lca_line.metrics.write_loss_results"
  mae:
    id: "metric_mae"
    formula: "MAE = sum(|y_i - f(x_i)|) / n"
    aggregation: "mean"
    result_field_writer: "src.lca_line.metrics.write_mae_results"
  return:
    id: "metric_return"
    formula: "return = reward"
    aggregation: "mean"
    result_field_writer: "src.lca_line.metrics.write_return_results"
  figure_1_reproduction_artifact:
    id: "metric_figure_1_reproduction_artifact"
    description: "Correlation between LCA distance and OOD performance in VMs and VLMs"
    result_field_writer: "src.lca_line.evaluation.write_figure_1"
  figure_2_reproduction_artifact:
    id: "metric_figure_2_reproduction_artifact"
    description: "Comparison of our setting with prior work"
    result_field_writer: "src.lca_line.evaluation.write_figure_2"
  figure_5_reproduction_artifact:
    id: "metric_figure_5_reproduction_artifact"
    description: "Correlating OOD Top-1/Top-5 accuracy on 4 ImageNet-OOD datasets"
    result_field_writer: "src.lca_line.evaluation.write_figure_5"
  table_5_reproduction_artifact:
    id: "metric_table_5_reproduction_artifact"
    description: "Soft labeling with WordNet for Linear Probing"
    result_field_writer: "src.lca_line.evaluation.write_table_5"
  table_6_reproduction_artifact:
    id: "metric_table_6_reproduction_artifact"
    description: "Soft Labeling with Latent Hierarchies for Linear Probing on ResNet-18"
    result_field_writer: "src.lca_line.evaluation.write_table_6"

# Parameter Sweeps and Executable Constants
parameter_sweeps:
  taxonomy_tree_structure:
    default: "wordnet"
    choices: ["wordnet", "latent_kmeans"]
  number_of_clusters:
    default: 4
    choices: [1, 2, 4, 6, 9, 1000]
  depth_of_hierarchy:
    default: 9
    choices: [3, 6, 9]
  lambda_weight:
    default: 0.03
    choices: [0.0, 0.01, 0.03, 0.05, 0.1, 1.0]
  learning_rate:
    default: 0.001
    choices: [0.0001, 0.001, 0.01]
  batch_size:
    default: 1024
    choices: [256, 512, 1024]
  epochs:
    default: 50
    choices: [10, 25, 50]

# Result-Trend Assertions for Semantic Review
result_trend_assertions:
  soft_labeling_latent_hierarchies_boost:
    description: "Soft labeling with latent hierarchies delivers a generalization boost compared to the baseline"
    baseline_outperformance: true
    comparison_semantics: "proposed method should be compared against explicit baselines"

