# configs/default.yaml
# Stochastic Interpolants with Data-Dependent Couplings
# Default Configuration and Registry Specification

# Grounding marker: reference_grounding: paper_method_core chunk_002 chunk_005 chunk_006 chunk_011

metadata:
  project_name: "Stochastic Interpolants with Data-Dependent Couplings"
  description: "Reproduction of in-painting and super-resolution tasks on ImageNet using data-dependent couplings."
  version: "1.0.0"

# 1. Dataset Registry
dataset_registry:
  imagenet:
    id: "imagenet"
    aliases: ["imagenet", "imagenet_1k", "imagenet-1k", "imagenet_c"]
    loader_factory: "data_pipeline.imagenet.load_imagenet"
    trust_remote_code: true
    resolutions: [256, 512]
    validation_checks:
      - "check_dataset_exists"
      - "check_resolution_valid"
    setup_metadata:
      huggingface_path: "imagenet-1k"
      split: "validation"
  imagenet_1k:
    id: "imagenet_1k"
    aliases: ["imagenet_1k", "imagenet-1k"]
    loader_factory: "data_pipeline.imagenet.load_imagenet"
    trust_remote_code: true
    resolutions: [256, 512]
    setup_metadata:
      huggingface_path: "imagenet-1k"
      split: "validation"
  imagenet_c:
    id: "imagenet_c"
    aliases: ["imagenet_c"]
    loader_factory: "data_pipeline.imagenet.load_imagenet"
    trust_remote_code: true
    resolutions: [256, 512]
    setup_metadata:
      huggingface_path: "imagenet-1k"
      split: "validation"

# 2. Environment Registry
environment_registry:
  imagenet_256:
    id: "imagenet_256"
    aliases: ["imagenet-256", "ImageNet (256x256)"]
    task_family: "image_restoration"
    resolution: 256
    channels: 3
    availability_check: "data_pipeline.tasks.check_tasks_available"
    setup_metadata:
      trust_remote_code: true
      size: [256, 256]
  imagenet_512:
    id: "imagenet_512"
    aliases: ["imagenet-512", "ImageNet (512x512)"]
    task_family: "image_restoration"
    resolution: 512
    channels: 3
    availability_check: "data_pipeline.tasks.check_tasks_available"
    setup_metadata:
      trust_remote_code: true
      size: [512, 512]

# 3. Method Registry
method_registry:
  ours:
    id: "ours"
    name: "Stochastic Interpolant with Data-Dependent Coupling"
    class_path: "model_or_method.coupling.DataDependentCoupling"
    selector: "ours"
  resnet:
    id: "resnet"
    name: "ResNet Baseline"
    class_path: "src.stochastic_interpolants.model.ResNetBaseline"
    selector: "resnet"
  ddpm:
    id: "ddpm"
    name: "Denoising Diffusion Probabilistic Models Baseline"
    class_path: "src.stochastic_interpolants.model.DDPMBaseline"
    selector: "ddpm"
  diffusion_model:
    id: "diffusion_model"
    name: "Standard Diffusion Model Baseline"
    class_path: "src.stochastic_interpolants.model.DiffusionModelBaseline"
    selector: "diffusion_model"
  gaussian_independent:
    id: "Gaussian with independent coupling"
    name: "Gaussian with independent coupling"
    class_path: "model_or_method.coupling.IndependentCoupling"
    selector: "Gaussian with independent coupling"

# 4. Metric Registry
metric_registry:
  fid:
    id: "fid"
    name: "Fréchet Inception Distance"
    formula: "d^2 = ||mu_1 - mu_2||^2 + Tr(Sigma_1 + Sigma_2 - 2*(Sigma_1*Sigma_2)^(1/2))"
    target_path: "results/metrics.json"
    aggregation: "mean"

# 5. Sweep Registry
sweep_registry:
  gamma:
    parameter: "gamma"
    values: [0.0, 1.0]
    description: "SDE sampling noise coefficient sweep (gamma=0 is ODE, gamma=1 is SDE)"
  batch_size:
    parameter: "batch_size"
    values: [32]
    description: "Batch size sweep"

# 6. Fixed Hyperparameters
fixed_hyperparameters:
  batch_size_32:
    batch_size: 32
  mask_tiles_64:
    mask_tiles: 64
  mask_probability_0.3:
    mask_probability: 0.3
  gradient_steps: 200000
  resnet_block_groups: 32

# 7. Experiment Specs (Callable Protocol Matrix)
experiment_specs:
  inpainting_imagenet_256:
    name: "In-painting on ImageNet 256x256"
    section: "Section 4.1"
    environment: "imagenet_256"
    dataset: "imagenet"
    method: "ours"
    baseline: "gaussian_independent"
    metrics: ["fid"]
    parameters:
      batch_size: 32
      mask_tiles: 64
      mask_probability: 0.3
      gamma: 0.0
    artifact_writers:
      - "write_inpainting_samples_artifact"
      - "write_metrics_artifact"
      - "write_artifact_manifest_artifact"
  sr_imagenet_256:
    name: "Super-resolution on ImageNet 256x256"
    section: "Section 4.2"
    environment: "imagenet_256"
    dataset: "imagenet"
    method: "ours"
    baseline: "gaussian_independent"
    metrics: ["fid"]
    parameters:
      batch_size: 32
      gamma: 0.0
    artifact_writers:
      - "write_sr_samples_artifact"
      - "write_metrics_artifact"
      - "write_artifact_manifest_artifact"

# 8. Mathematical Formulas and Algorithm Anchors
formulas:
  stochastic_interpolant:
    equation: "I_t = alpha_t * x_0 + beta_t * x_1 + gamma_t * z"
    symbols:
      alpha_t: "time-dependent coefficient for x_0"
      beta_t: "time-dependent coefficient for x_1"
      gamma_t: "time-dependent coefficient for noise z"
      gamma_t_sq: "gamma_t^2"
      alpha_0: 1.0
      beta_1: 1.0
      alpha_1: 0.0
      beta_0: 0.0
      gamma_0: 0.0
      gamma_1: 0.0
    time_distribution: "U(0,1)"
  inpainting_coupling:
    equation: "x_0 = xi * x_1 + (1 - xi) * zeta"
    symbols:
      xi: "binary mask in {0,1}^(C x W x H)"
      zeta: "Gaussian noise ~ N(0, I)"
      x_1: "ground truth image"
      x_0: "masked base image"
  super_resolution_coupling:
    equation: "x_0 = m(x_1) + sigma * zeta"
    symbols:
      m: "downsampling operator"
      sigma: "noise level"
      zeta: "Gaussian noise ~ N(0, I)"
      x_1: "high-resolution image"
      x_0: "low-resolution base image"
  transport_objectives:
    equation: "L_b = E_{t, x_0, x_1, z} [ || b_t(I_t, t) - dot_I_t ||^2 ]"
    symbols:
      b_t: "velocity field"
      dot_I_t: "time derivative of I_t"
      L_b: "velocity field loss"

# 9. Artifact Manifest
artifact_manifest:
  metrics: "results/metrics.json"
  inpainting_samples: "results/inpainting_samples.png"
  dataset_registry: "results/dataset_registry.json"
  environment_registry: "results/environment_registry.json"
  evidence_contract_matrix: "results/evidence_contract_matrix.json"
  experiment_registry: "results/experiment_registry.json"
  artifact_manifest: "results/artifact_manifest.json"
  sensitivity_report: "results/sensitivity_report.json"
  model_checkpoint: "checkpoints/model.pth"
  data_manifest: "results/data_manifest.json"
  environment_readiness: "results/environment_readiness.json"
  config_resolved: "results/config_resolved.json"
  experiment_results: "results/tables/experiment_results.csv"
  table_2: "results/tables/table_2.csv"
  table_3: "results/tables/table_3.csv"
  figure_3: "results/figures/figure_3.png"
  figure_4: "results/figures/figure_4.png"
  fig_4: "results/figures/fig_4.png"
  figure_5: "results/figures/figure_5.png"