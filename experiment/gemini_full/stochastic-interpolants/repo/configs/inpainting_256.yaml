      - "sample"
    steps: "The objectives (7) can readily be estimated in practice from samples (x_0, x_1) ~ rho(x_0, x_1) and z ~ N(0,1), which will enable us to learn a"

  reducing_transport_costs:
    section: "3.3. Reducing transport costs via coupling"
    symbols:
      - "alpha_t"
