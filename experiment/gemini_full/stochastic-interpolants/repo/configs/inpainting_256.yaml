      - 26
      - 23
    algorithm_terms:
      - "equation"
      - "objective"
      - "sample"
    steps: "Note that the objectives (29) can readily be estimated in practice from samples (x_0, x_1) ~ rho(x_0, x_1 | xi), z ~ N(0,1), and xi ~ eta(xi), which will enable us to learn approximations for use in a generative model."

  stochastic_interpolants_couplings:
    section: "3. Stochastic interpolants with couplings"
    symbols:
      - "alpha_t"
      - "beta_t"
      - "gamma_t^2"
      - "alpha_0"
      - "beta_1"
      - "alpha_1"
