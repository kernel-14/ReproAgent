    numeric_defaults:
      - 1
      - 0
      - 3.1
      - 2
    algorithm_terms:
      - "sample"
    steps: "Albergo et al., 2023), we introduce a time-dependent stochastic process that interpolates between samples from a simple base density rho_0(x_0) at time t=0 and samples from the target rho_1(x_1) at time t=1 : Definition 3.1 (Stochastic interpolant with coupling). ; They can then be used as generative models, owing to the property that the process x_t specified in Definition 3.1 satisfies I_{t=0}=x_0 ~ rho_0(x_0) and I_{t=1}=x_1 ~ rho_1(x_1), and hence samples the desired target density."

  transport_equations:
