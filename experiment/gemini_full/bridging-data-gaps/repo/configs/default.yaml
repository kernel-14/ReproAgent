  ffhq:
    id: "ffhq"
    alias: "ffhq"
    setup_metadata: { path: "data/ffhq", type: "source" }
    validation_check: "src.data.loader.validate_dataset"
    runnable_config_hook: "src.data.loader.load_ffhq"
  lsun_church:
    id: "lsun_church"
    alias: "lsun_church"
    setup_metadata: { path: "data/lsun_church", type: "source" }
    validation_check: "src.data.loader.validate_dataset"
    runnable_config_hook: "src.data.loader.load_lsun_church"
  sunglasses:
