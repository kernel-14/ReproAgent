# configs/default.yaml
# Centralized configuration and sweep registry for Batch and Match (BaM) reproduction.
# Reference Grounding: addendum:formula_algorithm_contract, chunk_004, chunk_007_01, chunk_008_02

# Global configuration flags and setup commands
global_setup:
  mode: "runtime_smoke" # Options: runtime_smoke, full_experiment, docker_validate
  seed: 42
  output_dir: "results"
  artifact_dir_env_var: "PAPERBENCH_REPRO_ARTIFACT_DIR"
  documented_setup_commands:
    - "pip install -e ."
    - "pip install -e .[heavy]"
    - "python main.py --mode runtime_smoke"

# Config Schema definition
config_schema:
  version: "1.0"
  required_fields:
    - "global_setup"
    - "environment_registry"
    - "dataset_registry"
    - "method_registry"
    - "metric_registry"
    - "parameter_sweeps"
    - "experiment_specs"

# Environment Registry
# Exposes paper-derived environment/task factories with ids, aliases, setup metadata, availability checks, and runnable config hooks.
environment_registry:
  cifar:
    id: "cifar"
    aliases:
      - "cifar"
      - "CIFAR-10 VAE 任务环境"
      - "cifar_vae"
    task_family: "cifar"
    setup_metadata:
      description: "CIFAR-10 Variational Autoencoder posterior inference task"
      in_channels: 3
      out_channels: 32 # c_hid
      c_hid: 32
      latent_dim: 16
      kernel_size: 3
      stride: 2
    availability_check: "src.bam.vae.is_cifar_vae_available"
    runnable_config_hook: "src.bam.vae.setup_cifar_vae"
  synthetic:
    id: "synthetic"
    aliases:
      - "synthetic"
      - "synthetic targets"
      - "unit-001"
    task_family: "synthetic"
    setup_metadata:
      description: "Synthetically-constructed target distributions (Gaussian and non-Gaussian)"
      dimensions: [4, 16, 64, 256]
      covariance_types: ["correlated", "ill-conditioned"]
    availability_check: "src.bam.distributions.is_synthetic_available"
    runnable_config_hook: "src.bam.distributions.setup_synthetic"
  hierarchical:
    id: "hierarchical"
    aliases:
      - "hierarchical"
      - "8-schools"
      - "hierarchical linear regression"
    task_family: "hierarchical"
    setup_metadata:
      description: "Hierarchical Bayesian models from PosteriorDB"
      models: ["eight_schools", "hierarchical_linear_regression"]
    availability_check: "src.data.data_posterior_targets.is_hierarchical_available"
    runnable_config_hook: "src.data.data_posterior_targets.setup_hierarchical"

# Dataset Registry
# Exposes paper-derived dataset/benchmark loaders with ids, setup metadata, validation checks, and runnable config hooks.
dataset_registry:
  cifar:
    id: "cifar"
    aliases:
      - "cifar"
      - "CIFAR-10"
    setup_metadata:
      description: "CIFAR-10 dataset for VAE training and evaluation"
      num_classes: 10
      image_size: 32
    validation_check: "src.bam.data.validate_cifar"
    runnable_config_hook: "src.bam.data.load_cifar"
  synthetic_data:
    id: "synthetic_data"
    aliases:
      - "synthetic_data"
    setup_metadata:
      description: "Synthetic samples generated from target distributions"
    validation_check: "src.bam.data.validate_synthetic"
    runnable_config_hook: "src.bam.data.load_synthetic"

# Method Registry
# Exposes method/baseline/attack selectors for ours, baseline.
method_registry:
  ours:
    id: "ours"
    aliases:
      - "ours"
      - "Ours"
      - "BaM"
      - "Batch and Match"
    description: "Batch and Match (BaM) variational inference algorithm"
    selector: "ours"
    algorithm_steps:
      - "Batch Step: Sample z_1, ..., z_B ~ q_t and compute scores g_b = grad log p(z_b)"
      - "Compute batch statistics: z_bar, C, g_bar, Gamma"
      - "Match Step: Update q_t+1 by minimizing regularized score-based divergence"
    hyperparameters:
      lambda: 1.0
      batch_size: 4
      steps: 100
  baseline:
    id: "baseline"
    aliases:
      - "baseline"
      - "ADVI"
      - "GSM"
    description: "Baseline variational inference algorithms (ADVI and GSM)"
    selector: "baseline"
    variants:
      advi:
        description: "Automatic Differentiation Variational Inference"
        learning_rate: 0.01
      gsm:
        description: "Gaussian Score Matching"
        learning_rate: 0.01

# Metric Registry
metric_registry:
  loss:
    id: "loss"
    aliases:
      - "loss"
      - "ELBO"
    formula: "KL(q; p)"
    aggregation: "mean"
  mse:
    id: "mse"
    aliases:
      - "mse"
      - "mean_squared_error"
    formula: "mean((z - z_true)^2)"
    aggregation: "mean"
  kl_forward:
    id: "kl_forward"
    aliases:
      - "KL(p; q)"
    formula: "forward KL divergence"
    aggregation: "mean"
  kl_reverse:
    id: "kl_reverse"
    aliases:
      - "KL(q; p)"
    formula: "reverse KL divergence"
    aggregation: "mean"

# Parameter Sweeps
# Exposes required parameter sweeps as executable constants/default accessors.
parameter_sweeps:
  learning_rate:
    default: 0.01
    values: [1e-4, 1e-3, 1e-2, 1e-1]
    description: "Learning rate for gradient-based methods (ADVI, GSM)"
  batch_size:
    default: 4
    values: [3, 4, 10, 20, 40]
    description: "Batch size B for sampling. D=4 uses B=3 for low-rank solver."
  regularization:
    default: 1.0
    values: [0.1, 1.0, 10.0]
    description: "Regularization parameter for BaM update"
  dimensions:
    default: 16
    values: [4, 16, 64, 256]
    description: "Dimensions D of the target distribution"
  lambda:
    default: 1.0
    values: [0.01, 0.1, 1.0, 10.0]
    description: "Regularization parameter lambda_t"
  steps:
    default: 100
    values: [100, 500]
    description: "Number of iterations T"

# Fixed Hyperparameter Anchors
fixed_hyperparameters:
  iterations_100:
    steps: 100
    description: "Fixed hyperparameter anchor for 100_iterations"

# Paper Formula and Algorithm Symbol Inventory
# Exposes paper-visible formulas, numeric anchors, and algorithm steps as code-visible config.
formula_algorithm_inventory:
  vae_network:
    symbols:
      Convin_channels_3_out_channels_c_hid_kernel_size_3_stride_2:
        in_channels: 3
        out_channels: "c_hid"
        kernel_size: 3
        stride: 2
      Convin_channels_c_hid_out_channels_c_hid_kernel_size_3_stride_1:
        in_channels: "c_hid"
        out_channels: "c_hid"
        kernel_size: 3
        stride: 1
      Convin_channels_c_hid_out_channels_2_c_hid_kernel_size_3_stride_2:
        in_channels: "c_hid"
        out_channels: "2 * c_hid"
        kernel_size: 3
        stride: 2
      Convin_channels_2_c_hid_out_channels_2_c_hid_kernel_size_3_stride_1:
        in_channels: "2 * c_hid"
        out_channels: "2 * c_hid"
        kernel_size: 3
        stride: 1
      Convin_channels_2_c_hid_out_channels_2_c_hid_kernel_size_3_stride_2:
        in_channels: "2 * c_hid"
        out_channels: "2 * c_hid"
        kernel_size: 3
        stride: 2
      Denseoutput_latent_dim:
        out_features: "latent_dim"
    numeric_defaults:
      c_hid: 32
      latent_dim: 16
  bam_algorithm_3_1:
    symbols:
      - "R^DtimesD"
      - "sum_b=1^B"
      - "Sigma^-1"
      - "mu"
      - "Sigma_t+1"
      - "lambda_t"
      - "mu_0"
      - "Sigma_0"
      - "mu_t"
      - "Sigma_t"
      - "g_bar^top"
      - "mu_t+1"
      - "mu_T"
      - "Sigma_T"
    numeric_defaults:
      B: 4
      T: 100
      lambda: 1.0
    steps:
      - "Sample z_1, ..., z_B ~ q_t"
      - "Compute scores g_b = grad log p(z_b)"
      - "Compute statistics: z_bar = sum(z_b)/B, C = sum((z_b-z_bar)(z_b-z_bar)^T)/B"
      - "Compute statistics: g_bar = sum(g_b)/B, Gamma = sum((g_b-g_bar)(g_b-g_bar)^T)/B"
      - "Update mu_t+1 and Sigma_t+1 using regularized match step"
  gaussian_score_matching_c_3:
    symbols:
      - "lambda"
      - "lambda_t"
      - "KL"
      - "z_t"
      - "g_t"
      - "q_t"
      - "z_bar"
      - "g_bar"
    numeric_defaults:
      B: 1
      lambda_limit: "infinity"
    steps:
      - "Set B = 1"
      - "Use z_t and g_t to denote single sample and score"
      - "As lambda -> infinity, loss shifts to score-based divergence"
  advi_baseline_e_1:
    symbols:
      - "p_tilde"
      - "lambda_t"
      - "mu_0"
      - "Sigma_0"
      - "mu_t"
      - "Sigma_t"
      - "sum_b=1^B"
      - "nabla_w"
      - "mu_T"
      - "Sigma_T"
      - "nabla_z"
      - "s_b^top"
      - "mu_b"
      - "Sigma_b"
    numeric_defaults:
      B: 4
      T: 100
    steps:
      - "Initialize variational mean mu_0 and covariance Sigma_0"
      - "At each iteration, compute gradient of ELBO with respect to variational parameters"
      - "Update parameters using SGD or Adam with learning rate lambda_t"

# Callable Experiment Specs (Obligation Matrix)
# Binds environments, methods, parameter defaults, metric functions, and artifact writer call sites.
experiment_specs:
  sweep_protocol:
    name: "Sweep Protocol"
    environment: "synthetic"
    method: "ours"
    parameters:
      learning_rate: [1e-4, 1e-3, 1e-2, 1e-1]
      batch_size: [3, 4, 10, 20, 40]
      regularization: [0.1, 1.0, 10.0]
      lambda: [0.01, 0.1, 1.0, 10.0]
    metrics: ["loss", "mse"]
    artifact_writer: "src.reporting.project_skeleton.write_sensitivity_report_artifact"
    output_path: "results/sensitivity_report.json"
  main_comparison:
    name: "Experiment: main comparison"
    environment: "synthetic"
    methods: ["ours", "baseline"]
    parameters:
      dimensions: [4, 16, 64, 256]
      batch_size: 4
      steps: 100
    metrics: ["kl_forward", "kl_reverse"]
    artifact_writer: "src.reporting.main_comparison.write_metrics_artifact"
    output_path: "results/metrics.json"
  per_sample_lowest_score_selection:
    name: "Protocol: per_sample_lowest_score_selection"
    environment: "cifar"
    method: "ours"
    parameters:
      batch_size: 4
      steps: 100
    metrics: ["loss"]
    artifact_writer: "src.reporting.main_comparison.write_metrics_artifact"
    output_path: "results/metrics.json"
  environment_protocol:
    name: "Environment Protocol"
    environments: ["cifar", "synthetic", "hierarchical"]
    artifact_writer: "src.reporting.project_skeleton.write_environment_registry_artifact"
    output_path: "results/environment_registry.json"
  method_protocol:
    name: "Method Protocol"
    methods: ["ours", "baseline"]
    artifact_writer: "src.reporting.project_skeleton.write_method_registry_artifact"
    output_path: "results/method_registry.json"
  dataset_inventory:
    name: "Dataset Inventory"
    datasets: ["cifar", "synthetic_data"]
    artifact_writer: "src.reporting.project_skeleton.write_dataset_registry_artifact"
    output_path: "results/dataset_registry.json"