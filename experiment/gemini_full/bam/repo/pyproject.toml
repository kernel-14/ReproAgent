[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bam_repro"
version = "0.1.0"
description = "Faithful reproduction of Batch and Match (BaM) variational inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
heavy = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "bridgestan>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
]

[project.scripts]
bam-repro = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bam"]