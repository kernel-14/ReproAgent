  anchor_3: 3
  anchor_10e_19: 10e-19
  anchor_0_2: 0.2
  anchor_1e_plus_6: 1e+6
  anchor_10: 10
  anchor_2: 2
  anchor_4: 4
  anchor_8: 8

# ==========================================
# SDE Configurations (VESDE & VPSDE)
# ==========================================

sde_config:
  VESDE:
    sigma_min: 0.0001
    sigma_max: 15
    f_VESDE: 0
    g_VESDE: "sigma_min * (sigma_max / sigma_min)^t * sqrt(2 * log(sigma_max / sigma_min))"
  VPSDE:
    beta_min: 0.01
    beta_max: 10
    f_VPSDE: "-0.5 * (beta_min + t * (beta_max - beta_min))"
    g_VPSDE: "sqrt(beta_min + t * (beta_max - beta_min))"

# ==========================================
# Output Paths & Registries
# ==========================================

output_paths:
  model_registry: "results/model_registry.json"
  metrics: "results/metrics.json"
  experiment_registry: "results/experiment_registry.json"
  evidence_contract_matrix: "results/evidence_contract_matrix.json"
  artifact_manifest: "results/artifact_manifest.json"
  sensitivity_report: "results/sensitivity_report.json"