# configs/config.yaml
# Faithful reproduction configuration for "All-in-one simulation-based inference" (Simformer)
# reference_grounding: addendum:formula_algorithm_contract configs/config.yaml

# ==========================================
# Active Route Contracts & Defined Symbols
# ==========================================

Benchmark Tasks Evaluation:
  description: "Evaluation suite for standard and structured SBI benchmark tasks"
  metrics:
    - "c2st"
    - "nll"
    - "accuracy"
  tasks:
    - "two_moons"
    - "gaussian_linear"
    - "gaussian_mixture"
  baselines:
    - "npe"
    - "nle"
    - "nre"
    - "diffusion_model"

Lotka-Volterra Unstructured Inference:
  description: "Unstructured inference on Lotka-Volterra simulator with dynamic time-series masks"
  parameters:
    theta: ["alpha", "beta", "gamma", "delta"]
  time_grid:
    t_min: 0
    t_max: 15
    steps: 1000
  mask_type: "dynamic_time"

SIRD Model Functional Inference:
  description: "Functional inference for Susceptible-Infectious-Recovered-Deceased epidemic model"
  parameters:
    theta: ["beta", "gamma", "mu"]
  observations: ["S", "I", "R", "D"]

Hodgkin-Huxley Interval Conditioning:
  description: "Interval-constrained conditioning for Hodgkin-Huxley model"
  parameters:
    theta: ["g_Na", "g_K", "g_L", "E_Na", "E_K", "E_L", "C_m"]
  energy_constraints:
    convert_charge_to_energyE: 4.2
    convert_total_energyE: 1000
    N_Na: 3
    valence_Na: 1
    number_of_transports: 5
    ATP_Na: 3
    ATP_energy: 10e-19
    convert_charge_to_energy: 0.628e-3
    convert_total_energy: 1.602176634e-19

Simformer Core Architecture:
  layers: 5
  embed_dim: 256
  num_heads: 8
  ff_dim: 1024
  diffusion_time_embedding: "random_gaussian_fourier"
  output_projection: "linear"

SBI Tokenizer:
  description: "Tokenizer for joint parameter-observation state vectors"
  token_dim: 64
  condition_mask_type: "binary"

Dependency Attention Masking:
  description: "Attention masking strategies to encode simulator dependency structures"
  mask_types:
    - "undirected"
    - "directed"
    - "dense"
  symmetric: true

Score-Matching Training:
  description: "Denoising score-matching training loop configuration"
  loss_type: "mse"
  optimizer: "adam"
  learning_rate: 0.0001

Guided Diffusion Sampling:
  description: "Reverse diffusion sampling with classifier/interval guidance"
  steps: 100
  guidance_scale: 1.5

C2ST Metric Implementation:
  description: "Classifier 2-Sample Test for posterior accuracy evaluation"
  classifier: "mlp"
  cv_folds: 5

tokenize_sbi_data:
  function_ref: "src.simformer.tokenizer.tokenize_sbi_data"
  args:
    - "theta"
    - "x"
    - "condition_mask"

apply_dependency_mask:
  function_ref: "src.simformer.attention.apply_dependency_mask"
  args:
    - "attention_matrix"
    - "M_E"

# ==========================================
# Interface Contracts
# ==========================================

make_adapter:
  function_ref: "src.tasks.hodgkin_huxley.make_adapter"
  config:
    adapter_type: "shift_scale"
    input_dim: 256
    output_dim: 256

apply_shift_module:
  function_ref: "src.tasks.hodgkin_huxley.apply_shift_module"
  config:
    shift_scale: 0.2
    bias: 0.0

