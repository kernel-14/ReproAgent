# configs/or_optimization_loop.yaml
# reference_grounding: paper:paper_training_or_optimization_loop (chunk_017, chunk_005)

# Global Configuration
project: "APT_Reproduction"
mode: "runtime_smoke"
seed: 42

# Active Reproduction Scope Notes
# reference_grounding: paper_addendum_constraints addendum.md
reproduction_scope:
  include_llama: false
  include_alpaca: false
  required_models: ["bert", "roberta", "t5"]
  required_tasks: ["glue", "squad", "cnn/dm"]
  active_reproduction_notes: "Reproduction focuses on BERT, RoBERTa, and T5 models across GLUE, SQuAD, and CNN/DM tasks as per addendum constraints."

# Optimization Loop Configuration
# reference_grounding: chunk_028 "train the pruned model for 15 epochs"
optimization:
  max_epochs: 15
  early_stopping_patience: 3
  optimizer: "adamw"
  learning_rate_scheduler: "linear"
  few_shot_setting: 10
  default_batch_size: 128

# Expose required parameter sweeps as executable constants/default accessors
# reference_grounding: m_i, m_o, r_apt, batch_size
sweeps:
  batch_size: [32, 128]
  m_i: [0.5, 0.7, 0.9]
  m_o: [0.5, 0.7, 0.9]
  r_apt: [8, 16, 32]

# Expose paper-derived environment/task factories
# reference_grounding: squad, glue, sst2, t5, cnn/dm, etc.
environments:
  unit-001:
    id: "unit-001"
    alias: "smoke_test"
    setup_metadata:
      description: "CLI entrypoint validation task"
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "configs/default.yaml"
  t5:
    id: "t5"
    alias: "t5_tasks"
    setup_metadata:
      description: "T5 model specific tasks"
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "configs/default.yaml"
  cnn_dm:
    id: "cnn/dm"
    alias: "cnn_dm"
    setup_metadata:
      loader: "CNN/DailyMail"
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "configs/default.yaml"
  tuning_mechanism_recovery:
    id: "tuning mechanism that recovers"
    alias: "recovery_mechanism"
    setup_metadata:
      description: "Mechanism that recovers performance after pruning"
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "configs/default.yaml"
  efficiency_claims:
