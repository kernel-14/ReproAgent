# Expose selectable method/baseline/variant factories or adapters
# reference_grounding: FT, LoRA, LoRA+Prune, CoFi, ours, bert, roberta, t5, fine_tuning, lora, test_time_adaptation, 10_shot_setting, batch_size_128
methods:
  FT:
    id: "FT"
    alias: "fine_tuning"
    factory: "src.methods.unit_or_implement.compute_loss"
  LoRA:
    id: "LoRA"
    alias: "lora"
    factory: "src.methods.unit_python_class.compute_loss"
  LoRA_Prune:
    id: "LoRA+Prune"
    alias: "lora_prune"
    factory: "src.methods.unit_or_implement.compute_loss"
  CoFi:
    id: "CoFi"
    alias: "cofi"
    factory: "src.methods.unit_or_implement.compute_loss"
  ours:
    id: "ours"
    alias: "apt"
    factory: "src.methods.unit_python_class.compute_loss"
  bert:
    id: "bert"
    alias: "bert_model"
    factory: "src.methods.unit_with_arguments.compute_loss"
  roberta:
    id: "roberta"
    alias: "roberta_model"
    factory: "src.methods.unit_with_arguments.compute_loss"
  t5:
    id: "t5"
    alias: "t5_model"
    factory: "src.methods.unit_with_arguments.compute_loss"
  fine_tuning:
    id: "fine_tuning"
    alias: "FT"
    factory: "src.methods.unit_or_implement.compute_loss"
  lora:
    id: "lora"
    alias: "LoRA"
    factory: "src.methods.unit_python_class.compute_loss"
  test_time_adaptation:
    id: "test_time_adaptation"
    alias: "tta"
    factory: "src.methods.unit_or_implement.compute_loss"
  ten_shot_setting:
    id: "10_shot_setting"
    alias: "few_shot_10"
    factory: "src.methods.unit_with_arguments.compute_loss"
  batch_size_128:
    id: "batch_size_128"
    alias: "bs_128"
    factory: "src.methods.unit_with_arguments.compute_loss"

# Active Route Contract - Wire symbols from executable routes
# reference_grounding: compute_accuracy, aggregate_accuracy, compute_loss, aggregate_loss, compute_f1, aggregate_f1, etc.
active_route_contract:
  compute_accuracy: "src.reporting.evidence_obligation_registry.compute_accuracy"
  aggregate_accuracy: "src.reporting.evidence_obligation_registry.aggregate_accuracy"
  compute_loss: "src.reporting.evidence_obligation_registry.compute_loss"
  aggregate_loss: "src.reporting.evidence_obligation_registry.aggregate_loss"
  compute_f1: "src.reporting.evidence_obligation_registry.compute_accuracy"
  aggregate_f1: "src.reporting.evidence_obligation_registry.aggregate_accuracy"
  compute_metric_entrypoint_config_loader_entrypoint_metric_entrypoint_objective: "src.reporting.evidence_obligation_registry.compute_accuracy"
  compute_metric_entrypoint_config_loader_entrypoint_metric_entrypoint_score: "src.reporting.evidence_obligation_registry.compute_accuracy"
  load_main: "main.py"
  prepare_main: "main.py"
  compute_reward: "src.reporting.evidence_obligation_registry.compute_loss"
  aggregate_reward: "src.reporting.evidence_obligation_registry.aggregate_loss"

# Full experiment-matrix route contract
# reference_grounding: datasets_or_tasks, methods_or_models, parameters
experiment_matrix:
  datasets_or_tasks:
    - "unit-001"
    - "t5"
    - "cnn/dm"
    - "tuning mechanism that recovers"
    - "efficiency claims while maintaining high"
    - "squad"
    - "glue"
    - "pruning roberta models targeting similar"
    - "apt consistently reach higher"
    - "salience notably hurts"
  methods_or_models:
    - "FT"
    - "LoRA"
    - "LoRA+Prune"
    - "CoFi"
    - "ours"
    - "bert"
    - "roberta"
    - "t5"
    - "fine_tuning"
    - "lora"
    - "test_time_adaptation"
  parameters:
    - "m_i"
    - "m_o"
    - "r_apt"
    - "batch_size"

# Artifact Writers
