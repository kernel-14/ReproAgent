    alias: "salience_ablation"
    setup_metadata:
      description: "Ablation showing that removing salience hurts performance"
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "configs/default.yaml"
  sst2:
