# Parameter Sweeps and Hyperparameters
# reference_grounding: m_i, m_o, r_apt, batch_size
sweeps:
  batch_size: [32, 128]
  m_i: [0.3, 0.5, 0.7]
  m_o: [0.3, 0.5, 0.7]
  r_apt: [8, 16, 32]

# Fixed Hyperparameter Anchors
# reference_grounding: 10_shot_setting, batch_size_128, batch_size_32
hyperparameters:
  10_shot_setting:
    num_shots: 10
    max_steps: 100
  batch_size_128:
    batch_size: 128
    learning_rate: 3e-4
  batch_size_32:
    batch_size: 32
    learning_rate: 2e-5
  default:
    batch_size: 32
    learning_rate: 2e-5
    weight_decay: 0.01
    max_epochs: 10
    warmup_ratio: 0.06
    sparsity_target: 0.6