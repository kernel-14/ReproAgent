# configs/default.yaml
# reference_grounding: paper:unit_001 (chunk_015, chunk_014)

# Global Configuration
project: "APT_Reproduction"
mode: "runtime_smoke" # Options: train, eval, runtime_smoke
seed: 42
output_dir: "results"
metrics_file: "results/metrics.json"

# CLI Command Defaults
# reference_grounding: wp_001 CLI command with arguments for --model, --task, --sparsity, and --mode
cli:
  model: "roberta"
  task: "sst2"
  sparsity: 0.6
  mode: "train"

# Reproduction Scope Notes
# reference_grounding: paper_addendum_constraints addendum.md
reproduction_scope:
  include_llama: false
  include_alpaca: false
  required_models: ["bert", "roberta", "t5"]
  required_tasks: ["glue", "squad", "cnn/dm"]
  active_reproduction_notes: "Reproduction focuses on BERT, RoBERTa, and T5 models across GLUE, SQuAD, and CNN/DM tasks as per addendum constraints."

# Method and Baseline Selectors
# reference_grounding: paper_contract_method_baseline_protocol
methods:
  ours:
    id: "apt"
    name: "Adaptive Pruning and Tuning"
    factory: "src.methods.unit_python_class.APTAdapter"
    # reference_grounding: m_i, m_o, r_apt
    parameters:
      m_i: 0.5
      m_o: 0.5
      r_apt: 16
  bert:
    id: "bert-base-uncased"
    alias: "bert"
  roberta:
    id: "roberta-base"
    alias: "roberta"
  t5:
    id: "t5-base"
    alias: "t5"
  llama:
    id: "llama-7b"
    alias: "llama"
  fine_tuning:
    id: "ft"
    alias: "FT"
  lora:
    id: "lora"
    alias: "LoRA"
  test_time_adaptation:
    id: "tta"
  lora_prune:
    id: "lora_prune"
    alias: "LoRA+Prune"
    description: "Mask Tuning (Kwon et al., 2022)"
  cofi:
    id: "cofi"
    alias: "CoFi"
    description: "L0 regularization plus dynamic layer-wise distillation"
    # reference_grounding: Binding addendum clarification for CoFi baseline
    hyperparameters:
      learning_rate: 2e-5
      weight_decay: 0.01
      lora_r: 8
      lora_alpha: 16
      l0_lambda: 0.1
      use_lora_control: true
      use_l0_control: true

# Environment and Task Factories
# reference_grounding: paper_contract_environment_protocol
environments:
  unit-001:
    id: "unit-001"
    alias: "smoke_test"
    setup_metadata:
      description: "CLI entrypoint validation task"
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "configs/default.yaml"
  t5:
