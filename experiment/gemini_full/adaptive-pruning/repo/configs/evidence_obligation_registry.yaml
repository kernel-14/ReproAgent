# Dataset and Benchmark Loaders
datasets:
  sst2_mnli_squad2:
    id: "SST2, MNLI, SQuAD v2.0"
    alias: "glue_squad"
    setup_metadata:
      description: "SST2, MNLI, and SQuAD v2.0 datasets"
    validation_check: "src.data.inventory_registry_make.validate_dataset"
    runnable_config_hook: "configs/default.yaml"
  cnn_dm_xsum:
    id: "CNN/DailyMail, XSum"
    alias: "summarization"
    setup_metadata:
      description: "CNN/DailyMail and XSum summarization datasets"
    validation_check: "src.data.inventory_registry_make.validate_dataset"
    runnable_config_hook: "configs/default.yaml"
  glue:
    id: "glue"
    alias: "glue"
    setup_metadata:
      description: "GLUE benchmark datasets"
    validation_check: "src.data.inventory_registry_make.validate_dataset"
    runnable_config_hook: "configs/default.yaml"
  truthfulqa:
    id: "truthfulqa"
    alias: "truthfulqa"
    setup_metadata:
      description: "TruthfulQA benchmark dataset"
    validation_check: "src.data.inventory_registry_make.validate_dataset"
    runnable_config_hook: "configs/default.yaml"
  squad:
    id: "squad"
    alias: "squad"
    setup_metadata:
      description: "SQuAD dataset"
    validation_check: "src.data.inventory_registry_make.validate_dataset"
    runnable_config_hook: "configs/default.yaml"

# Method, Baseline, and Attack Selectors
methods:
  ours:
    id: "ours"
    alias: "apt"
    description: "Adaptive Pruning and Tuning (Proposed)"
  bert:
    id: "bert"
    alias: "bert-base-uncased"
    description: "BERT baseline"
  roberta:
    id: "roberta"
    alias: "roberta-base"
    description: "RoBERTa baseline"
  t5:
    id: "t5"
    alias: "t5-base"
    description: "T5 baseline"
  fine_tuning:
    id: "fine_tuning"
    alias: "FT"
    description: "Full Fine-Tuning baseline"
  lora:
    id: "lora"
    alias: "LoRA"
    description: "Low-Rank Adaptation baseline"
  test_time_adaptation:
    id: "test_time_adaptation"
    alias: "TTA"
    description: "Test-Time Adaptation baseline"
  cofi:
    id: "cofi"
    alias: "CoFi"
    description: "CoFi baseline with LoRA and L0 module controls"
    # Binding addendum clarification: Expose referenced baseline default hyperparameters through configuration
    hyperparameters:
      learning_rate: 2e-5
      batch_size: 32
      weight_decay: 0.01
      warmup_ratio: 0.1
      l0_lambda: 0.1

# Fixed Hyperparameter Anchors
fixed_hyperparameters:
  10_shot_setting:
    few_shot_setting: 10
  batch_size_128:
    batch_size: 128
  batch_size_32:
    batch_size: 32

# Parameter Sweeps (Executable constants/default accessors)
parameter_sweeps:
  m_i: [0.5, 0.7, 0.9]
  m_o: [0.5, 0.7, 0.9]
  r_apt: [8, 16, 32]
  batch_size: [32, 128]

# Measurement Collection and Result Aggregation
metrics:
  - accuracy
  - f1
  - loss
  - rouge
  - training_time
  - training_cost
  - inference_cost
  - memory_usage
  - gpu_memory
  - F1

# Result-Trend Assertions
trend_assertions:
  baseline_outperformance:
    description: "Proposed method (ours) should be compared against explicit baselines (FT, LoRA, CoFi) and show outperformance in efficiency and/or accuracy."

# Concrete Reproduction Artifacts
reproduction_artifacts:
  - path: "results/evidence_contract_matrix.json"
    writer: "src.reporting.evidence_obligation_registry.write_evidence_contract_matrix_artifact"
  - path: "results/experiment_registry.json"
    writer: "src.reporting.evidence_obligation_registry.write_experiment_registry_artifact"
  - path: "results/metrics.json"
    writer: "src.reporting.evidence_obligation_registry.write_metrics_artifact"
  - path: "results/environment_registry.json"
    writer: "src.reporting.evidence_obligation_registry.write_environment_registry_artifact"
  - path: "results/dataset_registry.json"
    writer: "src.reporting.evidence_obligation_registry.write_dataset_registry_artifact"
  - path: "results/artifact_manifest.json"
    writer: "src.reporting.evidence_obligation_registry.write_artifact_manifest_artifact"
  - path: "results/sensitivity_report.json"
    writer: "src.reporting.evidence_obligation_registry.write_sensitivity_report_artifact"
  - path: "results/figures/figure_1.png"
    writer: "src.reporting.evidence_obligation_registry.write_figure_1_artifact"
    route: "src.reporting.evidence_obligation_registry.run_figure_1_route"
  - path: "results/tables/table_1.csv"
    writer: "src.reporting.evidence_obligation_registry.write_table_1_artifact"
    route: "src.reporting.evidence_obligation_registry.run_table_1_route"
  - path: "results/figures/figure_2.png"
    writer: "src.reporting.evidence_obligation_registry.write_figure_2_artifact"
    route: "src.reporting.evidence_obligation_registry.run_figure_2_route"