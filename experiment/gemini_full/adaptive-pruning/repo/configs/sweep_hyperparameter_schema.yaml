    runnable_config_hook: "configs/default.yaml"

# Method, Baseline, and Attack Selectors
# reference_grounding: paper_contract_method_baseline_protocol
methods:
  ours:
    id: "apt"
    alias: "ours"
    description: "Adaptive Pruning and Tuning (APT)"
  bert:
    id: "bert-base-uncased"
    alias: "bert"
  roberta:
    id: "roberta-base"
    alias: "roberta"
  t5:
    id: "t5-base"
    alias: "t5"
  fine_tuning:
    id: "ft"
    alias: "fine_tuning"
  lora:
    id: "lora"
    alias: "lora"
  test_time_adaptation:
    id: "tta"
    alias: "test_time_adaptation"
  cofi:
    id: "cofi"
    alias: "CoFi"
    description: "CoFi baseline with LoRA and L0 module controls plus default hyperparameters"
    hyperparameters:
      learning_rate: 2e-5
      weight_decay: 0.01
      warmup_ratio: 0.1
      l0_penalty: 0.1
      lora_r: 8
      lora_alpha: 16

# Parameter Sweeps and Fixed Hyperparameter Anchors
# reference_grounding: sweeps_protocols_hyperparameters
sweeps:
  batch_size: [32, 128]
  m_i: [0.5, 0.7, 0.9]
  m_o: [0.5, 0.7, 0.9]
  r_apt: [8, 16, 32]

fixed_hyperparameters:
  10_shot_setting:
    num_shots: 10
  batch_size_128:
    batch_size: 128
  batch_size_32:
    batch_size: 32
  half_precision_attack:
    fp16: true
  random_sample_manifest:
    sample_size: 100

# Measurement Collection and Result Aggregation
# reference_grounding: paper_contract_measurement_protocol
measurements:
  fidelity_score:
    metric: "fidelity score"
    aggregation: "mean"
  accuracy:
    metric: "accuracy"
    aggregation: "mean"
  runtime:
    metric: "runtime"
    aggregation: "mean"
  training_time:
    metric: "training time"
    aggregation: "sum"
  table_6_reproduction:
    metric: "table 6 reproduction artifact"
    aggregation: "identity"
  figure_2_reproduction:
    metric: "figure 2 reproduction artifact"
    aggregation: "identity"

# Concrete Reproduction Artifacts
# reference_grounding: paper_contract_artifact_protocol
artifacts:
  table_6:
    path: "results/tables/table_6.csv"
    description: "Hyperparameter and Training Details"
  figure_2:
    path: "results/figures/figure_2.png"
    description: "Adaptive Pruning and Tuning Overview and Performance"