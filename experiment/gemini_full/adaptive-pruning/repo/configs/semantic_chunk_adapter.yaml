# Required Parameter Sweeps
# reference_grounding: m_i, m_o, r_apt, batch_size
sweeps:
  batch_size: [32, 128]
  m_i: [0.5, 0.7, 0.9]
  m_o: [0.5, 0.7, 0.9]
  r_apt: [8, 16, 32]

# Full Experiment-Matrix Route Contract
# reference_grounding: datasets_or_tasks, methods_or_models, parameters
experiment_matrix:
  datasets_or_tasks:
    - "unit-001"
    - "t5"
    - "cnn/dm"
    - "tuning mechanism that recovers"
    - "efficiency claims while maintaining high"
    - "squad"
    - "glue"
    - "pruning roberta models targeting similar"
    - "apt consistently reach higher"
    - "salience notably hurts"
  methods_or_models:
    - "FT"
    - "LoRA"
    - "LoRA+Prune"
    - "CoFi"
    - "ours"
    - "bert"
    - "roberta"
    - "t5"
    - "fine_tuning"
    - "lora"
    - "test_time_adaptation"
  parameters:
    - "m_i"
    - "m_o"
    - "r_apt"

# Interface Contract Hooks
# reference_grounding: make_adapter(config), apply_shift_module(features, config)
interface_contract:
