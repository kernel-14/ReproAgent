# configs/task_setup_factory.yaml
# reference_grounding: paper:paper_task_environment_setup (chunk_017, chunk_006, chunk_007)

# Global Configuration
project: "APT_Reproduction"
seed: 42

# Active Reproduction Scope Notes
# reference_grounding: paper_addendum_constraints addendum.md
reproduction_scope:
  include_llama: false
  include_alpaca: false
  required_models: ["bert", "roberta", "t5"]
  required_tasks: ["glue", "squad", "cnn/dm"]
  active_reproduction_notes: "Reproduction focuses on BERT, RoBERTa, and T5 models across GLUE, SQuAD, and CNN/DM tasks as per addendum constraints."

# Expose required parameter sweeps as executable constants/default accessors
# reference_grounding: m_i, m_o, r_apt, batch_size
sweeps:
  m_i: [0.5, 0.7, 0.9]
  m_o: [0.5, 0.7, 0.9]
  r_apt: [8, 16, 32]
  batch_size: [32, 128]

# Expose fixed hyperparameter anchors
# reference_grounding: 10_shot_setting, batch_size_128, batch_size_32
fixed_hyperparameters:
  10_shot_setting:
    shots: 10
  batch_size_128:
    batch_size: 128
  batch_size_32:
    batch_size: 32

# Expose method/baseline/attack selectors
# reference_grounding: ours, bert, roberta, t5, fine_tuning, lora, test_time_adaptation
methods:
  ours:
    id: "ours"
    alias: "APT"
    factory: "src.methods.unit_python_class.APTAdapter"
    parameters:
      m_i: 0.5
      m_o: 0.5
      r_apt: 16
  bert:
    id: "bert"
    alias: "BERT"
    factory: "transformers.BertModel"
  roberta:
    id: "roberta"
    alias: "RoBERTa"
    factory: "transformers.RobertaModel"
  t5:
    id: "t5"
    alias: "T5"
    factory: "transformers.T5ForConditionalGeneration"
  fine_tuning:
    id: "fine_tuning"
    alias: "FT"
    factory: "src.methods.unit_or_implement.FineTuning"
  lora:
    id: "lora"
    alias: "LoRA"
    factory: "src.methods.unit_python_class.LoRAAdapter"
  test_time_adaptation:
    id: "test_time_adaptation"
    alias: "TTA"
    factory: "src.methods.unit_or_implement.TestTimeAdaptation"
  # Binding addendum clarification: Implement the CoFi baseline with LoRA and L0 module controls plus default hyperparameters.
  cofi:
    id: "cofi"
    alias: "CoFi"
    lora_control: true
    l0_module_control: true
    default_hyperparameters:
      learning_rate: 2e-5
      weight_decay: 0.01
      warmup_steps: 100
      max_epochs: 15

# Expose paper-derived environment/task factories
# reference_grounding: squad, glue, sst2, cnn/dm, t5, unit-001
environments:
  unit-001:
    id: "unit-001"
    alias: "smoke_test"
