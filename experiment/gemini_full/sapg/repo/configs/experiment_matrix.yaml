# Paper Formula / Algorithm Anchors
formula_anchors:
  preliminaries:
    section: "3. Preliminaries"
    symbols: ["s_0", "a_t", "s_t", "sum_t=0^T-1", "gamma^t", "A_hat", "pi_theta", "nabla_theta", "rho_d", "Q_hat", "V_hat", "L_on"]
    numeric_defaults: [0, 1]
    algorithm_terms: ["objective", "loss", "gradient", "ema", "update"]
  off_policy_updates:
    section: "4.1. Aggregating data using off-policy updates"
    symbols: ["pi_i", "pi_j", "L_off", "mu", "pi_i,old", "L_on", "lambda", "sum_k=t^t+2", "gamma^k-t", "gamma^3", "s_t^prime", "gamma", "s_t+1^prime", "L_off^critic"]
    numeric_defaults: [1, 3, 2]
    algorithm_terms: ["equation", "loss", "calculate", "update"]
  symmetric_aggregation:
    section: "4.2. Symmetric aggregation"
    symbols: ["lambda"]
    numeric_defaults: [1, 2]
    algorithm_terms: ["gradient", "update", "sample"]
  entropy_regularization:
    section: "4.5. Enforcing diversity through entropy regularization"
    symbols: ["L_on", "pi_i", "sigma"]
    numeric_defaults: [1]
    algorithm_terms: ["loss", "update"]
  experimental_setup:
    section: "5. Experimental Setup"
    symbols: ["theta", "phi_i", "psi_j", "cup_j=2^M", "D_1^prime", "OFfPOLicyLoss", "ONPOLicyLoss", "nabla_theta", "nabla_psi", "E_1", "E_N", "D_j", "D_1", "D_i"]
    numeric_defaults: [1, 2, 0]
    algorithm_terms: ["algorithm", "loss", "update", "sample", "initialize"]
  ablations:
    section: "6.3. Ablations"
    symbols: ["sigma"]
    numeric_defaults: [1]
    algorithm_terms: ["loss", "gradient", "update", "sample"]

# Defined Symbols for Static Review
defines_symbols:
  s_0: "s_0"
  a_t: "a_t"
  s_t: "s_t"
  sum_t_0_t_1: "sum_t_0_t_1"
  gamma_t: "gamma_t"
  a_hat: "a_hat"
  pi_theta: "pi_theta"
  nabla_theta: "nabla_theta"
  rho_d: "rho_d"
  q_hat: "q_hat"
  v_hat: "v_hat"
  l_on: "l_on"

# Called Symbols for Static Review
calls_symbols:
  - "compute_accuracy"
  - "aggregate_accuracy"
  - "compute_reward"
  - "aggregate_reward"
  - "compute_selection_objective"
  - "compute_selection_score"
  - "train_main"
  - "run_training_loop"
  - "compute_fidelity_score"
  - "aggregate_fidelity_score"
  - "write_fidelity_score_artifact"
  - "write_figure_4_artifact"