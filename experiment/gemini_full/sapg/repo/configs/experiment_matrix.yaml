# Evidence Obligation Matrix Registry
evidence_obligation_matrix:
  path: "results/evidence_contract_matrix.json"
  rows:
    - spec_id: "algo_1_impl"
      name: "Algorithm 1 Implementation"
      target_file: "models/sapg_policy.py"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "hp_sweep_epochs"
      name: "Hyperparameter Sweep: Epochs"
      target_file: "results/sensitivity_report.json"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "training_loop_exec"
      name: "Training Loop Execution"
      target_file: "checkpoints/model_final.pt"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "env_setup"
      name: "Environment Setup"
      target_file: "envs/isaacgym_wrapper.py"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "exp_1_allegrokuka"
      name: "Experiment I: AllegroKuka tasks"
      target_file: "results/table_1_allegrokuka.csv"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "exp_2_inhand"
      name: "Experiment II: In-hand tasks"
      target_file: "results/table_2_inhand.csv"
      method: "sapg"
      environment: "ShadowHand-Reorientation"
      metric: "Asymptotic Reward"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "baseline_comparison"
      name: "Baseline Comparison"
      target_file: "results/table_3.csv"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "additional_results"
      name: "Additional Results"
      target_file: "results/table_4.csv"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"
    - spec_id: "visual_analysis"
      name: "Visual Analysis"
      target_file: "results/figures/figure_7.png"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_figure_4_artifact"
    - spec_id: "ablation_diversity"
      name: "Ablation: Diversity/Aggregation"
      target_file: "results/sensitivity_report.json"
      method: "sapg"
      environment: "AllegroKuka-Throw"
      metric: "Success Count"
      artifact_writer: "write_fidelity_score_artifact"

# Result-Trend Assertions for Semantic Review
trend_assertions:
  - id: "sapg_vs_ppo_large_batch"
    assertion: "SAPG outperforms PPO with large batch sizes"
    metric: "Success Count"
    comparison: "sapg > ppo"
  - id: "stable_training_m_policies"
    assertion: "stable training across M policies"
    metric: "Success Count"
    comparison: "sapg_variance < ppo_variance"
  - id: "baseline_outperformance_ddpg_ppo"
    assertion: "baseline_outperformance: SAPG outperforms DDPG and PPO"
    metric: "Success Count"
    comparison: "sapg > ddpg and sapg > ppo"
  - id: "baseline_outperformance_explicit"
    assertion: "baseline_outperformance: proposed method should be compared against explicit baselines"
    metric: "Success Count"
    comparison: "sapg > pbt and sapg > pql"

