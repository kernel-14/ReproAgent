# ==============================================================================
# 3. Metric Formulas and Aggregations
# ==============================================================================
metrics:
  accuracy:
    id: "accuracy"
    canonical_identifier: "metric_accuracy"
    formula: "correct_predictions / total_predictions"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_accuracy"
  table_4_reproduction_artifact:
    id: "table 4 reproduction artifact"
    canonical_identifier: "metric_table_4_reproduction_artifact"
    formula: "zero_shot_classification_accuracy"
    aggregation: "table_format"
    writer: "src.fare.evaluator.write_table_4"
  clean_accuracy:
    id: "clean_accuracy"
    canonical_identifier: "metric_clean_accuracy"
    formula: "correct_clean_predictions / total_predictions"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_clean_accuracy"
  f1:
    id: "f1"
    canonical_identifier: "metric_f1"
    formula: "2 * (precision * recall) / (precision + recall)"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_f1"
  precision:
    id: "precision"
    canonical_identifier: "metric_precision"
    formula: "true_positives / (true_positives + false_positives)"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_precision"
  loss:
    id: "loss"
    canonical_identifier: "metric_loss"
    formula: "fare_loss_value"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_loss"
  cider:
    id: "cider"
    canonical_identifier: "metric_cider"
    formula: "cider_score_calculation"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_cider"
  vqa_accuracy:
    id: "vqa_accuracy"
    canonical_identifier: "metric_vqa_accuracy"
    formula: "vqa_score_calculation"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_vqa_accuracy"
  success_rate:
    id: "success_rate"
    canonical_identifier: "metric_success_rate"
    formula: "successful_attacks / total_attacks"
    aggregation: "mean"
    writer: "src.fare.evaluator.write_success_rate"

# ==============================================================================
# 4. Parameter Sweeps
# ==============================================================================
parameter_sweeps:
  weight_decay:
    default: 1.0e-4
    values: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
    description: "Weight decay sweep for FARE fine-tuning"
  lr:
    default: 1.0e-5
    values: [5.0e-6, 1.0e-5, 2.0e-5, 5.0e-5]
    description: "Learning rate sweep for FARE fine-tuning"

# ==============================================================================
# 5. Result Trend Assertions
# ==============================================================================
trend_assertions:
  baseline_outperformance:
    description: "Proposed method (FARE) should be compared against explicit baselines (CLIP, TeCoA) showing improvement over baselines."
    assertion_hook: "src.fare.utils.assert_baseline_outperformance"

# ==============================================================================
# 6. Result Artifact Paths and Writers
# ==============================================================================
