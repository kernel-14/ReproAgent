    caption: "(Robust) performance of LLaVA-1.5 on visionlanguage tasks and zero-shot (robust) classification for different CLIP models as vision encoder: (i) the original CLIP, (ii) TeCoA: robust CLIP with supervised adversarial fine-tuning at l_infinity radius of 2/255, and (iii) FARE."
    writer: "src.fare.evaluator.write_figure_1"
  figure_2:
