  - compute_reward
  - aggregate_reward
  - compute_ours_oradaptersby_inventory_objective
  - compute_ours_oradaptersby_inventory_score
  - compute_fare_loss
  - compute_accuracy
  - aggregate_accuracy
  - compute_f1