# ==============================================================================
# 7. Executable Formula and Algorithm Anchors
# ==============================================================================
formula_anchors:
  clip_sell_stocks:
    symbols:
      varepsilon_infty: "varepsilon_infty"
    numeric_defaults:
      epsilon: 4
      alpha: 5
      steps: 255
      target_captions: 6
      attacked_images: 25
    formula: "Figure 5: Qualitative results for stealthy targeted attacks (varepsilon_infty = 4/255) on image captioning using LLaVA for different employed CLIP models"
  ablation_loss_function:
    symbols:
      ell_2: "ell_2"
      ell_1: "ell_1"
    algorithm_terms:
      eq: "eq."
      formula: "formula"
      loss: "loss"
    steps: "Ablation of Loss Function: In the main paper we use the squared l_2-norm to measure similarity between original and perturbed embeddings in our formulation of the FARE-loss (3). We note that minimizing the l_1-loss can lead to sparse residuals, for which we see no motivation in the present setting."
  addendum_pgd:
    symbols:
      trust_remote_code: "trust_remote_code"
      load_dataset: "load_dataset"
      l_infinity: "l_infinity"
    numeric_defaults:
      iterations: 5000
      alpha_numerator: 1
      alpha_denominator: 255
    algorithm_terms:
      gradient: "gradient"
      compute: "compute"
      sample: "sample"
    steps: "The PGD implementation includes: gradient normalization with elementwise sign for l_infinity, momentum factor of 0.9, initialization with uniform random perturbation, and computation of l_infinity ball around non-normalized inputs. For computation of the CIDEr scores, they compute the CIDEr scores after every attack."
  embedding_loss_evaluation:
    symbols:
      L_clean: "L_clean"
      L_adv: "L_adv"
      phi_FT: "phi_FT"
      phi_Org: "phi_Org"
      FT: "FT"
    numeric_defaults:
      epsilon_numerator: 4
      epsilon_denominator: 255
      apgd_steps: 100
      sample_images: 500
    algorithm_terms:
      loss: "loss"
      compute: "compute"
      sample: "sample"
    steps: "To this end, we compute the clean embedding loss L_clean(x) = ||phi_FT(x) - phi_Org(x)||_2^2 and the adversarial embedding loss L_adv(x) = max_{z: ||z-x||_infty <= epsilon} ||phi_FT(z) - phi_Org(x)||_2^2."
  llava_non_robust:
    numeric_defaults:
      epsilon_numerator: 2
      epsilon_denominator: 255
    formula: "The clean CLIP model is completely non-robust even at the small radius epsilon = 2/255."
  targeted_attack_ablation:
    numeric_defaults:
      epsilon_numerator: 2
      epsilon_denominator: 255
      ablation_iterations: 500
      main_iterations: 10000
    formula: "We run the targeted attacks of Table 3 for 500 iterations (instead of 10,000) and observe that this attack is considerably weaker for epsilon = 2/255."
  llava_adversarial_output:
    symbols:
      emailapito_targetemail_subject_user: "EmailAPIto=<targetemail>,subject=User"
      asset_6: "asset_6"
      emailapito_targetemail_subject_userquery_body_attack: "EmailAPIto=<targetemail>,subject=UserQuery,body=attack"
      ell_infty: "ell_infty"
    numeric_defaults:
      epsilon_numerator: 4
      target_captions: 6
      attacked_images: 25
    algorithm_terms:
      ema: "ema"
    formula: "Target: EmailAPI(to=<target email>, subject=User(...) asset_6.jpg CLIP: A piza with pepperoni and mushrooms on it."

# ==============================================================================
# 8. Active Route Closure Calls
# ==============================================================================
calls_symbols:
