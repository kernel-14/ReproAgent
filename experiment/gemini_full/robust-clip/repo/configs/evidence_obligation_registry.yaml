# ==============================================================================
# 1. Environment and Task Factories
# ==============================================================================
environment_factories:
  unit-001:
    id: "unit-001"
    alias: "unit_001_smoke"
    setup_metadata:
      description: "Smoke test environment for pipeline validation"
      requires_gpu: false
    availability_check: "src.fare.utils.check_smoke_env"
    runnable_config_hook: "src.fare.utils.setup_smoke_env"
  cifar:
    id: "cifar"
    alias: "cifar10"
    setup_metadata:
      description: "CIFAR-10 zero-shot classification task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_cifar_env"
    runnable_config_hook: "src.fare.utils.setup_cifar_env"
  imagenet:
    id: "imagenet"
    alias: "imagenet_val"
    setup_metadata:
      description: "ImageNet-1k validation task for zero-shot and robust evaluation"
      requires_gpu: true
    availability_check: "src.fare.utils.check_imagenet_env"
    runnable_config_hook: "src.fare.utils.setup_imagenet_env"
  coco:
    id: "coco"
    alias: "coco_caption"
    setup_metadata:
      description: "COCO captioning and retrieval task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_coco_env"
    runnable_config_hook: "src.fare.utils.setup_coco_env"
  flickr30k:
    id: "flickr30k"
    alias: "flickr30k_retrieval"
    setup_metadata:
      description: "Flickr30k image-text retrieval task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_flickr_env"
    runnable_config_hook: "src.fare.utils.setup_flickr_env"
  stl10:
    id: "stl10"
    alias: "stl10_classification"
    setup_metadata:
      description: "STL-10 classification task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_stl10_env"
    runnable_config_hook: "src.fare.utils.setup_stl10_env"
  visual-question answering:
    id: "visual-question answering"
    alias: "vqa"
    setup_metadata:
      description: "Visual Question Answering task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_vqa_env"
    runnable_config_hook: "src.fare.utils.setup_vqa_env"
  was recently introduced:
    id: "was recently introduced"
    alias: "recent_benchmarks"
    setup_metadata:
      description: "Recently introduced benchmarks for LVLM evaluation"
      requires_gpu: true
    availability_check: "src.fare.utils.check_recent_benchmarks"
    runnable_config_hook: "src.fare.utils.setup_recent_benchmarks"
  best performing numbers:
    id: "best performing numbers"
    alias: "best_numbers"
    setup_metadata:
      description: "Best performing numbers validation task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_best_numbers"
    runnable_config_hook: "src.fare.utils.setup_best_numbers"
  models outperform tecoa across all:
    id: "models outperform tecoa across all"
    alias: "outperform_tecoa"
    setup_metadata:
      description: "Validation task to show models outperform TeCoA across all tasks"
      requires_gpu: true
    availability_check: "src.fare.utils.check_outperform_tecoa"
    runnable_config_hook: "src.fare.utils.setup_outperform_tecoa"
  resulting pope:
    id: "resulting pope"
    alias: "pope_eval"
    setup_metadata:
      description: "POPE hallucination evaluation task"
      requires_gpu: true
    availability_check: "src.fare.utils.check_pope_env"
    runnable_config_hook: "src.fare.utils.setup_pope_env"
  almost all down-stream:
    id: "almost all down-stream"
    alias: "downstream_tasks"
    setup_metadata:
      description: "Downstream tasks evaluation"
      requires_gpu: true
    availability_check: "src.fare.utils.check_downstream_env"
    runnable_config_hook: "src.fare.utils.setup_downstream_env"

