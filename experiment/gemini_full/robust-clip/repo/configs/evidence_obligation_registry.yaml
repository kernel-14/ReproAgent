# ==============================================================================
# 3. Method, Baseline, and Attack Selectors
# ==============================================================================
selectors:
  methods:
    - "ours"
    - "chain_of_thought"
    - "clip"
    - "robust_clip"
    - "vit"
    - "fine_tuning"
    - "llava"
    - "openflamingo"
    - "tecoa"
    - "fare"
  attacks:
    - "apgd"
    - "autoattack"
    - "pgd"

# ==============================================================================
# 4. Parameter Sweeps and Bounded Configs
# ==============================================================================
parameter_sweeps:
  weight_decay:
    default: 1e-4
    values: [1e-5, 1e-4, 1e-3]
  learning_rate:
    default: 5e-6
    values: [1e-6, 5e-6, 1e-5]
  batch_size:
    default: 128
    values: [32, 64, 128]

# ==============================================================================
# 5. Fixed Hyperparameter Anchors
# ==============================================================================
fixed_hyperparameters:
  "100_iterations": 100
  "10000_iterations": 10000
  "5000_iterations": 5000
  "5_ground_truths": 5
  "2_epochs": 2
  "10_pgd_steps": 10
  "epsilon_4/255": 0.0156862745  # 4/255
  "epsilon_2/255": 0.0078431372  # 2/255
  "alpha_1/255": 0.0039215686    # 1/255
  "adamw_betas_0.9_0.95": [0.9, 0.95]
  "weight_decay_1e-4": 0.0001
  "batch_size_128": 128
  "momentum_0.9": 0.9
  "cosine_decay_with_linear_warmup": true

# ==============================================================================
# 6. Formula and Algorithm Symbol Inventory
# ==============================================================================
symbols:
  l_infinity: "l_infinity"
  trust_remote_code: "trust_remote_code"
  load_dataset: "load_dataset"
  ell_infty: "ell_infty"
  emailapito_targetemail_subject_user: "EmailAPIto=<targetemail>,subject=User"
  asset_6: "asset_6"
  emailapito_targetemail_subject_userquery_body_attack: "EmailAPIto=<targetemail>,subject=UserQuery,body=attack"
  LR: "learning_rate"
  WD: "weight_decay"
  ell_2: "ell_2"
  ell_1: "ell_1"
  R^d: "R^d"
  L_clean: "L_clean"
  phi_FT: "phi_FT"
  phi_Org: "phi_Org"
  FT: "FT"
  L_adv: "L_adv"
  varepsilon_infty: "varepsilon_infty"
  ema: "ema"
  generate_adversarial_embedding: "generate_adversarial_embedding"
  gradient: "gradient"
  compute: "compute"
  sample: "sample"

numeric_anchors:
  "5000": 5000
  "1": 1
  "255": 255
  "2": 2
  "4": 4
  "6": 6
  "3": 3
  "5": 5
  "4.2": 4.2
  "10": 10
  "32": 32
  "15.7": 15.7
  "17.4": 17.4
  "14.4": 14.4
  "5.6": 5.6
  "500": 500
  "100": 100

# ==============================================================================
# 7. Executable Algorithm and Formula Specifications
# ==============================================================================
algorithms:
  embedding_loss_evaluation:
    section: "C.4. Evaluation of Embedding Loss"
    formulas:
      clean_loss: "L_clean(x) = ||phi_FT(x) - phi_Org(x)||_2^2"
      adv_loss: "L_adv(x) = max_{z: ||z-x||_inf <= eps} ||phi_FT(z) - phi_Org(x)||_2^2"
    defaults:
      num_samples: 500
      apgd_steps: 100
      epsilon: "4/255"
    steps:
      - "Compute clean embedding loss between fine-tuned and original vision encoder."
      - "Compute adversarial embedding loss using 100-step APGD attack with epsilon=4/255."
      - "Evaluate on 500 images sampled from ImageNet validation set."

  pgd_implementation:
    section: "addendum"
    details:
      gradient_normalization: "elementwise sign for l_infinity"
      momentum: 0.9
      initialization: "uniform random perturbation"
      projection: "l_infinity ball around non-normalized inputs"
      cider_worst_case: "compute CIDEr scores after every attack step to take worst case score per sample"

  llava_adversarial_output:
    section: "LLaVA Output for adversarial image"
    target_prompt: "EmailAPI(to=<target email>, subject=User(...)"
    clip_output: "A piza with pepperoni and mushrooms on it."
    tecoa_output: "A pizza is sitting on top of a pizza pan."
    clean_clip_non_robustness: "The clean CLIP model is completely non-robust even at the small radius epsilon=2/255."

  tecoa_comparison:
    section: "B.5. Comparison to Original TeCoA Checkpoint"
    formula: "||u/||u||_2 - v/||v||_2||_2^2 = 2 - 2 * cos(u, v)"
    vit_b32_epochs: 10
    pgd_steps: 2
    epsilon: "2/255"

  targeted_attack_ablation:
    section: "B.9. Targeted Attack: Ablation of Attack Iterations"
    iterations: 500
    baseline_iterations: 10000
    observation: "500 iterations is considerably weaker for epsilon=2/255 than 10000 iterations."