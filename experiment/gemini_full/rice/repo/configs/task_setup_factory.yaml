# configs/task_setup_factory.yaml
# reference_grounding: paper chunk_014, chunk_015, chunk_035, addendum:formula_algorithm_contract

# Global Constants and Sub-optimality Bounds
# reference_grounding: addendum:formula_algorithm_contract
constants:
  d_max: 1.0
  gamma: 0.99
  alpha_default: 0.01
  lambda_default: 0.01
  p_default: 0.5
  top_k_values: [10, 20, 30, 40]
  fidelity_trajectories: 500

# Paper-derived Symbols and Formulas for Algorithm 1 and Technique Detail
# reference_grounding: paper chunk_008, chunk_010_01, chunk_011_02
symbols:
  v_pi: "Value function V^pi(s)"
  e_pi: "Expectation E_pi"
  sum_t_0_infty: "Sum from t=0 to infinity"
  gamma_t: "Discount factor gamma^t"
  s_t: "State at time t"
  a_t: "Action at time t"
  s_0: "Initial state"
  a_t_m: "Mask action (0 or 1)"
  a_random: "Random action sampled from action space"
  theta: "Mask network parameters"
  pi_bar: "Blinded policy"
  pi_tilde: "State mask policy"
  pi_tilde_theta: "Mask network parameterized by theta"
  R_prime: "Intrinsic reward R(s,a) + alpha * a_m"
  eta_bar_pi: "Performance of the blinded policy"
  J_theta: "Objective function max eta(bar_pi)"

# Environment and Task Registry
# reference_grounding: paper:unit-001, paperbench_ref_001 CybORG/README.md
