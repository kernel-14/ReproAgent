    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Reacher-v2:
    alias: "Reacher"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  HalfCheetah-v3:
    alias: "HalfCheetah"
    group: "mujoco"
