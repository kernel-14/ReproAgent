# configs/sweep_hyperparameter_schema.yaml
# reference_grounding: paper chunk_031, chunk_014, chunk_015
# reference_grounding: addendum:formula_algorithm_contract

# ==============================================================================
# Paper Formula and Algorithm Symbol Inventory
# ==============================================================================
# reference_grounding: paper chunk_008, chunk_010_01, chunk_011_02
paper_symbols:
  d_max: 1.0
  v_pi: "V^pi"
  e_pi: "E_pi"
  sum_t_0_infty: "sum_t=0^infty"
  gamma_t: "gamma^t"
  s_t: "s_t"
  a_t: "a_t"
  s_0: "s_0"
  q_pi: "Q^pi"
  a_0: "a_0"
  a_pi: "A^pi"
  pi_star: "pi^*"
  max_pi: "max_pi"
  e_ssimrho: "E_ssimrho"
  d_rho_pi: "d_rho^pi"
  gamma: 0.99
  pr_pi: "Pr^pi"
  pi_r: "pi^r"
  d_rho: "d_rho"
  a_t_m: "a_t^m"
  a_random: "a_random"
  theta: "theta"
  pi_bar: "pi_bar"
  pi_tilde_theta: "pi_tilde_theta"
  numeric_anchors: [0, 1, 2, 3.1, 3.6, 3, 10, 20, 30, 40, 3.3, 4, 3.5, 3.4, 0.25, 0.5]

# ==============================================================================
# Environment and Task Registry
# ==============================================================================
# reference_grounding: paper:unit-001
environment_registry:
  Hopper-v3:
    alias: "Hopper"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Walker2d-v3:
    alias: "Walker2d"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Reacher-v2:
    alias: "Reacher"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  HalfCheetah-v3:
    alias: "HalfCheetah"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  SelfishMining:
    alias: "selfish mining"
    group: "selfish_mining"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  CageChallenge2:
    alias: "CAGE Challenge 2"
    group: "network_defense"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  AutonomousDriving:
    alias: "autonomous driving"
    group: "autonomous_driving"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  MalwareMutation:
    alias: "Malware Mutation"
    group: "malware_mutation"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"

# Explicit aliases for groups/benchmarks
group_aliases:
  mujoco: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]
  selfish_mining: ["SelfishMining"]
  network_defense: ["CageChallenge2"]
  autonomous_driving: ["AutonomousDriving"]
  cage: ["CageChallenge2"]
  gym: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]

# ==============================================================================
# Dataset and Benchmark Loaders
# ==============================================================================
dataset_loaders:
  cage: "src.rice.envs.load_cage_dataset"
  gym: "src.rice.envs.load_gym_dataset"
  mujoco: "src.rice.envs.load_mujoco_dataset"
  selfish_mining: "src.rice.envs.load_selfish_mining_dataset"
  network_defense: "src.rice.envs.load_network_defense_dataset"
  autonomous_driving: "src.rice.envs.load_autonomous_driving_dataset"

# ==============================================================================
# Method and Baseline Selectors
# ==============================================================================
method_selectors:
  ours: "src.rice.explanation.ExplanationGenerator"
  random: "src.rice.baselines.RandomBaseline"
  statemask: "src.rice.baselines.StateMaskBaseline"
  ppo: "src.rice.ppo.PPOTrainer"
  sac: "src.rice.baselines.SACBaseline"
  gail: "src.rice.baselines.GAILBaseline"
  jsrl: "src.rice.baselines.JSRLBaseline"
  heuristic: "src.rice.baselines.HeuristicBaseline"

# ==============================================================================
# Hyperparameter Sweeps and Defaults
# ==============================================================================
# reference_grounding: paper chunk_035, chunk_014, chunk_015
hyperparameter_sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0, 0.1, 0.01, 0.001]
  p: [0, 0.25, 0.5, 0.75, 1]
  learning_rate: [1e-4, 3e-4, 1e-3]
  clip_ratio: [0.1, 0.2, 0.3]
  batch_size: [64, 128, 256]

fixed_hyperparameters:
  mask_network_architecture: [64, 64]
  regularization_weight: 0.01
  gamma: 0.99
  ppo_epochs: 10
  target_kl: 0.01

# ==============================================================================
# Experiment Protocol Matrix
# ==============================================================================
# Materialize a callable protocol matrix linking named experiments to environments, methods, metrics, and artifact writers
experiment_protocols:
  experiment_i:
    name: "Fidelity and Efficiency of Explanation"
    tasks: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]
    methods: ["ours", "statemask"]
    metrics: ["fidelity_score", "training_time"]
    artifact_writers: 
      - "src.reporting.sweep_hyperparameter_schema.write_figure_5_artifact"
      - "src.reporting.sweep_hyperparameter_schema.write_table_4_artifact"
  experiment_ii:
    name: "Effectiveness of Refining Method"
    tasks: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3", "SelfishMining", "CageChallenge2", "AutonomousDriving", "MalwareMutation"]
    methods: ["ours", "random", "jsrl", "ppo"]
    metrics: ["reward"]
    artifact_writers:
      - "src.reporting.sweep_hyperparameter_schema.write_table_1_artifact"
      - "src.reporting.sweep_hyperparameter_schema.write_figure_2_artifact"
  experiment_iii:
    name: "Efficiency Comparison"
    tasks: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]
    methods: ["ours", "statemask"]
    metrics: ["training_time"]
    artifact_writers:
      - "src.reporting.sweep_hyperparameter_schema.write_table_4_artifact"
  experiment_iv:
    name: "Hyperparameter Sensitivity"
    tasks: ["Hopper-v3", "Walker2d-v3"]
    methods: ["ours"]
    sweeps: ["alpha", "lambda", "p"]
    metrics: ["reward", "fidelity_score"]
    artifact_writers:
      - "src.reporting.sweep_hyperparameter_schema.write_sensitivity_report_artifact"
      - "src.reporting.sweep_hyperparameter_schema.write_figure_3_artifact"
  experiment_v:
    name: "Sparse Reward Scenarios"
    tasks: ["Walker2d-v3"]
    methods: ["ours", "jsrl", "ppo"]
    metrics: ["reward"]
    artifact_writers:
      - "src.reporting.sweep_hyperparameter_schema.write_figure_1_artifact"

# ==============================================================================
# Artifact Registry
# ==============================================================================
artifacts:
  resolved_config: "results/config_resolved.json"
  sensitivity_report: "results/sensitivity_report.json"
  figure_1: "results/figures/figure_1.png"
  figure_5: "results/figures/figure_5.png"
  table_4: "results/tables/table_4.csv"
  table_1: "results/tables/table_1.csv"
  figure_2: "results/figures/figure_2.png"
  figure_3: "results/figures/figure_3.png"