# Parameter Sweeps
# reference_grounding: paper chunk_035, chunk_016_01
parameter_sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0, 0.1, 0.01, 0.001]
  p: [0, 0.25, 0.5, 0.75, 1]
  learning_rate: [0.0003, 0.001, 0.002]
  mask_network_architecture: [[64, 64], [128, 128]]
  regularization_weight: [0.01, 0.001]
  clip_ratio: [0.1, 0.2, 0.3]
  batch_size: [64, 128, 256]

# Experiment Matrix
# reference_grounding: paper chunk_015, chunk_035
experiment_matrix:
  experiment_i:
    tasks: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]
    methods: ["ours", "statemask"]
    metrics: ["compute_fidelity"]
    artifact_writers: ["write_figure_5_artifact", "write_table_4_artifact"]
  experiment_ii:
    tasks: ["SelfishMining", "CageChallenge2", "AutonomousDriving", "MalwareMutation"]
    methods: ["ours", "ppo", "jsrl", "random"]
    metrics: ["compute_reward"]
    artifact_writers: ["write_table_1_artifact", "write_figure_2_artifact"]
  experiment_iii:
    tasks: ["MalwareMutation"]
    methods: ["ours"]
    sweeps: ["p", "lambda"]
    metrics: ["compute_reward"]
    artifact_writers: ["write_figure_3_artifact", "write_table_2_artifact"]
  experiment_iv:
    tasks: ["CageChallenge2"]
    methods: ["ours"]
    sweeps: ["alpha"]
    metrics: ["compute_fidelity"]
    artifact_writers: ["write_figure_1_artifact", "write_table_7_artifact"]
  experiment_v:
    tasks: ["Hopper-v3"]
    methods: ["ours", "ppo", "jsrl"]
    metrics: ["compute_training_time"]
    artifact_writers: ["write_metrics_artifact", "write_summary_artifact"]

# Algorithm Anchors
# reference_grounding: paper chunk_010_01, chunk_011_02
algorithm_anchors:
  explanation_generation:
    terms: ["mask", "ema", "compute", "update", "sample", "initialize"]
    steps:
      - "Initialize mask network M_theta"
      - "Sample trajectory tau from policy pi"
      - "For each state s_t in tau, sample mask action a_t^m from M_theta(s_t)"
      - "Apply mask: if a_t^m=1, action is a_random; else action is pi(s_t)"
      - "Train M_theta using PPO to maximize intrinsic reward R' = R + alpha * a_m"
  policy_refining:
    terms: ["rank", "select", "roll_in", "exploration"]
    steps:
      - "Identify top-K critical steps using mask importance scores"
      - "Construct mixed initial state distribution from critical states"
      - "Reset agent to critical states (Roll-in)"
      - "Perform exploration from these states and update policy pi"

# Metric Registry
# reference_grounding: paper chunk_039
metric_registry:
