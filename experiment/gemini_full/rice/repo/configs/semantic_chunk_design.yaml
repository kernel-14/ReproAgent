# configs/semantic_chunk_design.yaml
# reference_grounding: paper chunk_008, chunk_009, chunk_010_01, chunk_011_02, chunk_015, chunk_035, chunk_039
# reference_grounding: addendum:formula_algorithm_contract

# Global Constants and Algorithm Symbols
# reference_grounding: paper chunk_008, chunk_010_01, chunk_011_02
constants:
  d_max: 1.0
  gamma: 0.99
  alpha_default: 0.01
  lambda_default: 0.01
  p_default: 0.5
  numeric_anchors: [0, 1, 2, 3.1, 3.6, 3, 10, 20, 30, 40, 3.3, 4, 3.5, 3.4, 0.25, 0.5]

symbols:
  v_pi: "V^pi(s) = E_pi[sum_{t=0}^infty gamma^t R(s_t, a_t) | s_0=s]"
  q_pi: "Q^pi(s, a) = E_pi[sum_{t=0}^infty gamma^t R(s_t, a_t) | s_0=s, a_0=a]"
  a_pi: "A^pi(s, a) = Q^pi(s, a) - V^pi(s)"
  pi_star: "Optimal policy pi^* = max_pi V^pi"
  theta: "Mask network parameters"
  pi_bar: "Blinded policy"
  pi_tilde: "State mask policy"
  a_t_m: "Mask action (0 or 1)"
  a_random: "Random action sampled from action space"
  intrinsic_reward: "R' = R + alpha * a_m"
  fidelity_score: "E_ssimrho [d_rho^pi]"

