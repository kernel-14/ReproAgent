# configs/rl_entropy_diversity.yaml
# reference_grounding: paper chunk_035, chunk_015, chunk_016_01
# reference_grounding: addendum:formula_algorithm_contract

# Global Constants and Algorithm Symbols
# reference_grounding: paper chunk_008, chunk_010_01, chunk_011_02
symbols:
  d_max: 1.0
  v_pi: "V^pi"
  e_pi: "E_pi"
  sum_t_0_infty: "sum_{t=0}^{\\infty}"
  gamma_t: "gamma^t"
  s_t: "s_t"
  a_t: "a_t"
  s_0: "s_0"
  q_pi: "Q^pi"
  a_0: "a_0"
  a_pi: "A^pi"
  pi_star: "pi^*"
  max_pi: "max_pi"
  e_ssimrho: "E_ssimrho"
  d_rho_pi: "d_rho^pi"
  gamma: 0.99
  pr_pi: "Pr^pi"
  pi_r: "pi^r"
  d_rho: "d_rho"
  a_t_m: "a_t^m"
  a_random: "a_random"
  theta: "theta"
  pi_bar: "pi_bar"
  pi_tilde_theta: "pi_tilde_theta"
  alpha: 0.01
  lambda: 0.01
  p: 0.5
  tau: 1.0
  pi_prime: "pi^prime"
  f_hat_theta: "f_hat_theta"
  pi_hat: "pi_hat"
  r_prime: "R^prime"
  theta_old: "theta_old"
  s_t_plus_1: "s_{t+1}"
  r_t_prime: "R_t^prime"
  epsilon_hat: "epsilon_hat"
  kappa_hat: "kappa_hat"

# Numeric Anchors and Defaults
# reference_grounding: paper formula/algorithm symbol inventory
numeric_anchors:
  zero: 0
  one: 1
  two: 2
  three_point_one: 3.1
  three_point_six: 3.6
  three: 3
  ten: 10
  twenty: 20
  thirty: 30
  forty: 40
  three_point_three: 3.3
  four: 4
  three_point_five: 3.5
  three_point_four: 3.4
  zero_point_two_five: 0.25
  zero_point_five: 0.5

# Environment and Task Registry
# reference_grounding: paper:unit-001
environments:
  Hopper-v3:
    alias: "Hopper"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Walker2d-v3:
    alias: "Walker2d"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Reacher-v2:
    alias: "Reacher"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  HalfCheetah-v3:
    alias: "HalfCheetah"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  SelfishMining:
    alias: "selfish mining"
    group: "selfish_mining"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  CageChallenge2:
    alias: "CAGE Challenge 2"
    group: "network_defense"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  AutonomousDriving:
    alias: "autonomous driving"
    group: "autonomous_driving"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  MalwareMutation:
    alias: "Malware Mutation"
    group: "malware_mutation"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  # Explicit aliases for groups
  mujoco:
    alias: "mujoco"
    group: "mujoco"
  selfish_mining:
    alias: "selfish_mining"
    group: "selfish_mining"
  network_defense:
    alias: "network_defense"
    group: "network_defense"
  autonomous_driving:
    alias: "autonomous_driving"
    group: "autonomous_driving"
  cage:
    alias: "cage"
    group: "network_defense"
  gym:
    alias: "gym"
    group: "mujoco"

# Dataset and Benchmark Loaders
datasets:
  cage:
    alias: "cage"
    loader: "src.rice.envs.load_cage_dataset"
    validation: "src.rice.envs.validate_dataset"
  gym:
    alias: "gym"
    loader: "src.rice.envs.load_gym_dataset"
    validation: "src.rice.envs.validate_dataset"
  mujoco:
    alias: "mujoco"
    loader: "src.rice.envs.load_mujoco_dataset"
  selfish_mining:
    alias: "selfish_mining"
    loader: "src.rice.envs.load_selfish_mining_dataset"
  network_defense:
    alias: "network_defense"
    loader: "src.rice.envs.load_network_defense_dataset"
  autonomous_driving:
    alias: "autonomous_driving"
    loader: "src.rice.envs.load_autonomous_driving_dataset"

# Method and Baseline Selectors
methods:
  ours: "src.rice.explanation.ExplanationGenerator"
  random: "src.rice.baselines.RandomBaseline"
  statemask: "src.rice.baselines.StateMaskBaseline"
  ppo: "src.rice.ppo.PPOTrainer"
  sac: "src.rice.baselines.SACBaseline"
  gail: "src.rice.baselines.GAILBaseline"
  jsrl: "src.rice.baselines.JSRLBaseline"
  heuristic: "src.rice.baselines.HeuristicBaseline"

# Parameter Sweeps
# reference_grounding: paper chunk_035, chunk_016_01
sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0, 0.1, 0.01, 0.001]
  p: [0, 0.25, 0.5, 0.75, 1]
  learning_rate: [0.0003, 0.001, 0.0001]
  clip_ratio: [0.1, 0.2, 0.3]
  batch_size: [64, 128, 256]
  mask_network_architecture: [[64, 64], [128, 128]]
  regularization_weight: [0.0, 0.01, 0.1]

# Entropy Schedule Configuration
# Hypothesis: Follower entropy regularization improves data diversity
entropy_schedule:
  initial_entropy_coeff: 0.01
  final_entropy_coeff: 0.001
  decay_steps: 100000
  type: "linear"

# Policy Loss Configuration
policy_loss:
  entropy_regularization: true
  entropy_coeff: 0.01
  clip_param: 0.2
  vf_coeff: 0.5
  max_grad_norm: 0.5

# Experiment Protocol Matrix
# reference_grounding: paper 4.2. Experiment Design
experiment_matrix:
  experiment_i:
    name: "Fidelity Comparison"
    tasks: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]
    methods: ["ours", "statemask"]
    metrics: ["fidelity_score"]
    artifact_writers: ["write_figure_5_artifact", "write_table_4_artifact"]
  experiment_ii:
    name: "Refining Performance"
    tasks: ["SelfishMining", "CageChallenge2"]
    methods: ["ours", "random", "jsrl"]
    metrics: ["reward"]
    artifact_writers: ["write_table_1_artifact", "write_figure_2_artifact"]
  experiment_iii:
    name: "Ablation Study - Alpha"
    tasks: ["Hopper-v3"]
    methods: ["ours"]
    sweep: "alpha"
    metrics: ["fidelity_score"]
    artifact_writers: ["write_sensitivity_report_artifact"]
  experiment_iv:
    name: "Ablation Study - Lambda and P"
    tasks: ["Walker2d-v3"]
    methods: ["ours"]
    sweep: ["lambda", "p"]
    metrics: ["reward"]
    artifact_writers: ["write_sensitivity_report_artifact"]
  experiment_v:
    name: "Efficiency Evaluation"
    tasks: ["Hopper-v3", "Walker2d-v3"]
    methods: ["ours", "statemask"]
    metrics: ["training_time"]
    artifact_writers: ["write_table_4_artifact"]

# Artifact Paths
artifacts:
  sensitivity_report: "results/sensitivity_report.json"
  config_resolved: "results/config_resolved.json"
  figure_1: "results/figures/figure_1.png"
  figure_5: "results/figures/figure_5.png"
  table_4: "results/tables/table_4.csv"
  table_1: "results/tables/table_1.csv"
  figure_2: "results/figures/figure_2.png"
  figure_3: "results/figures/figure_3.png"
  figure_4: "results/figures/figure_4.png"
  table_2: "results/tables/table_2.csv"
  table_3: "results/tables/table_3.csv"
  table_5: "results/tables/table_5.csv"
  table_6: "results/tables/table_6.csv"
  figure_6: "results/figures/figure_6.png"
  figure_7: "results/figures/figure_7.png"
  figure_8: "results/figures/figure_8.png"
  figure_9: "results/figures/figure_9.png"
  figure_10: "results/figures/figure_10.png"