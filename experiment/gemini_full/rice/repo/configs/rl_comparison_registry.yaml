# configs/rl_comparison_registry.yaml
# reference_grounding: paper chunk_015, chunk_016_01, chunk_035
# reference_grounding: addendum:formula_algorithm_contract

# Baseline Registry
# reference_grounding: paper:unit_009
baseline_registry:
  ours:
    name: "RICE (Ours)"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
    config:
      alpha: 0.01
      lambda: 0.01
      p: 0.5
  random:
    name: "Random"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
  statemask:
    name: "StateMask"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
  ppo:
    name: "PPO"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
  sac:
    name: "SAC"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
  gail:
    name: "GAIL"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
  jsrl:
    name: "JSRL"
    factory: "src.experiments.rl_comparison_registry.make_baseline"
  heuristic:
    name: "Heuristic"
    factory: "src.experiments.rl_comparison_registry.make_baseline"

# Comparison Runner
comparison_runner:
  entrypoint: "src.experiments.rl_comparison_registry.run_comparison"
  default_config:
    n_trajectories: 500
    k_critical_steps: 10

# Environment and Task Registry
# reference_grounding: paper:unit-001
environments:
  Hopper-v3:
    alias: "Hopper"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Walker2d-v3:
    alias: "Walker2d"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  Reacher-v2:
    alias: "Reacher"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  HalfCheetah-v3:
    alias: "HalfCheetah"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  SelfishMining:
    alias: "selfish mining"
    group: "selfish_mining"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  CageChallenge2:
    alias: "CAGE Challenge 2"
    group: "network_defense"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  AutonomousDriving:
    alias: "autonomous driving"
    group: "autonomous_driving"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  MalwareMutation:
    alias: "Malware Mutation"
    group: "malware_mutation"
    factory: "src.rice.envs.make_envs"
    availability_check: "src.rice.envs.check_envs_available"
  # Explicit aliases for groups and paper-derived names
  mujoco:
    alias: "mujoco"
    group: "mujoco"
  selfish_mining:
    alias: "selfish_mining"
    group: "selfish_mining"
  network_defense:
    alias: "network_defense"
    group: "network_defense"
  autonomous_driving:
    alias: "autonomous_driving"
    group: "autonomous_driving"
  cage:
    alias: "cage"
    group: "network_defense"
  gym:
    alias: "gym"
    group: "mujoco"

# Dataset and Benchmark Loaders
# reference_grounding: paper:unit-001
datasets:
  cage:
    alias: "cage"
    loader: "src.rice.envs.load_cage_dataset"
    validation: "src.rice.envs.validate_dataset"
  gym:
    alias: "gym"
    loader: "src.rice.envs.load_gym_dataset"
    validation: "src.rice.envs.validate_dataset"
  mujoco:
    alias: "mujoco"
    loader: "src.rice.envs.load_mujoco_dataset"
  selfish_mining:
    alias: "selfish_mining"
    loader: "src.rice.envs.load_selfish_mining_dataset"
  network_defense:
    alias: "network_defense"
    loader: "src.rice.envs.load_network_defense_dataset"
  autonomous_driving:
    alias: "autonomous_driving"
    loader: "src.rice.envs.load_autonomous_driving_dataset"

# Method and Baseline Selectors
# reference_grounding: paper:unit_009
methods:
  ours:
    selector: "src.rice.explanation.ExplanationGenerator"
    config_hook: "src.rice.explanation.get_default_config"
  random:
    selector: "src.rice.baselines.RandomAgent"
  statemask:
    selector: "src.rice.explanation.StateMaskWrapper"
  ppo:
    selector: "src.rice.ppo.PPOTrainer"
  sac:
    selector: "src.rice.baselines.SACAgent"
  gail:
    selector: "src.rice.baselines.GAILAgent"
  jsrl:
    selector: "src.rice.baselines.JSRLTrainer"
  heuristic:
    selector: "src.rice.baselines.HeuristicAgent"

# Parameter Sweeps
# reference_grounding: paper chunk_035, chunk_016_01
parameter_sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0, 0.1, 0.01, 0.001]
  p: [0, 0.25, 0.5, 0.75, 1]
  learning_rate: [0.0003, 0.0001, 0.001]
  mask_network_architecture: ["mlp", "cnn"]
  regularization_weight: [0.01, 0.1, 0.001]
  clip_ratio: [0.1, 0.2, 0.3]
  batch_size: [64, 128, 256]

# Experiment Matrix
# reference_grounding: paper chunk_015
experiments:
  experiment_i:
    env: "Hopper-v3"
    methods: ["ours", "statemask"]
    metrics: ["fidelity_score"]
    artifact_writers: ["write_figure_5_artifact", "write_table_4_artifact"]
  experiment_ii:
    env: "Walker2d-v3"
    methods: ["ours", "ppo", "jsrl"]
    metrics: ["reward"]
    artifact_writers: ["write_table_1_artifact", "write_figure_1_artifact"]
  experiment_iii:
    env: "Reacher-v2"
    methods: ["ours", "random", "statemask"]
    metrics: ["reward", "fidelity_score"]
    artifact_writers: ["write_figure_2_artifact"]
  experiment_iv:
    env: "HalfCheetah-v3"
    methods: ["ours", "ppo", "sac"]
    metrics: ["reward"]
    artifact_writers: ["write_metrics_artifact"]
  experiment_v:
    env: "SelfishMining"
    methods: ["ours", "heuristic"]
    metrics: ["reward"]
    artifact_writers: ["write_baseline_comparison_artifact"]

# Symbols and Numeric Anchors
# reference_grounding: paper chunk_008, chunk_010_01, chunk_011_02
symbols:
  d_max: 1.0
  v_pi: "V^pi"
  e_pi: "E_pi"
  sum_t_0_infty: "sum_t=0^infty"
  gamma_t: "gamma^t"
  s_t: "s_t"
  a_t: "a_t"
  s_0: "s_0"
  q_pi: "Q^pi"
  a_0: "a_0"
  a_pi: "A^pi"
  pi_star: "pi^*"
  max_pi: "max_pi"
  e_ssimrho: "E_ssimrho"
  d_rho_pi: "d_rho^pi"
  gamma: 0.99
  pr_pi: "Pr^pi"
  pi_r: "pi^r"
  d_rho: "d_rho"
  a_t_m: "a_t^m"
  a_random: "a_random"
  theta: "theta"
  pi_bar: "pi_bar"
  pi_tilde_theta: "pi_tilde_theta"
  formula: "J(theta) = max eta(bar_pi)"
  mask: "M(s)"
  ema: "EMA update"
  calculate: "fidelity score calculation"
  numeric_anchors: [0, 1, 2, 3.1, 3.6, 3, 10, 20, 30, 40, 3.3, 4, 3.5, 3.4, 0.25, 0.5]

# Artifact Writers and Routes
# reference_grounding: paper chunk_016_01, chunk_035
artifact_routes:
  baseline_registry:
    path: "results/baseline_registry.json"
    writer: "src.reporting.rl_comparison_registry.write_baseline_registry_artifact"
  baseline_comparison:
    path: "results/tables/baseline_comparison.csv"
    writer: "src.reporting.rl_comparison_registry.write_baseline_comparison_artifact"
  metrics:
    path: "results/metrics.json"
    writer: "src.reporting.rl_comparison_registry.write_metrics_artifact"
  figure_1:
    path: "results/figures/figure_1.png"
    writer: "src.reporting.rl_comparison_registry.write_figure_1_artifact"
  figure_5:
    path: "results/figures/figure_5.png"
    writer: "src.reporting.rl_comparison_registry.write_figure_5_artifact"
  table_4:
    path: "results/tables/table_4.csv"
    writer: "src.reporting.rl_comparison_registry.write_table_4_artifact"
  table_1:
    path: "results/tables/table_1.csv"
    writer: "src.reporting.rl_comparison_registry.write_table_1_artifact"
  figure_2:
    path: "results/figures/figure_2.png"
    writer: "src.reporting.rl_comparison_registry.write_figure_2_artifact"
  figure_10:
    path: "results/figures/figure_10.png"
    route: "src.experiments.rl_comparison_registry.run_figure_10_route"
    writer: "src.reporting.rl_comparison_registry.write_figure_10_artifact"
  figure_6:
    path: "results/figures/figure_6.png"
    route: "src.experiments.rl_comparison_registry.run_figure_6_route"
    writer: "src.reporting.rl_comparison_registry.write_figure_6_artifact"