# configs/default.yaml
# reference_grounding: paper:unit_001, paper:unit_003, addendum:formula_algorithm_contract

# Global Constants and Sub-optimality Bounds
# reference_grounding: addendum:formula_algorithm_contract
d_max: 1.0
black_box_assumption: true

# Environment and Task Registry
# reference_grounding: paper:unit_001, paper:unit_002
environment_registry:
  Hopper-v3:
    alias: "Hopper"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
  Walker2d-v3:
    alias: "Walker2d"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
  Reacher-v2:
    alias: "Reacher"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
  HalfCheetah-v3:
    alias: "HalfCheetah"
    group: "mujoco"
    factory: "src.rice.envs.make_envs"
  SelfishMining:
    alias: "selfish mining"
    group: "selfish_mining"
    factory: "src.rice.envs.make_envs"
  CageChallenge2:
    alias: "CAGE Challenge 2"
    group: "network_defense"
    factory: "src.rice.envs.make_envs"
  AutonomousDriving:
    alias: "autonomous driving"
    group: "autonomous_driving"
    factory: "src.rice.envs.make_envs"
  MalwareMutation:
    alias: "Malware Mutation"
    group: "malware_mutation"
    factory: "src.rice.envs.make_envs"

# Dataset and Benchmark Loaders
# reference_grounding: paper:unit_001
dataset_loaders:
  cage: "src.rice.envs.load_cage_dataset"
  gym: "src.rice.envs.load_gym_dataset"
  mujoco: "src.rice.envs.load_mujoco_dataset"
  selfish_mining: "src.rice.envs.load_selfish_mining_dataset"
  network_defense: "src.rice.envs.load_network_defense_dataset"
  autonomous_driving: "src.rice.envs.load_autonomous_driving_dataset"

# Method and Baseline Selectors
# reference_grounding: paper:unit_009
method_selectors:
  ours: "src.rice.explanation.ExplanationGenerator"
  random: "src.rice.baselines.RandomAgent"
  statemask: "src.rice.explanation.StateMask"
  ppo: "src.rice.ppo.PPOTrainer"
  sac: "src.rice.baselines.SACTrainer"
  gail: "src.rice.baselines.GAILTrainer"
  jsrl: "src.rice.baselines.JSRLTrainer"
  heuristic: "src.rice.baselines.HeuristicAgent"
  ppo_fine_tuning: "src.rice.baselines.PPOFineTuning"
  statemask_r: "src.rice.baselines.StateMaskR"

# Experiment Protocol Matrix
# Materialize a callable protocol matrix linking named experiments to environments, methods, metrics, and artifact writers
# reference_grounding: paper:unit_009, paper:unit_010
experiment_matrix:
  experiment_i:
    name: "Fidelity and Efficiency of Explanation"
    tasks: ["Hopper-v3", "Walker2d-v3", "Reacher-v2", "HalfCheetah-v3"]
    methods: ["ours", "statemask"]
    metrics: ["fidelity_score", "training_time"]
    artifact_writers: ["write_figure_5_artifact", "write_table_4_artifact"]
  experiment_ii:
    name: "Effectiveness of Refining Method"
    tasks: ["Hopper-v3", "Walker2d-v3", "SelfishMining", "CageChallenge2", "AutonomousDriving", "MalwareMutation"]
    methods: ["ours", "random", "jsrl", "ppo_fine_tuning"]
    metrics: ["reward"]
    artifact_writers: ["write_table_1_artifact", "write_figure_2_artifact"]
  experiment_iii:
    name: "Alternative Design Choices"
    tasks: ["Hopper-v3", "Walker2d-v3"]
    methods: ["ours", "statemask_r"]
    metrics: ["reward"]
    artifact_writers: ["write_figure_3_artifact", "write_figure_4_artifact"]
  experiment_iv:
    name: "Hyperparameter Sensitivity"
    tasks: ["Hopper-v3"]
    methods: ["ours"]
    metrics: ["reward"]
    artifact_writers: ["write_table_2_artifact"]
  experiment_v:
    name: "Sparse Reward MuJoCo"
    tasks: ["Walker2d-v3"]
    methods: ["ours", "jsrl", "ppo_fine_tuning"]
    metrics: ["reward"]
    artifact_writers: ["write_table_3_artifact"]

# Hyperparameters and Parameter Sweeps
# reference_grounding: paper chunk_035, chunk_016_01, chunk_014
hyperparameters:
  learning_rate: 0.0003
  clip_ratio: 0.2
  batch_size: 64
  gamma: 0.99
  tau: 0.95
  mask_network_architecture: [64, 64]
  regularization_weight: 0.1
  alpha: 0.01  # Intrinsic reward coefficient for mask training
  lambda: 0.01 # Refining coefficient
  p: 0.5       # Exploration probability

sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0, 0.1, 0.01, 0.001]
  p: [0, 0.25, 0.5, 0.75, 1]
  top_k: [10, 20, 30, 40]

# Formula and Algorithm Anchors
# reference_grounding: paper chunk_008, chunk_010_01, chunk_011_02
formula_anchors:
  objective_function: "J(theta) = max eta(bar_pi)"
  mask_action_logic: "a_t \odot a_t^m"
  intrinsic_reward: "R' = R + alpha * a_t^m"
  advantage_function: "A^pi(s, a) = Q^pi(s, a) - V^pi(s)"
  value_function: "V^pi(s) = E_pi[sum_t=0^infty gamma^t R(s_t, a_t) | s_0=s]"
  symbols:
    d_max: 1.0
    V_pi: "V^pi"
    E_pi: "E_pi"
    sum_t_0_infty: "sum_t=0^infty"
    gamma_t: "gamma^t"
    s_t: "s_t"
    a_t: "a_t"
    s_0: "s_0"
    Q_pi: "Q^pi"
    a_0: "a_0"
    A_pi: "A^pi"
    pi_star: "pi^*"
    max_pi: "max_pi"
    E_ssimrho: "E_ssimrho"
    d_rho_pi: "d_rho^pi"
    gamma: 0.99
    Pr_pi: "Pr^pi"
    pi_r: "pi^r"
    d_rho: "d_rho"
    a_t_m: "a_t^m"
    a_random: "a_random"
    theta: "theta"
    pi_bar: "pi_bar"
    pi_tilde_theta: "pi_tilde_theta"
    alpha: 0.01
    lambda: 0.01
    p: 0.5
    numeric_anchors: [0, 1, 2, 3.1, 3.6, 3, 10, 20, 30, 40, 3.3, 4, 3.5, 3.4, 0.25, 0.5]

# Artifact Paths
artifacts:
