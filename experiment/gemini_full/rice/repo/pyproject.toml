[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rice_repro"
version = "0.1.0"
description = "RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation"
authors = [{name = "PaperBench Repro Agent"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.62.0",
    "click>=8.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Training and RL dependencies (Heavy)
training = [
    "torch>=1.11.0",
    "gymnasium[classic_control,mujoco]>=0.28.1",
    "stable-baselines3>=2.0.0",
]
# Simulator and specialized environment dependencies (Heavy)
# reference_grounding: paperbench_ref_001 CybORG/CybORG/Tutorial/2. Observations.ipynb
# reference_grounding: paperbench_ref_008 core/policy/auto_policy.py
simulators = [
    "metadrive-simulator>=0.3.0",
    "cyborg-cage-2",
    "malconv",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[project.scripts]
rice-repro = "main:main"

[tool.setuptools]
packages = ["rice", "data", "reporting", "experiments"]
package-dir = {"" = "src"}

[tool.rice.experiment_design]
# reference_grounding: paper chunk_035, chunk_016_01, chunk_014
# 4.2. Experiment Design | symbols alpha | numeric/defaults 10, 20, 30, 40
# C.4. Evaluation Results | alpha from {0.01, 0.001, 0.0001}
# C.3. Additional Experiment Results | alpha as 0.01
alpha_sweep = [0.01, 0.001, 0.0001]
lambda_sweep = [0, 0.1, 0.01, 0.001]
p_sweep = [0, 0.25, 0.5, 0.75, 1]
top_k_fidelity_steps = [10, 20, 30, 40]
intrinsic_reward_alpha_default = 0.01

[tool.rice.technique_detail]
# 3.3. Technique Detail numeric anchors
# symbols s_t, a_t^m, a_t, a_random, theta, pi_bar, pi_tilde_theta, theta_old, s_0, pi_tilde, s_t+1, R_t^prime
# numeric/defaults 0, 1, 2, 3.1
mask_actions = [0, 1]
equation_3_1_anchor = 3.1
lemma_3_5_constant = 4

[tool.rice.addendum]
# addendum | symbols d_max
d_max_default = 1.0

[tool.rice.environment_registry]
# Preserve explicit environment/task coverage and initialization surfaces
tasks = [
    "Hopper-v3",
    "Walker2d-v3",
    "Reacher-v2",
    "HalfCheetah-v3",
    "MountainCarContinuous-v0",
    "CAGE Challenge 2",
    "autonomous driving",
    "Malware Mutation",
    "selfish mining",
    "MetaDrive"
]

[tool.rice.method_registry]
# Preserve explicit baseline or method-variant selection surfaces
baselines = [
    "Ours",
    "ppo fine-tuning",
    "statemask-r",
    "JSRL",
    "Random"
]

[tool.rice.artifact_registry]
# Write or declare concrete reproduction artifacts for result verification
outputs = [
    "results/environment_registry.json",
    "results/environment_readiness.json",
    "results/figures/figure_1.png",
    "results/figures/figure_2.png",
    "results/figures/figure_3.png",
    "results/figures/figure_4.png",
    "results/figures/figure_5.png",
    "results/figures/figure_6.png",
    "results/figures/figure_7.png",
    "results/figures/figure_8.png",
    "results/figures/figure_9.png",
    "results/figures/figure_10.png",
    "results/tables/table_1.csv",
    "results/tables/table_2.csv",
    "results/tables/table_3.csv",
    "results/tables/table_4.csv",
    "results/tables/table_5.csv",
    "results/tables/table_6.csv"
]