  - id: "experiment_results_csv"
    canonical_identifier: "artifact_experiment_results_csv"
    path: "results/tables/experiment_results.csv"
    writer: "write_experiment_results_csv"
    description: "Experiment results CSV"
  - id: "figure_1"
    canonical_identifier: "artifact_figure_1"
