  - id: "table_4"
    canonical_identifier: "artifact_table_4"
    path: "results/tables/table_4.csv"
    writer: "write_table_4"
    description: "Table 4 CSV"
  - id: "table_5"
    canonical_identifier: "artifact_table_5"
    path: "results/tables/table_5.csv"
    writer: "write_table_5"
    description: "Table 5 CSV"
  - id: "table_6"
    canonical_identifier: "artifact_table_6"
    path: "results/tables/table_6.csv"
    writer: "write_table_6"
    description: "Table 6 CSV"
  - id: "loss_trace"
    canonical_identifier: "artifact_loss_trace"
    path: "results/loss_trace.json"
    writer: "write_loss_trace"
