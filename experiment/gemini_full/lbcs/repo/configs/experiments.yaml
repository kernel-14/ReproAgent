# -----------------------------------------------------------------------------
# 6. Trend Assertions
# -----------------------------------------------------------------------------
trend_assertions:
  - id: "baseline_outperformance"
    description: "LBCS achieves better test accuracy and smaller coreset size compared to baselines"
    assertion_type: "comparison"
    metrics: ["accuracy", "coreset_size"]
    expected: "LBCS 在保持高准确率的同时，实现了比预定义 k 更小的优化核心大小"

# -----------------------------------------------------------------------------
# 7. Formula and Algorithm Anchors
# -----------------------------------------------------------------------------
formula_algorithm_anchors:
  preliminaries:
    section: "2. Preliminaries"
    symbols:
      L_p: "L_p norm of vectors or matrices"
      x_i: "Instance x_i"
      y_i: "Label y_i"
      m_i: "Mask element m_i in {0, 1}"
      f_1: "Performance constraint objective f_1(m)"
      sum_i_1_n: "Summation over n samples"
      theta: "Model parameters theta"
      l_0: "L_0 norm of mask vector"
      f_2: "Coreset size objective f_2(m)"
    numeric_defaults:
      1: 1
      0: 0
      2: 2
    algorithm_terms:
      - "formula"
      - "objective"
      - "loss"
      - "mask"
      - "select"
      - "sample"
    steps:
      - "We use ||.||_p to denote the L_p norm of vectors or matrices and l(.) to denote the crossentropy loss if there is no confusion."
      - "Formally, given a large-scale dataset D = {(x_i, y_i)}_{i=1}^n with a sample size n, where x_i denotes the instance and y_i denotes the label."

  lexicographic_bilevel_coreset_selection:
    section: "3.1. Lexicographic Bilevel Coreset Selection"
    symbols:
      f_1: "Performance constraint objective f_1(m)"
      f_2: "Coreset size objective f_2(m)"
      theta: "Model parameters theta"
    numeric_defaults:
      1: 1
      2: 2
      0: 0
      3: 3
    algorithm_terms:
      - "algorithm"
      - "formula"
      - "objective"
      - "mask"
      - "update"
      - "search"
      - "select"
      - "initialize"
    steps:
      - "theta(m) in arg min_theta L(m, theta) where min represents the lexicographic optimization procedure over the ordered list F(m)."

  optimization_algorithm:
    section: "3.2. Optimization Algorithm"
    symbols:
      epsilon: "Tolerance parameter"
      f_1: "Performance constraint objective f_1(m)"
      f_2: "Coreset size objective f_2(m)"
      f_i: "Objective f_i"
      i_prime: "Index i_prime"
      M_star: "Optimal mask M*"
      M_2_star: "Optimal mask M_2*"
      M_1_star: "Optimal mask M_1*"
      f_1_star: "Optimal value f_1*"
      f_2_star: "Optimal value f_2*"
    numeric_defaults:
      5: 5
      1: 1
      2: 2
    algorithm_terms:
      - "algorithm"
      - "formula"
      - "objective"
      - "gradient"
      - "mask"
      - "search"
      - "select"
    steps:
      - "As under lexicographic optimization, it is inaccessible to the gradients of f_1(m) and f_2(m) with respect to m, the methods that require analytic forms of gradients (Gong et al., 2021) are inapplicable."

  theoretical_analysis:
    section: "4. Theoretical Analysis"
    symbols:
      gamma_1: "gamma_1"
      gamma_2: "gamma_2"
      f_star: "f*"
      f_1: "f_1"
      f_2: "f_2"
      M_1_star: "M_1*"
      S_1: "S_1"
      eta_1: "eta_1"
      S_2: "S_2"
      t_hat: "t_hat"
      eta_2: "eta_2"
      psi_t_plus_1: "psi_t+1"
      M_2_star: "M_2*"
    numeric_defaults:
      0: 0
      1: 1
      2: 2
      3: 3
    algorithm_terms:
      - "algorithm"
      - "objective"
      - "mask"
      - "ema"
      - "update"
      - "search"
    steps:
      - "Specifically, for an objective function f, its infimum value in the search space M is denoted by f*."
      - "We employ m^t to represent the mask at the t-th iteration generated by our algorithm."

  black_box_optimization_algorithm:
    section: "A. Details of the Black-box Optimization Algorithm"
    symbols:
      epsilon: "epsilon"
      f_1: "f_1"
      f_2: "f_2"
      t_prime: "t^prime"
      delta_init: "delta_init"
      delta: "delta"
      F_H: "F_H"
    numeric_defaults:
      1: 1
      2: 2
      0: 0
      14: 14
    algorithm_terms:
      - "algorithm"
      - "objective"
      - "mask"
      - "update"
      - "search"
      - "sample"
    steps:
      - "For the black-box optimization of f_1 and f_2 in order of priority, we make use of a randomized direct search algorithm named LexiFlow (Zhang et al., 2023b;c) and make necessary modifications to it."

  more_justifications_and_analyses:
    section: "6. More Justifications and Analyses"
    numeric_defaults:
      1000: 1000
      3000: 3000
      4000: 4000
    algorithm_terms:
      - "gradient"
      - "mask"
      - "search"
      - "initialize"
    steps:
      - "'LBCS+Moderate' means the mask is initialized by 'Moderate' and then is refined by our LBCS."
      - "As a comparison, the time complexity of Probabilistic (Zhou et al., 2022) is O(T K C), where C is the number of sampling times required by its policy gradient estimator."

# -----------------------------------------------------------------------------
# 8. Symbol Definitions and Calls
# -----------------------------------------------------------------------------
defines_symbols:
  - "l_p"
  - "x_i"
  - "y_i"
  - "m_i"
  - "f_1"
  - "sum_i_1_n"
  - "theta"
  - "l_0"
  - "f_2"
  - "formula"
  - "objective"
  - "loss"

calls_symbols:
  - "compute_accuracy"
  - "aggregate_accuracy"
  - "compute_loss"
  - "aggregate_loss"
  - "compute_entrypoint_metric_entrypoint_objective"
  - "compute_entrypoint_metric_entrypoint_score"
  - "compute_fidelity_score"
  - "aggregate_fidelity_score"
  - "write_fidelity_score_artifact"
  - "write_figure_4_artifact"
  - "run_figure_4_route"
  - "compute_metric_table_2_metric_table_1_inoptimizingtheobjectives_objective"