# configs/experiments.yaml
# Refined Coreset Selection (RCS) / Lexicographic Bilevel Coreset Selection (LBCS)
# Complete experiment configuration, registries, sweeps, metrics, and formula/algorithm anchors.

metadata:
  project_name: "Refined Coreset Selection"
  paper_title: "Refined Coreset Selection: Towards Minimal Coreset Size under Model Performance Constraints"
  reproduction_version: "1.0.0"

# -----------------------------------------------------------------------------
# 1. Environment and Task Factories
# -----------------------------------------------------------------------------
environments:
  frameworks:
    - id: "pytorch"
      name: "PyTorch"
      alias: "torch"
      available: true
    - id: "torchvision"
      name: "torchvision"
      alias: "torchvision"
      available: true
  tasks:
    - id: "unit-001"
      name: "Unit 001 Coreset Selection Task"
      alias: "unit_001"
    - id: "cifar"
      name: "CIFAR Environment"
      alias: "cifar"
    - id: "imagenet"
      name: "ImageNet Environment"
      alias: "imagenet"
    - id: "mnist"
      name: "MNIST Environment"
      alias: "mnist"
    - id: "svhn"
      name: "SVHN Environment"
      alias: "svhn"
  ablation_notes:
    is_no_explicit_concept: "No explicit concept of pre-defined size constraint in pure lexicographic optimization"
    bind_each_baseline: "Each baseline is bound to its specific selection logic"
    worse_ablation_performance_without_fabricating: "Ablation variants show worse performance without fabricating results"
    versus_mlp_policies_when_paper: "Comparison versus MLP policies when paper mentions policy gradient estimators"
    determines_which: "Determines which mask initialization is used"
    keep_all_paper_visible: "Keep all paper-visible baselines and metrics registered"

# -----------------------------------------------------------------------------
# 2. Dataset and Benchmark Loaders
# -----------------------------------------------------------------------------
datasets:
  - id: "fmnist"
    name: "Fashion-MNIST"
    alias: "FMNIST"
    num_classes: 10
    input_shape: [1, 28, 28]
    default_size: 60000
    validation_check: "check_fmnist_exists"
  - id: "cifar10"
    name: "CIFAR-10"
    alias: "CIFAR-10"
    num_classes: 10
    input_shape: [3, 32, 32]
    default_size: 50000
    validation_check: "check_cifar10_exists"
  - id: "synthetic"
    name: "Synthetic Dataset"
    alias: "synthetic"
    num_classes: 10
    input_shape: [3, 32, 32]
    default_size: 1000
    validation_check: "check_synthetic_exists"
  - id: "imagenet"
    name: "ImageNet"
    alias: "imagenet"
    num_classes: 1000
    input_shape: [3, 224, 224]
    default_size: 1281167
    validation_check: "check_imagenet_exists"
  - id: "mnist"
    name: "MNIST"
    alias: "mnist"
    num_classes: 10
    input_shape: [1, 28, 28]
    default_size: 60000
    validation_check: "check_mnist_exists"
  - id: "imagenet_1k"
    name: "ImageNet-1k"
    alias: "imagenet_1k"
    num_classes: 1000
    input_shape: [3, 224, 224]
    default_size: 1281167
    validation_check: "check_imagenet_1k_exists"

# -----------------------------------------------------------------------------
# 3. Parameter Sweeps and Constants
# -----------------------------------------------------------------------------
parameter_sweeps:
  k:
    description: "Predefined coreset size before optimization"
    values: [200, 400, 1000, 2000, 3000, 4000]
    default: 1000
  epsilon:
    description: "Tolerance parameter for performance constraint"
    values: [0.2, 0.3, 0.4]
    default: 0.3
  noise_rate:
    description: "Label noise rate for robustness experiments"
    values: [0.0, 0.3, 0.5]
    default: 0.3
  lambda_values:
    description: "Weight parameter for multi-objective weighted combination"
    values: [0.0, 1.0]
    default: 0.5
  momentum:
    description: "Momentum for SGD optimizer"
    default: 0.9

# -----------------------------------------------------------------------------
# 4. Metrics and Aggregations
# -----------------------------------------------------------------------------
metrics:
  - id: "test_accuracy_cross_entropy_loss"
    canonical_identifier: "metric_test_accuracy_cross_entropy_loss"
    name: "Test Accuracy and Cross-Entropy Loss"
    formula: "accuracy_and_loss"
    aggregation: "mean_std"
  - id: "accuracy"
    canonical_identifier: "metric_accuracy"
    name: "Accuracy"
    formula: "compute_accuracy"
    aggregation: "aggregate_accuracy"
  - id: "loss"
    canonical_identifier: "metric_loss"
    name: "Loss"
    formula: "compute_loss"
    aggregation: "aggregate_loss"
  - id: "table_1_reproduction_artifact"
    canonical_identifier: "metric_table_1_reproduction_artifact"
    name: "Table 1 Metrics"
    formula: "compute_metric_table_2_metric_table_1_inoptimizingtheobjectives_objective"
    aggregation: "mean_std"
  - id: "table_2_reproduction_artifact"
    canonical_identifier: "metric_table_2_reproduction_artifact"
    name: "Table 2 Metrics"
    formula: "compute_metric_table_2_metric_table_1_inoptimizingtheobjectives_objective"
    aggregation: "mean_std"
  - id: "table_3_reproduction_artifact"
    canonical_identifier: "metric_table_3_reproduction_artifact"
    name: "Table 3 Metrics"
    formula: "compute_accuracy"
    aggregation: "mean_std"
  - id: "table_4_reproduction_artifact"
    canonical_identifier: "metric_table_4_reproduction_artifact"
    name: "Table 4 Metrics"
    formula: "compute_accuracy"
    aggregation: "mean_std"
  - id: "table_5_reproduction_artifact"
    canonical_identifier: "metric_table_5_reproduction_artifact"
    name: "Table 5 Metrics"
    formula: "compute_accuracy"
    aggregation: "mean_std"
  - id: "figure_1_reproduction_artifact"
    canonical_identifier: "metric_figure_1_reproduction_artifact"
    name: "Figure 1 Metrics"
    formula: "compute_loss"
    aggregation: "trace"
  - id: "figure_2_reproduction_artifact"
    canonical_identifier: "metric_figure_2_reproduction_artifact"
    name: "Figure 2 Metrics"
    formula: "compute_accuracy"
    aggregation: "mean_std"

# -----------------------------------------------------------------------------
# 5. Result Artifacts and Writers
# -----------------------------------------------------------------------------
artifacts:
  - id: "results_metrics_json"
    canonical_identifier: "artifact_results_metrics_json"
    path: "results/metrics.json"
    writer: "write_metrics_artifact"
    description: "Overall metrics summary"
  - id: "results_robustness_results_json"
    canonical_identifier: "artifact_results_robustness_results_json"
    path: "results/robustness_results.json"
    writer: "write_robustness_results"
    description: "Robustness against imperfect supervision results"
  - id: "results_table1_results_json_results_table2_results_json"
    canonical_identifier: "artifact_results_table1_results_json_results_table2_results_json"
    path: "results/table1_results.json"
    writer: "write_table1_results"
    description: "Table 1 results"
  - id: "table_2"
    canonical_identifier: "artifact_table_2"
    path: "results/table2_results.json"
    writer: "write_table2_results"
    description: "Table 2 results"
  - id: "evidence_contract_matrix"
    canonical_identifier: "artifact_evidence_contract_matrix"
    path: "results/evidence_contract_matrix.json"
    writer: "write_evidence_contract_matrix"
    description: "Evidence contract matrix"
  - id: "experiment_registry"
    canonical_identifier: "artifact_experiment_registry"
    path: "results/experiment_registry.json"
    writer: "write_experiment_registry"
    description: "Experiment registry"
  - id: "environment_registry"
    canonical_identifier: "artifact_environment_registry"
    path: "results/environment_registry.json"
    writer: "write_environment_registry"
    description: "Environment registry"
  - id: "dataset_registry"
    canonical_identifier: "artifact_dataset_registry"
    path: "results/dataset_registry.json"
    writer: "write_dataset_registry"
    description: "Dataset registry"
  - id: "artifact_manifest"
    canonical_identifier: "artifact_manifest"
    path: "results/artifact_manifest.json"
    writer: "write_artifact_manifest"
    description: "Artifact manifest"
  - id: "sensitivity_report"
    canonical_identifier: "artifact_sensitivity_report"
    path: "results/sensitivity_report.json"
    writer: "write_sensitivity_report"
