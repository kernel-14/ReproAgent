# configs/evidence_obligation_registry.yaml
# Faithful, complete, and judgeable reproduction registry for SMM.
# Reference Grounding: paper:paper_evidence_matrix (chunk_037, chunk_039, chunk_009)

# 1. Evidence Obligation Matrix Registry
evidence_obligation_matrix:
  environments:
    - cifar
    - imagenet
    - svhn
  datasets:
    - cifar
    - imagenet
    - imagenet_1k
    - dtd
    - eurosat
    - flowers
    - oxford_pets
    - svhn
  methods:
    - ours
    - vit
    - resnet
    - lora
  metrics:
    - accuracy
    - loss
  parameters:
    - p
    - learning_rate
    - patch_size
  trends:
    endpoint_low: "p=0 and p=1 must be represented as lowest/minimum boundary cases"

# 2. Environment & Task Factories
environment_registry:
  unit-001:
    id: "unit-001"
    alias: "unit_smoke_test"
    setup_metadata: "Smoke test environment"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  cifar-10:
    id: "cifar-10"
    alias: "cifar10"
    setup_metadata: "CIFAR-10 target task"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  cifar:
    id: "cifar"
    alias: "cifar100"
    setup_metadata: "CIFAR-100 target task"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  imagenet:
    id: "imagenet"
    alias: "imagenet_1k"
    setup_metadata: "ImageNet-1K pre-training source"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  svhn:
    id: "svhn"
    alias: "svhn"
    setup_metadata: "SVHN target task"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  ucf101:
    id: "ucf101"
    alias: "ucf101"
    setup_metadata: "UCF101 target task"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  food101:
    id: "food101"
    alias: "food101"
    setup_metadata: "Food-101 target task"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  sun397:
    id: "sun397"
    alias: "sun397"
    setup_metadata: "SUN397 target task"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  one_can_address_new:
    id: "one_can_address_new"
    alias: "address_new_tasks"
    setup_metadata: "Address new target tasks"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  target_tasks:
    id: "target_tasks"
    alias: "target_tasks"
    setup_metadata: "Target tasks across some domains"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  across_some:
    id: "across_some"
    alias: "across_some"
    setup_metadata: "Across some paper-semantic-chunks"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"
  paper_semantic_chunk_046:
    id: "paper-semantic-chunk-046-dataset-registry-additional-visualization-additional-visualization-figure"
    alias: "chunk_046_visualization"
    setup_metadata: "Additional visualization figure registry"
    available: true
    runnable_config_hook: "src.data.unit_python_py.resolve_epochs_defaults"

# 3. Dataset & Benchmark Loaders
dataset_registry:
  CIFAR10:
    id: "CIFAR10"
    setup_metadata: "CIFAR-10 dataset loader"
    validation_checks: "check_cifar10_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  SVHN:
    id: "SVHN"
    setup_metadata: "SVHN dataset loader"
    validation_checks: "check_svhn_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  cifar:
    id: "cifar"
    setup_metadata: "CIFAR dataset loader"
    validation_checks: "check_cifar_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  imagenet:
    id: "imagenet"
    setup_metadata: "ImageNet dataset loader"
    validation_checks: "check_imagenet_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  imagenet_1k:
    id: "imagenet_1k"
    setup_metadata: "ImageNet-1K dataset loader"
    validation_checks: "check_imagenet_1k_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  dtd:
    id: "dtd"
    setup_metadata: "Describable Textures Dataset loader"
    validation_checks: "check_dtd_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  eurosat:
    id: "eurosat"
    setup_metadata: "EuroSAT dataset loader"
    validation_checks: "check_eurosat_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  flowers:
    id: "flowers"
    setup_metadata: "Oxford Flowers 102 dataset loader"
    validation_checks: "check_flowers_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"
  oxford_pets:
    id: "oxford_pets"
    setup_metadata: "Oxford-IIIT Pets dataset loader"
    validation_checks: "check_oxford_pets_integrity"
    runnable_config_hook: "src.data.unit_smm_mask.resolve_learning_rate_defaults"

# 4. Method, Baseline, and Attack Selectors
method_selectors:
  ours: "SMM (Sample-specific Multi-channel Masks)"
  vit: "ViT-B32 pre-trained model"
  resnet: "ResNet-18 / ResNet-50 pre-trained model"
  lora: "Low-Rank Adaptation baseline"
  baselines:
    - PAD
    - NARROW
    - MEDIUM
    - FULL
  ablations:
    - ONLY_delta
    - ONLY_f_mask
    - SINGLE_CHANNEL_f_mask_s
    - standard_visual_reprogramming

# 5. Parameter Sweeps & Config Entries
parameter_sweeps:
  p:
    values: [0.0, 0.1, 0.5, 1.0]
    default: 0.5
  learning_rate:
    values: [0.001, 0.01, 0.1]
    default: 0.01
  patch_size:
    values: [4, 2, 1]
    default: 4
  epochs:
    values: [1, 10, 50, 100]
    default: 1
  mask_generator_cnn_architecture: "5-layer CNN"
  interpolation_scale_factor_l:
    values: [1, 2, 3]
    default: 2
  weight_decay:
    values: [0.0001, 0.0005, 0.001]
    default: 0.0005

# 6. Fixed Hyperparameter Anchors
fixed_hyperparameters:
  three_seed_protocol: [42, 100, 2024]
  imagenet_normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  vit_b32_imgsize: 384
  resnet_imgsize: 224
  ucf101_optimal:
    alpha: 0.001
    gamma: 1.0

# 7. Formula & Algorithm Symbol Inventory
formula_algorithm_symbols:
  ViT_B32: "ViT-B/32 pre-trained model"
  train_preprocess: "Compose[transforms.Resize(imgsize+32), RandomCrop(imgsize), Lambda(lambda x: x.convert('RGB')), Normalize]"
  test_preprocess: "Compose[transforms.Resize(imgsize), Normalize]"
  d_T: "Target image dimension"
  k_T: "Number of target classes"
  x_i: "Target input image sample"
  y_i: "Target label sample"
  f_P: "Reprogrammed image mapping function"
  f_out: "Output mapping function"
  f_in: "Pre-trained model input function"
  Y_sub: "Subset of pre-trained classes mapped to target classes"
  min_thetainTheta_omegainOmega: "Optimization objective over theta and omega"
  sum_i_1_n: "Summation over target training samples"
  theta: "Parameters of the visual reprogramming pattern delta"
  R_plus: "Positive real numbers domain"
  Theta: "Parameter space of delta"
  delta: "Shared visual reprogramming noise pattern"
  f_mask: "Lightweight mask generator CNN"
  d_P: "Pre-trained model input dimension"
  numeric_anchors:
    mean_r: 0.485
    mean_g: 0.456
    mean_b: 0.406
    std_r: 0.229
    std_g: 0.224
    std_b: 0.225
    vit_size: 384
    resnet_size: 224
    padding_width: 32
    min_val: 0
    max_val: 1
    scale_factor: 2

# 8. Declared Reproduction Artifacts
declared_artifacts:
  - "results/evidence_contract_matrix.json"
  - "results/experiment_registry.json"
  - "results/metrics.json"
  - "results/environment_registry.json"
  - "results/dataset_registry.json"
  - "results/artifact_manifest.json"
  - "results/sensitivity_report.json"
  - "results/tables/experiment_results.csv"
  - "results/figures/figure_1.png"
  - "results/figures/figure_2.png"
  - "results/figures/figure_3.png"
  - "results/tables/table_1.csv"
  - "results/tables/table_3.csv"
  - "results/tables/table_4.csv"
  - "results/tables/table_2.csv"
  - "results/figures/figure_4.png"
  - "results/figures/figure_5.png"
  - "results/figures/figure_6.png"