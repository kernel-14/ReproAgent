# 3. Parameter Sweeps & Config Entries
# Expose required parameter sweeps as executable constants/default accessors used by train/evaluate/report routes.
parameter_sweeps:
  mask_generator_cnn_architecture: "5-layer CNN"
  interpolation_scale_factor_l: [1, 2, 3]
  learning_rate: [0.001, 0.01, 0.1]
  weight_decay: [0.0001, 0.0005, 0.001]
  epochs: [1, 10, 50, 100]
  patch_size: [4, 2, 1]
  p: [0.0, 0.1, 0.5, 1.0]

# 4. Method, Baseline, and Attack Selectors
method_selectors:
  ours: "SMM (Sample-specific Multi-channel Masks)"
  vit: "ViT-B32"
  resnet: "ResNet-18"
  lora: "LoRA"

# 5. Fixed Hyperparameter Anchors
fixed_hyperparameters:
  three_seed_protocol: [42, 100, 2024]
  imagenet_normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  vit_b32_imgsize: 384
  resnet_imgsize: 224
  default_batch_size: 32
  default_epochs: 100
  default_learning_rate: 0.01
  default_weight_decay: 0.0005

# 6. Formula & Algorithm Symbol Inventory
# Every paper-visible formula, numeric anchor, hyperparameter default, and algorithm step is represented here.
formula_algorithm_anchors:
  addendum:
    symbols:
      - "ViT_B32"
      - "train_preprocess"
      - "Compose[transforms.Resizeimgsize+32,imgsize+32, RandomCropimgsize, Lambdalambdax:x.convert'RGB', NormalizeIMAGENETNORMALIZE['mean'],IMAGENETNORMALIZE['std'"
      - "test_preprocess"
      - "Compose[transforms.Resizeimgsize,imgsize"
    numeric_defaults:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      vit_imgsize: 384
      resnet_imgsize: 224
    formula: |
      IMAGENETNORMALIZE = {
        'mean': [0.485, 0.456, 0.406],
        'std': [0.229, 0.224, 0.225],
      }
      if model == "ViT_B32":
          imgsize = 384
      else:
          imgsize = 224
      train_preprocess = transforms.Compose([
          transforms.Resize((imgsize + 32, imgsize + 32)),
          transforms.RandomCrop(imgsize),
          transforms.RandomHorizontalFlip(),
          transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x),
          transforms.ToTensor(),
          transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std'])
      ])
      test_preprocess = transforms.Compose([
          transforms.Resize((imgsize, imgsize)),
          transforms.Lambda(lambda x: x.convert('RGB') if hasattr(x, 'convert') else x),
          transforms.ToTensor(),
          transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std'])
      ])

  framework_of_smm:
    symbols:
      - "delta"
      - "f_mask"
      - "f_in"
      - "theta"
      - "delta^*"
      - "f_out"
      - "d_P"
      - "d_T"
      - "x_i"
      - "phi"
      - "phi^*"
      - "f_P"
      - "R^d"
      - "y_i"
    algorithm_terms:
      - "objective"
      - "mask"
      - "sample"
    steps:
      - "Both methods use a pre-determined shared mask to indicate the valid location of pattern delta."
      - "We resize each target image and apply a different three-channel mask accordingly, driven by a lightweight f_mask with an interpolation up-scaling module, allowing for more variability in individual samples."

  architecture_of_mask_generator:
    symbols:
      - "f_mask"
      - "asset_8"
    numeric_defaults:
      layers: 5
      in_channels: 3
      out_channels: 3
      kernel_size: 3
      padding: 1
      stride: 1
    algorithm_terms:
      - "mask"
      - "ema"
    steps:
      - "Architecture of the 5-layer mask generator designed for ResNet Architecture of the Mask Generator."

  patch_wise_interpolation:
    symbols:
      - "f_out"
      - "delta"
      - "delta^*"
      - "f_in"
      - "f_mask"
      - "sum_i=1^n"
      - "f_P"
      - "x_i"
      - "y_i"
      - "alpha_1"
      - "alpha_2"
      - "phi"
      - "phi^*"
      - "d_P"
    numeric_defaults:
      scale_factor_l: 2
      min_val: 0
      max_val: 1
    algorithm_terms:
      - "algorithm"
      - "loss"
      - "gradient"
      - "mask"
      - "compute"
      - "initialize"
    steps:
      - "The patch-wise interpolation module upscales CNN-generated masks from H/2^l x W/2^l back to the original size H x W per channel."
      - "Employ a grid of H/2^l x W/2^l patches in the upsampling process, each sized 2^l x 2^l, ensuring the same values within each patch."

  problem_setting:
    symbols:
      - "f_out"
      - "f_in"
      - "Y_sub"
      - "min_thetainTheta"
      - "omegainOmega"
      - "sum_i=1^n"
      - "theta"
      - "d_T"
      - "k_T"
      - "x_i"
      - "y_i"
      - "f_P"
      - "R^+"
    numeric_defaults:
      loss_bound: 1
    algorithm_terms:
      - "formula"
      - "objective"
      - "loss"
    steps:
      - "Chen et al., 2023, and l: Y^T x Y^T -> R^+ U {0} is a loss function."

  understanding_masks:
    symbols:
      - "f_out"
      - "delta"
      - "R^+"
      - "R_D"
      - "int_X"
      - "p_X"
      - "F_1"
      - "F_2"
      - "x_i"
      - "d_P"
      - "f_P"
    numeric_defaults:
      min_error: 0
      max_error: 1
      norm_p: 2
    algorithm_terms:
      - "loss"
      - "mask"
      - "sample"
    steps:
      - "SMM enables stronger model learning capacity than previous representative VR methods, via showing reduced approximation error in the PAC learning framework."