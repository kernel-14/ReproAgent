# 3. Method, Baseline, and Attack Selectors
methods:
  ours: "smm"
  vit: "vit_b32"
  resnet: "resnet18"
  lora: "lora"
  baselines:
    - PAD
    - NARROW
    - MEDIUM
    - FULL
  ablations:
    - ONLY_delta
    - ONLY_f_mask
    - SINGLE_CHANNEL_f_mask_s
    - standard_visual_reprogramming

# 4. Parameter Sweeps & Bounded Config Entries
sweeps:
  p: [0.0, 0.1, 0.5, 1.0]
  learning_rate: [0.001, 0.01, 0.1]
  patch_size: [4, 2, 1]
  epochs: [1, 10, 50, 100]
  mask_generator_cnn_architecture: "5-layer CNN"
  interpolation_scale_factor_l: [1, 2, 3]
  weight_decay: [0.0001, 0.0005, 0.001]

# 5. Fixed Hyperparameter Anchors
fixed_hyperparameters:
  three_seed_protocol: [42, 100, 2024]
  imagenet_normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  vit_b32_imgsize: 384
  resnet_imgsize: 224
  ucf101_optimal:
    alpha: 0.001
    gamma: 1.0

# 6. Paper Formula & Algorithm Symbol Inventory (Code-Visible Anchors)
symbols:
  ViT_B32: "ViT_B32"
  train_preprocess: "Compose[transforms.Resize(imgsize+32, imgsize+32), transforms.RandomCrop(imgsize), transforms.Lambda(lambda x: x.convert('RGB')), transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std'])]"
  test_preprocess: "Compose[transforms.Resize(imgsize, imgsize), transforms.Normalize(IMAGENETNORMALIZE['mean'], IMAGENETNORMALIZE['std'])]"
  d_T: 3
  k_T: 10
  x_i: "x_i"
  y_i: "y_i"
  f_P: "f_P"
  f_out: "f_out"
  f_in: "f_in"
  Y_sub: "Y_sub"
  min_thetainTheta: "min_theta_in_Theta"
  omegainOmega: "omega_in_Omega"
  sum_i_1_n: "sum_i_1_to_n"
  theta: "theta"
  R_plus: "R^+"
  Theta: "Theta"
  delta: "delta"
  f_mask: "f_mask"
  d_P: 3
  numeric_anchors:
    mean_0: 0.485
    mean_1: 0.456
    mean_2: 0.406
    std_0: 0.229
    std_1: 0.224
    std_2: 0.225
    vit_size: 384
    resnet_size: 224
    cifar_size: 32
    one: 1
    zero: 0
    two: 2