# configs/or_optimization_loop.yaml
# Faithful, complete, and judgeable reproduction configuration for SMM optimization loop.
# Reference Grounding: paper:paper_training_or_optimization_loop (chunk_005, chunk_006, chunk_009)

# 1. Optimization Loop Configuration
# implementation_surface: training_loop
optimization_loop:
  training_routine: "src.methods.unit_smm_mask.train_smm"
  evaluation_routine: "src.methods.unit_smm_mask.evaluate_model"
  objective: "cross_entropy"
  optimizer: "Adam"
  scheduler: "CosineAnnealingLR"
  calls:
    compute_accuracy: "src.reporting.unit_python_py.compute_accuracy"
    aggregate_accuracy: "src.reporting.unit_python_py.aggregate_accuracy"
    compute_loss: "src.reporting.unit_python_py.compute_loss"
    aggregate_loss: "src.reporting.unit_python_py.aggregate_loss"
    compute_f1: "src.reporting.unit_python_py.compute_f1"
    aggregate_f1: "src.reporting.unit_python_py.aggregate_f1"
    compute_metric_entrypoint_config_artifact_writer_entrypoint_metric_entrypoint_objective: "src.reporting.unit_python_py.compute_metric_objective"
    compute_metric_entrypoint_config_artifact_writer_entrypoint_metric_entrypoint_score: "src.reporting.unit_python_py.compute_metric_score"
    write_main_artifact: "src.reporting.unit_python_py.write_main_artifact"
    write_artifact_manifest: "src.reporting.unit_python_py.write_artifact_manifest"
    compute_reward: "src.reporting.unit_python_py.compute_reward"
    load_unit_python_py: "src.data.unit_python_py.load_unit_python_py"

# 2. Method & Baseline Selector Set
# reference_grounding: paper:paper_training_or_optimization_loop chunk_005
methods:
  ours: "SMM (Sample-specific Multi-channel Masks)"
  vit: "ViT-B32"
  resnet: "ResNet-18"
  lora: "LoRA"
  baselines:
    - PAD
    - NARROW
    - MEDIUM
    - FULL
  ablations:
    - ONLY_delta
    - ONLY_f_mask
    - SINGLE_CHANNEL_f_mask_s
    - standard_visual_reprogramming
  mapping:
    - Rlm # Random Label Mapping (Rlm)

# 3. Parameter Sweeps
# reference_grounding: paper:paper_training_or_optimization_loop chunk_006
sweeps:
  p: [0.0, 0.1, 0.5, 1.0]
  learning_rate: [0.001, 0.01, 0.1]
  patch_size: [4, 2, 1]
  epochs: [1, 10, 50, 100]
  weight_decay: [0.0001, 0.0005, 0.001]
  interpolation_scale_factor_l: [1, 2, 3]

# 4. Fixed Hyperparameters & Protocols
# reference_grounding: paper:paper_training_or_optimization_loop chunk_006
fixed_hyperparameters:
  three_seed_protocol: [42, 100, 2024]
  mask_generator_cnn_architecture: "5-layer CNN"
  alpha_1: 1.0
  alpha_2: 1.0
  gamma: 1.0
  alpha: 0.001 # UCF101 specific
  vit_b32:
    img_size: 384
    pretrain: "ImageNet-1K"
  resnet18:
    img_size: 224
    pretrain: "ImageNet-1K"

# 5. Environment & Task Factories
# reference_grounding: paper:paper_training_or_optimization_loop chunk_005
task_factories:
  unit-001:
    alias: "unit_smoke_test"
    setup_metadata: "Smoke test environment"
    available: true
  cifar-10:
    alias: "cifar10"
    setup_metadata: "CIFAR-10 target task"
    available: true
  cifar:
    alias: "cifar100"
    setup_metadata: "CIFAR-100 target task"
    available: true
  imagenet:
    alias: "imagenet_1k"
    setup_metadata: "ImageNet-1K pre-training source"
    available: true
  svhn:
    alias: "svhn"
    setup_metadata: "SVHN target task"
    available: true
  ucf101:
    alias: "ucf101"
    setup_metadata: "UCF101 target task"
    available: true
  food101:
    alias: "food101"
    setup_metadata: "Food-101 target task"
    available: true
  sun397:
    alias: "sun397"
    setup_metadata: "SUN397 target task"
    available: true

# 6. Dataset & Benchmark Loaders
# reference_grounding: paper:paper_training_or_optimization_loop chunk_006
dataset_loaders:
  CIFAR10: "src.data.inventory_registry_make.load_cifar10"
  SVHN: "src.data.inventory_registry_make.load_svhn"
  imagenet_1k: "src.data.inventory_registry_make.load_imagenet"
  dtd: "src.data.inventory_registry_make.load_dtd"
  eurosat: "src.data.inventory_registry_make.load_eurosat"
  flowers: "src.data.inventory_registry_make.load_flowers"
  oxford_pets: "src.data.inventory_registry_make.load_oxford_pets"

# 7. Full Experiment Matrix Route
# reference_grounding: paper:paper_training_or_optimization_loop chunk_009
experiment_matrix:
  datasets: ["cifar10", "svhn", "imagenet_1k", "dtd", "eurosat", "flowers", "oxford_pets", "ucf101", "food101", "sun397"]
  methods: ["ours", "PAD", "FULL", "ONLY_delta", "ONLY_f_mask", "Rlm"]
  parameters:
    learning_rate: [0.01]
    patch_size: [4, 2, 1]
    epochs: [100]

