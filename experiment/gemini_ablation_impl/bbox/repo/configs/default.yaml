# configs/default.yaml
# reference_grounding: paperbench_ref_030 MMLU/run_mmlu_llama.py

metadata:
  title: "BBox-Adapter: Lightweight Adapting for Black-Box Large Language Models"
  reproduction_scope: "Faithful reproduction of BBox-Adapter training, inference, and evaluation routes."
  hypothesis: "一个统一、可配置的实验入口能够覆盖 BBox-Adapter 的核心方法、主结果、消融、扩展和成本分析复现路径。"
  decision_value: "确认下游代码生成应优先暴露统一 CLI、配置加载、实验选择、随机种子、dry-run/smoke-run 和 artifact 写出能力。"
  seed: 42

cli_template: "python -m bbox_adapter.run --experiment <name> --dataset <name> --base-model <name> --positive-source <name> --smoke"
callable_entrypoint: "main"

environment_task_factories:
  unit-001:
    id: "unit-001"
    alias: "question-answering"
    setup_metadata:
      positive_source: "ground_truth"
      cache_path: "results/cache"
      source_adapter_checkpoint: "results/adapter_checkpoint"
      target_base_model: "gpt-3.5-turbo"
      achieving_improvements: true
      determines_which: "adapter_scores"
      keep_all_paper_visible: true
    availability_checks:
      - "import bbox_adapter"
    runnable_config_hooks:
      data_pipeline: "bbox_adapter.datasets.build_datasets"
      config_factory: "bbox_adapter.config.resolve_batch_size_defaults"
      registry_configuration_artifact: "configs/default.yaml"

dataset_loaders:
  gsm8k:
    id: "gsm8k"
    aliases: ["GSM8K", "gsm8k"]
    setup_metadata:
      task_type: "mathematical"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  strategyqa:
    id: "strategyqa"
    aliases: ["StrategyQA", "strategyqa"]
    setup_metadata:
      task_type: "implicit_reasoning"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  truthfulqa:
    id: "truthfulqa"
    aliases: ["TruthfulQA", "truthfulqa"]
    setup_metadata:
      task_type: "truthful"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  scienceqa:
    id: "scienceqa"
    aliases: ["ScienceQA", "scienceqa"]
    setup_metadata:
      task_type: "scientific"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  toxigen:
    id: "toxigen"
    aliases: ["ToxiGen", "toxigen"]
    setup_metadata:
      task_type: "toxicity"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"

method_baseline_selectors:
  ours: "ours"
  chain_of_thought: "chain_of_thought"
  oracle: "oracle"
  heuristic: "heuristic"
  roberta: "roberta"
  fine_tuning: "fine_tuning"
  lora: "lora"
  sft_lora: "sft_lora"
  azure_sft: "azure_sft"
  mlm: "mlm"
  bbox_adapter: "bbox_adapter"
  ranking_nce: "ranking_nce"
  online_adaptation: "online_adaptation"
  single_step_inference: "single_step_inference"
  full_step_inference: "full_step_inference"
  ai_feedback: "ai_feedback"
  energy_based_model: "energy_based_model"

parameter_sweeps:
  positive_source:
    values: ["ground_truth", "ai_feedback", "human_feedback"]
    description: "positive sample source 应显式支持 Ground-Truth、AI Feedback、Human Feedback。"
  beam_size:
    values: [1, 3, 5]
    description: "beam sizes must include k=1,3,5 for Figure 3(a) scale analysis"
  iteration_count:
    values: [3, 0, 1, 2, 4]
    description: "iterations configurable"
  adapter_size:
    values: [0.1, 0.3]
    description: "adapter_size={0.1B,0.3B}"
  batch_size:
    values: [64]
    description: "batch_size"

fixed_hyperparameters:
  batch_size_64: 64
  nearest_neighbor_upsample: true

reproduction_artifacts:
  table_2:
    id: "table_2"
    caption: "Main results of adapting gpt-3.5-turbo on downstream tasks."
    metrics: ["accuracy", "absolute_improvement", "average_improvement"]
    output_paths:
      csv: "results/table2_main_results.csv"
      json: "results/table2_main_results.json"
  table_3:
    id: "table_3"
    caption: "Results of plug-and-play adaptation on davinci-002 and Mixtral-8×7B."
    metrics: ["accuracy"]
    output_paths:
      csv: "results/table3_plug_and_play.csv"
      json: "results/table3_plug_and_play.json"
  table_4:
    id: "table_4"
    caption: "Comparison of performance and cost for the base model, SFT, and BBOX-ADAPTER."
    metrics: ["accuracy", "accuracy_gain", "training_cost", "inference_cost", "relative_cost_ratio"]
    output_paths:
      csv: "results/table4_cost_analysis.csv"
      json: "results/table4_cost_analysis.json"
  table_5:
    id: "table_5"
    caption: "Accuracy (%) of BBox-ADAPTER fine-tuned with MLM loss and ranking-based NCE loss."
    metrics: ["accuracy", "loss_value"]
    output_paths:
      csv: "results/table5_ablation_nce_vs_mlm.csv"
      json: "results/table5_ablation_nce_vs_mlm.json"
  figure_3:
    id: "figure_3"
    caption: "Scale analysis on StrategyQA with different beam sizes and iterations."
    metrics: ["accuracy", "beam_size", "iteration_count"]
    output_paths:
      csv: "results/figure3_scale_analysis.csv"
      json: "results/figure3_scale_analysis.json"
  table_6:
    id: "table_6"
    caption: "Accuracy (%) and GPU memory usage on adapting Mixtral-8x7B to StrategyQA."
    metrics: ["accuracy", "gpu_memory"]
    output_paths:
      csv: "results/table6_whitebox_extension.csv"
      json: "results/table6_whitebox_extension.json"

output_artifacts:
  train_metrics: "results/train_metrics.json"
  metrics: "results/metrics.json"
  predictions: "results/predictions.jsonl"
  adapter_scores: "results/adapter_scores.jsonl"
  manifest: "results/manifest.json"
  config_snapshot: "results/config_snapshot.json"