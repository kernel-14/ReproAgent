# configs/unit_adapterfactory_from.yaml
# reference_grounding: paperbench_ref_030 readme.md

metadata:
  title: "BBox-Adapter: Lightweight Adapting for Black-Box Large Language Models"
  reproduction_scope: "Faithful reproduction of BBox-Adapter training, inference, and evaluation routes."
  hypothesis: "将黑盒 LLM 输出视为 proposal、将轻量 adapter 作为能量/评分模型，可以在无法访问参数、embedding 和输出概率时实现任务域校准。"
  decision_value: "若该单元实现成功，后续训练、推理、beam search 和在线适配都可围绕统一 of adapter score 接口构建；若失败，则核心方法不可复现。"
  seed: 42

environment_task_factories:
  unit-001:
    id: "unit-001"
    alias: "question-answering"
    setup_metadata:
      positive_source: "ground_truth"
      cache_path: "results/cache"
      source_adapter_checkpoint: "results/adapter_checkpoint"
      target_base_model: "gpt-3.5-turbo"
      achieving_improvements: true
      determines_which: "adapter_scores"
      keep_all_paper_visible: true
    availability_checks:
      - "import bbox_adapter"
    runnable_config_hooks:
      data_pipeline: "bbox_adapter.datasets.build_datasets"
      config_factory: "bbox_adapter.config.resolve_batch_size_defaults"
      registry_configuration_artifact: "configs/unit_adapterfactory_from.yaml"

dataset_loaders:
  gsm8k:
    id: "gsm8k"
    aliases: ["GSM8K", "gsm8k"]
    setup_metadata:
      task_type: "mathematical"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  strategyqa:
    id: "strategyqa"
    aliases: ["StrategyQA", "strategyqa"]
    setup_metadata:
      task_type: "implicit_reasoning"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  truthfulqa:
    id: "truthfulqa"
    aliases: ["TruthfulQA", "truthfulqa"]
    setup_metadata:
      task_type: "truthful"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  scienceqa:
    id: "scienceqa"
    aliases: ["ScienceQA", "scienceqa"]
    setup_metadata:
      task_type: "scientific"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  toxigen:
    id: "toxigen"
    aliases: ["ToxiGen", "toxigen"]
    setup_metadata:
      task_type: "toxicity"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"

selectable_methods:
  ours:
    class_path: "bbox_adapter.adapter.BBoxAdapter"
    description: "Proposed BBox-Adapter method"
  chain_of_thought:
    class_path: "bbox_adapter.baselines.ChainOfThought"
    description: "Chain of Thought baseline without adaptation"
  oracle:
    class_path: "bbox_adapter.baselines.Oracle"
    description: "Oracle upper bound baseline"
  heuristic:
    class_path: "bbox_adapter.baselines.Heuristic"
    description: "Heuristic baseline"
  roberta:
    class_path: "bbox_adapter.baselines.Roberta"
    description: "RoBERTa baseline"
  fine_tuning:
    class_path: "bbox_adapter.baselines.FineTuning"
    description: "Full parameter fine-tuning baseline"
  lora:
    class_path: "bbox_adapter.baselines.LoRA"
    description: "Low-Rank Adaptation baseline"
  sft_lora:
    class_path: "bbox_adapter.baselines.SFTLoRA"
    description: "Supervised Fine-Tuning with LoRA"
  azure_sft:
    class_path: "bbox_adapter.baselines.AzureSFT"
    description: "Azure OpenAI SFT service baseline"
  mlm:
    class_path: "bbox_adapter.baselines.MLM"
    description: "Masked Language Modeling loss baseline"
  bbox_adapter:
    class_path: "bbox_adapter.adapter.BBoxAdapter"
    description: "BBox-Adapter method alias"
  ranking_nce:
    class_path: "bbox_adapter.adapter.RankingNCE"
    description: "Ranking-based NCE loss adapter"
  online_adaptation:
    class_path: "bbox_adapter.adapter.OnlineAdaptation"
    description: "Online adaptation framework"
  single_step_inference:
    class_path: "bbox_adapter.inference.SingleStepInference"
    description: "Single-step inference mode"
  full_step_inference:
    class_path: "bbox_adapter.inference.FullStepInference"
    description: "Full-step inference mode"
  ai_feedback:
    class_path: "bbox_adapter.adapter.AIFeedback"
    description: "AI Feedback positive sample source"
  energy_based_model:
    class_path: "bbox_adapter.adapter.EnergyBasedModel"
    description: "Energy-Based Model scoring adapter"

parameter_sweeps:
  positive_sample_sources:
    - "Ground-Truth"
    - "AI Feedback"
    - "Human Feedback"
  beam_sizes:
    - 1
    - 3
    - 5
  iteration_counts:
    - 3
    - 0
    - 1
    - 2
    - 4
  adapter_sizes:
    - 0.1
    - 0.3
  batch_sizes:
    - 8
    - 64

reproduction_matrix:
  datasets:
    - "gsm8k"
    - "strategyqa"
    - "truthfulqa"
    - "scienceqa"
    - "toxigen"
  methods:
    - "Base model"
    - "Azure-SFT"
    - "BBOX-ADAPTER single-step"
    - "BBOX-ADAPTER full-step"
    - "MLM loss baseline"
    - "Base"
    - "LoRA"
    - "BBOX-ADAPTER"
  parameters:
    positive_source: "Ground-Truth"
    beam_size: 3
    iteration_count: 3
    adapter_size: 0.1
    batch_size: 8

output_paths:
  adapter_checkpoint: "results/adapter_checkpoint"
  adapter_scores: "results/adapter_scores.jsonl"
  train_metrics: "results/train_metrics.json"
  predictions: "results/predictions.jsonl"
  figure_1: "results/figures/figure_1.png"
  table_1: "results/tables/table_1.csv"
  figure_2: "results/figures/figure_2.png"
  table_2: "results/tables/table_2.csv"
  table_3: "results/tables/table_3.csv"
  table_4: "results/tables/table_4.csv"
  table_5: "results/tables/table_5.csv"
  figure_3: "results/figures/figure_3.png"
  table_6: "results/tables/table_6.csv"
  figure_4: "results/figures/figure_4.png"
  table_7: "results/tables/table_7.csv"
  table_8: "results/tables/table_8.csv"
  figure_5: "results/figures/figure_5.png"
  table_9: "results/tables/table_9.csv"