# configs/sweep_hyperparameter_schema.yaml
# reference_grounding: paperbench_ref_030 readme.md

metadata:
  title: "BBox-Adapter: Lightweight Adapting for Black-Box Large Language Models"
  reproduction_scope: "Faithful reproduction of BBox-Adapter hyperparameter sweeps and sensitivity analysis."
  hypothesis: "Sweep and hyperparameter fidelity controls whether a lightweight reproduction remains semantically tied to the paper."
  decision_value: "Determines which knobs generation must expose and which expensive variants can be deferred safely."
  seed: 42

environment_task_factories:
  unit-001:
    id: "unit-001"
    alias: "question-answering"
    setup_metadata:
      positive_source: "ground_truth"
      cache_path: "results/cache"
      source_adapter_checkpoint: "results/adapter_checkpoint"
      target_base_model: "gpt-3.5-turbo"
      achieving_improvements: true
      determines_which: "adapter_scores"
      keep_all_paper_visible: true
    availability_checks:
      - "import bbox_adapter"
    runnable_config_hooks:
      data_pipeline: "bbox_adapter.datasets.build_datasets"
      config_factory: "bbox_adapter.config.resolve_batch_size_defaults"
      registry_configuration_artifact: "configs/sweep_hyperparameter_schema.yaml"

dataset_loaders:
  gsm8k:
    id: "gsm8k"
    aliases: ["GSM8K", "gsm8k"]
    setup_metadata:
      task_type: "mathematical"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  strategyqa:
    id: "strategyqa"
    aliases: ["StrategyQA", "strategyqa"]
    setup_metadata:
      task_type: "implicit_reasoning"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  truthfulqa:
    id: "truthfulqa"
    aliases: ["TruthfulQA", "truthfulqa"]
    setup_metadata:
      task_type: "truthful"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  scienceqa:
    id: "scienceqa"
    aliases: ["ScienceQA", "scienceqa"]
    setup_metadata:
      task_type: "scientific"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  toxigen:
    id: "toxigen"
    aliases: ["ToxiGen", "toxigen"]
    setup_metadata:
      task_type: "toxicity"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"

method_baseline_selectors:
  ours: "ours"
  chain_of_thought: "chain_of_thought"
  oracle: "oracle"
  heuristic: "heuristic"
  roberta: "roberta"
  fine_tuning: "fine_tuning"
  lora: "lora"
  sft_lora: "sft_lora"
  azure_sft: "azure_sft"
  mlm: "mlm"
  bbox_adapter: "bbox_adapter"
  ranking_nce: "ranking_nce"
  online_adaptation: "online_adaptation"
  single_step_inference: "single_step_inference"
  full_step_inference: "full_step_inference"
  ai_feedback: "ai_feedback"
  energy_based_model: "energy_based_model"

parameter_sweeps:
  beam_size:
    values: [1, 3, 5]
    default: 3
    description: "Beam sizes for Figure 3(a) scale analysis"
  iteration_count:
    values: [3, 0, 1, 2, 4]
    default: 3
    description: "Number of iterations for online adaptation"
  adapter_size:
    values: ["0.1B", "0.3B"]
    default: "0.1B"
    description: "Size of the adapter layer"
  batch_size:
    values: [8, 16, 32, 64]
    default: 64
    description: "Batch size for training"
  positive_source:
    values: ["ground_truth", "ai_feedback", "human_feedback"]
    default: "ground_truth"
    description: "Positive sample source"

fixed_hyperparameters:
  batch_size_64: 64
  nearest_neighbor_upsample: true
  half_precision_attack: false
  random_sample_manifest: true

reproduction_artifacts:
  config_resolved:
    path: "results/config_resolved.json"
    description: "Resolved configuration artifact"
  sensitivity_report:
    path: "results/sensitivity_report.json"
    description: "Sensitivity report for hyperparameter sweeps"
  table_8:
    path: "results/tables/table_8.csv"
    caption: "Table 8. Hyperparameter settings of SFT-LoRA (Hu et al., 2021)."
    metrics:
      - "fidelity score"
      - "table 8 reproduction artifact"

active_reproduction_scope:
  preserve_explicit_baseline: "Ours"
  fidelity_score_collection: true
  table_8_verification: true