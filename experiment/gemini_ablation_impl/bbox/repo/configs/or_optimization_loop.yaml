# configs/or_optimization_loop.yaml
# reference_grounding: paperbench_ref_030 readme.md

metadata:
  title: "BBox-Adapter: Lightweight Adapting for Black-Box Large Language Models"
  reproduction_scope: "Faithful reproduction of BBox-Adapter online adaptation and optimization loop."
  hypothesis: "The paper's claimed improvement depends on the specified optimization sequence plus executable model definitions."
  decision_value: "Determines whether the generated repo can run the decisive intervention path under bounded smoke or full modes."
  seed: 42

environment_task_factories:
  unit-001:
    id: "unit-001"
    alias: "question-answering"
    setup_metadata:
      positive_source: "ground_truth"
      cache_path: "results/cache"
      source_adapter_checkpoint: "results/adapter_checkpoint"
      target_base_model: "gpt-3.5-turbo"
      achieving_improvements: true
      determines_which: "adapter_scores"
      keep_all_paper_visible: true
    availability_checks:
      - "import bbox_adapter"
    runnable_config_hooks:
      data_pipeline: "bbox_adapter.datasets.build_datasets"
      config_factory: "bbox_adapter.config.resolve_batch_size_defaults"
      registry_configuration_artifact: "configs/or_optimization_loop.yaml"

dataset_loaders:
  gsm8k:
    id: "gsm8k"
    aliases: ["GSM8K", "gsm8k"]
    setup_metadata:
      task_type: "mathematical"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  strategyqa:
    id: "strategyqa"
    aliases: ["StrategyQA", "strategyqa"]
    setup_metadata:
      task_type: "implicit_reasoning"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  truthfulqa:
    id: "truthfulqa"
    aliases: ["TruthfulQA", "truthfulqa"]
    setup_metadata:
      task_type: "truthful"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  scienceqa:
    id: "scienceqa"
    aliases: ["ScienceQA", "scienceqa"]
    setup_metadata:
      task_type: "scientific"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  toxigen:
    id: "toxigen"
    aliases: ["ToxiGen", "toxigen"]
    setup_metadata:
      task_type: "toxicity"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"

selectable_methods:
  ours:
    name: "BBOX-ADAPTER"
    class_path: "bbox_adapter.adapter.BBoxAdapter"
    description: "Proposed EBM-style scoring adapter for black-box LLMs."
  chain_of_thought:
    name: "Chain-of-Thoughts (CoT)"
    class_path: "bbox_adapter.baselines.CoTBaseline"
    description: "LLM performance without any adaptation."
  oracle:
    name: "Oracle"
    class_path: "bbox_adapter.baselines.OracleBaseline"
    description: "Upper bound selection baseline."
  heuristic:
    name: "Heuristic"
    class_path: "bbox_adapter.baselines.HeuristicBaseline"
    description: "Rule-based selection baseline."
  roberta:
    name: "RoBERTa"
    class_path: "bbox_adapter.baselines.RoBERTaBaseline"
    description: "RoBERTa-based classifier baseline."
  fine_tuning:
    name: "Supervised Fine-Tuning (SFT)"
    class_path: "bbox_adapter.baselines.SFTBaseline"
    description: "White-box full parameter fine-tuning."
  lora:
    name: "LoRA"
    class_path: "bbox_adapter.baselines.LoRABaseline"
    description: "Low-rank adaptation baseline."
  sft_lora:
    name: "SFT-LoRA"
    class_path: "bbox_adapter.baselines.SFTLoRABaseline"
    description: "LoRA under SFT setting for Mixtral."
  azure_sft:
    name: "Azure-SFT"
    class_path: "bbox_adapter.baselines.AzureSFTBaseline"
    description: "Azure OpenAI GPT-3.5-Turbo Fine-Tuning service."
  mlm:
    name: "MLM loss baseline"
    class_path: "bbox_adapter.baselines.MLMBaseline"
    description: "Masked Language Modeling loss baseline."
  bbox_adapter:
    name: "BBox-Adapter"
    class_path: "bbox_adapter.adapter.BBoxAdapter"
    description: "Proposed black-box adaptation method."
  ranking_nce:
    name: "Ranking NCE"
    class_path: "bbox_adapter.metrics.RankingNCELoss"
    description: "Ranking-based Noise Contrastive Estimation loss."
  online_adaptation:
    name: "Online Adaptation"
    class_path: "bbox_adapter.runner.OnlineAdaptationLoop"
    description: "Iterative sampling and training framework."
  single_step_inference:
    name: "BBOX-ADAPTER single-step"
    class_path: "bbox_adapter.inference.SingleStepInference"
    description: "Single-step adapted inference."
  full_step_inference:
    name: "BBOX-ADAPTER full-step"
    class_path: "bbox_adapter.inference.FullStepInference"
    description: "Full-step adapted inference."
  ai_feedback:
    name: "AI Feedback"
    class_path: "bbox_adapter.datasets.AIFeedbackLoader"
    description: "Positive samples from AI feedback."
  energy_based_model:
    name: "Energy-Based Model"
    class_path: "bbox_adapter.adapter.EBMScorer"
    description: "EBM perspective for black-box LLM adaptation."

parameter_sweeps:
  beam_size:
    values: [1, 3, 5]
    default: 3
    description: "Beam sizes for Figure 3(a) scale analysis."
  iteration_count:
    values: [3, 0, 1, 2, 4]
    default: 3
    description: "Number of iterations for online adaptation loop."
  adapter_size:
    values: [0.1, 0.3]
    default: 0.1
    description: "Size of the adapter layer in billions of parameters."
  batch_size:
    values: [8, 64]
    default: 64
    description: "Batch size for training the adapter."
  positive_source:
    values: ["ground_truth", "ai_feedback", "human_feedback"]
    default: "ground_truth"
    description: "Source of positive samples for NCE loss."

optimization_loop:
  training_loop:
    entrypoint: "bbox_adapter.runner.run_training_loop"
    loss_type: "ranking_nce"
    optimizer: "Paged AdamW 32bit"
    learning_rate: 2e-4
    weight_decay: 0.001
    max_grad_norm: 0.3
    lr_scheduler: "Cosine"
    epochs: 3
    spectral_normalization_alpha: 0.01

reproduction_artifacts:
  table_1:
    path: "results/tables/table_1.csv"
    caption: "Comparison of existing LLM adaptation methods based on five aspects."
    metrics: ["Model parameters accessibility", "Access to representations", "Token probability availability", "Retrieval corpus necessity", "Utilization of smaller adapter"]
  table_2:
    path: "results/tables/table_2.csv"
    caption: "Main results of adapting gpt-3.5-turbo on downstream tasks."
    metrics: ["accuracy", "absolute_improvement", "average_improvement"]
  table_3:
    path: "results/tables/table_3.csv"
    caption: "Results of plug-and-play adaptation on davinci-002 and Mixtral-8x7B."
    metrics: ["accuracy", "plug_and_play_transferability"]
  table_4:
    path: "results/tables/table_4.csv"
    caption: "Comparison of performance and cost for the base model, SFT, and BBOX-ADAPTER."
    metrics: ["accuracy", "training_cost", "inference_cost"]
  table_5:
    path: "results/tables/table_5.csv"
    caption: "Accuracy of BBox-ADAPTER fine-tuned with MLM loss and ranking-based NCE loss."
    metrics: ["accuracy", "loss_ablation"]
  figure_3:
    path: "results/figures/figure_3.png"
    caption: "Scale analysis on StrategyQA with different beam sizes and iterations."
    metrics: ["beam_size_sweep", "iteration_sweep"]
  table_6:
    path: "results/tables/table_6.csv"
    caption: "Accuracy and GPU memory usage on adapting Mixtral-8x7B to StrategyQA."
    metrics: ["accuracy", "vram_usage"]

active_reproduction_scope:
  smoke_mode:
    bounded_data_limit: 5
    bounded_epochs: 1
    bounded_iterations: 1
    bounded_beam_sizes: [1, 3]
    output_dir: "results"
    readiness_file: "results/readiness.json"
    result_file: "results/evaluation_result.json"