# configs/evidence_obligation_registry.yaml
# reference_grounding: paperbench_ref_030 readme.md

metadata:
  title: "BBox-Adapter: Lightweight Adapting for Black-Box Large Language Models"
  reproduction_scope: "Faithful reproduction of BBox-Adapter training, inference, and evaluation routes."
  hypothesis: "Preserving the paper's named experiment, dataset, environment, method, parameter, trend, and artifact obligations is necessary for the generated repository to reproduce the decisive contribution claims."
  decision_value: "Lets prepare and plan stages reject missing paper-stated Experiment/ablation/sensitivity coverage before generation, instead of waiting for post-generation semantic review."
  seed: 42

environment_task_factories:
  unit-001:
    id: "unit-001"
    alias: "question-answering"
    setup_metadata:
      positive_source: "ground_truth"
      cache_path: "results/cache"
      source_adapter_checkpoint: "results/adapter_checkpoint"
      target_base_model: "gpt-3.5-turbo"
      achieving_improvements: true
      determines_which: "adapter_scores"
      keep_all_paper_visible: true
    availability_checks:
      - "import bbox_adapter"
    runnable_config_hooks:
      data_pipeline: "bbox_adapter.datasets.build_datasets"
      config_factory: "bbox_adapter.config.resolve_batch_size_defaults"
      registry_configuration_artifact: "configs/evidence_obligation_registry.yaml"

dataset_loaders:
  gsm8k:
    id: "gsm8k"
    aliases: ["GSM8K", "gsm8k"]
    setup_metadata:
      task_type: "mathematical"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  strategyqa:
    id: "strategyqa"
    aliases: ["StrategyQA", "strategyqa"]
    setup_metadata:
      task_type: "implicit_reasoning"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  truthfulqa:
    id: "truthfulqa"
    aliases: ["TruthfulQA", "truthfulqa"]
    setup_metadata:
      task_type: "truthful"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  scienceqa:
    id: "scienceqa"
    aliases: ["ScienceQA", "scienceqa"]
    setup_metadata:
      task_type: "scientific"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"
  toxigen:
    id: "toxigen"
    aliases: ["ToxiGen", "toxigen"]
    setup_metadata:
      task_type: "toxicity"
    validation_checks:
      - "check_dataset_exists"
    runnable_config_hooks:
      load_route: "bbox_adapter.datasets.load_dataset"

method_baseline_selectors:
  ours:
    id: "ours"
    description: "BBox-Adapter proposed method"
  chain_of_thought:
    id: "chain_of_thought"
    description: "Chain of Thought prompting baseline"
  oracle:
    id: "oracle"
    description: "Oracle baseline"
  heuristic:
    id: "heuristic"
    description: "Heuristic baseline"
  roberta:
    id: "roberta"
    description: "RoBERTa baseline"
  fine_tuning:
    id: "fine_tuning"
    description: "Supervised Fine-Tuning baseline"
  lora:
    id: "lora"
    description: "LoRA baseline"
  sft_lora:
    id: "sft_lora"
    description: "SFT-LoRA baseline"
  azure_sft:
    id: "azure_sft"
    description: "Azure OpenAI SFT baseline"
  mlm:
    id: "mlm"
    description: "MLM loss baseline"
  bbox_adapter:
    id: "bbox_adapter"
    description: "BBox-Adapter method"
  ranking_nce:
    id: "ranking_nce"
    description: "Ranking-based NCE loss"
  online_adaptation:
    id: "online_adaptation"
    description: "Online adaptation framework"
  single_step_inference:
    id: "single_step_inference"
    description: "Single-step inference mode"
  full_step_inference:
    id: "full_step_inference"
    description: "Full-step inference mode"
  ai_feedback:
    id: "ai_feedback"
    description: "AI Feedback positive source"
  energy_based_model:
    id: "energy_based_model"
    description: "Energy-Based Model perspective"

parameter_sweeps:
  beam_size:
    values: [1, 3, 5]
    description: "Beam sizes for Figure 3(a) scale analysis"
  iteration_count:
    values: [3, 0, 1, 2, 4]
    description: "Number of iterations for online adaptation"
  adapter_size:
    values: [0.1, 0.3]
    description: "Adapter sizes in billions of parameters (0.1B, 0.3B)"
  batch_size:
    values: [64]
    description: "Batch size for training"
  positive_source:
    values: ["ground_truth", "ai_feedback", "human_feedback"]
    description: "Positive sample source explicitly supported"

fixed_hyperparameters:
  batch_size_64: 64
  nearest_neighbor_upsample: true

result_trend_assertions:
  baseline_outperformance:
    description: "Proposed method should be compared against explicit baselines and show improvement."
    expected_average_improvement: 0.0639

reproduction_artifacts:
  evidence_contract_matrix:
    path: "results/evidence_contract_matrix.json"
  experiment_registry:
    path: "results/experiment_registry.json"
  metrics:
    path: "results/metrics.json"
  dataset_registry:
    path: "results/dataset_registry.json"
  artifact_manifest:
    path: "results/artifact_manifest.json"
  sensitivity_report:
    path: "results/sensitivity_report.json"
  figure_1:
    path: "results/figures/figure_1.png"
    caption: "Illustration of white-box, grey-box, and black-box LLM adaptation."
  table_1:
    path: "results/tables/table_1.csv"
    caption: "Comparison of existing LLM adaptation methods based on five aspects."
  figure_2:
    path: "results/figures/figure_2.png"
    caption: "Overview of BBox-ADAPTER for black-box LLM adaptation."
  table_2:
    path: "results/tables/table_2.csv"
    caption: "Main results of adapting gpt-3.5-turbo on downstream tasks."
  table_3:
    path: "results/tables/table_3.csv"
    caption: "Results of plug-and-play adaptation on davinci-002 and Mixtral-8x7B."
  table_4:
    path: "results/tables/table_4.csv"
    caption: "Comparison of performance and cost for the base model, SFT, and BBox-Adapter."
  table_5:
    path: "results/tables/table_5.csv"
    caption: "Accuracy of BBox-Adapter fine-tuned with MLM loss and ranking-based NCE loss."
  figure_3:
    path: "results/figures/figure_3.png"
    caption: "Scale analysis on StrategyQA with different beam sizes and iterations."
  table_6:
    path: "results/tables/table_6.csv"
    caption: "Accuracy and GPU memory usage on adapting Mixtral-8x7B to StrategyQA."

measurement_collection:
  metrics:
    - "accuracy"
    - "loss"
    - "training_cost"
    - "inference_cost"
    - "api_cost"
    - "memory_usage"
    - "gpu_memory"
    - "toxicity"