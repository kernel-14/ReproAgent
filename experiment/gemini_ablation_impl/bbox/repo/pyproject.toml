[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbox_adapter"
version = "0.1.0"
description = "BBox-Adapter: Lightweight Adapting for Black-Box Large Language Models"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
# Optional heavy dependencies for training, simulation, and plotting
heavy = [
    "torch>=1.12.0",
    "transformers>=4.20.0",
    "openai>=1.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.60.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
bbox-adapter = "bbox_adapter.run:main"

[tool.setuptools]
packages = ["bbox_adapter"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]