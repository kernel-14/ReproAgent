# -------------------------------------------------------------------------
# 6. Parameter Sweeps & Hyperparameters
# -------------------------------------------------------------------------
parameter_sweeps:
  guidance_scale_gamma:
    default: 1.5
    values: [1.0, 1.5, 2.0, 3.0, 5.0]
  top_p:
    default: 0.9
    values: [0.8, 0.9, 0.95, 1.0]
  temperature:
    default: 0.7
    values: [0.2, 0.5, 0.7, 1.0]
  p:
    default: 0.9
    values: [0.8, 0.9, 0.95, 1.0]

fixed_hyperparameter_anchors:
  gamma_5: 5.0
  gamma_1_5: 1.5
  gamma_1: 1.0

# -------------------------------------------------------------------------
# 7. Method/Baseline/Attack Selectors
# -------------------------------------------------------------------------
method_selectors:
  - "ours"
  - "chain_of_thought"
  - "bert"
  - "ppo"

# -------------------------------------------------------------------------
# 8. Baseline Default Hyperparameters
# -------------------------------------------------------------------------
baseline_default_hyperparameters:
  ours:
    gamma: 1.5
    temperature: 0.7
    top_p: 0.9
  chain_of_thought:
    gamma: 1.5
    temperature: 0.7
    top_p: 0.9
  bert:
    learning_rate: 0.00005
    epochs: 3
  ppo:
    learning_rate: 0.00001
    clip_range: 0.2

# -------------------------------------------------------------------------
# 9. Paper Formula/Algorithm Anchors
# -------------------------------------------------------------------------
formula_anchors:
  classifier_guidance_text_to_image:
    section: "2.1. Classifier Guidance in Text-to-Image Models"
    symbols: ["P_theta", "P_phi", "gamma", "theta", "epsilon_t", "x_t_plus_1"]
    numeric_defaults: [4, 1, 0, 3]
    algorithm_terms: ["equation", "ema", "sample"]
    formula: "log P_hat_theta(epsilon_t | x_t+1, c) = gamma * log P_theta(epsilon_t | x_t+1, c) - (gamma - 1) * log P_theta(epsilon_t | x_t+1)"

  classifier_free_guidance_language_models:
    section: "2.2. Classifier-Free Guidance of Language Models"
    symbols: ["P_theta", "prod_i_1_T", "gamma", "prod_i_T", "w_i", "w_j_less_than_i"]
    numeric_defaults: [1, 6, 7, 5, 3.4]
    algorithm_terms: ["equation", "formula", "sample"]
    formula: "log P_hat_theta(w_i | w_j<i, c) = log P_theta(w_i | w_j<i) + gamma * (log P_theta(w_i | w_j<i, c) - log P_theta(w_i | w_j<i))"

  addendum_flops:
    section: "addendum"
    symbols: ["flops_computation", "sum_k", "sum_i_1_n", "w_p", "p_k", "x_i", "x_less_than_i"]
    numeric_defaults: [5.1, 1]
    algorithm_terms: ["equation", "formula", "search"]
    formula: "flops_computation = sum_k(p_k) + sum_i_1_n(x_i)"

  deliberative_prompting_cot:
    section: "C.5. Deliberative Prompting: Chain-of-Thought"
    symbols: ["gamma"]
    numeric_defaults: [1, 1.5, 14, 0.8, 15, 0.6]
    formula: "gamma_baseline = 1.0, gamma_ours = 1.5"

  basic_prompting_zero_shot:
    section: "3.1. Basic Prompting: Zero-Shot Prompts"
    symbols: ["gamma"]
    numeric_defaults: [81, 1.5, 77.9]
    formula: "LLaMA-7B accuracy = 81% with gamma = 1.5, outperforming PaLM-540B (77.9%)"

  program_synthesis_evaluations:
    section: "3.3.1. PROGRAM SYNTHESIS EVALUATIONS"
    symbols: ["gamma"]
    numeric_defaults: [4, 8, 2, 3, 1, 10, 100, 0.2]
    algorithm_terms: ["increase"]
    formula: "pass@k for k = 1, 10, 100 with different CFG strengths and temperatures"

  cfg_vs_instruction_tuning:
    section: "E. Further Comparison between CFG and Instruction-Tuning"
    symbols: ["CFG", "gamma", "P_instruct"]
    numeric_defaults: [0.9, 1.5, 90, 50]
    formula: "Entropy comparison of P(y|x), P(x), CFG-gamma=1.5, and P_instruct(y|x)"

# -------------------------------------------------------------------------
# 10. CFG Logit Transformation Core
# -------------------------------------------------------------------------
cfg_logit_transformation:
  name: "CFG Logit Transformation"
  formula: "L_cfg = L_uncond + gamma * (L_cond - L_uncond)"
  parameters:
    gamma: 1.5

# -------------------------------------------------------------------------
# 11. Active Reproduction Scope Notes
# -------------------------------------------------------------------------
reproduction_scope:
  active: true
  notes: "This configuration file exposes all required environment/task factories, dataset loaders, parameter sweeps, and formula anchors for the Classifier-Free Guidance reproduction."