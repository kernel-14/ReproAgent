  - id: "Closebook QA"
    aliases: ["closebook_qa"]
    setup_metadata:
      description: "Closebook QA dataset loader"
    validation_check: "validate_closebook_qa"
    runnable_config_hook: "setup_closebook_qa_config"
  - id: "Common Sense Reasoning"
    aliases: ["common_sense_reasoning"]
    setup_metadata:
      description: "Common Sense Reasoning dataset loader"
    validation_check: "validate_common_sense_reasoning"
    runnable_config_hook: "setup_common_sense_reasoning_config"
  - id: "Open-Assistant"
    aliases: ["open_assistant"]
    setup_metadata:
      description: "Open-Assistant dataset loader"
    validation_check: "validate_open_assistant"
    runnable_config_hook: "setup_open_assistant_config"
  - id: "glue"
