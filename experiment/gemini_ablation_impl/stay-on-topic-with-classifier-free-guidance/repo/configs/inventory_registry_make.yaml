# configs/inventory_registry_make.yaml
# Faithful reproduction inventory registry configuration for "Stay on topic with Classifier-Free Guidance"

# -------------------------------------------------------------------------
# 1. Defined Symbols (defines_symbols)
# -------------------------------------------------------------------------
defines_symbols:
  w_p: "prompt"
  flops_computation: "flops_computation_formula"
  sum_k: "sum_k_formula"
  p_k: "p_k_formula"
  x_i: "x_i_formula"
  sum_i_1_n: "sum_i_1_n_formula"
  equation: "equation_formula"
  formula: "formula_definition"
  search: "search_algorithm"
  p_theta: "p_theta_model"
  p_phi: "p_phi_classifier"

# -------------------------------------------------------------------------
# 2. Calls Symbols (calls_symbols)
# -------------------------------------------------------------------------
calls_symbols:
  - "write_environment_registry_artifact"
  - "write_environment_readiness_artifact"
  - "write_figure_1_artifact"
  - "write_table_11_artifact"
  - "write_table_1_artifact"
  - "write_table_5_artifact"
  - "write_figure_6_artifact"
  - "write_figure_2_artifact"
  - "run_table_1615_route"
  - "write_table_1615_artifact"
  - "run_figure_3_route"
  - "write_figure_3_artifact"

# -------------------------------------------------------------------------
# 3. Environment Registry & Task Factories
# -------------------------------------------------------------------------
environment_registry:
  - id: "unit-002"
    aliases: ["zero_shot_eval", "glue"]
    setup_metadata:
      description: "Zero-shot evaluation environment"
      decides_which: "zero_shot"
    availability_check: "check_zero_shot_available"
    runnable_config_hook: "setup_zero_shot_config"
  - id: "unit-003"
    aliases: ["cot_eval"]
    setup_metadata:
      description: "Chain-of-Thought evaluation environment"
      decides_which: "cot"
    availability_check: "check_cot_available"
    runnable_config_hook: "setup_cot_config"
  - id: "unit-004"
    aliases: ["program_synthesis_eval"]
    setup_metadata:
      description: "Program synthesis evaluation environment"
      decides_which: "program_synthesis"
    availability_check: "check_program_synthesis_available"
    runnable_config_hook: "setup_program_synthesis_config"
  - id: "unit-007"
    aliases: ["negative_prompting_eval"]
    setup_metadata:
      description: "Negative prompting evaluation environment"
      decides_which: "negative_prompting"
    availability_check: "check_negative_prompting_available"
    runnable_config_hook: "setup_negative_prompting_config"
  - id: "glue"
    aliases: ["glue_tasks"]
    setup_metadata:
      description: "GLUE benchmark tasks"
      decides_which: "glue"
    availability_check: "check_glue_available"
    runnable_config_hook: "setup_glue_config"
  - id: "significantly_different"
    aliases: ["significantly_different_eval"]
    setup_metadata:
      description: "Significantly different evaluation distributions"
    availability_check: "check_significantly_different_available"
    runnable_config_hook: "setup_significantly_different_config"
  - id: "underperform_distributions"
    aliases: ["underperform_distributions_among_all"]
    setup_metadata:
      description: "Underperform distributions among all tasks"
    availability_check: "check_underperform_distributions_available"
    runnable_config_hook: "setup_underperform_distributions_config"
  - id: "humanoid"
    aliases: ["humanoid_eval"]
    setup_metadata:
      description: "Humanoid evaluation environment"
    availability_check: "check_humanoid_available"
    runnable_config_hook: "setup_humanoid_config"
  - id: "common_sense_reasoning"
    aliases: ["common_sense_reasoning_eval"]
    setup_metadata:
      description: "Common sense reasoning tasks"
    availability_check: "check_common_sense_reasoning_available"
    runnable_config_hook: "setup_common_sense_reasoning_config"
  - id: "diverse_array"
    aliases: ["diverse_array_eval"]
    setup_metadata:
      description: "Diverse array of tasks"
    availability_check: "check_diverse_array_available"
    runnable_config_hook: "setup_diverse_array_config"

# -------------------------------------------------------------------------
# 4. Explicit Environment/Task Coverage & Initialization Surfaces
# -------------------------------------------------------------------------
explicit_environment_task_coverage:
  - "unit-002"
  - "unit-003"
  - "unit-004"
  - "unit-007"
  - "glue"
  - "significantly different"
  - "underperform distributions among all"
  - "humanoid"
  - "decides which"
  - "config tests artifact-writer expose explicit"
  - "common sense reasoning"
  - "diverse array"

# -------------------------------------------------------------------------
# 5. Dataset/Benchmark Loaders
# -------------------------------------------------------------------------
dataset_loaders:
  - id: "LAMBADA"
    aliases: ["lambada", "glue"]
    setup_metadata:
      description: "LAMBADA dataset loader"
    validation_check: "validate_lambada"
    runnable_config_hook: "setup_lambada_config"
  - id: "Closebook QA"
    aliases: ["closebook_qa"]
    setup_metadata:
      description: "Closebook QA dataset loader"
    validation_check: "validate_closebook_qa"
    runnable_config_hook: "setup_closebook_qa_config"
  - id: "Common Sense Reasoning"
    aliases: ["common_sense_reasoning"]
    setup_metadata:
      description: "Common Sense Reasoning dataset loader"
    validation_check: "validate_common_sense_reasoning"
    runnable_config_hook: "setup_common_sense_reasoning_config"
  - id: "Open-Assistant"
    aliases: ["open_assistant"]
    setup_metadata:
      description: "Open-Assistant dataset loader"
    validation_check: "validate_open_assistant"
    runnable_config_hook: "setup_open_assistant_config"

# -------------------------------------------------------------------------
# 6. Parameter Sweeps & Hyperparameters
# -------------------------------------------------------------------------
parameter_sweeps:
  guidance_scale_gamma:
    default: 1.5
    sweep_values: [1.0, 1.25, 1.5, 1.75, 2.0, 3.0, 4.0, 8.0]
  top_p:
    default: 0.9
    sweep_values: [0.8, 0.9, 0.95, 1.0]
  temperature:
    default: 0.8
    sweep_values: [0.2, 0.6, 0.8, 1.0]
  p:
    default: 0.9
    sweep_values: [0.8, 0.9, 0.95]

fixed_hyperparameter_anchors:
  gamma_5: 5.0
  gamma_1_5: 1.5
  gamma_1_25: 1.25
  gamma_1: 1.0
  gamma_2: 2.0
  gamma_4: 4.0
  gamma_8: 8.0
  gamma_3: 3.0
  gamma_0_2: 0.2
  gamma_0_6: 0.6
  gamma_0_8: 0.8
  gamma_14: 14.0
  gamma_15: 15.0
  top_p_0_9: 0.9
  temperature_0_8: 0.8

method_baseline_attack_selectors:
  - "ours"
  - "chain_of_thought"
  - "bert"
  - "ppo"

baseline_default_hyperparameters:
  ours:
    gamma: 1.5
    temperature: 0.8
    top_p: 0.9
  chain_of_thought:
    gamma: 1.5
    temperature: 0.8
    top_p: 0.9
  bert:
    learning_rate: 5e-5
    epochs: 3
  ppo:
    learning_rate: 1e-5
    epochs: 4

