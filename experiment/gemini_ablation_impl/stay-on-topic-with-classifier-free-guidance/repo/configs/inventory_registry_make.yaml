# -------------------------------------------------------------------------
# 8. Paper Formula/Algorithm Anchors & Steps
# -------------------------------------------------------------------------
formula_algorithm_anchors:
  - section: "2.1. Classifier Guidance in Text-to-Image Models"
    symbols: ["P_theta", "P_phi", "gamma", "theta", "epsilon_t", "x_t+1"]
    numeric_defaults: [4, 1, 0, 3]
    algorithm_terms: ["equation", "ema", "sample"]
    steps: "log P_hat_theta(epsilon_t | x_t+1, c) = gamma * log P_theta(epsilon_t | x_t+1, c) - (gamma - 1) * log P_theta(epsilon_t | x_t+1)"
  
  - section: "2.2. Classifier-Free Guidance of Language Models"
    symbols: ["P_theta", "prod_i=1^T", "gamma", "prod_i^T", "w_i", "w_j<i"]
    numeric_defaults: [1, 6, 7, 5, 3.4]
    algorithm_terms: ["equation", "formula", "sample"]
    steps: "log P_hat_theta(w_i | w_j<i, c) = log P_theta(w_i | w_j<i) + gamma * (log P_theta(w_i | w_j<i, c) - log P_theta(w_i | w_j<i))"

  - section: "addendum"
    symbols: ["flops_computation", "sum_k", "sum_i=1^n", "w_p", "p_k", "x_i", "x_<i"]
    numeric_defaults: [5.1, 1]
    algorithm_terms: ["equation", "formula", "search"]
    steps: "FLOPs are measured using flops_computation.py from google-research/electra. Falcon-7b-Base model is used."

  - section: "3.3.1. PROGRAM SYNTHESIS EVALUATIONS"
    symbols: ["gamma"]
    numeric_defaults: [4, 8, 2, 3, 1, 10, 100, 0.2]
    algorithm_terms: ["increase"]
    formula: "We test different CFG strength and different temperatures, evaluating at pass @ k for k=1, 10, 100."

  - section: "C.5. Deliberative Prompting: Chain-of-Thought"
    symbols: ["gamma"]
    numeric_defaults: [1, 1.5, 14, 0.8, 15, 0.6]
    formula: "In each cell, the first value is the result for gamma=1 (baseline) and the second value is the result for gamma=1.5 (ours)."

  - section: "3.1. Basic Prompting: Zero-Shot Prompts"
    symbols: ["gamma"]
    numeric_defaults: [81, 1.5, 77.9]
    formula: "LLaMA 7B model achieves 81% accuracy in Lambada (OpenAI) zero-shot benchmark with gamma=1.5, outperforming the current SOTA (zero-shot) of PaLM-540B (77.9%)."

  - section: "5.3. Visualizing Classifier-Free Guidance"
    symbols: ["w_t", "w_<t", "w_T", "w_hat", "c_bar"]
    numeric_defaults: [3]
    algorithm_terms: ["rank"]
    formula: "We visualize the vocabulary at each timestep ranked by the difference log P(w_t | w_<t) - log P(w_T | w_hat), showing which tokens are encouraged or discouraged the most."

  - section: "Red Square Generation"
    symbols: ["gamma"]
    numeric_defaults: [1600, 1.0, 2.0, 1, 1.25, 1.5, 1.75, 73]
    formula: "We produce 1600 completions for each CFG strength gamma = 1.0, 2.0."

