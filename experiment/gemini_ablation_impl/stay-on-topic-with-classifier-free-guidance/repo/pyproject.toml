[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build-meta"

[project]
name = "stay_on_topic_cfg"
version = "0.1.0"
description = "A faithful reproduction of Stay on topic with Classifier-Free Guidance"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Paperbench Repro Agent", email = "agent@paperbench.repro" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Lightweight core dependencies
dependencies = [
    "numpy>=1.20.0",
    "pyyaml>=6.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "click>=8.0.0",
    "jinja2>=3.0.0",
]

# Optional heavy simulator/training/deep learning dependencies
[project.optional-dependencies]
heavy = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "gymnasium>=0.28.1",
    "stable-baselines3>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]