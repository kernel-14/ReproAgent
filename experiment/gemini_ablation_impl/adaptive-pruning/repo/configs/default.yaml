# configs/default.yaml
# Configuration file for APT (Adaptive Pruning and Tuning Pretrained Language Models)
# Faithful reproduction configuration containing all paper-derived environments, datasets,
# hyperparameter anchors, parameter sweeps, and formula/algorithm symbol mappings.

# ==========================================
# Environment & Task Factories
# ==========================================
environment_factories:
  unit-001:
    id: "unit-001"
    aliases: ["unit-001", "smoke_test"]
    setup_metadata:
      description: "Smoke test environment for basic pipeline validation"
      requires_gpu: false
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_unit_config"

  squad:
    id: "squad"
    aliases: ["squad", "squad_v1.1", "squad_v2.0"]
    setup_metadata:
      description: "Stanford Question Answering Dataset for reading comprehension evaluation"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_squad_config"

  glue:
    id: "glue"
    aliases: ["glue", "glue_benchmark"]
    setup_metadata:
      description: "General Language Understanding Evaluation benchmark"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_glue_config"

  pruning_roberta_models_targeting_similar:
    id: "pruning_roberta_models_targeting_similar"
    aliases: ["roberta_pruning", "roberta_similar"]
    setup_metadata:
      description: "Pruning RoBERTa models targeting similar downstream performance"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_roberta_pruning_config"

  apt_consistently_reach_higher:
    id: "apt_consistently_reach_higher"
    aliases: ["apt_higher_perf"]
    setup_metadata:
      description: "APT consistently reaching higher performance than standard pruning"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_apt_higher_config"

  salience_notably_hurts:
    id: "salience_notably_hurts"
    aliases: ["salience_hurt_ablation"]
    setup_metadata:
      description: "Ablation showing that removing salience notably hurts performance"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_salience_hurt_config"

  sst2:
    id: "sst2"
    aliases: ["sst2", "glue_sst2"]
    setup_metadata:
      description: "Stanford Sentiment Treebank task from GLUE"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_sst2_config"

  open_llm_leaderboard_few_shot:
    id: "open_llm_leaderboard_few_shot"
    aliases: ["open_llm", "few_shot_leaderboard"]
    setup_metadata:
      description: "Open LLM Leaderboard few-shot evaluation tasks"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_open_llm_config"

  fine_tuning_will_not_hurt_their:
    id: "fine_tuning_will_not_hurt_their"
    aliases: ["ft_no_hurt"]
    setup_metadata:
      description: "Verification that fine-tuning will not hurt their pre-trained capabilities"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_ft_no_hurt_config"

  apt_reaches_superior:
    id: "apt_reaches_superior"
    aliases: ["apt_superior"]
    setup_metadata:
      description: "Verification that APT reaches superior efficiency-accuracy trade-offs"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_apt_superior_config"

  determines_which:
    id: "determines_which"
    aliases: ["determine_adapters"]
    setup_metadata:
      description: "Analysis of which adapters are selected and tuned by APT"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_determine_adapters_config"

  keep_all_paper_visible:
    id: "keep_all_paper_visible"
    aliases: ["paper_visible_all"]
    setup_metadata:
      description: "Keep all paper-visible experiments and baselines active"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_paper_visible_config"


# ==========================================
# Dataset & Benchmark Loaders
# ==========================================
dataset_loaders:
  SST2:
    id: "SST2"
    aliases: ["SST2", "sst2", "glue/sst2"]
    setup_metadata:
      num_classes: 2
      metric: "accuracy"
    validation_check: "src.apt.data.pipeline.validate_sst2"
    runnable_config_hook: "src.apt.data.pipeline.load_sst2"

  MNLI:
    id: "MNLI"
    aliases: ["MNLI", "mnli", "glue/mnli"]
    setup_metadata:
      num_classes: 3
      metric: "accuracy"
    validation_check: "src.apt.data.pipeline.validate_mnli"
    runnable_config_hook: "src.apt.data.pipeline.load_mnli"

  squad:
    id: "squad"
    aliases: ["squad", "squad_v1.1"]
    setup_metadata:
      metric: "f1"
    validation_check: "src.apt.data.pipeline.validate_squad"
    runnable_config_hook: "src.apt.data.pipeline.load_squad"

  glue:
    id: "glue"
    aliases: ["glue", "glue_all"]
    setup_metadata:
      tasks: ["sst2", "mnli", "qnli", "qqp", "mrpc", "cola", "rte", "stsb"]
    validation_check: "src.apt.data.pipeline.validate_glue"
    runnable_config_hook: "src.apt.data.pipeline.load_glue"

  truthfulqa:
    id: "truthfulqa"
    aliases: ["truthfulqa", "truthful_qa"]
    setup_metadata:
      metric: "mc2"
    validation_check: "src.apt.data.pipeline.validate_truthfulqa"
    runnable_config_hook: "src.apt.data.pipeline.load_truthfulqa"


# ==========================================
# Method, Baseline, and Attack Selectors
# ==========================================
method_selectors:
  ours: "src.models.modeling_apt.APTModel"
  bert: "transformers.BertModel"
  roberta: "transformers.RobertaModel"
  t5: "transformers.T5Model"
  fine_tuning: "src.apt.trainer.StandardFineTuning"
  lora: "src.models.apt_layers.StandardLoRALayer"
  test_time_adaptation: "src.apt.tuning.adaptive_engine.TestTimeAdaptation"


# ==========================================
# Parameter Sweeps & Bounded Configs
# ==========================================
parameter_sweeps:
  batch_size:
    values: [16, 32, 64, 128]
    default: 32
    bounded_smoke: 16
  early_training_threshold_t:
    description: "early-training step threshold t << T"
    values: [10, 50, 100, 200]
    default: 100
    bounded_smoke: 10


# ==========================================
# Fixed Hyperparameter Anchors
# ==========================================
hyperparameter_anchors:
  10_shot_setting:
    num_shots: 10
    max_steps: 50
  batch_size_128:
    batch_size: 128
  batch_size_32:
    batch_size: 32


# ==========================================
# Paper Formula & Algorithm Symbol Inventory
# ==========================================
# reference_grounding: paper:unit_003 (chunk_011)
formula_symbols:
  # Exponential moving average of block salience
  S_bar_t: "s_bar_t"       # \overline{S}^{(t)}
  S_bar_t_1: "s_bar_t_1"   # \overline{S}^{(t-1)}
  S_hat: "s_hat"           # \hat{S} (current outlier-aware salience score)
  mu: "mu"                 # Outlier threshold multiplier / scaling factor
  
  # Training steps and thresholds
  global_step: "global_step"
  pruning_start_step: "pruning_start_step"
  pruning_end_step: "pruning_end_step"
  
  # Loss terms
  L_distill: "l_distill"   # Self-distillation loss
  L_pred: "l_pred"         # Prediction loss
  L_layer: "l_layer"       # Layer-wise distillation loss
  
  # Memory tracking
  max_memory_allocated: "max_memory_allocated"
  torch_cuda_max_memory_allocated: "torch_cuda_max_memory_allocated"
  
  # Hyperparameters and constraints
  tau: "tau"               # Temperature for distillation / thresholding
  Theta: "Theta"           # Model parameters
  gamma_T: "gamma_T"       # Target sparsity at step T
  gamma_t: "gamma_t"       # Sparsity at step t
  Delta_t: "Delta_t"       # Memory budget or change at step t
  M_t: "M_t"               # Binary pruning mask at step t
  R_t: "R_t"               # Tuning rank at step t
  Theta_T: "Theta_T"       # Model parameters at step T
  M_T: "M_T"               # Binary pruning mask at step T
  delta: "delta"           # Density or scaling parameter
  Theta_t: "Theta_t"       # Model parameters at step t
  Theta_0: "Theta_0"       # Initial model parameters
  M_0: "M_0"               # Initial binary pruning mask


# ==========================================
# Numeric & Default Anchors
# ==========================================
numeric_anchors:
  ema_decay: 0.85          # Decay factor for salience EMA (0.85)
  ema_ratio: 0.15          # Ratio for current salience in EMA (0.15)
  default_rank: 8          # Initial adapter rank (8)
  min_rank: 1              # Minimum adapter rank (1)
  max_rank: 12             # Maximum adapter rank (12)
  num_heads: 12            # Number of MHA heads (12)
  hidden_dim: 768          # Hidden dimension size (768)
  intermediate_dim: 3072   # FFN intermediate dimension (3072)
  num_layers: 12           # Number of transformer layers (12)
  target_sparsity: 0.9     # Target sparsity ratio (0.9)
  pruning_ratio: 0.1       # Default pruning ratio (0.1)
  kurtosis_threshold: 4.4  # Outlier detection kurtosis threshold (4.4)
  temperature: 2.0         # Distillation temperature (2.0)
  alpha: 3.0               # Distillation loss weight scaling (3.0)
  c_head: 2                # Head parameter cost multiplier (2)
  c_neuron: 1536           # Neuron parameter cost multiplier (1536)
  c_dimension: 110592      # Dimension parameter cost multiplier (110592)
  total_params: 196608     # Total parameter budget anchor (196608)
  early_step_t: 7          # Early step threshold anchor (7)
  start_step: 0            # Pruning start step (0)
  end_step: 5              # Pruning end step (5)
  unity: 1                 # Unity constant (1)
  zero: 0                  # Zero constant (0)
  four: 4                  # Constant 4
  five: 5                  # Constant 5


# ==========================================
# Baselines & Addendum Clarifications
# ==========================================
# Binding addendum clarification: Implement the CoFi baseline with LoRA and L0 module controls plus default hyperparameters.
baselines:
  cofi:
    name: "CoFi"
    use_lora: true
    use_l0_module: true
    default_hyperparameters:
      learning_rate: 2e-5
      weight_decay: 0.01
      warmup_ratio: 0.1
      max_grad_norm: 1.0
      l0_penalty: 0.1
      target_sparsity: 0.5
      temperature: 0.66