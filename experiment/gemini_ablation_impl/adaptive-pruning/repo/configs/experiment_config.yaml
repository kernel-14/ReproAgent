# ==========================================
# Defined Symbols (Paper Formulas)
# ==========================================
defined_symbols:
  s_bar_t:
    symbol: "S_bar^t"
    description: "Exponential moving average of salience scores at step t"
    formula: "mu * S_bar^{t-1} + (1 - mu) * S_hat"
  s_bar_t_1:
    symbol: "S_bar^{t-1}"
    description: "Exponential moving average of salience scores at step t-1"
  s_hat:
    symbol: "S_hat"
    description: "Outlier-aware salience score computed at current step"
  mu:
    symbol: "mu"
    description: "EMA decay factor for salience scoring"
    default: 0.85
  global_step:
    symbol: "global_step"
    description: "Current training step t"
  pruning_start_step:
    symbol: "pruning_start_step"
    description: "Step at which adaptive pruning begins"
    default: 0.15
  pruning_end_step:
    symbol: "pruning_end_step"
    description: "Step at which adaptive pruning ends"
    default: 0.9
  l_distill:
    symbol: "L_distill"
    description: "Self-distillation loss term"
    formula: "L_pred + tau * L_layer"
  l_pred:
    symbol: "L_pred"
    description: "Prediction-level distillation loss (KL divergence)"
  l_layer:
    symbol: "L_layer"
    description: "Layer-level distillation loss (MSE between student and teacher hidden states)"
  max_memory_allocated:
    symbol: "max_memory_allocated"
    description: "Peak memory allocated during training"
  torch_cuda_max_memory_allocated:
    symbol: "torch.cuda.max_memory_allocated"
    description: "PyTorch CUDA peak memory allocation function"

# ==========================================
