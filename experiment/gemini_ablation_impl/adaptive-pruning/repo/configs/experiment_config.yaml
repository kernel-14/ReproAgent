  run_experiment: "main.run_experiment"
  compute_accuracy: "src.apt.utils.metrics.compute_accuracy"
  aggregate_accuracy: "src.apt.utils.metrics.aggregate_accuracy"
  compute_loss: "src.apt.utils.metrics.compute_loss"
  aggregate_loss: "src.apt.utils.metrics.aggregate_loss"
  compute_f1: "src.apt.utils.metrics.compute_f1"
  aggregate_f1: "src.apt.utils.metrics.aggregate_f1"
  compute_entrypoint_metric_entrypoint_objective: "src.apt.utils.metrics.compute_entrypoint_metric_entrypoint_objective"
  compute_entrypoint_metric_entrypoint_score: "src.apt.utils.metrics.compute_entrypoint_metric_entrypoint_score"
  build_main: "main.build_main"
  write_figure_4_artifact: "src.apt.utils.metrics.write_figure_4_artifact"
  compute_mse: "src.apt.utils.metrics.compute_mse"

# ==========================================
# Interface Contract
# ==========================================
interface_contract:
  load_classifier: "main.load_classifier"
  finetune_classifier: "main.finetune_classifier"

# ==========================================
# Paper Formula & Algorithm Anchors
# ==========================================
paper_formula_anchors:
  adaptive_pruning_and_tuning:
    section: "4. Adaptive Pruning and Tuning"
    symbols: ["Delta_t", "Theta_t", "M_t"]
    defaults:
      scaling_factor: 2
      section_ref: 4.4
    terms: ["salience", "mask", "distill", "prune"]
    steps: "APT gradually prunes LM parameters with binary pruning masks learned from our lightweight outlier-aware salience scoring function for training and inference efficiency. Additionally, we explain our self-knowledge distillation technique that improves pruned LM's task performance with limited training exp."

  low_cost_adaptive_pruning:
    section: "4.2. Low-cost Adaptive LM Pruning"
    symbols: ["Theta_t", "W_i,j", "D_t", "S_hat", "W_:,j", "sum_i", "M_t", "H_j,i", "O_:,j", "X_j,:^top", "O_j", "gamma_t", "d_h", "d_m"]
    defaults:
      kurtosis_threshold: 4
      min_salience: 1
      scaling_factor: 2
      ema_decay: 5
    terms: ["equation", "algorithm", "formula", "gradient", "salience", "mask", "kurt", "kurtosis"]
    steps: "Given a task, we compute the outlier-aware salience score of parameter blocks at each early-training step when t << T. Afterward, we use a fast search algorithm to determine the parameters to be pruned, and then we update their binary pruning masks accordingly."

  hyperparameter_and_training_details:
    section: "A. Hyperparameter and Training Details"
    symbols: ["gamma_T", "gamma_t", "alpha"]
    defaults:
      initial_rank: 8
      scaling_factor: 1
      distill_weight: 3
    terms: ["objective", "mask", "rank", "distill", "prune", "initialize", "increase", "decrease"]
    steps: "Hyperparameters used in APT experiments. When pruning LMs with APT, following (Xia et al., 2022), we first prune and train the LM with the self-distillation objective, and then fine-tune the pruned LM to recover its end-task performance. Given T pruning training steps in total, we set a pre-determined target sparsity gamma_T and use cubic scheduling to control the LM parameter size, where gamma_t = gamma_T + (1 - gamma_T) * (1 - t/T)^3."

  adaptive_pruning_and_tuning_details:
    section: "C. Adaptive Pruning and Tuning Details"
    symbols: ["delta", "d_m", "n_L", "n_h", "n_f", "C_head", "C_neuron", "C_dimension", "b_1", "b_2", "b_N", "b_i", "d_h^prime", "n_h^prime"]
    defaults:
      num_heads: 12
      hidden_dim: 768
      intermediate_dim: 3072
      total_params: 196608
      head_cost: 2
      neuron_cost: 1536
      dimension_cost: 110592
      delta: 4
    terms: ["algorithm", "salience", "mask", "binary search", "calculate", "search", "sort", "prune"]
    steps: "For the details of the algorithm, we first sort all blocks by the salience density, defined as the block salience divided by the number of parameters."

  apt_adapter:
    section: "4.1. APT adapter"
    symbols: ["H_apt", "r_apt", "delta", "Theta_t", "d_i", "d_o", "m_i", "m_o", "W_A", "W_B", "M_t", "R_t"]
    defaults:
      min_rank: 0
      step_size: 1
      scaling_factor: 3
    terms: ["mask", "rank", "prune", "increase", "decrease"]
    steps: "Assuming an APT adapter projects the input X in R^{d_i} to the output H_apt(X) in R^{d_o}, we design binary pruning masks (m_i in R^{d_i} for input and m_o in R^{d_o} for output) and dynamic ranks."

  addendum:
    section: "addendum"
    symbols: ["global_step", "pruning_start_step", "pruning_end_step", "L_distill", "L_layer", "max_memory_allocated", "torch.cuda.max_memory_allocated", "S_bar^t", "S_bar^t-1", "S_hat", "mu", "L_pred", "tau"]
    defaults:
      pruning_end_ratio: 0.85
      pruning_start_ratio: 0.15
      target_sparsity: 0.9
      distill_loss_weight: 0.1
      num_layers: 4
      scaling_factor: 1
      num_heads: 7
      min_rank: 0
    terms: ["equation", "loss", "salience", "mask", "teacher", "student", "distill", "compute"]
    steps: "The mask tuning baseline should be implemented using https://github.com/WoosukKwon/retraining-free-pruning"