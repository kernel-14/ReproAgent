# configs/experiment_config.yaml
# Faithful reproduction configuration containing all paper-derived environments, datasets,
# hyperparameter anchors, parameter sweeps, and formula/algorithm symbol mappings.

# ==========================================
# Environment & Task Factories
# ==========================================
environment_factories:
  unit-001:
    id: "unit-001"
    aliases: ["unit-001", "smoke_test"]
    setup_metadata:
      description: "Smoke test environment for basic pipeline validation"
      requires_gpu: false
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_unit_config"

  squad:
    id: "squad"
    aliases: ["squad", "squad_v1.1", "squad_v2.0"]
    setup_metadata:
      description: "Stanford Question Answering Dataset for reading comprehension evaluation"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_squad_config"

  glue:
    id: "glue"
    aliases: ["glue", "glue_benchmark"]
    setup_metadata:
      description: "General Language Understanding Evaluation benchmark"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_glue_config"

  pruning_roberta_models_targeting_similar:
    id: "pruning_roberta_models_targeting_similar"
    aliases: ["roberta_pruning", "roberta_similar"]
    setup_metadata:
      description: "Pruning RoBERTa models targeting similar downstream performance"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_roberta_pruning_config"

  apt_consistently_reach_higher:
    id: "apt_consistently_reach_higher"
    aliases: ["apt_higher_performance"]
    setup_metadata:
      description: "APT consistently reaches higher task performance than LoRA+Prune"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_apt_higher_config"

  salience_notably_hurts:
    id: "salience_notably_hurts"
    aliases: ["salience_ablation"]
    setup_metadata:
      description: "Ablation showing that removing salience-based allocation hurts performance"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_salience_ablation_config"

  sst2:
    id: "sst2"
    aliases: ["sst2_task"]
    setup_metadata:
      description: "Stanford Sentiment Treebank task evaluation"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_sst2_config"

  open_llm_leaderboard_few_shot:
    id: "open_llm_leaderboard_few_shot"
    aliases: ["open_llm_leaderboard"]
    setup_metadata:
      description: "Open LLM Leaderboard few-shot tasks evaluation"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_open_llm_config"

  fine_tuning_will_not_hurt_their:
    id: "fine_tuning_will_not_hurt_their"
    aliases: ["fine_tuning_stability"]
    setup_metadata:
      description: "Fine-tuning stability verification under pruning"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_ft_stability_config"

  apt_reaches_superior:
    id: "apt_reaches_superior"
    aliases: ["apt_superior_efficiency"]
    setup_metadata:
      description: "APT reaches superior inference speedup and less memory consumption"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_apt_superior_config"

  determines_which:
    id: "determines_which"
    aliases: ["determines_which_adapters"]
    setup_metadata:
      description: "Determines which adapters to prune and tune dynamically"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_determines_which_config"

  keep_all_paper_visible:
    id: "keep_all_paper_visible"
    aliases: ["paper_visible_tasks"]
    setup_metadata:
      description: "Keep all paper-visible tasks and configurations"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_paper_visible_config"

# ==========================================
# Dataset & Benchmark Loaders
# ==========================================
dataset_loaders:
  SST2:
    id: "SST2"
    setup_metadata:
      name: "Stanford Sentiment Treebank"
      task_type: "classification"
    validation_check: "src.apt.data.pipeline.validate_sst2"
    runnable_config_hook: "src.apt.data.pipeline.load_sst2"

  MNLI:
    id: "MNLI"
    setup_metadata:
      name: "Multi-Genre Natural Language Inference"
      task_type: "classification"
    validation_check: "src.apt.data.pipeline.validate_mnli"
    runnable_config_hook: "src.apt.data.pipeline.load_mnli"

  squad:
    id: "squad"
    setup_metadata:
      name: "SQuAD"
      task_type: "qa"
    validation_check: "src.apt.data.pipeline.validate_squad"
    runnable_config_hook: "src.apt.data.pipeline.load_squad"

  glue:
    id: "glue"
    setup_metadata:
      name: "GLUE Benchmark"
      task_type: "multi_task"
    validation_check: "src.apt.data.pipeline.validate_glue"
    runnable_config_hook: "src.apt.data.pipeline.load_glue"

  truthfulqa:
    id: "truthfulqa"
    setup_metadata:
      name: "TruthfulQA"
      task_type: "generation_eval"
    validation_check: "src.apt.data.pipeline.validate_truthfulqa"
    runnable_config_hook: "src.apt.data.pipeline.load_truthfulqa"

# ==========================================
# Metric Formulas & Aggregations
# ==========================================
metrics:
  training_time:
    id: "training_time"
    canonical_identifier: "metric_training_time"
    formula: "end_time - start_time"
    aggregation: "sum"
    writer: "src.apt.utils.metrics.write_training_time"

  table_2_reproduction_artifact:
    id: "table_2_reproduction_artifact"
    canonical_identifier: "metric_table_2_reproduction_artifact"
    formula: "normalize_to_ft(accuracy, training_time, inference_time)"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_table_2"

  table_4_reproduction_artifact:
    id: "table_4_reproduction_artifact"
    canonical_identifier: "metric_table_4_reproduction_artifact"
    formula: "ablation_relative_efficiency(accuracy, training_time, memory)"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_table_4"

  train_mem_tta_accuracy:
    id: "train_mem_tta_accuracy"
    canonical_identifier: "metric_train_mem_tta_accuracy"
    formula: "combine_metrics(max_memory_allocated, time_to_accuracy, accuracy)"
    aggregation: "identity"
    writer: "src.apt.utils.metrics.write_train_mem_tta_accuracy"

  accuracy:
    id: "accuracy"
    canonical_identifier: "metric_accuracy"
    formula: "correct_predictions / total_predictions"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_accuracy"

  f1:
    id: "f1"
    canonical_identifier: "metric_f1"
    formula: "2 * (precision * recall) / (precision + recall)"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_f1"

  loss:
    id: "loss"
    canonical_identifier: "metric_loss"
    formula: "cross_entropy + alpha * self_distillation_loss"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_loss"

  rouge:
    id: "rouge"
    canonical_identifier: "metric_rouge"
    formula: "rouge_l_fmeasure"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_rouge"

  training_cost:
    id: "training_cost"
    canonical_identifier: "metric_training_cost"
    formula: "training_time * gpu_power_factor"
    aggregation: "sum"
    writer: "src.apt.utils.metrics.write_training_cost"

# ==========================================
# Parameter Sweeps & Fixed Anchors
# ==========================================
parameter_sweeps:
  early_training_threshold_t:
    description: "early-training step threshold t << T"
    default: 100
    values: [50, 100, 200]
  total_steps_T:
    description: "Total training steps T"
    default: 1000
    values: [500, 1000, 2000]
  pruning_start_step:
    description: "Step to start pruning"
    default: 100
  pruning_end_step:
    description: "Step to end pruning"
    default: 900
  target_sparsity:
    description: "Target sparsity gamma_T"
    default: 0.6
    values: [0.3, 0.5, 0.6, 0.7]

# ==========================================
# Result-Trend Assertions
# ==========================================
result_trend_assertions:
  baseline_outperformance:
    description: "proposed method should be compared against explicit baselines"
    assertion_fn: "src.apt.utils.metrics.assert_baseline_outperformance"
    baselines: ["FT", "LoRA", "LoRA+Prune", "MaskTuning"]
    target_improvement_pct: 2.5

