# configs/unit_run_experiment.yaml
# Configuration for running unit experiments in APT (Adaptive Pruning and Tuning)
# Contains environment factories, dataset loaders, metric formulas, parameter sweeps,
# result-trend assertions, and artifact paths.

# ==========================================
# Environment & Task Factories
# ==========================================
environment_factories:
  unit-001:
    id: "unit-001"
    aliases: ["unit-001", "smoke_test"]
    setup_metadata:
      description: "Smoke test environment for basic pipeline validation"
      requires_gpu: false
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_unit_config"

  squad:
    id: "squad"
    aliases: ["squad", "squad_v1.1", "squad_v2.0"]
    setup_metadata:
      description: "Stanford Question Answering Dataset for reading comprehension evaluation"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_squad_config"

  glue:
    id: "glue"
    aliases: ["glue", "glue_benchmark"]
    setup_metadata:
      description: "General Language Understanding Evaluation benchmark"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_glue_config"

  pruning_roberta_models_targeting_similar:
    id: "pruning_roberta_models_targeting_similar"
    aliases: ["roberta_pruning", "roberta_similar"]
    setup_metadata:
      description: "Pruning RoBERTa models targeting similar downstream performance"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_roberta_config"

  apt_consistently_reach_higher:
    id: "apt_consistently_reach_higher"
    aliases: ["apt_higher"]
    setup_metadata:
      description: "Verify that APT consistently reaches higher task performance than LoRA+Prune"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_apt_higher_config"

  salience_notably_hurts:
    id: "salience_notably_hurts"
    aliases: ["salience_hurts"]
    setup_metadata:
      description: "Verify that removing outlier-aware salience notably hurts performance"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_salience_hurts_config"

  sst2:
    id: "sst2"
    aliases: ["sst2_task"]
    setup_metadata:
      description: "SST-2 sentiment classification task"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_sst2_config"

  open_llm_leaderboard_few_shot:
    id: "open_llm_leaderboard_few_shot"
    aliases: ["open_llm"]
    setup_metadata:
      description: "Open LLM Leaderboard few-shot tasks evaluation"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_open_llm_config"

  fine_tuning_will_not_hurt_their:
    id: "fine_tuning_will_not_hurt_their"
    aliases: ["ft_no_hurt"]
    setup_metadata:
      description: "Verify that fine-tuning will not hurt their pre-trained capabilities"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_ft_no_hurt_config"

  apt_reaches_superior:
    id: "apt_reaches_superior"
    aliases: ["apt_superior"]
    setup_metadata:
      description: "Verify that APT reaches superior inference speedup and less memory consumption"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_apt_superior_config"

  determines_which:
    id: "determines_which"
    aliases: ["determines_which_adapters"]
    setup_metadata:
      description: "Verify how APT determines which adapters to prune/tune"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_determines_which_config"

  keep_all_paper_visible:
    id: "keep_all_paper_visible"
    aliases: ["keep_all"]
    setup_metadata:
      description: "Keep all paper-visible experiments and baselines"
      requires_gpu: true
    availability_check: "src.apt.utils.registry.check_environment_availability"
    runnable_config_hook: "src.apt.utils.registry.get_keep_all_config"

# ==========================================
# Dataset & Benchmark Loaders
# ==========================================
dataset_loaders:
  SST2:
    id: "SST2"
    setup_metadata:
      name: "SST-2"
      task_type: "classification"
    validation_check: "src.apt.data.pipeline.validate_sst2"
    runnable_config_hook: "src.apt.data.pipeline.load_sst2"

  MNLI:
    id: "MNLI"
    setup_metadata:
      name: "MNLI"
      task_type: "classification"
    validation_check: "src.apt.data.pipeline.validate_mnli"
    runnable_config_hook: "src.apt.data.pipeline.load_mnli"

  squad:
    id: "squad"
    setup_metadata:
      name: "SQuAD"
      task_type: "qa"
    validation_check: "src.apt.data.pipeline.validate_squad"
    runnable_config_hook: "src.apt.data.pipeline.load_squad"

  glue:
    id: "glue"
    setup_metadata:
      name: "GLUE"
      task_type: "benchmark"
    validation_check: "src.apt.data.pipeline.validate_glue"
    runnable_config_hook: "src.apt.data.pipeline.load_glue"

  truthfulqa:
    id: "truthfulqa"
    setup_metadata:
      name: "TruthfulQA"
      task_type: "generation"
    validation_check: "src.apt.data.pipeline.validate_truthfulqa"
    runnable_config_hook: "src.apt.data.pipeline.load_truthfulqa"

# ==========================================
# Metric Formulas & Aggregations
# ==========================================
metrics:
  training_time:
    id: "training_time"
    canonical_identifier: "metric_training_time"
    formula: "total_elapsed_seconds"
    aggregation: "sum"
    writer: "src.apt.utils.metrics.write_training_time"

  table_2_reproduction_artifact:
    id: "table_2_reproduction_artifact"
    canonical_identifier: "metric_table_2_reproduction_artifact"
    formula: "normalized_to_ft(accuracy, training_time, inference_time)"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_table_2"

  table_4_reproduction_artifact:
    id: "table_4_reproduction_artifact"
    canonical_identifier: "metric_table_4_reproduction_artifact"
    formula: "ablation_relative_efficiency(accuracy, training_time, memory)"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_table_4"

  train_mem_tta_accuracy:
    id: "train_mem_tta_accuracy"
    canonical_identifier: "metric_train_mem_tta_accuracy"
    formula: "tta_at_97_percent_accuracy"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_train_mem_tta_accuracy"

  accuracy:
    id: "accuracy"
    canonical_identifier: "metric_accuracy"
    formula: "correct_predictions / total_predictions"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_accuracy"

  f1:
    id: "f1"
    canonical_identifier: "metric_f1"
    formula: "2 * (precision * recall) / (precision + recall)"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_f1"

  loss:
    id: "loss"
    canonical_identifier: "metric_loss"
    formula: "cross_entropy_loss + alpha * self_distillation_loss"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_loss"

  rouge:
    id: "rouge"
    canonical_identifier: "metric_rouge"
    formula: "rouge_l_fmeasure"
    aggregation: "mean"
    writer: "src.apt.utils.metrics.write_rouge"

  training_cost:
    id: "training_cost"
    canonical_identifier: "metric_training_cost"
    formula: "training_time * gpu_power_factor"
    aggregation: "sum"
    writer: "src.apt.utils.metrics.write_training_cost"

# ==========================================
# Parameter Sweeps & Executable Constants
# ==========================================
parameter_sweeps:
  early_training_step_threshold_t:
    description: "Early-training step threshold t << T"
    default: 100
    sweep_values: [50, 100, 200]
  
  pruning_start_step:
    description: "Step at which pruning starts"
    default: 100
    sweep_values: [50, 100, 150]

  pruning_end_step:
    description: "Step at which pruning ends"
    default: 900
    sweep_values: [800, 900, 1000]

  global_step:
    description: "Current global step"
    default: 0

  s_bar_t:
    description: "Moving average of block salience at step t"
    default: 0.0

  s_bar_t_1:
    description: "Moving average of block salience at step t-1"
    default: 0.0

  s_hat:
    description: "Current outlier-aware salience score of block"
    default: 0.0

  mu:
    description: "Exponential moving average coefficient"
    default: 0.85

  l_distill:
    description: "Self-distillation loss weight"
    default: 0.1

  l_pred:
    description: "Prediction loss weight"
    default: 0.9

  l_layer:
    description: "Layer mapping distillation loss weight"
    default: 4

  max_memory_allocated:
    description: "Maximum memory allocated during training"
    default: 0.0

  torch_cuda_max_memory_allocated:
    description: "PyTorch CUDA maximum memory allocated"
    default: 0.0

# ==========================================
# Result-Trend Assertions
# ==========================================
result_trends:
  baseline_outperformance:
    assertion: "proposed method should be compared against explicit baselines"
    expected_trend: "APT > LoRA+Prune"
    metrics: ["accuracy", "training_time", "memory_usage"]

# ==========================================
# Result Artifact Paths & Writers
# ==========================================
artifacts:
  table_2:
    id: "table_2"
    canonical_identifier: "artifact_table_2"
    path: "results/tables/table_2.csv"
    caption: "RoBERTa and T5 pruning with APT compared to baselines under 60% sparsity."
    writer: "src.apt.utils.metrics.write_table_2"

  table_4:
    id: "table_4"
    canonical_identifier: "artifact_table_4"
    path: "results/tables/table_4.csv"
    caption: "Results of ablating salience-based allocation strategy and APT adapter with RoBERTa-base model."
    writer: "src.apt.utils.metrics.write_table_4"

  figure_1:
    id: "figure_1"
    canonical_identifier: "artifact_figure_1"
    path: "results/figures/figure_1.png"
    caption: "APT provides both training and inference efficiency benefits by pruning and tuning pretrained LM parameters adaptively."
    writer: "src.apt.utils.metrics.write_figure_1"

  table_1:
    id: "table_1"
    canonical_identifier: "artifact_table_1"
    path: "results/tables/table_1.csv"
    caption: "Efficiency comparison of existing methods and APT."
    writer: "src.apt.utils.metrics.write_table_1"

  figure_2:
    id: "figure_2"
    canonical_identifier: "artifact_figure_2"
    path: "results/figures/figure_2.png"
    caption: "APT adaptively identifies pruning and tuning parameters via APT adapters during fine-tuning with little cost."
    writer: "src.apt.utils.metrics.write_figure_2"

  table_11:
    id: "table_11"
    canonical_identifier: "artifact_table_11"
    path: "results/tables/table_11.csv"
    caption: "Raw efficiency metrics when using different methods to fine-tune RoBERTa base and T5 base models on SST2."
    writer: "src.apt.utils.metrics.write_table_11"

  table_3:
    id: "table_3"
    canonical_identifier: "artifact_table_3"
    path: "results/tables/table_3.csv"
    caption: "LLaMA 2 7B 30% sparsity pruning results with GPT4-generated Alpaca dataset."
    writer: "src.apt.utils.metrics.write_table_3"

  table_12:
    id: "table_12"
    canonical_identifier: "artifact_table_12"
    path: "results/tables/table_12.csv"
    caption: "Raw efficiency metrics when using different methods to fine-tune LLaMA2 7B models on Alpaca."
    writer: "src.apt.utils.metrics.write_table_12"

  figure_3:
    id: "figure_3"
    canonical_identifier: "artifact_figure_3"
    path: "results/figures/figure_3.png"
    caption: "Task performance v.s. relative inference efficiency on RoBERTa, T5, and LLaMA-2 7B models."
    writer: "src.apt.utils.metrics.write_figure_3"

  table_5:
    id: "table_5"
    canonical_identifier: "artifact_table_5"
    path: "results/tables/table_5.csv"
    caption: "LLaMA 2 7B model ablation results under 30% and 50% sparsity settings."
    writer: "src.apt.utils.metrics.write_table_5"

# ==========================================
# Executable Symbol Bindings
# ==========================================
executable_bindings:
  defines_symbols:
    s_bar_t: "src.apt.pruning.salience.s_bar_t"
    s_bar_t_1: "src.apt.pruning.salience.s_bar_t_1"
    s_hat: "src.apt.pruning.salience.s_hat"
    mu: "src.apt.pruning.salience.mu"
    global_step: "src.apt.trainer.global_step"
    pruning_start_step: "src.apt.trainer.pruning_start_step"
    pruning_end_step: "src.apt.trainer.pruning_end_step"
    l_distill: "src.apt.distillation.self_distillation.l_distill"
    l_pred: "src.apt.distillation.self_distillation.l_pred"
    l_layer: "src.apt.distillation.self_distillation.l_layer"
    max_memory_allocated: "src.apt.utils.metrics.max_memory_allocated"
    torch_cuda_max_memory_allocated: "src.apt.utils.metrics.torch_cuda_max_memory_allocated"

  calls_symbols:
    run_experiment: "main.run_experiment"
    compute_accuracy: "src.apt.utils.metrics.compute_accuracy"
    aggregate_accuracy: "src.apt.utils.metrics.aggregate_accuracy"
    compute_loss: "src.apt.utils.metrics.compute_loss"
    aggregate_loss: "src.apt.utils.metrics.aggregate_loss"
    compute_f1: "src.apt.utils.metrics.compute_f1"
    aggregate_f1: "src.apt.utils.metrics.aggregate_f1"
    compute_entrypoint_metric_entrypoint_objective: "src.apt.utils.metrics.compute_entrypoint_metric_entrypoint_objective"
    compute_entrypoint_metric_entrypoint_score: "src.apt.utils.metrics.compute_entrypoint_metric_entrypoint_score"
    build_main: "main.main"
    write_figure_4_artifact: "src.apt.utils.metrics.write_figure_4_artifact"
    compute_mse: "src.apt.utils.metrics.compute_mse"