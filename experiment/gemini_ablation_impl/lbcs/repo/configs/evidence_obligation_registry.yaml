# Method/Baseline/Attack Selectors
methods:
  ours:
    id: "ours"
    alias: "LBCS"
    description: "LBCS (Lexicographic Bilevel Coreset Selection)"
  oracle:
    id: "oracle"
    alias: "oracle"
    description: "Oracle baseline"
  vit:
    id: "vit"
    alias: "vit"
    description: "ViT baseline"
  ppo:
    id: "ppo"
    alias: "ppo"
    description: "PPO baseline"
  resnet:
    id: "resnet"
    alias: "resnet"
    description: "ResNet baseline"

# Parameter Sweeps
sweeps:
  group_size:
    default: 100
    values: [100]
  noise_rate:
    default: 0.3
    values: [0.3]
  noise_type:
    default: "symmetric"
    values: ["symmetric"]
  k:
    default: 1000
    values: [1000, 2000, 3000, 4000]
  lambda_values:
    default: 0
    values: [0, 1]
  epochs:
    default: 100
    values: [10, 50, 100]

# Fixed Hyperparameter Anchors
hyperparameters:
  momentum_0_9:
    name: "momentum"
    value: 0.9

# Result Trend Assertions
result_trends:
  baseline_outperformance:
    description: "proposed method should be compared against explicit baselines"
    assertion: "ours_accuracy > baseline_accuracy"

# Reproduction Artifacts
artifacts:
  evidence_contract_matrix:
    path: "results/evidence_contract_matrix.json"
    writer: "write_evidence_contract_matrix_artifact"
  experiment_registry:
    path: "results/experiment_registry.json"
    writer: "write_experiment_registry_artifact"
  metrics:
    path: "results/metrics.json"
    writer: "write_metrics_artifact"
  environment_registry:
    path: "results/environment_registry.json"
    writer: "write_environment_registry_artifact"
  dataset_registry:
    path: "results/dataset_registry.json"
    writer: "write_dataset_registry_artifact"
  artifact_manifest:
    path: "results/artifact_manifest.json"
    writer: "write_artifact_manifest"
  sensitivity_report:
    path: "results/sensitivity_report.json"
    writer: "write_sensitivity_report"
  table2_results:
    path: "results/table2_results.json"
    writer: "write_table2_results_artifact"
  robustness_results:
    path: "results/robustness_results.json"
    writer: "write_robustness_results_artifact"
  imagenet_results:
    path: "results/imagenet_results.json"
    writer: "write_imagenet_results_artifact"
  figure_1:
    path: "results/figures/figure_1.png"
    writer: "write_figure_1_artifact"
    runner: "run_figure_1_route"
  table_1:
    path: "results/tables/table_1.csv"
    writer: "write_table_1_artifact"
    runner: "run_table_1_route"

# Active Reproduction Scope Notes
reproduction_scope:
  notes: "Faithful reproduction of LBCS coreset selection under model performance constraints."
  seeds: [42, 100, 2023]