# configs/default.yaml
# Reference Grounding: paper_task_environment_setup, paper_training_or_optimization_loop

# Project and Benchmark Definitions
ExORL Zero-Shot Benchmark:
  id: "exorl_zero_shot"
  alias: "deepmind_control"
  dataset: "deepmind_control"
  tasks: ["walker_walk", "walker_run", "cheetah_run", "jacopin_stand"]
  metrics: ["normalized_score", "success_rate"]
  artifact_path: "results/table1_exorl.csv"

D4RL Zero-Shot Benchmark:
  id: "d4rl_zero_shot"
  alias: "robotics"
  dataset: "robotics"
  tasks: ["antmaze-medium-play-v2", "antmaze-large-play-v2", "kitchen-complete-v0"]
  metrics: ["normalized_score", "success_rate"]
  artifact_path: "results/table2_d4rl.csv"

Reward Family Scaling Ablation:
  id: "reward_family_scaling"
  description: "Experiment 5.3: Scaling properties (reward subsets)"
  subsets: ["singleton", "linear", "mlp", "joint"]
  metrics: ["normalized_score"]
  artifact_path: "results/table3.csv"

# Agent and Model Implementations
FRE Agent Implementation:
  method: "ours"
  encoder: "Transformer Reward Encoder"
  policy: "Latent-Conditioned IQL Update"
  prior_sampler: "Reward Prior Sampler"
  hyperparameters:
    latent_dim: 50
    embedding_dim: 128
    num_heads: 4
    num_layers: 2
    learning_rate: 0.0003
    batch_size: 256
    training_iterations: 1000000
    K: 64  # number of encoder states
    K_prime: 6  # number of decoder states (K^prime)
    reward_discretization_bins: 20
    beta: 0.1  # KL weight
    done_mask_chance: 0.9

Transformer Reward Encoder:
  architecture: "permutation_invariant_transformer"
  positional_encodings: false
  causal_masking: false
  inputs: "unordered_set"

Reward Prior Sampler:
  priors:
    singleton:
      type: "singleton_goal_reaching"
      p_randomgoal: 0.3
      p_geometric_goal: 0.5
      p_current_goal: 0.2
    linear:
      type: "random_linear"
    mlp:
      type: "random_neural_networks_mlp"
    domain_knowledge:
      type: "xy_velocity"
      directions:
        vel_left: [-1.0, 0.0]
        vel_up: [0.0, 1.0]
        vel_down: [0.0, -1.0]
        vel_right: [1.0, 0.0]

Latent-Conditioned IQL Update:
  algorithm: "iql"
  discount: 0.99
  expectile: 0.7
  temperature: 3.0

# Data and Reward Prior Pipeline
Data and Reward Prior Pipeline:
  datasets:
    deepmind_control:
      alias: "exorl"
      path: "data/exorl"
      validation_check: true
    robotics:
      alias: "d4rl"
      path: "data/d4rl"
      validation_check: true
  reward_families:
    - "singleton"
    - "linear"
    - "mlp"
    - "xy_velocity"

# Evaluation Framework
Evaluation Framework:
  metrics:
    normalized_score: "compute_accuracy"
    success_rate: "aggregate_accuracy"
    loss: "compute_loss"
  baselines:
    ours: "FRE"
    bc: "Behavior Cloning"
    iql: "Implicit Q-Learning"
    test_time_adaptation: "TTA"
    ppo: "PPO"
    fb: "Forward-Backward"
    sr: "Successor Representations"
    aps: "Active Pre-Training"
    proto: "Proto-RL"
    vic: "Variational Intrinsic Control"
    smm: "State Marginal Matching"
    diayn: "Diversity is All You Need"
    rnd: "Random Network Distillation"

# Baseline Implementations
Baseline Implementations:
  bc:
    learning_rate: 0.0003
    batch_size: 256
  iql:
    learning_rate: 0.0003
    batch_size: 256
  ppo:
    learning_rate: 0.0003
    batch_size: 2048

# Experiment Specifications (Callable Protocol Matrix)
experiments:
  "Experiment 5.2: Main comparison (ExORL)":
    env: "ExORL (DeepMind Control)"
    dataset: "deepmind_control"
    methods: ["ours", "bc", "iql", "ppo", "fb"]
    metric_function: "normalized_score"
    artifact_writer: "write_table1_exorl"
    output_path: "results/table1_exorl.csv"
  
  "Experiment 5.2: Main comparison (D4RL)":
    env: "AntMaze (D4RL)"
    dataset: "robotics"
    methods: ["ours", "bc", "iql", "test_time_adaptation"]
    metric_function: "success_rate"
    artifact_writer: "write_table2_d4rl"
    output_path: "results/table2_d4rl.csv"

  "Experiment 5.3: Scaling properties (reward subsets)":
    env: "ExORL (DeepMind Control)"
    dataset: "deepmind_control"
    methods: ["ours"]
    subsets: ["singleton", "linear", "mlp", "joint"]
    metric_function: "normalized_score"
    artifact_writer: "write_table3_artifact"
    output_path: "results/table3.csv"

  "Experiment 5.4: Domain knowledge (XY/velocity rewards)":
    env: "AntMaze (D4RL)"
    dataset: "robotics"
    methods: ["ours"]
    reward_types: ["vel_left", "vel_up", "vel_down", "vel_right"]
    metric_function: "success_rate"
    artifact_writer: "write_figure_6_artifact"
    output_path: "results/figure6.png"

  "Experiment: Extended results (Table 3)":
    env: "Kitchen (D4RL)"
    dataset: "robotics"
    methods: ["ours", "bc", "iql"]
    metric_function: "success_rate"
    artifact_writer: "write_table3_artifact"
    output_path: "results/table3.csv"

  "Experiment: Extended results (Table 4)":
    env: "Kitchen (D4RL)"
    dataset: "robotics"
    methods: ["ours", "bc", "iql"]
    metric_function: "normalized_score"
    artifact_writer: "write_table4_artifact"
    output_path: "results/table4.csv"

  "Experiment: Visualization (Figure 7)":
    env: "ExORL (DeepMind Control)"
    dataset: "deepmind_control"
    methods: ["ours"]
    metric_function: "latent_tsne"
    artifact_writer: "write_figure_7_artifact"
    output_path: "results/figure7.png"

  "Experiment: Visualization (Figure 8)":
    env: "AntMaze (D4RL)"
    dataset: "robotics"
    methods: ["ours"]
    metric_function: "latent_tsne"
    artifact_writer: "write_figure_8_artifact"
    output_path: "results/figure8.png"

  "Experiment: Visualization (Figure 9)":
    env: "Kitchen (D4RL)"
    dataset: "robotics"
    methods: ["ours"]
    metric_function: "latent_tsne"
    artifact_writer: "write_figure_9_artifact"
    output_path: "results/figure9.png"

# Environment and Task Factories
environment_factories:
  unit-001:
    id: "unit-001"
    alias: "unit_test_env"
    setup_metadata:
      state_dim: 4
      action_dim: 2
    availability_check: "check_unit_env_available"
    runnable_config_hook: "setup_unit_env"
  
  ExORL (DeepMind Control):
    id: "dmc"
    alias: "deepmind_control"
    setup_metadata:
      domain: "walker"
      task: "walk"
    availability_check: "check_dmc_available"
    runnable_config_hook: "setup_dmc_env"

  AntMaze (D4RL):
    id: "antmaze"
    alias: "robotics"
    setup_metadata:
      maze_size: "medium"
      task: "play"
    availability_check: "check_d4rl_available"
    runnable_config_hook: "setup_antmaze_env"

  Kitchen (D4RL):
    id: "kitchen"
    alias: "robotics"
    setup_metadata:
      task: "complete"
    availability_check: "check_d4rl_available"
    runnable_config_hook: "setup_kitchen_env"

# Dataset and Benchmark Loaders
dataset_loaders:
  deepmind_control:
    id: "deepmind_control"
    setup_metadata:
      source: "ExORL"
      format: "npz"
    validation_check: "validate_exorl_dataset"
    runnable_config_hook: "load_exorl_dataset"
  
  robotics:
    id: "robotics"
    setup_metadata:
      source: "D4RL"
      format: "hdf5"
    validation_check: "validate_d4rl_dataset"
    runnable_config_hook: "load_d4rl_dataset"

# Paper Formula and Algorithm Symbol Inventory
formula_algorithm_symbols:
  vel_left: [-1.0, 0.0]
  vel_up: [0.0, 1.0]
  vel_down: [0.0, -1.0]
  vel_right: [1.0, 0.0]
  L_pi: "-E_{(s, g, a) ~ D} [log pi(a | s, g)]"
  E_s_g_a_sim_D: "expectation over dataset D"
  p_randomgoal: 0.3
  p_geometric_goal: 0.5
  p_current_goal: 0.2
  L_eta: "loss for functional reward encoding"
  L_eta_e: "encoder loss term"
  L_eta_d: "decoder loss term"
  D_KL: "Kullback-Leibler divergence"
  beta: 0.1
  KL: "D_KL(q_theta(z | L_eta^e) || p(z))"
  p_theta: "decoder model"
  sum_k_1: "summation over K states"
  K_prime: 6
  q_theta: "encoder model"
  s_k_d: "decoder state sample"
  s_1_e: "encoder state sample 1"
  s_2_e: "encoder state sample 2"
  s_K_e: "encoder state sample K"
  sum_k: "summation over states"
  numeric_defaults:
    one: 1
    zero: 0
    zero_point_three: 0.3
    zero_point_five: 0.5
    zero_point_two: 0.2
    two: 2
    six: 6