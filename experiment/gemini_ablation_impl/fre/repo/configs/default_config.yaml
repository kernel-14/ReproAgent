    artifact_writer: "src.reporting.eval_bench.write_figure9"
    output_path: "results/figure9.png"

# -----------------------------------------------------------------------------
# 7. Executable Algorithm & Formula Anchors
# -----------------------------------------------------------------------------
algorithms:
  preliminaries:
    description: "Rewards as functions of state eta(s) or state-action pairs eta(s, a)"
    formula: "eta(s)"
    loss_terms: ["loss"]

  functional_reward_encoding:
    description: "Section 4.1: Learn a latent representation z maximally informative about L_eta while compressive"
    objective: "We would like to learn a latent representation z that is maximally informative about L_eta, while remaining maximally compressive."
    formula_terms:
      L_eta: "L_eta"
      L_eta_e: "L_eta^e"
      L_eta_d: "L_eta^d"
      D_KL: "D_KL"
      beta: 0.1
      KL: "KL"
      p_theta: "p_theta"
      sum_k_1: "sum_k=1"
      K_prime: 6
      q_theta: "q_theta"
      sum_k: "sum_k"
      s_k_d: "s_k^d"
      s_1_e: "s_1^e"
      s_2_e: "s_2^e"
    masking:
      causal_masking: false
      positional_encodings: false
      unordered_set: true

  offline_rl_with_fre:
    description: "Section 4.3: Train encoder and policy"
    steps:
      - "Begin: # Train encoder while not converged do"
      - "Sample reward function eta ~ p(eta)"
      - "Sample K states for encoder {s_k^e} ~ D"
      - "Sample K' states for decoder {s_k^d} ~ D"
      - "Train FRE by maximizing Equation (6)"
      - "end while"
      - "# Train policy while not converged do"
      - "Sample reward function eta ~ p(eta)"
      - "Encode z ~ q_theta(z | L_eta^e)"
      - "Train policy pi(a | s, z) using offline RL (e.g., IQL or TD3)"
    symbols:
      K_prime: 6
      p_theta: "p_theta"
      s_k_e: "s_k^e"
      s_k_d: "s_k^d"

  hindsight_relabeling:
    description: "Addendum: Hindsight relabeling during training"
    loss_function: "L_pi = -E_{(s, g, a) ~ D} [log pi(a | s, g)]"
    goal_sampling_priors:
      p_randomgoal: 0.3
      p_geometric_goal: 0.5
      p_current_goal: 0.2
    masking:
      done_mask_on_goal_achieved: true
      random_binary_mask_chance: 0.9