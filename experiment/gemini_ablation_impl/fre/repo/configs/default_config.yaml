      batch_size: 256
    metric_function: "src.reporting.eval_bench.compute_normalized_score"
    artifact_writer: "src.reporting.eval_bench.write_table3"
    output_path: "results/table3.csv"

  "Experiment: Extended results (Table 4)":
    environment: "robotics"
    method: "ours"
    parameter_defaults:
      learning_rate: 0.0003
      batch_size: 256
    metric_function: "src.reporting.eval_bench.compute_normalized_score"
    artifact_writer: "src.reporting.eval_bench.write_table4"
    output_path: "results/table4.csv"

  "Experiment: Visualization (Figure 7)":
    environment: "deepmind_control"
    method: "ours"
    parameter_defaults:
      learning_rate: 0.0003
      batch_size: 256
    metric_function: "src.reporting.eval_bench.compute_visualization"
    artifact_writer: "src.reporting.eval_bench.write_figure7"
    output_path: "results/figure7.png"

  "Experiment: Visualization (Figure 8)":
