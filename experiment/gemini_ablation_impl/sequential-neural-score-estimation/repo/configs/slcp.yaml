# configs/slcp.yaml
# Sequential Neural Score Estimation (SNPSE / TSNPSE) - SLCP Task Configuration
# Reference Grounding: paperbench_repro configs/slcp.yaml

# Active Route Contracts (Chinese Symbol Mappings)
active_route_contracts:
  SLCP 基准实验: "slcp_tsnpse"
  theta: "parameter_vector"
  gradient: "score_function"
  ema: "exponential_moving_average"
  theta_t: "perturbed_parameter"
  theta_0: "initial_parameter"
  r_d: "parameter_dimension"
  r: "round_index"
  w_t: "standard_brownian_motion"
  theta_bar_0: "mean_initial_parameter"
  p_t: "perturbed_marginal_density"
  theta_bar_t: "mean_perturbed_parameter"

# Task Environment Factory Registry
# Reference Grounding: Section 5.1 SLCP
task:
  id: "slcp"
  alias: "SLCP"
  setup_metadata:
    difficulty: "challenging"
    theta_dim: 5
    x_dim: 8
    description: "Reproduction of the SLCP experiment from Section 5.1"
    determines_which: "prior truncation boundary"
    can_fluctuate_based: "simulation budget"
    two_most_challenging: ["slcp", "lotka_volterra"]
    including_both: true
  prior:
    type: "uniform"
    low: -3.0
    high: 3.0
    bounds: [-3.0, 3.0]
  simulator:
    name: "slcp"
    points: 4
  availability_check: "import sbi; import torch"
  runnable_config_hook: "configs/slcp.yaml"
  data_pipeline: "tasks/slcp.py"

# Sequential Training Protocol (Algorithm 1 / TSNPSE)
# Reference Grounding: Section 3.1, Algorithm 1
sequential:
  num_rounds: 10 # N_r
  budget_per_round: 1000 # M
  total_budget: 10000
  proposal_strategy: "truncated_prior" # TSNPSE
  truncation_quantile: 0.95 # p_tilde^r
  maintain_buffer: true # Maintain data buffer across sequential rounds

# Model Architecture and Training Hyperparameters
# Reference Grounding: Section E.3.2 Network Architecture and Training
model:
  type: "score_network"
  layers: 3
  hidden_dim: 256
  activation: "SiLU"
  time_embedding:
    type: "sinusoidal"
    dim: 64
  output_dim_factor: 4
  output_dim_min: 30

training:
  optimizer: "Adam"
  learning_rate: 1e-4
  batch_size: 128
  num_epochs: 500
  ema_decay: 0.999
  loss_type: "DSM" # Denoising Score Matching (J_post / J_lik)
  lambda_t: 1.0 # Weighting function in J_post

# Diffusion SDE Parameters
# Reference Grounding: Section 2.1 SDEs
sde:
  type: "VESDE"
  sigma_min: 0.01
  sigma_max: 15.0
  num_steps: 100

# Baseline Configurations and Hyperparameters
# Reference Grounding: Section 5.1 & Addendum
baselines:
  npe:
    method: "NPE"
    neural_net: "maf"
    learning_rate: 5e-4
    batch_size: 100
  nle:
    method: "NLE"
    neural_net: "maf"
    learning_rate: 5e-4
    batch_size: 100
  nre:
    method: "NRE"
    neural_net: "resnet"
    learning_rate: 5e-4
    batch_size: 100
  diffusion_model:
    method: "NPSE"
    learning_rate: 1e-4
    batch_size: 128

# C2ST Evaluation Settings
# Reference Grounding: Section 5.1 & Addendum
evaluation:
  metric: "c2st"
  classifier: "2-layer MLP" # or "Random Forest"
  hidden_units: 256
  num_samples: 1000

# Paper Evidence Obligation Matrix Registry
evidence_obligation_matrix:
  method_core:
    name: "Method Core"
    source_path: "models/score_network.py"
  tsnpse_logic:
    name: "TSNPSE Logic"
    source_path: "methods/tsnpse.py"
  experiment_1:
    name: "Experiment I: SLCP comparison"
    artifact_path: "results/experiment_registry.json"
  experiment_2:
    name: "Experiment II: Lotka-Volterra comparison"
    artifact_path: "results/experiment_registry.json"
  c2st_evaluation:
    name: "C2ST Evaluation"
    artifact_path: "results/c2st_report.json"
  baseline_comparison:
    name: "Baseline Comparison"
    artifact_path: "results/tables/experiment_results.csv"
  appendix_d_comparison:
    name: "Appendix D Comparison"
    artifact_path: "results/figures/figure_9.png"

# Dataset and Benchmark Registry
dataset_registry:
  aliases:
    slcp: "tasks/slcp.py"
    lotka_volterra: "tasks/lotka_volterra.py"

# Method and Baseline Selectors
method_selectors:
  ours: "TSNPSE"
  npe: "sbibm.npe"
  nle: "sbibm.nle"
  nre: "sbibm.nre"
  diffusion_model: "SNPSE"

# Bounded Parameter Sweeps
parameter_sweeps:
  learning_rate: [1e-4, 5e-4, 1e-3]
  batch_size: [64, 128, 256]

# Paper Formula and Algorithm Symbol Inventory
# Reference Grounding: Section 2, 3, Appendix B & C
symbol_inventory:
  theta: "parameter vector"
  theta_t: "perturbed parameter at time t"
  theta_0: "initial parameter sample"
  R_d: "d-dimensional real space"
  R_plus: "positive real line"
  w_t: "standard Brownian motion"
  theta_bar_0: "mean of initial parameter"
  p_T: "prior or terminal perturbation density"
  theta_bar_t: "mean of perturbed parameter at time t"
  g_squared: "diffusion coefficient g^2(t)"
  p_t: "perturbed marginal density"
  p_tmid0: "transition kernel p_{t|0}"
  nabla_theta: "score operator w.r.t theta"
  p_T_minus_t: "reverse-time transition kernel"
  lambda_t: "loss weighting function"
  J_post: "posterior score matching objective"
  SM: "score matching"
  int_0_T: "integral from 0 to T"
  s_psi: "score network approximation"
  DSM: "denoising score matching"
  R_p: "p-dimensional observation space"
  x_obs: "observed data"
  p_tilde: "truncated proposal prior"
  N_r: "number of sequential rounds"
  numeric_anchors:
    zero: 0
    one: 1
    two: 2
    three: 3
    four: 4
    six: 6
    seven: 7
    nine: 9
    twelve: 12
    thirteen: 13
    fourteen: 14
    eighteen: 18
    nineteen: 19
    two_point_one: 2.1
    fifty_four: 54
    two_point_one_one_five: 2.115

# Executable Algorithm Steps & Formulas
# Reference Grounding: Appendix B.1, C.2.1, C.3.1, C.4.1, C.4.3, Section 3.2
algorithms:
  B_1_Overview:
    objective: "denoising likelihood score matching"
    formula: "J_lik_DSM = 0.5 * int_0^T lambda_t * E[||s_psi(theta_t, x, t) - nabla_theta log p_tmid0(theta_t | theta_0)||^2] dt"
    steps:
      - "Train score network s_psi(theta_t, x, t) to approximate nabla_theta log p_t(x | theta_t)"
      - "Combine with prior score to estimate posterior score"
  C_2_1_Overview:
    objective: "sequential score estimation with proposal prior"
    steps:
      - "For r=1, sample parameters from the prior theta_0_i_1 ~ p(theta)"
      - "Concatenate samples to form the joint dataset"
      - "Train score network using denoising score matching"
  C_3_1_Overview:
    objective: "sequential posterior score estimation"
    steps:
      - "For r=1, sample parameters from the prior theta_0_i_1 ~ p(theta)"
      - "Concatenate samples with previous rounds to form joint dataset"
      - "Train score network to minimize J_post"
  C_4_1_Overview:
    objective: "truncated sequential score estimation"
    steps:
      - "For r=1, sample parameters from the prior theta_0_i_1 ~ p(theta)"
      - "Concatenate samples to form joint dataset"
      - "Train score network to approximate proposal prior score"
  C_4_3_Estimating_Proposal_Prior_Score:
    objective: "estimate score of perturbed proposal prior"
    formula: "nabla_theta log p_tilde_t^r(theta_t) = nabla_theta log [ (1/r) * sum_{s=0}^{r-1} p_psi_t^s(theta_t | x_obs) ]"
    steps:
      - "Compute score of perturbed proposal prior using mixture of previous round posteriors"
      - "Use denoising score matching objective to train the proposal prior score network"
  Alternative_Approaches_3_2:
    objective: "alternative sequential NPSE approaches"
    steps:
      - "In r-th round, sample new parameters theta_0_i_r ~ p_psi^{r-1}(theta | x_obs)"
      - "Concatenate samples to form joint dataset"
      - "Train score network using alternative objectives"

