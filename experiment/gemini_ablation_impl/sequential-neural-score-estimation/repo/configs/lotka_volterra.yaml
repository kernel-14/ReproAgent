# configs/lotka_volterra.yaml
# Sequential Neural Score Estimation (SNPSE / TSNPSE) - Lotka-Volterra Task Configuration
# Reference Grounding: paperbench_repro configs/lotka_volterra.yaml

# Task Environment Factory Registry
# Reference Grounding: Section 5.2 Lotka-Volterra
task:
  id: "lotka_volterra"
  alias: "Lotka-Volterra"
  setup_metadata:
    difficulty: "challenging"
    theta_dim: 4
    x_dim: 20
    description: "Reproduction of the Lotka-Volterra experiment from Section 5.2"
    determines_which: "prior truncation boundary"
    can_fluctuate_based: "simulation budget"
  prior:
    type: "uniform"
    low: -5.0
    high: 2.0
    bounds: [-5.0, 2.0]
  simulator:
    name: "lotka_volterra"
    points: 20
  availability_check: "import sbi; import torch"
  runnable_config_hook: "configs/lotka_volterra.yaml"
  data_pipeline: "tasks/lotka_volterra.py"

# Sequential Training Protocol (Algorithm 1 / TSNPSE)
# Reference Grounding: Section 3.1, Algorithm 1
sequential:
  num_rounds: 10 # N_r
  budget_per_round: 1000 # M
  total_budget: 10000
  proposal_strategy: "truncated_prior" # TSNPSE
  truncation_quantile: 0.95 # p_tilde^r
  maintain_buffer: true # Maintain data buffer across sequential rounds

# Model Architecture and Training Hyperparameters
# Reference Grounding: Section E.3.2 Network Architecture and Training
model:
  type: "score_network"
  layers: 3
  hidden_dim: 256
  activation: "SiLU"
  time_embedding:
    type: "sinusoidal"
    dim: 64
  output_dim_factor: 4
  output_dim_min: 30

training:
  optimizer: "Adam"
  learning_rate: 1e-4
  batch_size: 128
  num_epochs: 500
  ema_decay: 0.999
  loss_type: "DSM" # Denoising Score Matching (J_post / J_lik)
  lambda_t: 1.0 # Weighting function in J_post

# Diffusion SDE Parameters
# Reference Grounding: Section 2.1 Score-based Diffusion Models
diffusion:
  sde_type: "VESDE"
  sigma_min: 0.01
  sigma_max_strategy: "first_round_only" # Addendum constraint
  T: 1.0

# Parameter Sweeps Registry
# Reference Grounding: paper:paper_contract_sweep_hyperparameter_protocol
sweeps:
  learning_rate: [1e-4, 5e-4, 1e-3]
  batch_size: [64, 128, 256]

# Method and Baseline Selectors
# Reference Grounding: paper:paper_evidence_matrix
methods:
  ours: "TSNPSE"
  npe: "sbibm.npe"
  nle: "sbibm.nle"
  nre: "sbibm.nre"
  diffusion_model: "SNPSE"

# Evaluation and Artifact Writing Specs
# Reference Grounding: Section 5.1 Evaluation Metrics
evaluation:
  metrics: ["c2st", "loss"]
  c2st:
    classifier: "mlp" # 2-layer MLP
    hidden_units: 50
    num_samples: 1000
  artifact_writers:
    - "write_last_artifact"
    - "write_experiment_registry_artifact"
    - "write_dataset_registry_artifact"
    - "write_metrics_artifact"
    - "run_figure_2_route"

# Paper Formula/Algorithm Symbol Inventory (Code-Visible Anchors)
# Reference Grounding: Section 2, 3, Appendix B, C
symbols:
  theta: "parameters"
  theta_t: "perturbed parameters at time t"
  theta_0: "initial parameters"
  R_d: "parameter space dimension"
  R_plus: "positive real numbers"
  w_t: "standard Wiener process"
  theta_bar_0: "mean of initial parameters"
  p_T: "prior distribution at time T"
  theta_bar_t: "mean of perturbed parameters"
  g_2: "diffusion coefficient squared"
  p_t: "marginal distribution at time t"
  p_tmid0: "transition kernel"
  nabla_theta: "score function gradient"
  p_T_minus_t: "reverse time distribution"
  lambda_t: "loss weighting function"
  J_post: "posterior score matching objective"
  SM: "score matching"
  int_0_T: "integral over time horizon"
  s_psi: "score network"
  DSM: "denoising score matching"
  R_p: "observation space dimension"
  x_obs: "observed data"
  p_tilde: "proposal distribution"
  N_r: "number of rounds"

# Numeric and Default Anchors from Paper
anchors:
  zero: 0
  one: 1
  two: 2
  three: 3
  four: 4
  six: 6
  seven: 7
  nine: 9
  twelve: 12
  thirteen: 13
  fourteen: 14
  eighteen: 18
  nineteen: 19
  two_point_one: 2.1
  fifty_four: 54
  sigma_max_init: 2.115
  section_4_3: 4.3
  section_8_1: 81
  section_2_3: 2.3
  section_9_9: 99
  section_3_3: 3.3

# Artifact Path Registry
# Reference Grounding: writes_artifacts contract
paths:
  checkpoint: "results/checkpoints/last.ckpt"
  experiment_registry: "results/experiment_registry.json"
  dataset_registry: "results/dataset_registry.json"
  evidence_contract_matrix: "results/evidence_contract_matrix.json"
  artifact_manifest: "results/artifact_manifest.json"
  metrics: "results/metrics.json"
  sensitivity_report: "results/sensitivity_report.json"
  config_resolved: "results/config_resolved.json"
  data_manifest: "results/data_manifest.json"
  experiment_results: "results/tables/experiment_results.csv"
  figure_2: "results/figures/figure_2.png"
  figure_3: "results/figures/figure_3.png"
  figure_4: "results/figures/figure_4.png"
  figure_7: "results/figures/figure_7.png"
  figure_8: "results/figures/figure_8.png"
  training_trace: "results/training_trace.json"