# reference_grounding: paperbench_ref_001 envs.py

project_metadata:
  name: "Fine-tuning Reinforcement Learning Models is Secretly a Forgetting Mitigation Problem"
  paper_id: "ftrl"

# 1. Environment Registry & Factories
environment_registry:
  NetHack:
    id: "NetHack-v0"
    aliases:
      - "nethack learning"
      - "nle"
      - "unit-001"
      - "fine-tuning + bc"
    setup_metadata:
      eval_rollout_limit: 100000
      eval_no_progress_limit: 150
      eval_death_termination: true
      fisher_matrix_batches: 10000
      dataset_name: "NLD-AA"
      ttyrec_dataset: "nld-aa-v0"
    availability_check:
      package: "nle"
      import_test: "nle.env.NLE"
    runnable_config_hooks:
      add_nledata_directory: "/tmp/nle_data"
      add_altorg_directory: "/tmp/altorg_data"
    metrics:
      - "gold score"
      - "eating score"
      - "staircase score"
      - "scout score"
      - "experience points"
      - "dungeon depth"

  RoboticSequence:
    id: "RoboticSequence-v0"
    aliases:
      - "robotics"
      - "push-wall"
      - "peg-unplug-side"
      - "them were originally introduced"
    setup_metadata:
      num_stages: 4
      stage_success_threshold: 0.9
      random_start_goal: true
      observation_space: "robot_config + stage_one_hot"
      policy_network:
        hidden_layers: 4
        neurons_per_layer: 256
    availability_check:
      package: "metaworld"
      import_test: "metaworld.envs.ALL_V2_ENVIRONMENTS"
    runnable_config_hooks:
      beta: 1.5
      max_path_length: 200
    metrics:
      - "success_rate"
      - "stage_success_rate"
      - "Forward Transfer"
      - "AUC"
      - "AUC_b"

# 2. Dataset Registry & Loaders
dataset_registry:
  robotics:
    id: "RoboticSequenceDataset"
    aliases:
      - "metaworld_trajectories"
      - "robotics"
    setup_metadata:
      source: "MetaWorld"
      type: "expert_trajectories"
    validation_checks:
      - "check_file_exists"
      - "check_trajectory_length"
    runnable_config_hooks:
      batch_size: 128
    factory: "src.data.task_setup_factory.make_dataset"
    readiness_check: "src.data.task_setup_factory.check_dataset_readiness"

  nethack:
    id: "TtyrecDataset"
    aliases:
      - "nld-aa-v0"
      - "nle_data"
    setup_metadata:
      source: "NLD-AA"
      type: "ttyrec"
    validation_checks:
      - "check_directory_exists"
    runnable_config_hooks:
      add_nledata_directory: "/tmp/nle_data"
      add_altorg_directory: "/tmp/altorg_data"
      batch_size: 128
      ttyrecdataset_nld_aa_v0_batch_size_128: 128
    factory: "src.data.task_setup_factory.make_dataset"
    readiness_check: "src.data.task_setup_factory.check_dataset_readiness"

# 3. Method / Baseline / Attack Selectors
method_selectors:
  ours:
    id: "ours"
    aliases: ["Ours", "scaled-bc + fine-tuning + ks"]
    factory: "src.methods.core_callable_component.OursMethod"
  ppo:
    id: "ppo"
    factory: "src.methods.unit_python_py.PPOMethod"
  sac:
    id: "sac"
    factory: "src.methods.unit_python_py.SACMethod"
  bc:
    id: "bc"
    aliases: ["Behavioral Cloning", "Fine-tuning + BC"]
    factory: "src.methods.unit_bc_loss.BCMethod"
  oracle:
    id: "oracle"
    factory: "src.methods.core_callable_component.OracleMethod"
  nle:
    id: "nle"
    factory: "src.methods.core_callable_component.NLEMethod"
  ewc:
    id: "ewc"
    aliases: ["Fine-tuning + EWC"]
    factory: "src.methods.unit_ewc_penalty.EWCMethod"

# 4. Bounded Sweep & Config Entries
parameter_sweeps:
  learning_rate:
    sweep_values: [0.0001, 0.0003, 0.001]
    default: 0.0003
  batch_size:
    sweep_values: [64, 128, 256]
    default: 128
  fixed_hyperparameters:
    batch_size_128: 128

# 5. Paper Formula & Algorithm Symbol Inventory
symbol_inventory:
  # Numeric/default anchors
  anchors:
    batch_size_128: 128
    two: 2
    zero: 0
    nine: 9
    one: 1
    val_0_11: 0.11
    val_2_22: 2.22
    val_0_5: 0.5
    val_10: 10
    val_0_08: 0.08
    val_9_93: 9.93
    val_13: 13
    val_11: 11
    val_30: 30
    val_200: 200
    val_1_5: 1.5

  # Formula symbols
  add_nledata_directory: "/tmp/nle_data"
  add_altorg_directory: "/tmp/altorg_data"
  ttyrec_dataset_name: "nld-aa-v0"
  batch_size: 128
  L_aux: "auxiliary loss term"
  theta: "current policy parameters"
  sum_i: "summation index over parameters"
  F_i: "Fisher information matrix diagonal element"
  theta_star_i: "pre-trained policy parameter i"
  theta_i: "current policy parameter i"
  theta_star: "pre-trained policy parameters"
  L_BC: "behavioral cloning loss"
  B_BC: "behavioral cloning buffer"
  D_KL: "Kullback-Leibler divergence"
  pi_star: "pre-trained policy"
  pi_theta: "current policy"
  L_KS: "kickstarting loss"
  s_0: "initial state in two-state MDP"
  v_0: "value of state s_0"
  gamma: "discount factor"
  r_0: "reward at state s_0"
  f_theta: "transition probability or function"
  r_1: "reward at state s_1"
  epsilon: "exploration or threshold parameter"

# 6. Executable Algorithm & Formula Anchors
formula_anchors:
  addendum:
    symbols:
      - "add_nledata_directory"
      - "add_altorg_directory"
      - "TtyrecDataset\"nld-aa-v0\""
      - "batch_size=128"
      - "batch_size"
    numeric_defaults:
      batch_size: 128
    algorithm_terms:
      - "algorithm"
      - "distill"
      - "compute"
    steps: "The 'from scratch' model doesn't use any behavioral cloning. Existing implementations that should be used: PPO RND with the environment should be implemented using the code at https://github.com/jcwleo/random-network-distillation-pytorch."

  two_state_mdp:
    section: "A.1. Two-state MDPs"
    symbols:
      - "theta"
      - "gamma"
      - "f_theta"
      - "epsilon"
      - "1_thetaleq1-epsilon/2"
      - "1_theta>1-epsilon/2"
      - "s_0"
      - "v_0"
      - "r_0"
      - "r_1"
      - "s_1"
      - "f_0"
      - "f_1"
    numeric_defaults:
      zero: 0
      nine: 9
      one: 1
      two: 2
      val_0_11: 0.11
      val_2_22: 2.22
      val_0_5: 0.5
      val_10: 10
    algorithm_terms:
      - "gradient"
    steps: "The value of state s_0 equals v_0(theta) = (1 / (1 - gamma)) * (theta + r_0 * (1 - theta) * (1 - gamma * f_theta) + gamma * theta * r_1 * (1 - f_theta)) / (1 - gamma * f_theta + gamma * theta). In each case, we treat fine-tuning as the process of adjusting theta towards the gradient."

  forgetting_capabilities:
    section: "2. Forgetting of pre-trained capabilities"
    symbols:
      - "theta_*"
      - "L_BC"
      - "theta"
      - "B_BC"
      - "D_KL"
      - "pi_*"
      - "pi_theta"
      - "L_KS"
    algorithm_terms:
      - "objective"
      - "loss"
      - "sample"
      - "initialize"
    steps: "For the fine-tuning phase, we initialize the policy with theta_* and we apply an auxiliary loss of the form L_BC(theta) = E_{s ~ B_BC}[D_KL(pi_*(s) || pi_theta(s))] alongside the RL objective. Kickstarting applies KL of a similar form, but the expectation is over data sampled by the current policy, i.e., L_KS(theta) = E_{s ~ pi_theta}[D_KL(pi_*(s) || pi_theta(s))]."

  apple_retrieval:
    section: "A.2. Synthetic example: Appleretrieval"
    symbols:
      - "pi_w,b"
      - "asset_13"
      - "sigma"
    numeric_defaults:
      one: 1
      zero: 0
      two: 2
      val_13: 13
      val_11: 11
      val_30: 30
    algorithm_terms:
      - "algorithm"
      - "gradient"
      - "ema"
      - "increase"
    steps: "We can guide the model towards focusing on one or the other by setting the c parameter since the linear model trained with gradient descent will tend towards a solution with a low weight norm."

  meta_world:
    section: "B.3. Meta World"
    symbols:
      - "E_k"
      - "E_i"
      - "r_t"
      - "r_t^prime"
      - "beta"
      - "K_ij"
      - "x_i"
      - "x_j"
      - "L_ij"
      - "y_i"
      - "y_j"
      - "CKA"
      - "HSIC"
    numeric_defaults:
      one: 1
      val_200: 200
      val_1_5: 1.5
    algorithm_terms:
      - "algorithm"
      - "formula"
      - "sample"
      - "initialize"
    steps: "t=1 {Move to the next env, reset timestep counter} end if end while Return i-1. In order to make the problem more challenging, we randomly sample the start and goal conditions, similarly as in (Wolczyk et al., 2021)."

  distillation_methods:
    section: "C.2. Distillation-based methods"
    symbols:
      - "D_KL^s"
      - "pi_theta"
      - "theta"
      - "pi_*"
      - "L_BC"
      - "B_theta"
      - "L_KS"
      - "E_asimpcdotmids"
    algorithm_terms:
      - "loss"
      - "teacher"
      - "student"
    steps: "In behavioral cloning, we apply the following loss: L_BC(theta) = E_{s ~ B}[D_KL^s(pi_theta || pi_*)] where B is a buffer of data containing states from pre-training."