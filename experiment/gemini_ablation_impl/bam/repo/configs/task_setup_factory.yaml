    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "src.data.task_setup_factory.load_task_setup_factory"

# Expose paper-derived dataset/benchmark loaders with ids, setup metadata, validation checks, and runnable config hooks
dataset_loaders:
  cifar:
    id: "cifar"
    aliases: ["cifar10", "cifar-10"]
    setup_metadata:
      in_channels: 3
      c_hid: 64
      latent_dim: 128
    validation_checks:
      - "check_channels"
      - "check_resolution"
    runnable_config_hook: "src.data.inventory_registry_make.load_inventory_registry_make"

# Expose required parameter sweeps as executable constants/default accessors
parameter_sweeps:
  lambda:
    default: 1.0
    sweep_values: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
  learning_rate:
    default: 0.001
    sweep_values: [1e-4, 5e-4, 1e-3, 5e-3, 1e-2]
  batch_size:
    default: 64
    sweep_values: [16, 32, 64, 128, 256]
  p:
    default: 2.0
    sweep_values: [1.0, 2.0]

# Expose fixed hyperparameter anchors
fixed_hyperparameters:
  iterations: 100  # 100_iterations anchor

# Expose method/baseline/attack selectors
method_selectors:
  ours:
    id: "ours"
    name: "Batch and Match (BaM)"
    description: "Proposed score-based divergence variational inference method"
  baseline:
    id: "baseline"
    name: "ADVI / GSM"
    description: "Baseline variational inference methods"

# Paper formula/algorithm symbol inventory and anchors
formula_anchors:
  addendum_vae:
    symbols:
      Convin_channels_3_out_channels_c_hid_kernel_size_3_stride_2: "Convin_channels=3,out_channels=c_hid,kernel_size=3,stride=2"
