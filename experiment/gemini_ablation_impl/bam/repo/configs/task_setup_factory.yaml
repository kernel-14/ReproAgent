# configs/task_setup_factory.yaml
# reference_grounding: paperbench_ref_008 docs/jep/12049-type-annotations.md
# reference_grounding: paperbench_ref_005 doc/use_cases.md

metadata:
  name: "Task Setup Factory Configuration"
  description: "Exposes paper-derived environment/task factories, dataset loaders, parameter sweeps, and formula anchors."

# Paper evidence contract: explicitly register environment/task aliases for cifar.
environment_registry:
  cifar:
    id: "cifar"
    aliases: ["cifar10", "cifar-10", "cifar_keep_external"]
    factory: "src.data.task_setup_factory.make_task_setup_factory"
    setup_metadata:
      in_channels: 3
      c_hid: 64
      latent_dim: 128
      kernel_size: 3
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "src.data.task_setup_factory.load_task_setup_factory"

# Expose paper-derived environment/task factories with ids, aliases, setup metadata, availability checks, and runnable config hooks
environment_factories:
  cifar:
    id: "cifar"
    aliases: ["cifar10", "cifar-10", "cifar_keep_external"]
    setup_metadata:
      in_channels: 3
      c_hid: 64
      latent_dim: 128
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
    runnable_config_hook: "src.data.task_setup_factory.load_task_setup_factory"
  determines_which:
    id: "determines_which"
    aliases: ["determines_which_adapters"]
    setup_metadata: {}
    availability_check: "src.data.task_setup_factory.check_task_setup_factory_available"
