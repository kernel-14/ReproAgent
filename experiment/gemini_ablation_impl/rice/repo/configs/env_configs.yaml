# configs/env_configs.yaml
# RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation
# Reference Grounding: paperbench_ref_006 Refine_mujoco/masknet/readme.md

# -------------------------------------------------------------------------
# 1. Active Reproduction Scope Notes & Metadata
# -------------------------------------------------------------------------
metadata:
  project_name: "RICE Reproduction"
  description: "Faithful reproduction of RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation"
  active_reproduction_scope: "Bounded execution smoke/default subset and full-mode sweeps"
  hypothesis: "Vanilla PPO is sufficient to train the state mask without sacrificing theoretical guarantees when the objective is reformulated."
  decision_value: "Standardizes the optimization process for both the explanation and the refinement phases."

# -------------------------------------------------------------------------
# 2. Environment/Task Factories & Aliases
# -------------------------------------------------------------------------
environments:
  Hopper-v3:
    id: "Hopper-v3"
    aliases: ["Hopper", "mujoco", "gym"]
    setup_metadata:
      state_dim: 11
      action_dim: 3
      reward_type: "dense"
    availability_check: "import gym; gym.make('Hopper-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"
  
  Walker2d-v3:
    id: "Walker2d-v3"
    aliases: ["Walker2d", "mujoco", "gym"]
    setup_metadata:
      state_dim: 17
      action_dim: 6
      reward_type: "dense"
    availability_check: "import gym; gym.make('Walker2d-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  Reacher-v3:
    id: "Reacher-v3"
    aliases: ["Reacher", "mujoco", "gym"]
    setup_metadata:
      state_dim: 11
      action_dim: 2
      reward_type: "dense"
    availability_check: "import gym; gym.make('Reacher-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  HalfCheetah-v3:
    id: "HalfCheetah-v3"
    aliases: ["HalfCheetah", "mujoco", "gym"]
    setup_metadata:
      state_dim: 17
      action_dim: 6
      reward_type: "dense"
    availability_check: "import gym; gym.make('HalfCheetah-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  SelfishMining-v0:
    id: "SelfishMining-v0"
    aliases: ["Selfish Mining", "selfish mining", "selfish_mining"]
    setup_metadata:
      state_dim: 3
      action_dim: 4
      reward_type: "sparse"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  CageChallenge2-v0:
    id: "CageChallenge2-v0"
    aliases: ["Cage Challenge 2", "CAGE Challenge 2", "cage", "network_defense"]
    setup_metadata:
      state_dim: 52
      action_dim: 4
      reward_type: "dense"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  AutonomousDriving-v0:
    id: "AutonomousDriving-v0"
    aliases: ["Autonomous Driving", "autonomous driving", "autonomous_driving"]
    setup_metadata:
      state_dim: 25
      action_dim: 2
      reward_type: "dense"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  MalwareMutation-v0:
    id: "MalwareMutation-v0"
    aliases: ["Malware Mutation", "Malware Mutation", "network_defense"]
    setup_metadata:
      state_dim: 1024
      action_dim: 23
      reward_type: "sparse"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

# -------------------------------------------------------------------------
# 3. Dataset/Benchmark Loaders
# -------------------------------------------------------------------------
datasets:
  cage:
    id: "cage"
    aliases: ["cage", "network_defense"]
    setup_metadata:
      source: "CybORG Challenge 2"
      validation_check: "import cyborg"
      runnable_config_hook: "rice.envs.env_factory.load_dataset"
  gym:
    id: "gym"
    aliases: ["gym", "mujoco"]
    setup_metadata:
      source: "OpenAI Gym MuJoCo"
      validation_check: "import gym"
      runnable_config_hook: "rice.envs.env_factory.load_dataset"
  mujoco:
    id: "mujoco"
    aliases: ["mujoco", "gym"]
    setup_metadata:
      source: "MuJoCo Benchmarks"
      validation_check: "import gym"
      runnable_config_hook: "rice.envs.env_factory.load_dataset"
  selfish_mining:
    id: "selfish_mining"
    aliases: ["selfish_mining", "selfish mining"]
    setup_metadata:
      source: "Bitcoin Bare Fee Model MDP"
      validation_check: "import numpy"
      runnable_config_hook: "rice.envs.env_factory.load_dataset"
  network_defense:
    id: "network_defense"
    aliases: ["network_defense", "cage", "Malware Mutation"]
    setup_metadata:
      source: "CybORG / Malware RL"
      validation_check: "import numpy"
      runnable_config_hook: "rice.envs.env_factory.load_dataset"
  autonomous_driving:
    id: "autonomous_driving"
    aliases: ["autonomous_driving", "autonomous driving"]
    setup_metadata:
      source: "MetaDrive Simulator"
      validation_check: "import metadrive"
      runnable_config_hook: "rice.envs.env_factory.load_dataset"

# -------------------------------------------------------------------------
# 4. Method / Baseline / Attack Selectors
# -------------------------------------------------------------------------
methods:
  selectors:
    - "ours"
    - "random"
    - "statemask"
    - "ppo"
    - "sac"
    - "gail"
    - "jsrl"
    - "heuristic"
    - "Ours"
    - "b-line"
    - "ppo fine-tuning"
    - "statemask-r"

# -------------------------------------------------------------------------
# 5. Parameter Sweeps & Hyperparameter Defaults
# -------------------------------------------------------------------------
parameter_sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0.0, 0.1, 0.01, 0.001]
  p: [0.0, 0.25, 0.5, 0.75, 1.0]
  learning_rate: [3e-4, 1e-4, 5e-5]
  ppo_hyperparameters:
    learning_rate: 3e-4
    batch_size: 64
    gamma: 0.99
    clip_range: 0.2
    ent_coef: 0.0
    n_epochs: 10
    n_steps: 2048

# -------------------------------------------------------------------------
# 6. Callable Protocol Matrix (Experiment Matrix)
# -------------------------------------------------------------------------
experiment_protocol_matrix:
  experiment_i:
    aliases: ["experiment_i", "experiment i"]
    env: "Hopper-v3"
    method: "ours"
    metric_function: "rice.metrics.fidelity.calculate_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_figure_5"
  experiment_ii:
    aliases: ["experiment_ii", "experiment ii"]
    env: "Walker2d-v3"
    method: "ours"
    metric_function: "rice.metrics.fidelity.calculate_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_table_4"
  experiment_iii:
    aliases: ["experiment_iii", "experiment iii", "experiment 3"]
    env: "Reacher-v3"
    method: "ours"
    metric_function: "rice.metrics.fidelity.calculate_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_figure_1"
  experiment_iv:
    aliases: ["experiment_iv", "experiment iv"]
    env: "HalfCheetah-v3"
    method: "ours"
    metric_function: "rice.metrics.fidelity.calculate_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_table_1"
  experiment_v:
    aliases: ["experiment_v", "experiment v"]
    env: "SelfishMining-v0"
    method: "ours"
    metric_function: "rice.metrics.fidelity.calculate_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_table_3"

