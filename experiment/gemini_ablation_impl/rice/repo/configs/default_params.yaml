# -------------------------------------------------------------------------
# 6. Dataset / Benchmark Loaders Registry
# -------------------------------------------------------------------------
datasets:
  aliases:
    cage: ["Cage Challenge 2"]
    gym: ["Hopper", "Walker2d", "Reacher", "HalfCheetah"]
    mujoco: ["Hopper", "Walker2d", "Reacher", "HalfCheetah"]
    selfish_mining: ["Selfish Mining"]
    network_defense: ["Cage Challenge 2", "Malware Mutation"]
    autonomous_driving: ["Autonomous Driving"]

  loaders:
    cage:
      id: "cage_loader"
      setup_metadata:
