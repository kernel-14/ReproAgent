# -------------------------------------------------------------------------
# 8. Paper Formula / Algorithm Anchors (Technique Details)
# -------------------------------------------------------------------------
anchors:
  technique_detail_3_3_part1:
    section: "3.3. Technique Detail"
    symbols: ["theta", "pi_bar", "alpha", "pi_tilde", "pi_prime", "lambda", "pi_theta", "f_hat_theta", "pi_hat", "R_prime", "s_t", "a_t", "a_t_m", "tau"]
    numeric_defaults: [1, 2, 0]
    algorithm_terms: ["algorithm", "formula", "objective", "loss", "mask", "calculate", "sample"]
    steps:
      - "With this reformulation, we can utilize the vanilla PPO algorithm to train the state mask without sacrificing the theoretical guarantee."
      - "To tackle this problem, we add an additional reward by giving an extra bonus when the mask net outputs 1."

  technique_detail_3_3_part2:
    section: "3.3. Technique Detail"
    symbols: ["a_random", "theta", "pi_bar", "pi_tilde_theta", "theta_old", "pi_tilde", "s_t", "a_t_m", "a_t", "s_0", "s_t_plus_1", "R_t_prime"]
    numeric_defaults: [0, 1, 2, 3.1]
    algorithm_terms: ["equation", "algorithm", "objective", "mask", "ema", "compute", "update", "sample"]
    steps:
      - "We leverage a state-of-the-art explanation method StateMask (Cheng et al., 2023)."
      - "At a high level, StateMask parameterizes the importance of the target agent's current time step as a neural network model (i.e., mask network)."

  experiment_design_4_2:
    section: "4.2. Experiment Design"
    symbols: ["alpha"]
    numeric_defaults: [10, 20, 30, 40]
    algorithm_terms: ["mask", "rank", "ema", "compute", "select", "sample"]
    steps:
      - "To show the equivalence of our explanation method with StateMask, we compare the fidelity of our method with StateMask."
      - "We compute the fidelity score of each explanation method as mentioned in StateMask across 500 trajectories."

  additional_results_c_3:
    section: "C.3. Additional Experiment Results"
    symbols: ["alpha"]
    numeric_defaults: [0.25, 0.5]
    algorithm_terms: ["mask", "ema", "sample"]
    steps:
      - "For all applications, we choose the coefficient of the intrinsic reward for training the mask network alpha as 0.01."
      - "First, We observe that our explanation method has similar fidelity scores with StateMask across all applications, empirically indicating the equivalence of our explanation method with StateMask."

  sparse_rewards_c_4:
    section: "C.4. Evaluation Results of MuJoCo Games with Sparse Rewards"
    symbols: ["alpha"]
    numeric_defaults: [0, 1]
    algorithm_terms: ["mask", "ema"]
    steps:
      - "First, we compare our refining method with other baseline methods (i.e., PPO fine-tuning, StateMask-R, and JSRL) in the SparseWalker2d game."
      - "We vary the hyper-parameter alpha from {0.01,0.001,0.0001} and record the fidelity scores of the mask network trained under different settings of alpha."

  addendum_fidelity:
    section: "addendum"
    symbols: ["d_max"]
    algorithm_terms: ["formula", "mask", "ema", "calculate"]
    steps:
      - "Both the explanation method (as well as StateMask) and the refinement method (as well as StateMask-R) are based on the black-box assumption."
      - "The explanation method for which we wish to measure fidelity score (e.g., StateMask) generates step-level importance scores for the trajectory, identifying how critical each step is to the agent's final reward."