# configs/evidence_obligation_registry.yaml
# RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation
# Reference Grounding: paperbench_ref_006 Refine_mujoco/masknet/fid_test.py

# -------------------------------------------------------------------------
# 1. Active Reproduction Scope Notes & Metadata
# -------------------------------------------------------------------------
metadata:
  project_name: "RICE Reproduction"
  description: "Faithful reproduction of RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation"
  active_reproduction_scope: "Bounded execution smoke/default subset and full-mode sweeps"
  hypothesis: "Vanilla PPO is sufficient to train the state mask without sacrificing theoretical guarantees when the objective is reformulated."
  decision_value: "Standardizes the optimization process for both the explanation and the refinement phases."

# -------------------------------------------------------------------------
# 2. Environment/Task Factories & Aliases
# -------------------------------------------------------------------------
environments:
  Hopper:
    id: "Hopper-v3"
    aliases: ["Hopper", "mujoco", "gym"]
    setup_metadata:
      state_dim: 11
      action_dim: 3
      reward_type: "dense"
    availability_check: "import gym; gym.make('Hopper-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"
  
  Walker2d:
    id: "Walker2d-v3"
    aliases: ["Walker2d", "mujoco", "gym"]
    setup_metadata:
      state_dim: 17
      action_dim: 6
      reward_type: "dense"
    availability_check: "import gym; gym.make('Walker2d-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  Reacher:
    id: "Reacher-v3"
    aliases: ["Reacher", "mujoco", "gym"]
    setup_metadata:
      state_dim: 11
      action_dim: 2
      reward_type: "dense"
    availability_check: "import gym; gym.make('Reacher-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  HalfCheetah:
    id: "HalfCheetah-v3"
    aliases: ["HalfCheetah", "mujoco", "gym"]
    setup_metadata:
      state_dim: 17
      action_dim: 6
      reward_type: "dense"
    availability_check: "import gym; gym.make('HalfCheetah-v3')"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  Selfish_Mining:
    id: "SelfishMining-v0"
    aliases: ["selfish mining", "selfish_mining"]
    setup_metadata:
      state_dim: 3
      action_dim: 4
      reward_type: "sparse"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  Cage_Challenge_2:
    id: "CAGEChallenge2-v0"
    aliases: ["CAGE Challenge 2", "cage", "network_defense"]
    setup_metadata:
      state_dim: 52
      action_dim: 13
      reward_type: "sparse"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  Autonomous_Driving:
    id: "AutonomousDriving-v0"
    aliases: ["autonomous driving", "autonomous_driving"]
    setup_metadata:
      state_dim: 25
      action_dim: 2
      reward_type: "dense"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

  Malware_Mutation:
    id: "MalwareMutation-v0"
    aliases: ["Malware Mutation", "malware_mutation"]
    setup_metadata:
      state_dim: 1024
      action_dim: 235
      reward_type: "sparse"
    availability_check: "import rice.envs.real_world_envs"
    runnable_config_hook: "rice.envs.env_factory.make_env"

# -------------------------------------------------------------------------
# 3. Dataset/Benchmark Loaders
# -------------------------------------------------------------------------
datasets:
  cage:
    id: "cage_dataset"
    aliases: ["cage"]
    setup_metadata:
      format: "npz"
      num_trajectories: 500
    validation_check: "import os; os.path.exists('results/dataset_registry.json')"
    runnable_config_hook: "rice.utils.config_loader.load_dataset"

  gym:
    id: "gym_dataset"
    aliases: ["gym", "mujoco"]
    setup_metadata:
      format: "npz"
      num_trajectories: 500
    validation_check: "import os; os.path.exists('results/dataset_registry.json')"
    runnable_config_hook: "rice.utils.config_loader.load_dataset"

  mujoco:
    id: "mujoco_dataset"
    aliases: ["mujoco"]
    setup_metadata:
      format: "npz"
      num_trajectories: 500
    validation_check: "import os; os.path.exists('results/dataset_registry.json')"
    runnable_config_hook: "rice.utils.config_loader.load_dataset"

  selfish_mining:
    id: "selfish_mining_dataset"
    aliases: ["selfish_mining"]
    setup_metadata:
      format: "npz"
      num_trajectories: 500
    validation_check: "import os; os.path.exists('results/dataset_registry.json')"
    runnable_config_hook: "rice.utils.config_loader.load_dataset"

  network_defense:
    id: "network_defense_dataset"
    aliases: ["network_defense"]
    setup_metadata:
      format: "npz"
      num_trajectories: 500
    validation_check: "import os; os.path.exists('results/dataset_registry.json')"
    runnable_config_hook: "rice.utils.config_loader.load_dataset"

  autonomous_driving:
    id: "autonomous_driving_dataset"
    aliases: ["autonomous_driving"]
    setup_metadata:
      format: "npz"
      num_trajectories: 500
    validation_check: "import os; os.path.exists('results/dataset_registry.json')"
    runnable_config_hook: "rice.utils.config_loader.load_dataset"

# -------------------------------------------------------------------------
# 4. Method / Baseline / Attack Selectors
# -------------------------------------------------------------------------
methods:
  - "ours"
  - "random"
  - "statemask"
  - "ppo"
  - "sac"
  - "gail"
  - "jsrl"
  - "heuristic"
  - "Ours"
  - "b-line"
  - "ppo fine-tuning"

# -------------------------------------------------------------------------
# 5. Parameter Sweeps & Hyperparameter Defaults
# -------------------------------------------------------------------------
parameter_sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0.0, 0.1, 0.01, 0.001]
  p: [0.0, 0.25, 0.5, 0.75, 1.0]
  learning_rate: [3e-4, 1e-4, 5e-5]
  ppo_hyperparameters:
    learning_rate: 3e-4
    batch_size: 64
    gamma: 0.99
    clip_range: 0.2
    ent_coef: 0.0
    n_epochs: 10
    n_steps: 2048

# -------------------------------------------------------------------------
