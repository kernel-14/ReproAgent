  A_pi: "A^pi"
  pi_star: "pi^*"
  max_pi: "max_pi"
  E_ssimrho: "E_ssimrho"
  d_rho_pi: "d_rho^pi"
  gamma: "gamma"
  Pr_pi: "Pr^pi"
  pi_r: "pi^r"
  d_rho: "d_rho"
  a_t_m: "a_t^m"
  a_random: "a_random"
  theta: "theta"
  pi_bar: "pi_bar"
  pi_tilde_theta: "pi_tilde_theta"
  pi_tilde: "pi_tilde"
  pi_prime: "pi^prime"
  lambda: "lambda"
  pi_theta: "pi_theta"
  f_hat_theta: "f_hat_theta"
