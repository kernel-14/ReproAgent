# -------------------------------------------------------------------------
# 7. Callable Protocol Matrix (Named Experiments)
# -------------------------------------------------------------------------
experiments:
  experiment_i:
    name: "Experiment I: Fidelity and Equivalence"
    environment: "Hopper"
    method_selector: "ours"
    metric_function: "rice.metrics.fidelity.compute_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_figure_5"
  
  experiment_ii:
    name: "Experiment II: Efficiency of Explanation"
    environment: "Walker2d"
    method_selector: "ours"
    metric_function: "rice.metrics.fidelity.compute_efficiency"
    artifact_writer: "rice.utils.artifact_logger.write_table_4"

  experiment_iii:
    name: "Experiment III: Refinement Performance"
    environment: "Reacher"
    method_selector: "ours"
    metric_function: "rice.metrics.fidelity.compute_reward"
    artifact_writer: "rice.utils.artifact_logger.write_table_1"

  experiment_iv:
    name: "Experiment IV: Parameter Sensitivity"
    environment: "HalfCheetah"
    method_selector: "ours"
    metric_function: "rice.metrics.fidelity.compute_reward"
    artifact_writer: "rice.utils.artifact_logger.write_figure_1"

  experiment_v:
    name: "Experiment V: Real-world Applications"
    environment: "Selfish_Mining"
    method_selector: "ours"
    metric_function: "rice.metrics.fidelity.compute_reward"
    artifact_writer: "rice.utils.artifact_logger.write_figure_2"

  experiment_i_alias:
    name: "experiment i"
    environment: "Hopper"
    method_selector: "ours"
    metric_function: "rice.metrics.fidelity.compute_fidelity"
    artifact_writer: "rice.utils.artifact_logger.write_figure_5"

  experiment_3:
