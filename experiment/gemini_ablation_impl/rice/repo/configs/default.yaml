# configs/default.yaml
# RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation
# Reference Grounding: paperbench_ref_006 Refine_mujoco/masknet/readme.md

# -------------------------------------------------------------------------
# 1. Active Reproduction Scope Notes & Metadata
# -------------------------------------------------------------------------
metadata:
  project_name: "RICE Reproduction"
  description: "Faithful reproduction of RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation"
  active_reproduction_scope: "Bounded execution smoke/default subset and full-mode sweeps"
  hypothesis: "Vanilla PPO is sufficient to train the state mask without sacrificing theoretical guarantees when the objective is reformulated."
  decision_value: "Standardizes the optimization process for both the explanation and the refinement phases."

# -------------------------------------------------------------------------
# 2. Paper Formula & Algorithm Symbol Inventory (Code-Visible Anchors)
# -------------------------------------------------------------------------
# These symbols and numeric anchors are explicitly registered here to be loaded by runtime code.
symbols:
  d_max: "d_max"
  V_pi: "V^pi"
  E_pi: "E_pi"
  sum_t_0_infty: "sum_t=0^infty"
  gamma_t: "gamma^t"
  s_t: "s_t"
  a_t: "a_t"
  s_0: "s_0"
  Q_pi: "Q^pi"
  a_0: "a_0"
  A_pi: "A^pi"
  pi_star: "pi^*"
  max_pi: "max_pi"
  E_ssimrho: "E_ssimrho"
  d_rho_pi: "d_rho^pi"
  gamma: "gamma"
  Pr_pi: "Pr^pi"
  pi_r: "pi^r"
  d_rho: "d_rho"
  a_t_m: "a_t^m"
  a_random: "a_random"
  theta: "theta"
  pi_bar: "pi_bar"
  pi_tilde_theta: "pi_tilde_theta"
  pi_tilde: "pi_tilde"
  pi_prime: "pi^prime"
  lambda: "lambda"
  pi_theta: "pi_theta"
  f_hat_theta: "f_hat_theta"
  pi_hat: "pi_hat"
  R_prime: "R^prime"
  tau: "tau"
  theta_old: "theta_old"
  s_t_plus_1: "s_t+1"
  R_t_prime: "R_t^prime"
  pi_e: "pi_e"
  pi_g: "pi_g"

numeric_anchors:
  zero: 0
  one: 1
  two: 2
  three_point_one: 3.1
  three_point_six: 3.6
  three: 3
  ten: 10
  twenty: 20
  thirty: 30
  forty: 40
  three_point_three: 3.3
  four: 4
  three_point_five: 3.5
  three_point_four: 3.4
  zero_point_two_five: 0.25
  zero_point_five: 0.5

# -------------------------------------------------------------------------
# 3. Environment / Task Factories & Aliases
# -------------------------------------------------------------------------
environments:
  aliases:
    mujoco: ["Hopper", "Walker2d", "Reacher", "HalfCheetah"]
    selfish_mining: ["selfish mining", "Selfish Mining"]
    network_defense: ["CAGE Challenge 2", "Cage Challenge 2"]
    autonomous_driving: ["autonomous driving", "Autonomous Driving"]
    cage: ["CAGE Challenge 2", "Cage Challenge 2"]
    gym: ["Hopper", "Walker2d", "Reacher", "HalfCheetah", "Malware Mutation"]
  
  factories:
    Hopper:
      id: "Hopper-v3"
      alias: "mujoco"
      setup_metadata:
        state_dim: 11
        action_dim: 3
      availability_check: "check_mujoco_wrappers_available"
      config_hook: "make_mujoco_wrappers"
    Walker2d:
      id: "Walker2d-v3"
      alias: "mujoco"
      setup_metadata:
        state_dim: 17
        action_dim: 6
      availability_check: "check_mujoco_wrappers_available"
      config_hook: "make_mujoco_wrappers"
    Reacher:
      id: "Reacher-v3"
      alias: "mujoco"
      setup_metadata:
        state_dim: 11
        action_dim: 2
      availability_check: "check_mujoco_wrappers_available"
      config_hook: "make_mujoco_wrappers"
    HalfCheetah:
      id: "HalfCheetah-v3"
      alias: "mujoco"
      setup_metadata:
        state_dim: 17
        action_dim: 6
      availability_check: "check_mujoco_wrappers_available"
      config_hook: "make_mujoco_wrappers"
    "Selfish Mining":
      id: "SelfishMining-v0"
      alias: "selfish_mining"
      setup_metadata:
        state_dim: 3
        action_dim: 4
      availability_check: "check_real_world_envs_available"
      config_hook: "make_real_world_envs"
    "Cage Challenge 2":
      id: "CageChallenge2-v0"
      alias: "network_defense"
      setup_metadata:
        state_dim: 52
        action_dim: 13
      availability_check: "check_real_world_envs_available"
      config_hook: "make_real_world_envs"
    "Autonomous Driving":
      id: "AutonomousDriving-v0"
      alias: "autonomous_driving"
      setup_metadata:
        state_dim: 10
        action_dim: 2
      availability_check: "check_real_world_envs_available"
      config_hook: "make_real_world_envs"
    "Malware Mutation":
      id: "MalwareMutation-v0"
      alias: "gym"
      setup_metadata:
        state_dim: 2351
        action_dim: 227
      availability_check: "check_real_world_envs_available"
      config_hook: "make_real_world_envs"

# -------------------------------------------------------------------------
# 4. Dataset / Benchmark Loaders
# -------------------------------------------------------------------------
datasets:
  aliases:
    cage: ["Cage Challenge 2"]
    gym: ["Hopper", "Walker2d", "Reacher", "HalfCheetah", "Malware Mutation"]
    mujoco: ["Hopper", "Walker2d", "Reacher", "HalfCheetah"]
    selfish_mining: ["Selfish Mining"]
    network_defense: ["Cage Challenge 2"]
    autonomous_driving: ["Autonomous Driving"]
  
  loaders:
    cage:
      id: "cage_loader"
      setup_metadata:
        source: "CybORG"
      validation_check: "validate_cage_dataset"
      config_hook: "load_cage_dataset"
    gym:
      id: "gym_loader"
      setup_metadata:
        source: "D4RL"
      validation_check: "validate_gym_dataset"
      config_hook: "load_gym_dataset"

# -------------------------------------------------------------------------
# 5. Method / Baseline / Attack Selectors
# -------------------------------------------------------------------------
methods:
  selectors:
    - "ours"
    - "random"
    - "statemask"
    - "ppo"
    - "sac"
    - "gail"
    - "jsrl"
    - "heuristic"
    - "Ours"
    - "b-line"
    - "ppo fine-tuning"

# -------------------------------------------------------------------------
# 6. Parameter Sweeps & Hyperparameters
# -------------------------------------------------------------------------
sweeps:
  alpha: [0.01, 0.001, 0.0001]
  lambda: [0.0, 0.1, 0.01, 0.001]
  p: [0.0, 0.25, 0.5, 0.75, 1.0]
  learning_rate: [0.0003, 0.0001, 0.00005]

hyperparameters:
  ppo:
    learning_rate: 0.0003
    batch_size: 64
    gamma: 0.99
    clip_range: 0.2
    ent_coef: 0.0
    n_epochs: 10
    n_steps: 2048
  rice:
    alpha: 0.01
    lambda: 0.01
    p: 0.5

# -------------------------------------------------------------------------
# 7. Callable Protocol Matrix (Named Experiments)
# -------------------------------------------------------------------------
# Links named experiments to environments, methods, metrics, and artifact writers.
experiment_matrix:
  experiment_i:
    name: "Fidelity and Efficiency of Explanation"
    environments: ["Hopper", "Walker2d", "Reacher", "HalfCheetah"]
    methods: ["ours", "statemask", "random"]
    metrics: ["fidelity_score", "training_time"]
    artifact_writer: "write_fidelity_results"
  experiment_ii:
    name: "Effectiveness of Refining Method"
    environments: ["Hopper", "Walker2d", "Reacher", "HalfCheetah"]
    methods: ["ours", "ppo fine-tuning", "statemask-r", "jsrl"]
    metrics: ["final_reward"]
    artifact_writer: "write_refinement_results"
  experiment_iii:
    name: "Real-world Applications"
    environments: ["Selfish Mining", "Cage Challenge 2", "Autonomous Driving", "Malware Mutation"]
    methods: ["ours", "ppo", "sac", "gail", "heuristic"]
    metrics: ["final_reward", "evasion_probability"]
    artifact_writer: "write_real_world_results"
  experiment_iv:
    name: "Hyperparameter Sensitivity (Alpha, Lambda, P)"
    environments: ["Walker2d"]
    methods: ["ours"]
    metrics: ["fidelity_score", "final_reward"]
    artifact_writer: "write_sensitivity_results"
  experiment_v:
    name: "Sparse Reward MuJoCo Games"
    environments: ["Walker2d"]
    methods: ["ours", "ppo fine-tuning", "statemask-r", "jsrl"]
    metrics: ["final_reward"]
    artifact_writer: "write_sparse_results"

# -------------------------------------------------------------------------
# 8. Output Paths
# -------------------------------------------------------------------------
output_paths:
  metrics: "results/metrics.json"
  environment_registry: "results/environment_registry.json"
  environment_readiness: "results/environment_readiness.json"
  figure_1: "results/figures/figure_1.png"
  figure_5: "results/figures/figure_5.png"
  table_4: "results/tables/table_4.csv"