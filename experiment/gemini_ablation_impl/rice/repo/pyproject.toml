[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rice"
version = "0.1.0"
description = "Faithful reproduction of RICE: Breaking Through the Training Bottlenecks of Reinforcement Learning with Explanation"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "PaperBench Repro Agent" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Lightweight core dependencies (separate from heavy simulator/training dependencies)
dependencies = [
    "numpy>=1.20.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
# Heavy simulator and reinforcement learning training dependencies
rl = [
    "torch>=1.11.0",
    "stable-baselines3>=1.6.0",
    "gym>=0.21.0",
    "gymnasium>=0.26.0",
]
simulators = [
    "metadrive-simulator>=0.2.5",
]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["rice"]
package-dir = {"" = "src"}