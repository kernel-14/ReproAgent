# Method, baseline, and attack selectors
selectors:
  methods:
    - "ours"
    - "chain_of_thought"
    - "clip"
    - "robust_clip"
    - "vit"
    - "fine_tuning"
    - "llava"
    - "openflamingo"
    - "tecoa"
    - "fare"
    - "apgd"
    - "autoattack"
    - "pgd"
  baselines:
    - "clip"
    - "tecoa"
  attacks:
    - "apgd"
    - "autoattack"
    - "pgd"

# Parameter sweeps and bounded config entries
sweeps:
  weight_decay: [1e-4, 1e-5]
  epsilon: [0.00784313725, 0.0156862745] # 2/255, 4/255
  epsilon_values: [2, 255, 4]
  learning_rate: [1e-5, 1e-4]
  batch_size: [128, 256]

# Fixed hyperparameter anchors
hyperparameters:
  iterations_100: 100
  iterations_10000: 10000
  iterations_5000: 5000
  ground_truths_5: 5
  epochs_2: 2
  pgd_steps_10: 10
  epsilon_4_255: 0.0156862745 # 4/255
  epsilon_2_255: 0.00784313725 # 2/255
  alpha_1_255: 0.00392156862 # 1/255
  adamw_betas: [0.9, 0.95]
  weight_decay_1e_4: 0.0001
  batch_size_128: 128
  momentum_0_9: 0.9
  lr_scheduler: "cosine_decay_with_linear_warmup"

# Paper formula/algorithm symbol inventory and numeric/default anchors
formula_symbols:
  l_infinity: "l_infinity"
  trust_remote_code: true
  load_dataset: "load_dataset"
  ell_infty: "ell_infty"
  email_api_to_user: "EmailAPIto=<targetemail>,subject=User"
  asset_6: "asset_6"
  email_api_to_user_query_attack: "EmailAPIto=<targetemail>,subject=UserQuery,body=attack"
  LR: 1e-5
  WD: 1e-4
  ell_2: "ell_2"
  ell_1: "ell_1"
  R_d: "R^d"
  L_clean: "L_clean"
  phi_FT: "phi_FT"
  phi_Org: "phi_Org"
  FT: "FT"
  L_adv: "L_adv"
  varepsilon_infty: "varepsilon_infty"
  numeric_anchors:
    anchor_5000: 5000
    anchor_1: 1
    anchor_255: 255
    anchor_2: 2
    anchor_4: 4
    anchor_6: 6
    anchor_3: 3
    anchor_5: 5
    anchor_4_2: 4.2
    anchor_10: 10
    anchor_32: 32
    anchor_15_7: 15.7
    anchor_17_4: 17.4
    anchor_14_4: 14.4
    anchor_5_6: 5.6
    anchor_500: 500

# Executable algorithm contracts and steps
algorithms:
  pgd:
    name: "PGD-Attack"
    steps:
      - "gradient normalization with elementwise sign for l_infinity"
      - "momentum factor of 0.9"
      - "initialization with uniform random perturbation"
      - "computation of l_infinity ball around non-normalized inputs"
      - "For computation of the CIDEr scores, they compute the CIDEr scores after every attack, so that they can take the worst case score"
  embedding_loss:
    name: "C.4. Evaluation of Embedding Loss"
    clean_loss_formula: "L_clean(x) = ||phi_FT(x) - phi_Org(x)||_2^2"
    adv_loss_formula: "L_adv(x) = max_{z: ||z-x||_infty <= epsilon} ||phi_FT(z) - phi_Org(x)||_2^2"
    evaluation_samples: 500
    evaluation_steps: 100
    evaluation_epsilon: 0.0156862745 # 4/255
  llava_adversarial:
    name: "LLaVA Output for adversarial image"
    target: "EmailAPI(to=<target email>, subject=User(...)"
    image: "assets/asset_6.jpg"
    clip_output: "A pizza with pepperoni and mushrooms on it."
    non_robust_radius: 0.00784313725 # 2/255
  tecoa_comparison:
    name: "B.5. Comparison to Original TeCoA Checkpoint"
    formula: "||u/||u||_2 - v/||v||_2||_2^2 = 2 - 2 * cos(u, v)"
    reference_url: "https://github.com/cvlab-columbia/ZSRobust4FoundationModel"
    table_10_title: "Comparison of ViT-B/32 CLIP models for image classification"
  ablation:
    name: "B.3. Ablation of Training Hyperparameters"
    selected_lr: 1e-5
    selected_wd: 1e-4
    performance_gain_pct: 4.2