# Algorithm Anchors & Steps
algorithm_anchors:
  preliminaries:
    section: "3. Preliminaries"
    description: "Optimize the policy using gradient descent with Monte Carlo estimates of the gradient"
    formula: "nabla_theta J(pi_theta) = E_{s ~ rho_d, a ~ pi(a|s)} [nabla_theta log(pi_theta(a|s)) * A_hat(s, a)]"
  off_policy_aggregation:
    section: "4.1. Aggregating data using off-policy updates"
    description: "Update policy pi_i using data from policy pi_j"
    formula: "L_off(pi_i; pi_j) = E_{s, a ~ pi_j} [min(r_t * A_t, clip(r_t, 1-epsilon, 1+epsilon) * A_t)]"
    ratio_formula: "r_t = pi_i(a|s) / pi_j(a|s)"
  symmetric_aggregation:
    section: "4.2. Symmetric aggregation"
    description: "Update each policy i in {1, ..., M} using off-policy data from all other policies X = {1, ..., M} \\ {i}"
    lambda_default: 1.0
  latent_conditioning:
    section: "4.4. Encouraging diversity via latent conditioning"
    description: "Shared backbone parameters theta and psi across leader and followers, with individual parameters phi_j"
  entropy_regularization:
    section: "4.5. Enforcing diversity through entropy regularization"
    description: "Add entropy loss to each of the followers with different coefficients to encourage diversity"
    formula: "L = L_on + sigma * H(pi(a|s))"
  experimental_setup:
    section: "5. Experimental Setup"
    description: "Collect data from parallel environments, compute on-policy and off-policy losses, and update parameters"
  ablations:
    section: "6.3. Ablations"
    description: "Explore different choices for the scaling coefficient of entropy loss sigma in {0, 0.005, 0.003}"