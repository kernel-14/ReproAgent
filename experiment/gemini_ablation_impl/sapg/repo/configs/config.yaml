# configs/config.yaml
# SAPG: Split and Aggregate Policy Gradients Configuration File
# Reference Grounding: paper_contract_sweep_hyperparameter_protocol, paper_task_environment_setup, paper_training_or_optimization_loop

project:
  name: "sapg_reproduction"
  description: "Faithful reproduction of Split and Aggregate Policy Gradients (SAPG)"

# 3. Preliminaries & Algorithm Symbols Inventory
symbols:
  s_0: "initial_state"
  a_t: "action_at_t"
  s_t: "state_at_t"
  sum_t_0_T_1: "sum_{t=0}^{T-1}"
  gamma_t: "gamma^t"
  A_hat: "advantage_estimate"
  pi_theta: "policy_parameterized_by_theta"
  nabla_theta: "policy_gradient"
  rho_d: "state_visitation_distribution"
  Q_hat: "action_value_estimate"
  V_hat: "state_value_estimate"
  L_on: "on_policy_loss"
  pi_old: "old_policy"
  r_t: "reward_at_t"
  epsilon: "ppo_clip_parameter"
  A_t: "advantage_at_t"
  pi_1: "policy_1"
  pi_M: "policy_M"
  pi_i: "policy_i"
  pi_j: "policy_j"
  L_off: "off_policy_loss"
  mu: "importance_weight_threshold"
  pi_i_old: "old_policy_i"
  lambda: "aggregation_weight"

numeric_anchors:
  zero: 0
  one: 1
  two: 2
  three: 3
  six: 6
  seven: 7
  twenty_three: 23
  thirty: 30
  entropy_coef_default: 0.005
  num_environments: 24576

# Expose required parameter sweeps as executable constants/default accessors
sweeps:
  M:
    default: 4
    values: [2, 4, 8]
    description: "Number of parallel policies (leader + followers)"
  lambda:
    default: 1.0
    values: [0.1, 0.5, 1.0, 2.0]
    description: "Aggregation weight for off-policy updates"
  mu:
    default: 0.1
    values: [0.01, 0.05, 0.1, 0.2]
    description: "Importance weight threshold"
  sigma:
    default: 0.003
    values: [0.0, 0.003, 0.005]
    description: "Entropy coefficients for followers to enforce diversity"
  epochs:
    default: 100
    values: [50, 100, 200]
    description: "Number of training epochs"
  batch_size:
    default: 4096
    values: [1024, 2048, 4096, 8192]
    description: "Batch size for policy updates"

# Method / Baseline / Attack Selectors
method_selectors:
  ours: "sapg"
  sapg: "sapg"
  ppo: "ppo"
  pbt: "pbt"
  pql: "pql"
  ddpg: "ddpg"

# Baseline Default Hyperparameters (Binding addendum clarification)
baselines:
  ppo:
    clip_range: 0.2
    ent_coef: 0.0
    learning_rate: 0.0003
    n_steps: 2048
    gae_lambda: 0.95
    gamma: 0.99
  ddpg:
    buffer_size: 1000000
    learning_rate: 0.001
    batch_size: 256
    tau: 0.005
    gamma: 0.99
  pql:
    num_critics: 2
    learning_rate: 0.0003
    batch_size: 1024
  pbt:
    population_size: 8
    mutation_rate: 0.2
    explore_weight: 0.1

# Environment / Task Factories Registry
environments:
  AllegroKuka-Throw:
