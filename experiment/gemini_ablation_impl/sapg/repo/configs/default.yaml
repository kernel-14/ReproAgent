# Baseline default hyperparameters (Binding addendum clarification)
baseline_hyperparameters:
  ppo:
    lr: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
    batch_size: 24576
  ddpg:
    lr_actor: 0.0001
    lr_critic: 0.001
    gamma: 0.99
    tau: 0.005
    batch_size: 24576
  pbt:
    population_size: 8
    mutation_rate: 0.2
    batch_size: 24576
  pql:
    lr: 0.0003
    gamma: 0.99
    batch_size: 24576

# Training loop and data buffer routing configuration
training_loop:
  parallel_rollouts: true
  route_followers_to_leader: true
  off_policy_aggregation: true
  symmetric_aggregation: false # If true, all policies update symmetrically
  diversity_regularization:
    entropy_loss: true
    latent_conditioning: true