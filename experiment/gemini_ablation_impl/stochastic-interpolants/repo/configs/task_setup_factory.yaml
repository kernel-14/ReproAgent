# configs/task_setup_factory.yaml
# Reference Grounding: paper_task_environment_setup (chunk_006, chunk_007, chunk_008)

metadata:
  paper_title: "Stochastic Interpolants with Data-Dependent Couplings"
  reproduction_scope: "Faithful reproduction of stochastic interpolants with data-dependent couplings vs independent Gaussian baselines"
  trust_remote_code: true
  seed: 42
  output_dir: "results"
  active_reproduction_scope_notes: "This configuration defines the task setup factory, dataset registry, environment/task factories, and parameter sweeps for the stochastic interpolants reproduction."

environment_task_factories:
  unit-006:
    id: "unit-006"
    alias: "unit_006_fast_test"
    description: "Fast smoke test environment with synthetic shapes"
    availability_check: "src.data.pipeline.check_synthetic_available"
    setup_metadata:
      resolution: [32, 32]
      channels: 3
    runnable_config_hook: "src.data.pipeline.prepare_pipeline"
  imagenet:
    id: "imagenet"
    alias: "imagenet_1k"
    description: "ImageNet-1k dataset from HuggingFace"
    dataset_name: "imagenet-1k"
    trust_remote_code: true
    availability_check: "src.data.pipeline.check_imagenet_available"
    setup_metadata:
      resolution: [256, 256]
      channels: 3
      trust_remote_code: true
    runnable_config_hook: "src.data.pipeline.load_pipeline"
  low-resolution-image:
    id: "low-resolution-image"
    alias: "imagenet_c"
    description: "Low-resolution or corrupted ImageNet subset for downstream tasks"
    availability_check: "src.data.pipeline.check_imagenet_c_available"
    setup_metadata:
      resolution: [64, 64]
      channels: 3
    runnable_config_hook: "src.data.pipeline.load_pipeline"
  downstream_tasks:
    id: "downstream_tasks"
    alias: "perform_various_downstream"
    description: "Downstream tasks to perform various evaluations"
    availability_check: "src.data.pipeline.check_downstream_available"
    setup_metadata:
      tasks: ["inpainting", "super_resolution"]
    runnable_config_hook: "src.data.pipeline.load_pipeline"

dataset_loaders:
  synthetic_shapes:
    id: "synthetic_shapes"
    name: "Synthetic shapes or a small subset of ImageNet/CIFAR-10"
    validation_check: "src.data.pipeline.validate_synthetic"
    setup_metadata:
      num_samples: 100
    runnable_config_hook: "src.data.pipeline.prepare_pipeline"
  imagenet_1k:
    id: "imagenet_1k"
    name: "imagenet"
    validation_check: "src.data.pipeline.validate_imagenet"
    setup_metadata:
      dataset_name: "imagenet-1k"
      trust_remote_code: true
    runnable_config_hook: "src.data.pipeline.load_pipeline"
  imagenet_c:
    id: "imagenet_c"
    name: "imagenet_c"
    validation_check: "src.data.pipeline.validate_imagenet_c"
    setup_metadata:
      corruption_type: "gaussian_noise"
    runnable_config_hook: "src.data.pipeline.load_pipeline"

parameter_sweeps:
  alpha_t_beta_t:
    description: "alpha_t, beta_t coefficients and their derivatives"
    alpha_t: "1 - t"
    beta_t: "t"
    d_alpha_t: "-1"
    d_beta_t: "1"
  training_hyperparameters:
    batch_size: [32, 64, 128]
    learning_rate: [0.0001, 0.0002, 0.0005]
    epochs: [10, 20, 50]
  ode_integration:
    num_integration_steps: [10, 20, 50, 100]
    solver_type: ["euler", "rk4"]
  gamma_values:
    values: [0, 1]

fixed_hyperparameter_anchors:
  batch_size_32:
    batch_size: 32
  mask_tiles_64:
    mask_tiles: 64
  mask_probability_0.3:
    mask_probability: 0.3

method_selectors:
  ours:
    name: "ours"
    description: "Stochastic Interpolants with Data-Dependent Couplings"
  resnet:
    name: "resnet"
    description: "ResNet baseline"
  ddpm:
    name: "ddpm"
    description: "Denoising Diffusion Probabilistic Models"
  diffusion_model:
    name: "diffusion_model"
    description: "Standard Diffusion Model baseline"

registry_configuration_artifact:
  path: "results/environment_registry.json"
  description: "Registry configuration artifact that determines which task/config surfaces are implemented"
  keep_all_paper_visible: true
  determines_which: "determines which task/config surfaces must be implemented before training or evaluation can be meaningful"
  is_determined: "is determined by the active reproduction scope"
  config_data_pipeline: "config data-pipeline"
  config_factory: "config factory"